  addNoto(Math.round(S.org.heat / 3)); S.org = null;
  remember(`Deixei a vida no crime organizado (${name}).`, "good");
  return R(true, "Você está fora.");
}

/* ---------- Gestão (chefe) ---------- */
function recruit(c){
  if (!isBoss()) return R(false, "Só o chefe recruta.");
  if (S.org.members.length >= 14) return R(false, "Organização grande demais para controlar.");
  if (S.dirty + S.money < c.cost) return R(false, `Recrutar custa ${fmt(c.cost)}.`);
  const d = Math.min(S.dirty, c.cost); S.dirty -= d; addMoney(-(c.cost - d));
  S.org.members.push(c); S.org.heat = clamp(S.org.heat + 2);
  log(`🕶️ Recrutei ${c.name} ("${c.nick}") como ${c.role}.`, "", ["crime"]); return R(true, `${c.nick} está dentro.`);
}
function expel(muid){
  const m = S.org?.members.find(x=>x.uid===muid); if (!m) return R(false,"?");
  S.org.members = S.org.members.filter(x=>x!==m);
  for (const x of S.org.members) x.loyalty = clamp(x.loyalty - 3);
  if (m.loyalty < 40 || chance(personalityOfMember(m).snitch || 0.1)){ S.org.heat = clamp(S.org.heat + 15); log(`${m.nick} saiu falando demais. A polícia ficou sabendo de coisas.`, "bad", ["crime"]); }
  else log(`Expulsei ${m.nick} da organização.`, "", ["crime"]);
  return R(true, "Membro expulso.");
}
const personalityOfMember = m => byId(DATA.personalities, m.personality) || {};
function bonusMember(muid){
  const m = S.org?.members.find(x=>x.uid===muid); if (!m) return R(false,"?");
  const v = Math.round(m.cut * 0.5); if (S.dirty < v) return R(false, `Bônus de ${fmt(v)} (dinheiro sujo).`);
  S.dirty -= v; m.loyalty = clamp(m.loyalty + rint(8, 15)); m.history.push({ age:P().age, text:"Recebeu bônus" });
  return R(true, `${m.nick} ficou mais leal.`);
}
function startOp(opId, territory){
  if (!isBoss()) return R(false, "Só o chefe abre operações.");
  const op = byId(DATA.orgOps, opId);
  if (S.org.ops.some(o=>o.id===opId)) return R(false, "Essa operação já está rodando.");
  const busy = S.org.ops.reduce((a,o)=>a+byId(DATA.orgOps,o.id).members,0);
  if (S.org.members.length - busy < op.members) return R(false, `Precisa de ${op.members} capangas livres.`);
  const setup = priceOf(op.income * 0.3);
  if (S.dirty + S.money < setup) return R(false, `Montar a operação custa ${fmt(setup)}.`);
  const d = Math.min(S.dirty, setup); S.dirty -= d; addMoney(-(setup - d));
  territory = territory || pick(S.org.territories.length ? S.org.territories : DATA.territories);
  if (!S.org.territories.includes(territory)) S.org.territories.push(territory);
  S.org.ops.push({ id:opId, territory, years:0 });
  log(`💼 Abri a operação "${op.name}" em ${territory}.`, "bad", ["crime"]); return R(true, "Operação em andamento.");
}
function stopOp(opId){ if (!S.org) return R(false,"?"); S.org.ops = S.org.ops.filter(o=>o.id!==opId); return R(true, "Operação encerrada."); }
/* Lavagem: converte sujo em limpo através de negócios de fachada. */
function launder(amount){
  const cap = frontCapacity() - num(S.flags.launderedThisYear);
  if (cap <= 0) return R(false, "Sem negócio de fachada (lava-jato, casa noturna, academia…) ou capacidade esgotada este ano.");
  amount = Math.min(Math.round(amount), S.dirty, cap);
  if (amount <= 0) return R(false, "Nada para lavar.");
  S.dirty -= amount; const clean = Math.round(amount * 0.8); addMoney(clean);
  S.flags.launderedThisYear = num(S.flags.launderedThisYear) + amount; S.stats.laundered += amount;
  if (S.org) S.org.heat = clamp(S.org.heat + amount / Math.max(1, frontCapacity()) * 6);
  addNoto(2);
  if (S.stats.laundered > wageOf(400000) && chance(0.15)) enqueue("ev_tax_audit");
  log(`🧺 Lavei ${fmt(amount)} pelos meus negócios: ${fmt(clean)} limpos (taxa de 20%).`, "", ["crime","money"]);
  return R(true, `${fmt(clean)} agora são dinheiro limpo.`);
}

/* ---------- Tick anual ---------- */
function orgYear(){
  S.flags.launderedThisYear = 0;
  const O = S.org; if (!O) return;
  O.years++;
  const crisis = phaseName() === "crise" || phaseName() === "recessão" ? 1.15 : 1;
  if (!isBoss()){
    // membro: ganha uma fatia, acumula respeito, pode ser promovido
    const base = priceOf(25000 * (O.rank + 1)) * DATA.orgRanks[O.rank].share * 8 * crisis;
    const cut = Math.round(base * rfloat(0.6, 1.4)); S.dirty += cut; S.stats.dirtyEarned += cut;
    O.respect = clamp(O.respect + rint(2, 6) + S.crimeSkill/25);
    addNoto(2); addStress(4);
    const next = DATA.orgRanks[O.rank + 1];
    if (next && O.respect >= next.respect && chance(0.45)){
      O.rank++; log(`🕶️ Subi na hierarquia de ${O.name}: agora sou ${next.name}.`, "milestone", ["crime"]); emit("promotion");
      if (isBoss()){ O.own = true; O.members = [makeCrewCandidate(), makeCrewCandidate(), makeCrewCandidate()]; O.ops = [{ id:"gambling", territory:pick(DATA.territories), years:0 }]; O.territories = [O.ops[0].territory]; log(`👑 O antigo chefe caiu. Assumi o comando de ${O.name}.`, "milestone"); achieve("kingpin","Chefe do crime organizado"); }
    }
    if (chance(0.25)) enqueue("ev_org_task");
    if (chance(0.04 + P().notoriety/600)) enqueue("ev_police_raid");
    return;
  }
  // chefe: receita das operações, folha dos capangas, calor, riscos
  const avgSkill = O.members.length ? O.members.reduce((a,m)=>a+m.skill,0)/O.members.length : 30;
  let gross = 0;
  for (const o of O.ops){ const d = byId(DATA.orgOps, o.id); o.years++; gross += priceOf(d.income) * (0.6 + avgSkill/140) * crisis * (O.remote ? 0.7 : 1) * rfloat(0.7, 1.3); O.heat += d.heat; }
  const payroll = O.members.reduce((a,m)=>a+m.cut,0);
  const net = Math.round(gross - payroll);
  S.dirty = Math.max(0, S.dirty + net); if (net > 0) S.stats.dirtyEarned += net;
  if (net < 0) for (const m of O.members) m.loyalty = clamp(m.loyalty - 10); // atraso na "parte" = revolta
  log(`🕶️ ${O.name}: ${fmt(Math.round(gross))} em operações, ${fmt(payroll)} para a equipe${net<0?" (rombo! a equipe ficou sem a parte)":""}.`, net<0?"bad":"", ["crime"]);
  O.heat = clamp(O.heat - 8 + O.members.length*0.5 + (O.remote ? 4 : 0));
  for (const m of O.members){ m.age++; m.loyalty = clamp(m.loyalty - rint(1,4) + (net > 0 ? 1 : 0)); m.skill = clamp(m.skill + rint(0,2)); }
  addStress(6 + O.ops.length*2); addNoto(O.ops.length);
  for (const r of O.rivals){ r.power = Math.round(r.power * rfloat(0.95, 1.15)); r.hostility = clamp(r.hostility + rint(-3, 8) + O.territories.length); }
  // riscos (cada um é um evento que pergunta ao jogador)
  if (chance(Math.max(0, (O.heat - 25) / 110))) enqueue("ev_police_raid");
  const traitor = O.members.find(m => m.loyalty < 30 && chance(0.25 + (personalityOfMember(m).snitch || 0)));
  if (traitor) enqueue("ev_betrayal", { uid:traitor.uid, nick:traitor.nick, name:traitor.name });
  const rival = O.rivals.find(r => r.hostility > 45 && chance(r.hostility/200));
  if (rival) enqueue("ev_rival_war", { name: rival.name, power: rival.power });
  if (O.ops.length && chance(0.15)) enqueue("ev_expansion");
}
</script>
<script>/* src/systems/martial.js */
"use strict";
/* =====================================================================
   systems/martial.js — artes marciais: matrícula, mensalidade, treino
   (retornos decrescentes + lesão em treino intenso), graduação/faixas,
   golpes desbloqueados por maestria e torneios com cartel.

   Estado: S.martial = { arts:{ id:{ m, years } }, enrolled:[ids],
     rec:{ w, l, d, ko }, kills, banUntil, titles:[] }
   ===================================================================== */
const MAX_ENROLL = 2;

function martial(){
  if (!S.martial) S.martial = { arts:{}, enrolled:[], rec:{ w:0, l:0, d:0, ko:0 }, kills:0, banUntil:0, titles:[] };
  return S.martial;
}
const mastery = id => num(martial().arts[id]?.m);
const bestMastery = () => Math.max(0, ...Object.values(martial().arts).map(a => num(a.m)));
const bestArt = () => { let b = null, v = -1; for (const [id, a] of Object.entries(martial().arts)) if (a.m > v){ v = a.m; b = id; } return b; };
function rankIdx(m){ let i = 0; DATA.rankThresholds.forEach((t, k) => { if (m >= t) i = k; }); return i; }
function rankName(artId){ const a = byId(DATA.martialArts, artId); return a.ranks[rankIdx(mastery(artId))]; }

/* Golpes conhecidos: básicos + desbloqueados por maestria. */
function knownMoves({ tournamentArt } = {}){
  const weapons = tournamentArt || typeof weaponMoves !== "function" ? [] : weaponMoves(); // armas não entram no ringue
  return weapons.concat(DATA.moves.filter(mv => {
    if (!mv.art) return !(tournamentArt && mv.dirty);
    if (tournamentArt && tournamentArt !== "mma" && mv.art !== tournamentArt) return false;
    return mastery(mv.art) >= mv.req;
  }));
}
function nextUnlock(artId){ return DATA.moves.filter(mv => mv.art === artId && mv.req > mastery(artId)).sort((a,b)=>a.req-b.req)[0] || null; }

/* Atributos de luta do personagem (derivados, nunca armazenados). */
function fighterStats(){
  const p = P(), a = p.age, bm = bestMastery();
  const ageMal = a > 45 ? (a - 45) * 0.9 : a < 16 ? (16 - a) * 3 : 0;
  const others = Object.values(martial().arts).reduce((s, x) => s + num(x.m), 0) - bm;
  const skill = clamp(bm * 0.75 + others * 0.12 + num(S.crimeSkill) * 0.1 + (hasTrait("athletic") ? 8 : 0) + num(p.talents?.sport) * 0.08);
  const str = clamp(p.stats.health * 0.55 + bm * 0.3 + (hasTrait("athletic") ? 10 : 0) - ageMal + 8);
  const def = clamp(skill * 0.65 + p.stats.health * 0.2 - ageMal * 0.5);
  const intim = S.prison ? num(S.prison.intim) * 0.15 : 0; // físico ganho no pátio
  return { skill: clamp(skill + intim), str: clamp(str + intim), def, hp: Math.max(15, Math.round(p.stats.health)) };
}

/* ---------- Matrícula e treino ---------- */
function enrollArt(id){
  const d = byId(DATA.martialArts, id), M = martial();
  if (inPrison()) return R(false, "Você está preso(a).");
  if (P().age < d.minAge) return R(false, `Idade mínima: ${d.minAge}.`);
  if (M.enrolled.includes(id)) return R(false, "Você já treina essa modalidade.");
  if (M.enrolled.length >= MAX_ENROLL) return R(false, `Máximo de ${MAX_ENROLL} modalidades ao mesmo tempo.`);
  if (P().stats.health < 25) return R(false, "O professor não aceita alunos com saúde tão baixa.");
  const fee = artFee(id);
  if (adult() && fee > 0 && !canAfford(fee)) return R(false, `Matrícula + 1ª mensalidade: ${fmt(fee)}.`);
  if (adult()) addMoney(-fee);
  M.enrolled.push(id); M.arts[id] = M.arts[id] || { m:0, years:0 };
  log(`${d.emoji} Me matriculei em ${d.name}.`, "");
  return R(true, `Matriculado(a) em ${d.name}. Mensalidade de ${fmt(artFee(id))}.`);
}
function quitArt(id){
  const M = martial(); if (!M.enrolled.includes(id)) return R(false, "Você não treina isso.");
  M.enrolled = M.enrolled.filter(x => x !== id);
  return R(true, `Parei de treinar ${byId(DATA.martialArts, id).name}. A maestria fica, mas enferruja sem treino.`);
}
const artFee = id => priceOf(byId(DATA.martialArts, id).fee);

/* Treino ativo (gasta energia). Intenso = ganho maior, lesão provável. */
function trainArt(id, intense = false){
  const d = byId(DATA.martialArts, id), M = martial();
  if (!M.enrolled.includes(id)) return R(false, "Matricule-se primeiro.");
  if (inPrison()) return R(false, "Sem academia na cadeia — só o pátio.");
  if (P().stats.health < 20) return R(false, "Saúde baixa demais para treinar.");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  const key = "art_" + id; S.actCount[key] = num(S.actCount[key]);
  const before = mastery(id), age = P().age;
  const ageF = age < 12 ? 0.7 : age <= 30 ? 1.1 : age <= 45 ? 0.9 : age <= 60 ? 0.65 : 0.4;
  const talent = 1 + num(P().talents?.sport) / 200 + (hasTrait("athletic") ? 0.15 : 0);
  const gain = rint(4, 8) * (intense ? 1.8 : 1) * dim(key) * ageF * talent * (1 - before / 140);
  S.actCount[key]++;
  M.arts[id].m = clamp(before + gain);
  S.health.exercised = true; addStress(-3);
  let extra = "";
  if (chance(d.injury * (intense ? 2.6 : 0.8) * (age > 50 ? 1.6 : 1))){
    extra = ` Lesão no treino.` + injure(rint(intense ? 6 : 3, intense ? 14 : 8), `Lesão treinando ${d.name}`, 0.12);
  } else addStat("health", rint(1, 3) * ageBody());
  return R(true, `Treino ${intense ? "intenso " : ""}de ${d.name}: maestria ${Math.round(before)} → ${Math.round(M.arts[id].m)}.` + unlockNews(id, before) + extra);
}
/* Mensagens de faixa nova / golpe novo ao cruzar limiares. */
function unlockNews(id, before){
  const after = mastery(id), d = byId(DATA.martialArts, id); let msg = "";
  for (const mv of DATA.moves.filter(m => m.art === id && m.req > before && m.req <= after)){
    log(`${d.emoji} Aprendi um golpe novo: ${mv.name}.`, "good"); msg += ` 🆕 Golpe desbloqueado: ${mv.name}!`;
  }
  if (rankIdx(after) > rankIdx(before)){
    const r = d.ranks[rankIdx(after)]; log(`${d.emoji} Graduação em ${d.name}: ${r}.`, "milestone"); msg += ` 🎖️ Nova graduação: ${r}.`;
    if (rankIdx(after) >= 4) achieve("blackbelt_" + id, `${r} em ${d.name}`);
  }
  return msg;
}

/* ---------- Tick anual ---------- */
function martialYear(){
  const M = martial(), Y = S.yearSummary;
  if (inPrison()) return;
  for (const id of [...M.enrolled]){
    const d = byId(DATA.martialArts, id), cost = artFee(id) * 12, a = M.arts[id];
    if (adult()){
      if (S.money < cost){ M.enrolled = M.enrolled.filter(x => x !== id); log(`${d.emoji} Larguei ${d.name}: não dava para pagar a mensalidade.`, "bad"); continue; }
      addMoney(-cost); Y.expenses += cost; Y.lines.push([`Academia: ${d.name}`, -cost]);
    }
    const before = a.m; a.years++;
    a.m = clamp(a.m + rfloat(1.5, 4) * (1 - a.m / 130) * (P().age > 55 ? 0.5 : 1));
    unlockNews(id, before);
    S.health.exercised = true;
    if (chance(d.injury * 0.35)) injure(rint(2, 7), `Lesão treinando ${d.name}`, 0.08);
  }
  // sem treino, a maestria enferruja devagar
  for (const [id, a] of Object.entries(M.arts)) if (!M.enrolled.includes(id) && a.m > 10) a.m = clamp(a.m - 1.2);
}

/* ---------- Torneios ---------- */
function tournamentBlock(t, artId){
  const M = martial();
  if (inPrison()) return "Você está preso(a)";
  if (P().age < 16) return "Idade mínima: 16";
  if (P().age > 48 && t.id !== "amador") return "Velho(a) demais para o circuito";
  if (num(M.banUntil) > P().age) return `Suspenso(a) até os ${M.banUntil} anos`;
  if (!artId || mastery(artId) < t.minM) return `Maestria ${t.minM} exigida`;
  if (t.minWins && M.rec.w < t.minWins) return `Cartel mínimo: ${t.minWins} vitórias`;
  if (P().stats.health < 45) return "Exame médico: saúde mínima 45";
  if (adult() && !canAfford(priceOf(t.fee))) return `Inscrição: ${fmt(priceOf(t.fee))}`;
  return null;
}
function enterTournament(tid, artId){
  const t = byId(DATA.tournaments, tid), why = tournamentBlock(t, artId);
  if (why) return R(false, why);
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  if (adult()) addMoney(-priceOf(t.fee));
  startFight("tournament", { tid, art: artId, idx: 0 });
  return R(true, `${t.emoji} Inscrito(a) em ${t.name}. Luta 1 de ${t.fights}!`);
}
/* Chamado ao fim de cada luta de torneio (com a luta já resolvida). */
function tournamentAfter(F){
  const t = byId(DATA.tournaments, F.ctx.tid), M = martial(), won = F.result === "win";
  if (F.result === "draw"){ // decisão dos juízes por pontos
    const mine = F.dealt, theirs = F.taken;
    F.result = mine >= theirs ? "win" : "lose";
    F.lines.push(`⚖️ Decisão dos juízes: ${F.result === "win" ? "vitória" : "derrota"} por pontos (${Math.round(mine)} × ${Math.round(theirs)}).`);
  }
  const win = F.result === "win";
  if (win){ M.rec.w++; if (["ko","grave","coma","death","sub"].includes(F.oppOutcome)) M.rec.ko++; }
  else M.rec.l++;
  if (!win){
    F.summary += ` Fui eliminado(a) em ${t.name}.`; addStat("happiness", -4);
    log(`${t.emoji} Perdi em ${t.name} (cartel ${M.rec.w}-${M.rec.l}).`, "bad");
    return;
  }
  if (F.ctx.idx + 1 < t.fights){ F.next = { ...F.ctx, idx: F.ctx.idx + 1 }; F.summary += ` Avancei para a luta ${F.ctx.idx + 2} de ${t.fights}.`; return; }
  const prize = priceOf(rint(...t.prize));
  addMoney(prize); S.stats.earned += prize; addFame(t.fame); addRep(t.rep); addStat("happiness", 10);
  if (S.org) S.org.respect = clamp(S.org.respect + 4);
  M.titles.push({ tid:t.id, age:P().age, art:F.ctx.art });
  log(`${t.emoji} CAMPEÃO(Ã) de ${t.name}! Prêmio de ${fmt(prize)} (cartel ${M.rec.w}-${M.rec.l}, ${M.rec.ko} nocautes).`, "milestone");
  if (t.id === "cinturao") achieve("worldbelt", "Campeão(ã) mundial de lutas");
  if (t.id === "pro") achieve("profighter", "Vitória em evento profissional de luta");
  F.summary += ` 🏆 Campeão(ã)! Prêmio: ${fmt(prize)}.`;
}
</script>
<script>/* src/systems/combat.js */
"use strict";
/* =====================================================================
   systems/combat.js — motor de briga por turnos (lógica pura; a UI só
   chama fightAction e lê S.fight).

   Fluxo: startFight(kind, ctx) cria S.fight → o jogador escolhe uma ação
   por turno (golpe, defender, fugir, render-se, golpe para matar) → o
   oponente reage → ao fim, finishFight aplica TODAS as consequências
   (lesões, cartel, polícia, homicídio, vingança, submundo) e grava
   F.summary. A UI fecha com closeFight(), que libera S.fight.

   ---- LETALIDADE (golpe que encerra a luta) ----
     poder  = (0.60 + força·0.60) × (0.85 + maestria·0.50) × intensidade.dmg
     dano   = sorteio(golpe.dmg) × poder × 2.5 (× 1.8 se crítico)
     vuln   = 1 + idade(>45: +0.3 · >60: +0.8 · <16: +0.5) + (100−saúde do alvo)/150
     L      = golpe.lethal × poder × vuln × (crítico ? 2 : 1)
              × intensidade.lethal × (1 − maestria·0.7·intensidade.control)
              × (torneio ? 0.3 : 1)
     sorteio r: r < L → MORTE · r < 2.5L → COMA · r < 6L → LESÃO GRAVE · senão nocaute
   Ou seja: maestria aumenta o poder, mas também o CONTROLE — um faixa-preta
   no modo "Controlado" quase nunca mata; "Com tudo" anula o controle.
   ===================================================================== */
const FIGHT_MAX_ROUNDS = 12;
const DMG_SCALE = 2.5, OPP_DMG_SCALE = 2.3; // brigas decidem em ~4–8 trocas
const intensity = id => byId(DATA.intensities, id) || DATA.intensities[1];

function makeOpponent(kind, ctx){
  const pf = DATA.fightProfiles[kind], c = country();
  if (ctx.uid){ // alguém que você conhece
    const r = relBy(ctx.uid);
    if (r) return { uid:r.uid, first:r.first, last:r.last, gender:r.gender, age:r.age, personality:r.personality,
      str: clamp(rint(...pf.str) - Math.max(0, r.age-50)), skill: rint(...pf.skill), health: rint(55, 95), weapon:0, job:r.job };
  }
  const n = ctx.npc || (() => { const g = kind === "tournament" ? P().gender : (chance(0.8) ? "M" : "F"); const nm = genName(c, g);
    const age = kind === "tournament" ? rint(19, 34) : kind === "prison" ? rint(20, 55) : rint(17, 52);
    return { first:nm.first, last:nm.last, gender:g, age, personality: pick(DATA.personalities).id }; })();
  let skill = rint(...pf.skill), art = null;
  if (kind === "tournament"){ const t = byId(DATA.tournaments, ctx.tid); skill = rint(...t.skill); art = ctx.art; }
  const wIdx = weighted([0,1,2], k => pf.armed[k]);
  return { first:n.first, last:n.last || "", gender:n.gender || "M", age:n.age || rint(18,50), personality:n.personality || "hothead",
    str: rint(...pf.str), skill, health: rint(60, 100), weapon: wIdx, art, nick: n.nick };
}

function startFight(kind, ctx = {}){
  const me = fighterStats(), opp = makeOpponent(kind, ctx);
  opp.maxHp = opp.hp = Math.round(rint(...DATA.fightProfiles[kind].hp) * (0.5 + opp.health/400));
  opp.def = clamp(opp.skill * 0.65 + opp.health * 0.2);
  S.fight = { kind, ctx, opp, me:{ hp:me.hp, max:me.hp, sta:100 }, intensity: kind === "tournament" ? "normal" : "normal",
    round:0, lines:[], over:false, dealt:0, taken:0, result:null, oppOutcome:null, myOutcome:null, summary:"", intentKill:false, defending:false };
  const w = DATA.weapons[opp.weapon];
  S.fight.lines.push(kind === "tournament"
    ? `🔔 ${byId(DATA.tournaments, ctx.tid).name}: ${opp.first} ${opp.last} (${byId(DATA.martialArts, ctx.art).name}, habilidade ${opp.skill}).`
    : `${DATA.fightProfiles[kind].name}: ${opp.first}, ${opp.age} anos${opp.weapon ? `, armado(a) com ${w.name.toLowerCase()}` : ""}.`);
  emit("fightStart");
  return S.fight;
}
const fightOn = () => !!(S && S.fight && !S.fight.over);

/* ---------- Cálculos expostos à UI (mesma fórmula usada no sorteio) ---------- */
function moveMastery(mv){ return mv.art ? mastery(mv.art) : bestMastery() * 0.3; }
function movePower(mv, F = S.fight){
  const me = fighterStats(), I = intensity(F.intensity);
  return (0.6 + me.str/100*0.6) * (0.85 + moveMastery(mv)/100*0.5) * I.dmg * (F.me.sta < 15 ? 0.7 : 1);
}
function moveHit(mv, F = S.fight){
  const me = fighterStats();
  return clamp((mv.acc + (me.skill - F.opp.def)/160 + moveMastery(mv)/400 - (F.me.sta < 15 ? 0.15 : 0) + (F.opp.hp < F.opp.maxHp*0.3 ? 0.08 : 0)) * 100, 8, 95) / 100;
}
function targetVuln(o){ return 1 + (o.age > 60 ? 0.8 : o.age > 45 ? 0.3 : 0) + (o.age < 16 ? 0.5 : 0) + (100 - o.health)/150; }
function moveLethal(mv, crit = false, F = S.fight){
  const I = intensity(F.intensity), ctrl = 1 - moveMastery(mv)/100*0.7*I.control;
  return Math.min(0.95, mv.lethal * movePower(mv, F) * targetVuln(F.opp) * (crit ? 2 : 1) * I.lethal * ctrl * (F.kind === "tournament" ? 0.3 : 1));
}
function lethalLabel(L){ return L >= 0.25 ? ["extrema","bad"] : L >= 0.08 ? ["alta","bad"] : L >= 0.025 ? ["média","warn"] : ["baixa","good"]; }
/* "Golpe para matar": só fora do ringue e quando o contexto permite. */
function canKill(F = S.fight){
  const k = DATA.fightProfiles[F.kind].kill;
  if (k === "no") return false;
  if (k === "yes") return true;
  return F.opp.hp <= F.opp.maxHp * 0.45; // briga comum / legítima defesa: só com o oponente já caído
}
function killOdds(F = S.fight){
  const me = fighterStats(), down = F.opp.hp <= F.opp.maxHp * 0.4;
  return { hit: clamp((0.42 + me.skill/250 + (down ? 0.3 : 0)) * 100, 10, 95) / 100,
           death: clamp((0.3 + bestMastery()/250 + me.str/400 + (down ? 0.25 : 0)) * targetVuln(F.opp) * 100, 10, 95) / 100 };
}
function fightActions(F = S.fight){
  const tour = F.kind === "tournament";
  const moves = knownMoves(tour ? { tournamentArt: F.ctx.art } : {});
  return { moves, kill: !tour && canKill(F), flee: !tour, surrender: true };
}

/* Brigas iniciadas pelo jogador (você é o agressor). */
function provokeStranger(){
  if (inPrison()) return R(false, "Você está preso(a).");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  startFight("provoke", {}); return R(true, "Esbarrei de propósito no primeiro marrento que vi.");
}
function provokeRel(u){
  const r = relBy(u); if (!r || !r.alive) return R(false, "Não dá.");
  if (inPrison()) return R(false, "Você está preso(a).");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  startFight("provoke", { uid:u }); return R(true, `Parti pra cima de ${r.first}.`);
}

/* ---------- Turno ---------- */
function fightAction(act){
  const F = S.fight; if (!F || F.over) return;
  F.round++; F.defending = false;
  const o = F.opp, L = F.lines; let stunned = false;
  if (act === "defend"){ F.defending = true; F.me.sta = Math.min(100, F.me.sta + 28); L.push("🛡️ Fechei a guarda e recuperei o fôlego."); }
  else if (act === "flee"){
    const p = clamp(0.35 + P().stats.health/300 + (o.hp < o.maxHp*0.5 ? 0.15 : 0) - (o.weapon === 2 ? 0.15 : 0), 0.1, 0.85);
    if (chance(p)){ L.push("🏃 Consegui escapar correndo!"); return endFight("fled"); }
    L.push("🏃 Tentei fugir, mas fui alcançado(a)!");
  }
  else if (act === "surrender"){
    L.push(F.kind === "tournament" ? "🏳️ Bati três vezes. Desisti da luta." : "🏳️ Levantei as mãos e pedi para parar.");
    return endFight("surrender");
  }
  else if (act === "kill"){
    if (!canKill(F)) return;
    const k = killOdds(F); F.me.sta = Math.max(0, F.me.sta - 25);
    if (chance(k.hit)){
      F.intentKill = true;
      const r = rand(); o.hp = 0;
      F.oppOutcome = r < k.death ? "death" : r < k.death + (1-k.death)*0.6 ? "coma" : "grave";
      L.push(F.oppOutcome === "death" ? `☠️ Golpe final. ${o.first} não se levanta mais.` : `☠️ Golpe brutal. ${o.first} ficou ${F.oppOutcome === "coma" ? "em coma" : "gravemente ferido(a)"}, mas sobreviveu.`);
      return endFight("win");
    }
    L.push(`☠️ Tentei acabar com ${o.first}, mas errei — e abri a guarda.`); stunned = true;
  }
  else {
    const mv = byId(DATA.moves, act) || weaponMoves().find(m => m.id === act); if (!mv) return;
    if (mv.weapon) F.usedWeapon = mv.weapon; // perícia: arma registrada em seu nome pesa
    F.me.sta = Math.max(0, F.me.sta - mv.cost);
    if (chance(moveHit(mv))){
      const crit = chance(0.06 + moveMastery(mv)/100*0.12 + mv.ko*0.4);
      const dmg = Math.round(rint(...mv.dmg) * movePower(mv) * DMG_SCALE * (crit ? 1.8 : 1));
      o.hp -= dmg; F.dealt += dmg;
      L.push(`${crit ? "💥 CRÍTICO! " : "👊 "}${mv.name}: ${dmg} de dano.`);
      emit("hit");
      // finalização (chave/estrangulamento) ou nocaute
      const lowK = 1 - Math.max(0, o.hp)/o.maxHp * 0.6;
      if (mv.type === "sub" && o.hp > 0 && chance(mv.ko * lowK * (0.8 + moveMastery(mv)/200))){
        if (F.intensity === "all"){ o.hp = 0; } // não soltou quando o outro bateu
        else { F.oppOutcome = "sub"; L.push(`🤚 ${o.first} bateu! Finalização com ${mv.name}.`); return endFight("win"); }
      }
      if (o.hp > 0 && chance(mv.ko * movePower(mv) * (crit ? 2 : 1) * lowK * 0.6)){ o.hp = 0; L.push(`😵 ${o.first} apagou na hora!`); }
      if (o.hp <= 0){
        const Lt = moveLethal(mv, crit), r = rand();
        F.oppOutcome = r < Lt ? "death" : r < Lt*2.5 ? "coma" : r < Lt*6 ? "grave" : "ko";
        L.push({ death:`☠️ ${o.first} caiu e não respira mais.`, coma:`🚑 ${o.first} entrou em coma.`, grave:`🩸 ${o.first} ficou gravemente ferido(a).`, ko:`💤 Nocaute! ${o.first} está no chão.` }[F.oppOutcome]);
        return endFight("win");
      }
    } else { L.push(`💨 ${mv.name} — errei.`); emit("miss"); }
  }
  oppTurn(F, stunned);
  if (!F.over && F.round >= FIGHT_MAX_ROUNDS){ L.push(F.kind === "tournament" ? "🔔 Fim do tempo regulamentar." : "👮 Gente separou a briga."); endFight("draw"); }
}

function oppTurn(F, freeHit){
  const o = F.opp, me = fighterStats(), L = F.lines, w = DATA.weapons[o.weapon];
  // oponente machucado e sem sangue no olho pode fugir
  if (F.kind !== "tournament" && o.hp < o.maxHp*0.22 && ["calm","shy","funny","generous"].includes(o.personality) && chance(0.4)){ L.push(`🏃 ${o.first} desistiu e saiu correndo.`); F.oppOutcome = "fled"; return endFight("win"); }
  const hit = clamp(0.5 + (o.skill - me.def)/160 - (F.defending ? 0.3 : 0) + (freeHit ? 0.35 : 0), 0.08, 0.92);
  if (!chance(hit)){ L.push(`↪️ Esquivei ${pick(["do golpe","do ataque","por pouco"])}.`); return; }
  let dmg = rint(4, 10) * OPP_DMG_SCALE * (0.6 + o.str/100*0.7) * (F.kind === "tournament" ? 0.8 + o.skill/150 : 1) * w.mult * (F.defending ? 0.5 : 1) * (freeHit ? 1.5 : 1);
  dmg = Math.round(dmg); F.me.hp -= dmg; F.taken += dmg;
  L.push(`🤕 ${o.first} acertou ${o.weapon ? (o.weapon === 2 ? "um tiro de raspão" : "uma facada") : pick(DATA.oppAttacks)}: −${dmg}.`);
  emit("hurt");
  if (F.me.hp <= 0){
    const Lme = 0.012 * w.lethal * (["prison","rival","revenge","hit"].includes(F.kind) ? 2 : 1) * (P().age > 60 ? 1.8 : 1) * (F.kind === "tournament" ? 0.3 : 1);
    const r = rand();
    F.myOutcome = r < Lme ? "death" : r < Lme*3 ? "coma" : "ko";
    L.push({ death:"⚰️ Tudo ficou escuro…", coma:"🚑 Apaguei e acordei no hospital dias depois.", ko:"😵 Fui nocauteado(a)." }[F.myOutcome]);
    endFight("lose");
  }
}

/* ---------- Fim da luta: consequências ---------- */
function endFight(result){
  const F = S.fight; F.over = true; F.result = result;
  if (F.kind === "tournament") tournamentAfter(F);
  const o = F.opp, name = `${o.first}${o.last ? " " + o.last : ""}`;
  S.stats.fights = num(S.stats.fights) + 1; if (F.result === "win") S.stats.fightsWon = num(S.stats.fightsWon) + 1;
  // lesões do jogador
  const dmgTaken = Math.max(0, F.taken);
  let s = { win:`Venci a briga contra ${name}.`, lose:`Perdi a briga para ${name}.`, draw:`A briga com ${name} terminou empatada.`, fled:"Fugi da briga.", surrender:"Me rendi." }[F.result];
  if (F.kind === "tournament") s = F.result === "win" ? `Vitória sobre ${name}!` : `Derrota para ${name}.`;
  if (dmgTaken > 0) s += injure(Math.round(dmgTaken * 0.4), F.kind === "tournament" ? "Uma luta oficial" : "Uma briga", 0.2);
  if (F.myOutcome === "coma"){ s += injure(rint(18, 30), "O coma após a briga", 0.6); const bill = priceOf(rint(2000, 8000)) * (1 - effectivePlan().coverage); addMoney(-Math.round(bill)); s += ` Conta do hospital: ${fmt(Math.round(bill))}.`; }
  if (F.myOutcome === "death") S.flags.forcedDeath = F.kind === "tournament" ? "lesão cerebral em uma luta oficial" : `ferimentos em uma briga com ${name}`;
  F.summary = s + (F.summary ? " " + F.summary : "");
  (FIGHT_AFTER[F.kind] || (()=>{}))(F);
  if (F.oppOutcome === "death" && F.kind !== "hunt") registerKill(F); // caçadas usam o modelo de suspeita do lado sombrio
  else if (["grave","coma"].includes(F.oppOutcome) && F.kind !== "tournament") assaultCharge(F);
  if (F.kind !== "tournament") log(`🥊 ${F.summary}`, F.result === "win" && F.oppOutcome !== "death" ? "" : "bad");
  emit(F.result === "win" ? "fightWin" : "fightLose");
  sanitize();
}

/* Efeitos específicos por contexto. */
const FIGHT_AFTER = {
  street(F){ if (F.result === "win"){ addNoto(3); addStat("happiness", 3); F.summary += " A adrenalina demorou a passar."; } else if (F.result === "lose") addStat("happiness", -4); else if (F.result === "surrender") addStat("happiness", -3); },
  provoke(F){
    P().karma = clamp(P().karma - 5); addNoto(4);
    const r = F.ctx.uid && relBy(F.ctx.uid);
    if (r){ r.rel = clamp(r.rel - 40); r.respect = clamp(num(r.respect) + (F.result === "win" ? 5 : -10)); remember_npc(r, F.result === "win" ? "Apanhou de você numa briga" : "Brigou com você e venceu"); if (r.role === "friend" && r.rel < 15){ r.role = "acquaintance"; F.summary += ` ${r.first} cortou relações.`; } }
  },
  robbery(F){
    if (F.result === "win"){ addFame(2); addStat("happiness", 6); F.summary += " Desarmei o assaltante e ainda virei notícia."; }
    else if (F.result !== "fled"){ addMoney(-num(F.ctx.amt)); F.summary += ` Levaram ${fmt(num(F.ctx.amt))}.`; }
  },
  prison(F){
    if (!S.prison) return;
    S.prison.foughtAge = P().age; // briga no ano corta a remição pela metade
    if (F.result === "win") S.prison.intim = clamp(num(S.prison.intim) + 6);
    if (F.result === "win"){ addNoto(4); addStat("happiness", 2); F.summary += " Ganhei respeito no pavilhão."; }
    else if (F.result === "lose" || F.result === "surrender"){ addStat("happiness", -5); F.summary += " Agora sou alvo fácil no pavilhão."; }
    if (F.ctx.provoked && chance(0.35)){ S.prison.years++; F.summary += " A direção me mandou para a solitária: +1 ano."; }
  },
  rival(F){
    if (!S.org) return;
    const rv = S.org.rivals.find(r => r.name === F.ctx.rival);
    S.org.heat = clamp(S.org.heat + 12);
    if (F.result === "win"){ S.org.respect = clamp(S.org.respect + 12); if (rv){ rv.power = Math.round(rv.power * (F.oppOutcome === "death" ? 0.25 : 0.6)); rv.hostility = F.oppOutcome === "death" ? 90 : 40; }
      if (F.oppOutcome === "death" || F.oppOutcome === "coma"){ const t = DATA.territories.find(t => !S.org.territories.includes(t)); if (t){ S.org.territories.push(t); F.summary += ` Tomamos ${t}.`; } } }
    else { S.org.respect = clamp(S.org.respect - 15); if (S.org.territories.length > 1){ S.org.territories.pop(); F.summary += " Perdemos território."; } }
  },
  hit(F){
    if (F.oppOutcome === "death"){ const pay = num(F.ctx.pay); S.dirty += pay; S.stats.dirtyEarned += pay; S.crimeSkill = clamp(S.crimeSkill + 6); F.summary += ` Contrato cumprido: ${fmt(pay)} em dinheiro sujo.`; if (S.org) S.org.respect = clamp(S.org.respect + 15); }
    else { if (S.org){ S.org.respect = clamp(S.org.respect - 10); S.org.heat = clamp(S.org.heat + 15); } F.summary += " O alvo sobreviveu: sem pagamento, e agora ele sabe quem você é."; if (F.result === "win" && F.oppOutcome !== "fled") schedule("victimRevenge", rint(1, 3), { name:`${F.opp.first} ${F.opp.last}`, kin:"o próprio alvo" }, "O alvo do contrato sobreviveu e quer vingança."); }
  },
  revenge(F){ if (F.result === "win") F.summary += " Encerrei essa história — por enquanto."; else addStat("happiness", -6); },
  tournament(F){ if (F.oppOutcome === "death") martial().banUntil = P().age + 2; },
  hunt(F){ huntFightAfter(F); },
};

/* Lesão grave / coma fora do ringue: lesão corporal grave. */
function assaultCharge(F){
  if (F.kind === "prison"){ if (S.prison) S.prison.years += 2; F.summary += " Lesão grave na cadeia: +2 anos de pena."; return; }
  const selfDef = F.kind === "robbery" && F.intensity !== "all" && !F.intentKill;
  addNoto(8); P().karma = clamp(P().karma - (selfDef ? 2 : 10));
  if (selfDef){ F.summary += " A polícia registrou como legítima defesa."; return; }
  if (P().age >= 18 && chance(0.3 + (F.kind === "street" ? 0.1 : 0))){
    const y = rint(1, 4); sendToPrison(y, "lesão corporal grave"); F.summary += ` Fui preso(a) por lesão corporal grave (${y} ano(s)).`;
  } else F.summary += " Ninguém me denunciou… ainda.";
}

/* ---------- HOMICÍDIO: investigação, testemunhas, pena, trauma, vingança ---------- */
function registerKill(F){
  const o = F.opp, name = `${o.first}${o.last ? " " + o.last : ""}`, M = martial();
  const intentional = F.intentKill || F.kind === "hit";
  const selfDefense = ["robbery","revenge"].includes(F.kind) || (F.kind === "prison" && F.ctx.attacked);
  const excess = F.intensity === "all";
  M.kills++; S.stats.kills = num(S.stats.kills) + 1;
  // impacto psicológico (matar sem querer pesa mais)
  addStat("happiness", -(intentional ? 14 : 26)); addStress(intentional ? 18 : 30); P().karma = clamp(P().karma - (intentional ? 35 : selfDefense ? 10 : 20));
  remember(`Matei ${name}${intentional ? "" : " sem querer"}. Isso nunca vai sair da minha cabeça.`, "bad");
  log(`☠️ ${name}, ${o.age} anos, morreu após ${F.kind === "tournament" ? "a luta" : "a briga"} comigo.`, "bad", ["crime"]);
  // submundo: reputação temida
  addNoto(intentional ? 35 : 18);
  if (S.org) S.org.respect = clamp(S.org.respect + (intentional ? 20 : 10));
  if (M.kills >= 3) achieve("feared", "Temido(a) no submundo");
  // vítima conhecida
  const r = o.uid && relBy(o.uid);
  if (r){ r.alive = false; r.deathAge = r.age; for (const x of S.rels) if (x.alive && x !== r) x.rel = clamp(x.rel - 12); const pt = partner(); if (pt && chance(0.5)){ pt.rel = clamp(pt.rel - 40); } }
  // ringue: quase sempre acidente esportivo
  if (F.kind === "tournament"){
    F.next = null; M.banUntil = P().age + 2; addFame(-4);
    if (chance(0.25)){ const y = rint(1, 4); sendToPrison(y, "homicídio culposo em luta", "mínima"); F.summary += ` A perícia apontou negligência: ${y} ano(s) por homicídio culposo.`; }
    else F.summary += " A perícia concluiu: acidente esportivo. Fui suspenso(a) por 2 anos e não durmo direito desde então.";
    return;
  }
  // tipificação e pena
  const pen = DATA.penal[P().country] || { max:40, life:false };
  let label, years;
  if (intentional){ label = "homicídio qualificado"; years = rint(20, pen.max); if (pen.life && chance(0.4)) years = 99; }
  else if (selfDefense && !excess){ label = "legítima defesa"; years = 0; }
  else if (selfDefense){ label = "excesso de legítima defesa"; years = rint(2, 6); }
  else if (excess){ label = "homicídio doloso"; years = rint(12, Math.min(25, pen.max)); }
  else { label = "lesão corporal seguida de morte"; years = rint(4, 12); }
  const wit = { street:rint(1,6), provoke:rint(1,5), robbery:rint(0,3), prison:rint(2,8), rival:rint(0,3), hit:rint(0,2), revenge:rint(0,4) }[F.kind] ?? 2;
  const gun = F.usedWeapon && arsenal().find(w => w.id === F.usedWeapon), gunTrace = gun ? byId(DATA.armory, gun.id).trace * (gun.registered ? 0.35 : 0.12) : 0;
  const pCaught = clamp((0.2 + wit*0.1 + gunTrace + (S.record.length ? 0.1 : 0) - num(S.crimeSkill)/300 - (S.org ? orgPower()/500 : 0) + (F.kind === "prison" ? 0.6 : 0)) * 100, 5, 95) / 100;
  F.summary += ` ${wit ? `${wit} testemunha(s) viram tudo.` : "Ninguém viu."}`;
  if (F.kind === "prison" && S.prison){
    if (years > 0 && chance(pCaught)){ S.prison.years = Math.min(99, S.prison.years + years); S.prison.security = "máxima"; S.record.push({ crime:label, age:P().age, years }); F.summary += ` Condenado(a) por ${label}: +${years >= 99 ? "perpétua" : years + " anos"}. Transferido(a) para segurança máxima.`; }
    else F.summary += " Ninguém abriu a boca. No pavilhão, agora todo mundo me teme.";
  }
  else if (years === 0){
    if (chance(0.85)){ F.summary += " O inquérito concluiu legítima defesa. Não fui indiciado(a)."; log("⚖️ Morte registrada como legítima defesa.", ""); }
    else { const y = rint(1, 3); sendToPrison(y, "excesso de legítima defesa"); F.summary += ` O júri viu excesso: ${y} ano(s).`; }
  }
  else if (P().age >= 12 && chance(pCaught * 0.55)){
    sendToPrison(years, label, years >= 12 ? "máxima" : "média");
    F.summary += ` Fui preso(a) em flagrante por ${label}: ${years >= 99 ? "PRISÃO PERPÉTUA" : years + " anos"}.`;
  } else {
    schedule("homicideCase", rint(1, 3), { name, label, years, p: pCaught }, `A polícia investiga a morte de ${name}.`);
    F.summary += " Saí antes da polícia chegar. Mas a investigação vai começar.";
  }
  if (S.dark && !S.dark.active && P().age >= 18 && chance(0.4)) enqueue("ev_dark_awakening");
  // família / aliados da vítima
  if (chance(F.kind === "rival" ? 0.8 : 0.45)) schedule("victimRevenge", rint(1, 5), { name, kin: F.kind === "rival" ? "a facção dele" : pick(["o irmão","o primo","o filho","a irmã","o melhor amigo"]) }, `A família de ${name} não vai esquecer.`);
}

/* Fecha a luta (UI chama após o jogador ler o resumo). Torneio pode encadear. */
function closeFight(){
  const F = S.fight; if (!F) return null;
  const out = F.summary; S.fight = null;
  if (F.next && P().alive && !inPrison()) startFight("tournament", F.next);
  else if (S.flags.forcedDeath){ const c = S.flags.forcedDeath; delete S.flags.forcedDeath; die(c); }
  return out;
}
/* Resolução automática (selftest, save recarregado no meio da briga, bots). */
function autoFight(maxSteps = 40){
  let g = 0;
  while (S.fight && g++ < maxSteps){
    const F = S.fight;
    if (F.over){ closeFight(); continue; }
    const acts = fightActions(F), mv = acts.moves.length ? pick(acts.moves) : null;
    F.intensity = pick(DATA.intensities).id;
    if (F.me.hp < F.me.max*0.25 && acts.flee && chance(0.5)) fightAction("flee");
    else if (acts.kill && chance(0.15)) fightAction("kill");
    else if (F.me.sta < 15 || !mv) fightAction("defend");
    else fightAction(mv.id);
  }
  if (S.fight){ S.fight.over = true; closeFight(); }
}

/* Consequências agendadas de mortes (registradas em CONSEQ). */
Object.assign(CONSEQ, {
  homicideCase(ctx){
    if (!P().alive) return;
    if (inPrison()){ if (chance(ctx.p * 0.5)){ S.prison.years = Math.min(99, S.prison.years + ctx.years); S.record.push({ crime:ctx.label, age:P().age, years:ctx.years }); return out(`Fui condenado(a) também pela morte de ${ctx.name}: +${ctx.years} anos.`, "bad"); } return; }
    if (!chance(0.35 + ctx.p * 0.6)) return out(`A investigação da morte de ${ctx.name} não chegou até mim.`, "good");
    enqueue("ev_murder_probe", ctx);
    return out(`A polícia chegou até mim pela morte de ${ctx.name}.`, "bad");
  },
  victimRevenge(ctx){
    if (!P().alive) return;
    if (inPrison()){ enqueue("ev_prison_fight"); return out(`Gente ligada a ${ctx.name} chegou ao meu pavilhão.`, "bad"); }
    enqueue("ev_revenge", ctx);
    return out(`${ctx.kin[0].toUpperCase() + ctx.kin.slice(1)} de ${ctx.name} veio atrás de mim.`, "bad");
  },
});
</script>
<script>/* src/systems/escape.js */
"use strict";
/* =====================================================================
   systems/escape.js — FUGA DA PRISÃO (minigame tático em grade) e vida
   de foragido(a).

   Regras do puzzle (por etapa):
   • Grade com paredes; você começa na cela (🧍) e precisa chegar à saída (🚪).
   • Guardas patrulham em linha reta, indo e voltando; olham para onde andam.
     Câmeras giram entre direções a cada 2 turnos. A visão é uma linha de
     N casas que para em paredes.
   • A cada turno você anda 1 casa (ou espera). Você é pego se entrar numa
     casa vigiada AGORA (vermelho) ou no PRÓXIMO turno (laranja).
   • Limite de turnos = melhor solução + folga. Em dificuldade alta, a saída
     exige o cartão-chave (🔑) e há mais etapas (celas → pátio → muralha).
   • Toda etapa é gerada e VERIFICADA por busca em largura (BFS) no espaço
     posição × tempo × chave: nunca existe puzzle impossível.

   Dificuldade d = segurança (mínima 0 · média 2 · máxima 4)
                   + tentativas frustradas + fugas anteriores (máx. 8).
   ===================================================================== */
const ESC_DIRS = { N:[0,-1], S:[0,1], E:[1,0], W:[-1,0] };
const ESC_TMAX = 70;

function escapeDifficulty(){
  const sec = { "mínima":0, "média":2, "máxima":4 }[S.prison?.security] ?? 1;
  return Math.min(8, sec + num(S.prison?.escAttempts) + num(S.stats.escapes));
}
function escapeParams(d){
  return { size: Math.min(10, 7 + Math.floor(d/2)), guards: Math.min(6, 2 + Math.floor(d*0.5)), cams: Math.min(3, Math.floor((d+1)/2)),
           range: d >= 5 ? 4 : 3, slack: Math.max(2, 8 - d), stages: d <= 1 ? 1 : d <= 4 ? 2 : 3, keyFrom: d >= 6 ? 0 : d >= 3 ? 99 : 999 };
}

/* ---------- Geometria e visão (puras: dependem só da etapa e do tempo) ---------- */
const escCell = (st, x, y) => (x < 0 || y < 0 || x >= st.w || y >= st.h) ? "#" : st.grid[y][x];
const escFloor = (st, x, y) => escCell(st, x, y) !== "#";
function guardAt(g, t){
  const n = g.path.length; if (n === 1) return { x:g.path[0][0], y:g.path[0][1], dir:g.dir };
  const per = 2*(n-1), k = (t + g.off) % per, i = k < n ? k : per - k;
  const k2 = (t + 1 + g.off) % per, j = k2 < n ? k2 : per - k2;
  const [x, y] = g.path[i], [x2, y2] = g.path[j];
  const dir = Object.keys(ESC_DIRS).find(d => ESC_DIRS[d][0] === Math.sign(x2-x) && ESC_DIRS[d][1] === Math.sign(y2-y)) || g.dir;
  return { x, y, dir };
}
const camDir = (c, t) => c.dirs[Math.floor((t + c.off) / 2) % c.dirs.length];
function rayCells(st, x, y, dir, range, out){
  const [dx, dy] = ESC_DIRS[dir];
  for (let k = 1; k <= range; k++){ const nx = x + dx*k, ny = y + dy*k; if (!escFloor(st, nx, ny)) break; out.add(nx + "," + ny); }
}
function visionAt(st, t){
  const v = new Set();
  for (const g of st.guards){ const p = guardAt(g, t); v.add(p.x + "," + p.y); rayCells(st, p.x, p.y, p.dir, st.range, v); }
  for (const c of st.cams) rayCells(st, c.x, c.y, camDir(c, t), st.range, v);
  return v;
}

/* ---------- Solucionador (BFS em posição × tempo × chave) ---------- */
function solveStage(st){
  const needKey = !!st.key, seen = new Set(), q = [[st.start[0], st.start[1], needKey ? 0 : 1, 0, null]];
  const vis = []; const V = t => vis[t] || (vis[t] = visionAt(st, t));
  if (V(0).has(st.start.join(","))) return null;
  seen.add(`${st.start[0]},${st.start[1]},${needKey?0:1},0`);
  for (let h = 0; h < q.length; h++){
    const [x, y, k, t] = q[h];
    if (x === st.exit[0] && y === st.exit[1]) { const path = []; for (let n = q[h]; n; n = n[4]) path.unshift([n[0], n[1]]); return { len: t, path }; }
    if (t >= ESC_TMAX) continue;
    for (const [dx, dy] of [[0,-1],[0,1],[1,0],[-1,0],[0,0]]){
      const nx = x + dx, ny = y + dy; if (!escFloor(st, nx, ny)) continue;
      if (nx === st.exit[0] && ny === st.exit[1] && !k) continue;
      const key = nx + "," + ny; if (V(t).has(key) || V(t+1).has(key)) continue;
      const nk = k || (st.key && nx === st.key[0] && ny === st.key[1]) ? 1 : 0;
      const sk = `${nx},${ny},${nk},${t+1}`; if (seen.has(sk)) continue; seen.add(sk);
      q.push([nx, ny, nk, t+1, q[h]]);
    }
  }
  return null;
}

/* ---------- Gerador ---------- */
function genStage(d, idx, total){
  const P0 = escapeParams(d), W = P0.size, H = P0.size;
  for (let attempt = 0; attempt < 60; attempt++){
    const g = Array.from({ length:H }, (_, y) => Array.from({ length:W }, (_, x) => (x === 0 || y === 0 || x === W-1 || y === H-1) ? "#" : "."));
    // blocos de parede e segmentos (corredores)
    for (let i = 0; i < Math.floor(W*H*0.07); i++){
      const x = rint(2, W-3), y = rint(2, H-3), horiz = chance(0.5), len = rint(1, 3);
      for (let k = 0; k < len; k++){ const xx = horiz ? x+k : x, yy = horiz ? y : y+k; if (xx < W-1 && yy < H-1) g[yy][xx] = "#"; }
    }
    const start = [1, H-2], exit = [W-2, 0];
    g[H-2][1] = "."; g[H-2][2] = "."; g[H-3][1] = "."; g[1][W-2] = "."; g[1][W-3] = ".";
    const st = { w:W, h:H, grid: g.map(r => r.join("")), start, exit, key:null, guards:[], cams:[], range:P0.range, name: DATA.escapeStages[Math.min(idx, 2)] };
    st.grid[0] = st.grid[0].slice(0, exit[0]) + "X" + st.grid[0].slice(exit[0]+1);
    // distâncias a partir da cela (sem guardas) — garante conectividade
    const dist = {}, bq = [start]; dist[start.join(",")] = 0;
    for (let h = 0; h < bq.length; h++){ const [x,y] = bq[h]; for (const [dx,dy] of Object.values(ESC_DIRS)){ const nx=x+dx, ny=y+dy, k=nx+","+ny; if (escFloor(st,nx,ny) && dist[k] === undefined){ dist[k] = dist[x+","+y]+1; bq.push([nx,ny]); } } }
    if (dist[exit.join(",")] === undefined) continue;
    const floors = Object.keys(dist).map(k => k.split(",").map(Number)).filter(([x,y]) => y > 0);
    // cartão-chave: longe da cela e fora do caminho direto
    const needKey = P0.keyFrom === 0 || (idx === total-1 && P0.keyFrom <= 99);
    if (needKey){ const far = floors.filter(([x,y]) => dist[x+","+y] >= W/2 && Math.abs(x-exit[0]) + Math.abs(y-exit[1]) >= 3); if (!far.length) continue; st.key = pick(far); }
    // guardas: patrulha em linha reta, longe da cela
    const busy = new Set([start.join(","), exit.join(","), st.key?.join(",")]);
    for (let i = 0; i < P0.guards; i++){
      const cand = floors.filter(([x,y]) => dist[x+","+y] >= 3 && !busy.has(x+","+y));
      if (!cand.length) break;
      const [x, y] = pick(cand), horiz = chance(0.5), [dx, dy] = horiz ? [1,0] : [0,1], path = [[x,y]], want = rint(3, 5);
      for (let k = 1; path.length < want && escFloor(st, x+dx*k, y+dy*k) && y+dy*k > 0; k++) path.push([x+dx*k, y+dy*k]);
      for (let k = 1; path.length < want && escFloor(st, x-dx*k, y-dy*k) && y-dy*k > 0; k++) path.unshift([x-dx*k, y-dy*k]);
      if (path.length < 2) continue;
      if (path.some(([px,py]) => Math.abs(px-start[0]) + Math.abs(py-start[1]) <= 1)) continue;
      path.forEach(p => busy.add(p.join(",")));
      st.guards.push({ path, off: rint(0, 2*(path.length-1)-1), dir: horiz ? "E" : "S" });
    }
    // câmeras: presas a paredes, varrendo os corredores vizinhos
    for (let i = 0; i < P0.cams; i++){
      const walls = [];
      for (let y = 1; y < H-1; y++) for (let x = 1; x < W-1; x++) if (st.grid[y][x] === "#"){ const dirs = Object.keys(ESC_DIRS).filter(dn => escFloor(st, x+ESC_DIRS[dn][0], y+ESC_DIRS[dn][1]) && st.grid[y+ESC_DIRS[dn][1]][x+ESC_DIRS[dn][0]] !== "X"); if (dirs.length >= 2) walls.push({ x, y, dirs }); }
      if (!walls.length) break;
      const w = pick(walls); if (st.cams.some(c => c.x === w.x && c.y === w.y)) continue;
      st.cams.push({ x:w.x, y:w.y, dirs: w.dirs.slice(0, 2 + (d >= 6 ? 1 : 0)), off: rint(0, 3) });
    }
    if (st.guards.length < Math.min(2, P0.guards)) continue;
    const sol = solveStage(st);
    if (!sol || sol.len < Math.max(6, W - 2)) continue;
    st.opt = sol.len; st.limit = sol.len + P0.slack;
    return st;
  }
  // fallback garantido: sem guardas (nunca deve acontecer, mas jamais trava o jogo)
  const W2 = 7, g2 = Array.from({ length:W2 }, (_, y) => (y === 0 ? "#####X#" : y === W2-1 ? "#######" : "#.....#"));
  const st = { w:W2, h:W2, grid:g2, start:[1,W2-2], exit:[5,0], key:null, guards:[], cams:[], range:3, name:DATA.escapeStages[0] };
  st.opt = solveStage(st).len; st.limit = st.opt + 6; return st;
}

/* ---------- Ciclo do minigame ---------- */
function escapeBlock(){
  if (!S.prison) return "Você não está preso(a).";
  if (num(S.prison.escBlock) > 0) return `Vigilância reforçada sobre você: espere ${S.prison.escBlock} ano(s).`;
  if (S.prison.escTriedAge === P().age) return "Você já tentou fugir este ano.";
  if (P().stats.health < 15) return "Fraco(a) demais para tentar.";
  return null;
}
function startEscape(bonus = 0){
  const why = escapeBlock(); if (why) return R(false, why);
  const d = Math.max(0, escapeDifficulty() - bonus), P0 = escapeParams(d), stages = [];
  for (let i = 0; i < P0.stages; i++) stages.push(genStage(d, i, P0.stages));
  S.prison.escTriedAge = P().age;
  S.escape = { d, stages, stage:0, t:0, pos:[...stages[0].start], key:!stages[0].key, over:false, result:null, msg:"" };
  return R(true, `Plano de fuga em ${P0.stages} etapa(s). Dificuldade ${d}/8.`);
}
const escStage = () => S.escape.stages[S.escape.stage];
/* dir: N | S | E | W | wait. Retorna texto curto para a UI. */
function escapeMove(dir){
  const E = S.escape; if (!E || E.over) return "";
  const st = escStage(), [dx, dy] = dir === "wait" ? [0,0] : ESC_DIRS[dir];
  const nx = E.pos[0] + dx, ny = E.pos[1] + dy;
  if (!escFloor(st, nx, ny)) return "🧱 Parede.";
  if (nx === st.exit[0] && ny === st.exit[1] && !E.key) return "🔒 A porta exige o cartão-chave.";
  const k = nx + "," + ny;
  if (visionAt(st, E.t).has(k) || visionAt(st, E.t + 1).has(k)){ E.pos = [nx, ny]; return failEscape("👮 Um guarda te viu!"); }
  E.pos = [nx, ny]; E.t++;
  emit("step");
  if (st.key && nx === st.key[0] && ny === st.key[1] && !E.key){ E.key = true; emit("pickup"); }
  if (nx === st.exit[0] && ny === st.exit[1]){
    if (E.stage + 1 < E.stages.length){ E.stage++; E.t = 0; E.pos = [...escStage().start]; E.key = !escStage().key; emit("stage"); return `✅ ${st.name} superado! Próxima etapa: ${escStage().name}.`; }
    return succeedEscape();
  }
  if (E.t >= st.limit) return failEscape("⏰ A contagem de presos começou — sua cela estava vazia.");
  return dir === "wait" ? "⏳ Esperei imóvel nas sombras." : "";
}
function abortEscape(){ const E = S.escape; if (!E || E.stage || E.t) return false; S.escape = null; if (S.prison) S.prison.escTriedAge = null; return true; }

function succeedEscape(){
  const E = S.escape, pr = S.prison; E.over = true; E.result = "ok";
  S.wanted = { since:P().age, remaining: pr.years, crime: pr.crime, fakeId:false, country:P().country, years:0, security: pr.security };
  S.prison = null; S.stats.escapes = num(S.stats.escapes) + 1;
  addNoto(40); addStat("happiness", 15); addStress(10);
  if (S.org) S.org.respect = clamp(S.org.respect + 12);
  log(`🏃 FUGI DA PRISÃO (${pr.security}) e agora sou foragido(a) da Justiça. 🚨`, "milestone", ["crime"]);
  achieve("escape", "Fuga da prisão");
  emit("escape");
  return E.msg = "🏃 Você está livre! A partir de agora, é foragido(a): a polícia vai te procurar.";
}
function failEscape(why){
  const E = S.escape, pr = S.prison; E.over = true; E.result = "fail";
  const add = rint(2, 4), hurt = rint(10, 20);
  pr.years += add; pr.escBlock = 2; pr.escAttempts = num(pr.escAttempts) + 1;
  if (pr.security === "mínima") pr.security = "média"; else if (pr.security === "média" && chance(0.5)) pr.security = "máxima";
  const seq = injure(hurt, "O espancamento após a fuga frustrada", 0.3);
  addStat("happiness", -10); addStress(12);
  log(`🚨 Tentativa de fuga frustrada: +${add} anos de pena, solitária e surra dos agentes.`, "bad", ["crime"]);
  emit("caught");
  return E.msg = `${why} Fuga frustrada: +${add} anos de pena, ${hurt} de saúde perdidos na surra, 2 anos sob vigilância reforçada. Agora em segurança ${pr.security}.${seq}`;
}
function closeEscape(){ const E = S.escape; if (!E) return ""; const m = E.msg; S.escape = null; return m; }
/* Bots e saves recarregados: resolve sem UI (chance cai com a dificuldade). */
function autoEscape(){
  const E = S.escape; if (!E) return;
  if (!E.over){ if (chance(0.62 - E.d*0.06)) succeedEscape(); else failEscape("👮 Pego(a) no corredor."); }
  closeEscape();
}

/* ---------- Foragido(a) ---------- */
function recaptureChance(){
  const W = S.wanted; if (!W) return 0;
  return Math.min(0.9, 0.22 * (P().country !== W.country ? 0.35 : 1) * (W.fakeId ? 0.45 : 1) * (S.org ? 0.8 : 1) * (1 + P().notoriety/200));
}
function fugitiveYear(){
  const W = S.wanted; if (!W || inPrison()) return;
  W.years = num(W.years) + 1; addStress(5);
  if (chance(recaptureChance())){
    const y = W.remaining + rint(2, 5), crime = W.crime; S.wanted = null;
    log("🚔 Fui recapturado(a) depois de anos foragido(a).", "bad");
    sendToPrison(y, `fuga da prisão (${crime})`, "máxima");
    return;
  }
  if (W.years >= 15){ S.wanted = null; log("📁 Meu caso de foragido(a) esfriou e saiu da lista de prioridades.", "good"); return; }
  if (chance(0.45)) enqueue("ev_fugitive");
}
function buyFakeId(){
  const W = S.wanted; if (!W) return R(false, "Você não precisa disso.");
  if (W.fakeId) return R(false, "Você já tem identidade falsa.");
  const cost = priceOf(9000);
  if (S.dirty >= cost) S.dirty -= cost; else if (canAfford(cost)) addMoney(-cost); else return R(false, `Um documento bom custa ${fmt(cost)}.`);
  if (chance(0.15)){ addNoto(10); return R(false, "O falsário era informante. Perdi o dinheiro e a polícia sabe meu novo nome."); }
  W.fakeId = true; log("🪪 Comprei uma identidade falsa.", "bad");
  return R(true, "Nova identidade. Empregos comuns voltam a ser possíveis (concursos, não).");
}
</script>
<script>/* src/systems/prison.js */
"use strict";
/* =====================================================================
   systems/prison.js — VIDA NA PRISÃO: pátio (força + intimidação),
   trabalho, cursos/oficinas, recurso judicial e visitas.

   REMIÇÃO CONTEXTUAL: cada sessão de estudo/trabalho acumula
     base (estudo 0,07 · trabalho 0,06 ano) × mult[curso][tipo do crime]
     × comportamento (0,5 se brigou no ano)
   em S.prison.remit; a cada 1,0 acumulado, a pena cai 1 ano.
   Ex.: preso por fraude estudando Direito Penal remite ~2,2× mais que
   alguém preso por homicídio no mesmo curso; para este, Terapia rende
   2,3×. O tipo do crime é detectado por crimeCategory(texto da pena).
   ===================================================================== */
function crimeCategory(crime){
  const t = String(crime || "");
  for (const k of ["financial","violent","property","drugs"]) if (DATA.crimeCats[k].re.test(t)) return k;
  return "other";
}
const prisonCat = () => S.prison?.cat || crimeCategory(S.prison?.crime);
function prisonCourse(id){ return (S.prison.courses ||= {})[id] ||= { p:0, done:false }; }

/* Converte remição acumulada em anos de pena a menos. */
function applyRemit(amount, why){
  const pr = S.prison; pr.remit = num(pr.remit) + amount;
  let cut = 0;
  while (pr.remit >= 1 && pr.years > 1){ pr.remit -= 1; pr.years--; cut++; }
  if (cut){ S.stats.remitted = num(S.stats.remitted) + cut; log(`📉 Remição de pena (${why}): −${cut} ano(s). Restam ${pr.years}.`, "good", ["crime"]); }
  return cut ? ` 📉 Pena reduzida em ${cut} ano(s)!` : ` (+${Math.round(amount*365)} dias de remição acumulados)`;
}
const behaviorMult = () => S.prison.foughtAge === P().age ? 0.5 : 1;

function prisonAct(kind, id){
  const pr = S.prison; if (!pr) return R(false, "Você não está preso(a).");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  const cat = prisonCat();
  switch (kind){
    case "yard": {
      const g = rint(4, 9); pr.intim = clamp(num(pr.intim) + g); S.health.exercised = true; addStress(-3);
      return R(true, `Malhei no pátio. Intimidação ${Math.round(pr.intim)} (+${g}).` + fx({ health: rint(1,3), looks: chance(0.3) ? 1 : 0 }));
    }
    case "work": {
      const pay = priceOf(rint(60, 160)); addMoney(pay);
      const job = pick(["na cozinha","na lavanderia","na oficina de costura","na manutenção","na horta"]);
      return R(true, `Trabalhei ${job} e juntei ${fmt(pay)} de pecúlio.` + applyRemit(DATA.prisonRemit.work * (cat === "property" ? 1.4 : 1) * behaviorMult(), "trabalho"));
    }
    case "course": {
      const c = byId(DATA.prisonCourses, id); if (!c) return R(false, "?");
      if (P().stats.intelligence < c.minInt){ S.activitiesThisYear--; return R(false, `Exige inteligência ${c.minInt}. Faça Leitura e Redação antes.`); }
      const st = prisonCourse(id);
      const g = Math.round(rint(18, 30) * (0.7 + P().stats.intelligence/180));
      const was = st.done; st.p = Math.min(100, st.p + g);
      let msg = `${c.emoji} ${c.name}: ${st.done ? "revisão" : `progresso ${st.p}%`}.`;
      if (!was && st.p >= 100){ st.done = true; msg += " 🎓 Concluído! " + coursePerk(c); }
      const mult = c.mult[cat] || 1;
      msg += applyRemit(DATA.prisonRemit.study * mult * behaviorMult(), `${c.name}${mult > 1.3 ? ", alinhado ao meu caso" : ""}`);
      if (id === "literacy") addStat("intelligence", 1);
      return R(true, msg);
    }
    case "visit": {
      const fam = S.rels.filter(r => r.alive && ["mother","father","spouse","partner","child","sibling"].includes(r.role));
      if (!fam.length){ S.activitiesThisYear--; return R(false, "Ninguém vem me visitar."); }
      const v = pick(fam); v.rel = clamp(v.rel + 6); addStress(-6);
      return R(true, `${v.first} veio me visitar. Chorei no abraço.` + fx({ happiness: rint(5, 10) }));
    }
  }
  return R(false, "?");
}
function coursePerk(c){
  if (!S.prisonSkills.includes(c.id)) S.prisonSkills.push(c.id);
  log(`🎓 Concluí o curso de ${c.name} na prisão.`, "milestone");
  switch (c.id){
    case "it": S.cyberSkill = clamp(S.cyberSkill + 15); return "Agora sei programar de verdade.";
    case "therapy": addStress(-15); for (const k in S.addictions) S.addictions[k] = clamp(S.addictions[k] - 20); P().karma = clamp(P().karma + 8); return "Aprendi a lidar com a raiva e com os vícios.";
    case "finance": addCredit(30); return "Entendi finalmente juros, orçamento e crédito.";
    case "literacy": addStat("intelligence", 4); return "Ler virou meu refúgio.";
    case "law": return "Agora entendo meu processo — e posso recorrer.";
    default: return "Aprendi um ofício.";
  }
}
/* Recurso/revisão criminal: exige Direito Penal concluído; 1 por pena. */
function appealSentence(){
  const pr = S.prison; if (!pr) return R(false, "Você não está preso(a).");
  if (!prisonCourse("law").done) return R(false, "Conclua Direito Penal Básico para montar o recurso.");
  if (pr.appealed) return R(false, "Seu recurso já foi julgado nesta pena.");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  pr.appealed = true;
  const cat = prisonCat(), p = clamp((DATA.appealOdds[cat] + (P().stats.intelligence - 50)/250 + (prisonCourse("therapy").done ? 0.05 : 0)) * 100, 5, 85) / 100;
  if (!chance(p)) return R(false, `Recurso negado (chance era ${Math.round(p*100)}%). Pelo menos aprendi como o tribunal pensa.`);
  const cut = Math.max(1, Math.round(pr.years * rfloat(0.2, 0.4)));
  pr.years = Math.max(0, pr.years - cut);
  log(`⚖️ Ganhei o recurso: pena reduzida em ${cut} ano(s).`, "milestone", ["crime"]);
  if (pr.years <= 0){ S.prison = null; S.parole = 2; log("🔓 Fui solto(a) pelo recurso!", "milestone"); return R(true, `RECURSO ACEITO! Pena extinta — estou livre! 🔓`); }
  return R(true, `Recurso aceito! −${cut} ano(s) de pena (restam ${pr.years}).`);
}
/* Bônus de contratação por ofícios aprendidos na cadeia (usado em oddsHire). */
function prisonHireBonus(c){
  const sk = S.prisonSkills || [];
  let b = 0;
  if (sk.includes("it") && /Tecnologia|TI|Dados/i.test(c.sector)) b += 0.1;
  if (sk.includes("workshop") && (c.tier === "operacional" || c.edu <= 1)) b += 0.1;
  if (sk.includes("law") && /Justiça/i.test(c.sector)) b += 0.05;
  return b;
}
</script>
<script>/* src/systems/looks.js */
"use strict";
/* =====================================================================
   systems/looks.js — APARÊNCIA E VISÃO.
   • Estilo: cabelo, barba/maquiagem (ganho pontual, rende menos se
     repetido no ano), guarda-roupa (custo anual → +aparência/ano até um
     teto) e skincare (custo anual → metade da perda de aparência pela idade).
   • Procedimentos: botox, harmonização, lentes dentais e cirurgia
     plástica premium ou BARATA (erro médico: aparência, saúde e até morte).
   • Visão: teste ÚNICO na escola (S.look.visionTested). Miopia → óculos
     com penalidade de aparência pela armação (básica −4, moderna −2,
     grife −1, lentes de contato 0 com custo anual). Sem correção: dor de
     cabeça e queda no desempenho escolar. Adulto(a) pode fazer cirurgia
     a laser (premium 97% ou clínica barata 80% de sucesso).
   ===================================================================== */
const look = () => S.look;
DATA.hairStyles = [
  { id:"natural",  name:"Natural",                 price:0,    looks:0 },
  { id:"simple",   name:"Corte simples",           price:40,   looks:1 },
  { id:"modern",   name:"Corte moderno",           price:120,  looks:2 },
  { id:"color",    name:"Coloração / luzes",       price:260,  looks:2 },
  { id:"visagism", name:"Visagismo premium",       price:700,  looks:3 },
];
DATA.faceStyles = [
  { id:"none",     name:"Nada",                    price:0,    looks:0 },
  { id:"beard",    name:"Barba desenhada",         price:60,   looks:1 },
  { id:"makeup",   name:"Maquiagem profissional",  price:150,  looks:2 },
  { id:"brows",    name:"Design de sobrancelhas",  price:80,   looks:1 },
];
DATA.wardrobes = [
  { id:0, name:"Básico",       price:0,     perYear:0, cap:0 },
  { id:1, name:"Moderno",      price:2500,  perYear:1, cap:80 },
  { id:2, name:"Grife",        price:12000, perYear:2, cap:92 },
];
DATA.procedures = [
  { id:"botox",   name:"Botox",                          price:1800,  looks:[2,4],  minAge:25, risk:0.01, harm:[2,4] },
  { id:"harmon",  name:"Harmonização facial",            price:6000,  looks:[3,6],  minAge:21, risk:0.06, harm:[4,9] },
  { id:"veneers", name:"Lentes dentais",                 price:12000, looks:[4,6],  minAge:18, risk:0.03, harm:[2,5] },
  { id:"plastic_lux", name:"Cirurgia plástica (clínica premium)",   price:25000, looks:[8,14], minAge:18, risk:0.04, harm:[6,12], surgery:true },
  { id:"plastic_cheap",name:"Cirurgia plástica (clínica barata)",   price:5000,  looks:[7,12], minAge:18, risk:0.25, harm:[10,20], surgery:true, cheap:true },
];
DATA.frames = [
  { id:"basic",    name:"Armação básica do SUS/convênio", price:0,    penalty:4 },
  { id:"modern",   name:"Armação moderna",                price:400,  penalty:2 },
  { id:"designer", name:"Armação de grife",               price:1500, penalty:1 },
  { id:"contacts", name:"Lentes de contato",              price:600,  penalty:0, yearly:true, minAge:13 },
];

/* Paga custo (adulto paga; criança: família paga se puder). */
function payLook(v){
  if (v <= 0) return true;
  if (!adult()){ if (clsBand() >= 1 || v <= priceOf(100)) return true; return false; }
  if (!canAfford(v)) return false; addMoney(-v); return true;
}
function setStyle(kind, id){
  const L = look(), list = kind === "hair" ? DATA.hairStyles : DATA.faceStyles, d = byId(list, id);
  if (!d) return R(false, "?");
  if (P().age < 8) return R(false, "Seus pais escolhem seu cabelo por enquanto.");
  const price = priceOf(d.price); if (!payLook(price)) return R(false, `Custa ${fmt(price)}.`);
  L[kind === "hair" ? "hair" : "face"] = id;
  const key = "style"; const g = sc(d.looks, key); S.actCount[key] = num(S.actCount[key]) + 1;
  if (g) addStat("looks", g);
  return R(true, `Novo visual: ${d.name}.${g ? ` (Aparência +${g})` : ""}`);
}
function setWardrobe(id){
  const d = byId(DATA.wardrobes, id); if (!d) return R(false, "?");
  if (P().age < 14) return R(false, "Ainda é a família que compra suas roupas.");
  look().wardrobe = id;
  return R(true, id ? `Guarda-roupa ${d.name}: ${fmt(priceOf(d.price))}/ano, +${d.perYear} de aparência por ano (até ${d.cap}).` : "Voltei ao básico.");
}
function toggleSkincare(){
  if (P().age < 14) return R(false, "Cedo demais.");
  look().skincare = !look().skincare;
  return R(true, look().skincare ? `Rotina de skincare: ${fmt(priceOf(1500))}/ano, envelhecimento da pele pela metade.` : "Larguei o skincare.");
}
function doProcedure(id){
  const d = byId(DATA.procedures, id); if (!d) return R(false, "?");
  if (P().age < d.minAge) return R(false, `Idade mínima: ${d.minAge}.`);
  if (inPrison()) return R(false, "Você está preso(a).");
  const price = priceOf(d.price); if (!canAfford(price)) return R(false, `Custa ${fmt(price)}.`);
  addMoney(-price); look().procedures++; emit("hospital");
  const risk = d.risk * (P().age > 60 ? 2 : 1) * (P().stats.health < 40 ? 1.5 : 1);
  if (chance(risk)){
    const h = rint(...d.harm);
    addStat("looks", -h);
    let msg = `${d.cheap ? "ERRO MÉDICO" : "Complicação"} em ${d.name.toLowerCase()}: aparência −${h}.`;
    if (d.surgery){
      msg += injure(rint(8, 20), `Erro na ${d.name.toLowerCase()}`, 0.5);
      if (d.cheap && chance(0.06)){ S.flags.forcedDeath = "complicações de uma cirurgia plástica em clínica clandestina"; log("☠️ A clínica barata não tinha nem UTI.", "bad"); }
      if (d.cheap) schedule("clinicLawsuit", 1, { price }, "Posso processar a clínica.");
    }
    addStat("happiness", -10); log(`💉 ${msg}`, "bad", ["health"]);
    return R(false, msg);
  }
  const g = rint(...d.looks); addStat("looks", g); addStat("happiness", 5);
  if (d.surgery && chance(0.15)) schedule("plasticRevision", rint(5, 10));
  log(`💉 ${d.name}: aparência +${g}.`, "", ["health"]);
  return R(true, `${d.name} deu certo: aparência +${g}.`);
}

/* ---------- Visão ---------- */
function setFrame(id){
  const L = look(), d = byId(DATA.frames, id); if (!d || !L.myopia || L.lasik) return R(false, "Você não usa óculos.");
  if (d.minAge && P().age < d.minAge) return R(false, `Lentes de contato a partir dos ${d.minAge}.`);
  const price = priceOf(d.price); if (!d.yearly && !payLook(price)) return R(false, `Custa ${fmt(price)}.`);
  const diff = d.penalty - num(L.glassesPenalty);
  addStat("looks", -diff); L.glassesPenalty = d.penalty; L.glasses = id;
  return R(true, `Agora uso: ${d.name}.${diff ? ` (Aparência ${diff > 0 ? "−" : "+"}${Math.abs(diff)})` : ""}`);
}
function laserSurgery(cheap){
  const L = look();
  if (!L.myopia || L.lasik) return R(false, "Sua visão não precisa de correção.");
  if (P().age < 20) return R(false, "O grau só estabiliza depois dos 20 anos.");
  const price = priceOf(cheap ? 3500 : 9000); if (!canAfford(price)) return R(false, `Custa ${fmt(price)}.`);
  addMoney(-price);
  if (!chance(cheap ? 0.8 : 0.97)){
    const msg = "A cirurgia não corrigiu tudo e deixou o olho seco." + injure(rint(3, 8), "A cirurgia ocular", 0.3);
    addStat("looks", -1); log(`👁️ ${msg}`, "bad", ["health"]); return R(false, msg);
  }
  addStat("looks", num(L.glassesPenalty) + 1); L.glassesPenalty = 0; L.glasses = null; L.lasik = true;
  log("👁️ Fiz cirurgia a laser: adeus, óculos!", "milestone", ["health"]); achieve("lasik", "Visão corrigida a laser");
  return R(true, "Visão 100%! Aparência recuperada (+1 bônus).");
}

/* ---------- Tick anual ---------- */
function looksYear(){
  const L = look(), Y = S.yearSummary, a = P().age;
  if (a >= 14){
    const w = DATA.wardrobes[L.wardrobe || 0];
    if (w.price){ const c = priceOf(w.price); if (adult() && S.money < c){ L.wardrobe = 0; log("👕 Cortei o guarda-roupa caro: não cabia no orçamento.", ""); } else { if (adult()){ addMoney(-c); Y.expenses += c; Y.lines.push([`Guarda-roupa ${w.name.toLowerCase()}`, -c]); } if (P().stats.looks < w.cap) addStat("looks", w.perYear); } }
    if (L.skincare){ const c = priceOf(1500); if (adult() && S.money < c) L.skincare = false; else if (adult()){ addMoney(-c); Y.expenses += c; Y.lines.push(["Skincare", -c]); } }
    if (L.glasses === "contacts"){ const c = priceOf(600); if (adult() && S.money < c){ setFrame("basic"); log("👓 Sem dinheiro para lentes: voltei aos óculos básicos.", "bad"); } else if (adult()){ addMoney(-c); Y.expenses += c; Y.lines.push(["Lentes de contato", -c]); } }
  }
  // miopia sem correção: dor de cabeça e notas ruins
  if (L.myopia && !L.glasses && !L.lasik){ if (S.edu.school) S.edu.perf = clamp(S.edu.perf - 4); addStress(3); }
}
CONSEQ.clinicLawsuit = ctx => { if (chance(0.5)){ const v = Math.round(ctx.price * 2); addMoney(v); return out(`Ganhei o processo contra a clínica: ${fmt(v)} de indenização.`, "good"); } return out("A clínica fechou e sumiu. Não recebi nada.", "bad"); };
</script>
<script>/* src/systems/pets.js */
"use strict";
/* =====================================================================
   systems/pets.js — ANIMAIS: adoção, pet shop, mercado exótico.

   Cada pet: bond (vínculo), hunger (fome), stress, health, trained (0–1),
   neglect (anos SEGUIDOS de descuido), played (interagiu no ano).
   Tick anual: paga ração+veterinário (sem dinheiro → fome +35);
   sem interação → estresse +20 e vínculo −8; espaço inadequado (porte
   maior que a moradia) → estresse +25. Ano com fome ≥ 50 ou estresse ≥ 60
   conta como DESCUIDO.

   RISCO DE ATAQUE (só espécies com danger > 0.05), por ano:
     p = danger × (0.008 + 0.12·anosDeDescuido + fome·0.0015 + estresse·0.001)
         × (1 − vínculo/200) × (1 − treino·0.35)
   Tigre bem cuidado ≈ 0,5%/ano; 2 anos sem comida nem atenção ≈ 25–30%/ano.
   Ataque: pode MATAR o dono (fim de jogo), ferir gravemente ou atacar
   uma visita (processo, prisão possível, animal sacrificado).
   Exóticos são ilegais: fiscalização ambiental pode apreender + multar.
   ===================================================================== */
const MAX_PETS = 6;
const petSp = pt => byId(DATA.petSpecies, pt.sp);
function homeSpace(){
  if (inPrison()) return 0;
  const own = residence();
  if (own){ const k = byId(DATA.properties, own.id)?.kind; return k === "Sítio/Fazenda" || k === "Mansão" ? 2 : k === "Casa" ? 1 : 0; }
  if (S.rental) return /Casa/i.test(byId(DATA.rentals, S.rental)?.name || "") ? 1 : 0;
  if (parents().length || P().age < 18) return clsBand() >= 4 ? 2 : clsBand() >= 2 ? 1 : 0;
  return 0;
}
const spaceName = n => ["apartamento/sem quintal","casa com quintal","sítio, fazenda ou mansão"][n];

function addPet(spId, opts = {}){
  const sp = byId(DATA.petSpecies, spId);
  const pt = { uid:uid(), sp:spId, name: opts.name || pick(DATA.petNames), age: num(opts.age, 0), bond: num(opts.bond, 45), hunger:0, stress: num(opts.stress, 10),
    neglect:0, health: num(opts.health, 90), trained: 0, played:false, temper: opts.temper || "dócil", lifespan: rint(...sp.life) };
  (S.pets ||= []).push(pt); S.stats.petsOwned = num(S.stats.petsOwned) + 1;
  log(`${sp.emoji} ${pt.name} (${sp.name.toLowerCase()}) entrou para a família.`, "good");
  return pt;
}
/* Abrigo: 4 bichos gerados por ano (estável no ano). */
function shelterList(){
  if (S.flags.shelterAge !== P().age || !S.flags.shelter){
    S.flags.shelterAge = P().age;
    S.flags.shelter = [0,1,2,3].map(() => { const sp = pick(DATA.petSpecies.filter(s => s.src === "shelter")); return { sp:sp.id, name:pick(DATA.petNames), age:rint(0, 9), temper: pick(["dócil","medroso","brincalhão","ciumento","calmo"]) }; });
  }
  return S.flags.shelter;
}
function canKeep(sp){
  if ((S.pets || []).length >= MAX_PETS) return `Máximo de ${MAX_PETS} animais.`;
  if (inPrison()) return "Você está preso(a).";
  if (sp.src === "exotic" && P().age < 18) return "O mercado exótico só vende para adultos.";
  if (sp.src === "shop" && P().age < 10) return "Peça para seus pais.";
  return null;
}
function adoptPet(i){
  const a = shelterList()[i]; if (!a) return R(false, "Esse já foi adotado.");
  const sp = byId(DATA.petSpecies, a.sp), why = canKeep(sp); if (why) return R(false, why);
  const fee = priceOf(sp.price); if (adult() && !canAfford(fee)) return R(false, `Taxa de adoção: ${fmt(fee)}.`);
  if (adult()) addMoney(-fee);
  S.flags.shelter.splice(i, 1);
  const pt = addPet(sp.id, { name:a.name, age:a.age, temper:a.temper, bond:55 }); P().karma = clamp(P().karma + 4); addStat("happiness", 8);
  return R(true, `Você adotou ${pt.name}! 🐾 (taxa ${fmt(fee)})`);
}
function buyPet(spId, name){
  const sp = byId(DATA.petSpecies, spId); if (!sp || sp.src === "shelter") return R(false, "?");
  const why = canKeep(sp); if (why) return R(false, why);
  const price = priceOf(sp.price); if (!canAfford(price)) return R(false, `Custa ${fmt(price)}.`);
  addMoney(-price);
  if (sp.illegal){ addNoto(4); S.crimeSkill = clamp(S.crimeSkill + 1); if (chance(0.12)){ const fine = priceOf(rint(10000, 40000)); addMoney(-Math.min(Math.max(0,S.money), fine)); S.record.push({ crime:"tráfico de animais silvestres", age:P().age, years:0 }); log(`🚨 Flagrante do Ibama na compra de um(a) ${sp.name.toLowerCase()}: animal apreendido e multa de ${fmt(fine)}.`, "bad", ["crime"]); return R(false, `Era fiscalização! Animal apreendido, multa de ${fmt(fine)} e ficha suja.`); } }
  const pt = addPet(spId, { name: (name || "").trim().slice(0, 20) || undefined, bond: sp.danger > 0.2 ? 25 : 40, temper: sp.danger > 0.2 ? "selvagem" : "dócil" });
  if (sp.danger >= 0.3) remember(`Tenho um(a) ${sp.name.toLowerCase()} em casa. Se faltar comida, atenção ou espaço, isso pode acabar muito mal.`, "pending");
  return R(true, `${sp.emoji} ${pt.name} é seu/sua! ${sp.illegal ? "⚠️ Posse ilegal: cuidado com a fiscalização." : ""}`);
}
function petAct(u, kind){
  const pt = (S.pets || []).find(x => x.uid === u); if (!pt) return R(false, "?");
  const sp = petSp(pt);
  if (inPrison()) return R(false, "Você está preso(a).");
  switch (kind){
    case "play": {
      if (pt.played) return R(false, `Você já brincou com ${pt.name} este ano. (Treinar gasta energia.)`);
      pt.played = true; pt.bond = clamp(pt.bond + rint(6, 12)); pt.stress = clamp(pt.stress - 15); addStress(-3);
      return R(true, `Brincou com ${pt.name}. ${sp.danger >= 0.3 ? "Com cuidado." : "Que farra!"}` + fx({ happiness: 3 }));
    }
    case "feed": {
      const c = priceOf(Math.max(80, sp.food * 0.25)); if (!canAfford(c)) return R(false, `Ração especial: ${fmt(c)}.`);
      addMoney(-c); pt.hunger = clamp(pt.hunger - 40); pt.bond = clamp(pt.bond + 3);
      return R(true, `${pt.name} devorou a ração especial (${fmt(c)}).`);
    }
    case "train": {
      const c = sp.danger >= 0.2 ? priceOf(3000) : priceOf(300);
      if (!canAfford(c)) return R(false, `Adestrador: ${fmt(c)}.`);
      if (!spendEnergy()) return R(false, "Sem energia este ano.");
      addMoney(-c); pt.trained = Math.min(1, pt.trained + (sp.danger >= 0.2 ? 0.2 : 0.35)); pt.bond = clamp(pt.bond + 5); pt.stress = clamp(pt.stress - 8);
      return R(true, `${pt.name} está ${Math.round(pt.trained*100)}% adestrado(a).`);
    }
    case "vet": {
      const c = priceOf(Math.max(150, sp.vet * 0.6)); if (!canAfford(c)) return R(false, `Consulta: ${fmt(c)}.`);
      addMoney(-c); pt.health = clamp(pt.health + 20); pt.stress = clamp(pt.stress - 5);
      return R(true, `${pt.name} foi ao veterinário${sp.illegal ? " (um que não faz perguntas)" : ""}. Saúde ${Math.round(pt.health)}.`);
    }
    case "giveaway": {
      S.pets = S.pets.filter(x => x !== pt); addStat("happiness", -6);
      if (sp.illegal){ P().karma = clamp(P().karma + 6); log(`${sp.emoji} Entreguei ${pt.name} a um santuário de animais. Sem multa por entrega voluntária.`, ""); return R(true, `${pt.name} foi para um santuário.`); }
      log(`${sp.emoji} Doei ${pt.name} para uma família que vai cuidar bem.`, ""); return R(true, `Doei ${pt.name}.`);
    }
  }
  return R(false, "?");
}

/* Probabilidade anual de ataque (exposta à UI). */
function attackRisk(pt){
  const sp = petSp(pt); if (!sp || sp.danger <= 0.05) return 0;
  return Math.min(0.9, sp.danger * (0.008 + 0.12*pt.neglect + pt.hunger*0.0015 + pt.stress*0.001) * (1 - pt.bond/200) * (1 - pt.trained*0.35));
}
function petsYear(){
  const pets = S.pets || []; if (!pets.length) return;
  const Y = S.yearSummary, space = homeSpace();
  for (const pt of [...pets]){
    const sp = petSp(pt); pt.age++;
    if (inPrison()){
      if (sp.illegal){ S.pets = S.pets.filter(x => x !== pt); log(`${sp.emoji} Sem mim, ${pt.name} foi apreendido(a) pelo Ibama.`, "bad"); continue; }
      pt.bond = clamp(pt.bond - 6); pt.played = false; continue; // família cuida dos domésticos
    }
    // custos: ração + veterinário
    const cost = priceOf(sp.food + sp.vet);
    if (!adult() && !sp.illegal){ pt.hunger = clamp(pt.hunger - 30); } // família banca os pets da criança
    else if (S.money >= cost){ addMoney(-cost); Y.expenses += cost; Y.lines.push([`${sp.emoji} ${pt.name}: ração e veterinário`, -cost]); pt.hunger = clamp(pt.hunger - 40); pt.health = clamp(pt.health + 3); }
    else { pt.hunger = clamp(pt.hunger + 35); pt.health = clamp(pt.health - 8); }
    if (!pt.played){ pt.stress = clamp(pt.stress + 20); pt.bond = clamp(pt.bond - 8); } else pt.stress = clamp(pt.stress - 10);
    if (sp.size > space) pt.stress = clamp(pt.stress + 25);
    pt.neglect = pt.hunger >= 50 || pt.stress >= 60 ? pt.neglect + 1 : 0;
    pt.played = false;
    if (pt.bond >= 60) addStat("happiness", 2);
    // fiscalização ambiental
    if (sp.illegal && chance(0.05 + P().notoriety/1000)){
      const fine = priceOf(rint(15000, 60000)); addMoney(-Math.min(Math.max(0,S.money), fine)); S.pets = S.pets.filter(x => x !== pt);
      S.record.push({ crime:"posse ilegal de animal silvestre", age:P().age, years:0 }); addNoto(6);
      log(`🚨 Denúncia anônima: o Ibama apreendeu ${pt.name} (${sp.name.toLowerCase()}). Multa de ${fmt(fine)}.`, "bad", ["crime"]);
      continue;
    }
    // ataque
    if (chance(attackRisk(pt))){ petAttack(pt, sp); if (!P().alive || S.flags.forcedDeath) return; continue; }
    // velhice / doença
    if (pt.age >= pt.lifespan || pt.health <= 0 || (pt.age >= pt.lifespan - 2 && chance(0.3))){
      S.pets = S.pets.filter(x => x !== pt); addStat("happiness", -Math.round(4 + pt.bond/8));
      log(`🕯️ ${pt.name}, meu/minha ${sp.name.toLowerCase()}, morreu aos ${pt.age} anos.`, "bad");
      if (pt.bond >= 70) remember(`Perder ${pt.name} doeu como perder alguém da família.`, "bad");
    }
  }
}
function petAttack(pt, sp){
  const r = rand(), pDeath = clamp((0.12 + sp.danger*0.35 + pt.neglect*0.08) * 100, 5, 75) / 100;
  S.pets = S.pets.filter(x => x !== pt);
  if (r < pDeath){
    S.flags.forcedDeath = `ataque do próprio ${sp.name.toLowerCase()} (${pt.name})`;
    addFame(15);
    log(`📰 TRAGÉDIA: ${P().first} ${P().last} foi atacado(a) e morto(a) pelo ${sp.name.toLowerCase()} que criava em casa, ${pt.name}. Vizinhos dizem que o animal "não comia havia dias".`, "bad");
    return;
  }
  if (r < pDeath + (1 - pDeath) * 0.55){
    const s = injure(rint(28, 48), `O ataque de ${pt.name}`, 0.7);
    addStress(25); addStat("happiness", -18); addFame(6);
    log(`🩸 ${pt.name} (${sp.name.toLowerCase()}) me atacou. Sobrevivi por pouco; o animal foi sacrificado.${s}`, "bad", ["health"]);
    return;
  }
  const fine = priceOf(rint(30000, 120000)); addMoney(-Math.min(Math.max(0,S.money), fine)); addFame(8); addRep(-12);
  log(`🚑 ${pt.name} (${sp.name.toLowerCase()}) atacou uma visita. Indenização de ${fmt(fine)} e o animal foi sacrificado.`, "bad", ["crime"]);
  if (chance(0.3) && adult()) sendToPrison(rint(1, 3), "lesão corporal culposa (ataque de animal)");
}
</script>
<script>/* src/systems/gigs.js */
"use strict";
/* =====================================================================
   systems/gigs.js — TRABALHO AUTÔNOMO (freelance, apps, criadores,
   trabalho adulto). Pode ser renda principal ou bico junto do emprego
   (bico + emprego = mais estresse e ritmo máximo "Normal").

   Renda anual = base × Π(atributos) × (0,6 + habilidade/100)
                 × público (clientes/assinantes) × ritmo × país
     • atributo d com peso w: (0,4 + valor/100·1,2)^w  (média ≈ 1)
