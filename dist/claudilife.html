<script>/* src/ui/combat.js */
"use strict";
/* =====================================================================
   ui/combat.js — modal de combate (arena, golpes, intensidade, log),
   painel de artes marciais, torneios e lista de golpes.
   A lógica fica em systems/combat.js e systems/martial.js.
   ===================================================================== */
function fbar(cur, max, cls, label){
  const v = clamp(cur / Math.max(1, max) * 100);
  return `<div class="fbar ${cls}" title="${label}"><i style="width:${v}%"></i><span>${label} ${Math.max(0, Math.round(cur))}/${Math.round(max)}</span></div>`;
}
function oppAvatar(o){ return o.age >= 60 ? (o.gender === "F" ? "👵" : "👴") : o.gender === "F" ? "👩" : "🧔"; }

function renderFight(hitWho){
  const F = S.fight, o = F.opp, me = fighterStats(), pf = DATA.fightProfiles[F.kind], tour = F.kind === "tournament";
  const per = byId(DATA.personalities, o.personality), w = DATA.weapons[o.weapon];
  const title = tour ? `${byId(DATA.tournaments, F.ctx.tid).emoji} ${byId(DATA.tournaments, F.ctx.tid).name}` : `🥊 ${pf.name}`;
  let h = `<div class="fight ${hitWho ? "hit-" + hitWho : ""}">
    <div class="fight-head"><h3>${esc(title)}</h3>${chip(F.over ? "Fim" : `Round ${F.round + 1}/${FIGHT_MAX_ROUNDS}`, "neutral")}${tour ? chip(`Luta ${F.ctx.idx + 1}/${byId(DATA.tournaments, F.ctx.tid).fights}`, "neutral") : ""}</div>
    <div class="arena">
      <div class="fighter me"><div class="f-av">${avatar()}</div><div class="f-name">${esc(P().first)} <span class="muted s">(você)</span></div>
        ${fbar(F.me.hp, F.me.max, "hp", "❤️")}${fbar(F.me.sta, 100, "sta", "⚡")}
        <div class="f-tags">${chip(`💪 ${Math.round(me.str)}`, "neutral")}${chip(`🎯 ${Math.round(me.skill)}`, "neutral")}${bestArt() ? chip(`${byId(DATA.martialArts, bestArt()).emoji} ${rankName(bestArt())}`, "neutral") : ""}</div></div>
      <div class="vs">VS</div>
      <div class="fighter opp"><div class="f-av">${oppAvatar(o)}</div><div class="f-name">${esc(o.first)}${o.nick ? ` <span class="muted s">"${esc(o.nick)}"</span>` : ""} <span class="muted s">${o.age}a</span></div>
        ${fbar(o.hp, o.maxHp, "hp", "❤️")}
        <div class="f-tags">${chip(`💪 ${o.str}`, "neutral")}${chip(`🎯 ${o.skill}`, "neutral")}${chip(`🩺 ${o.health}`, "neutral")}${per ? chip(`🧠 ${per.name}`, "neutral") : ""}${o.weapon ? chip(w.name, "bad") : ""}${o.art ? chip(byId(DATA.martialArts, o.art).name, "neutral") : ""}</div></div>
    </div>
    <div class="flog">${F.lines.slice(-5).map((l, i, a) => `<div class="${i === a.length - 1 ? "new" : ""}">${esc(say(l))}</div>`).join("")}</div>`;
  if (F.over){
    const icon = F.oppOutcome === "death" ? "☠️" : F.myOutcome === "death" ? "⚰️" : F.result === "win" ? "🏆" : F.result === "fled" ? "🏃" : F.result === "draw" ? "🤝" : "🤕";
    h += `<div class="fight-end"><div class="emoji">${icon}</div><div class="result">${esc(say(F.summary))}</div>
      <div class="choices"><button class="primary" onclick="UI.fightDone()">${F.next ? "Próxima luta →" : "Continuar"}</button></div></div></div>`;
    return h;
  }
  const acts = fightActions(F);
  h += `<div class="seg" role="radiogroup" aria-label="Intensidade">${DATA.intensities.map(I => `<button role="radio" aria-checked="${F.intensity === I.id}" class="${F.intensity === I.id ? "on" : ""}" title="${esc(I.hint)}" onclick="UI.fightIntensity('${I.id}')">${I.name}</button>`).join("")}</div>
    <div class="oddsline">${esc(intensity(F.intensity).hint)}${tour ? " · árbitro presente (letalidade ×0,3)" : ""}</div>
    <div class="moves">${acts.moves.map(mv => {
      const pw = movePower(mv), L = moveLethal(mv), [ll, lc] = lethalLabel(L), dis = F.me.sta < mv.cost;
      return `<button class="mv ${mv.art ? "special" : ""}" ${dis ? "disabled" : ""} onclick="UI.fightAct('${mv.id}')"><b>${mv.art ? byId(DATA.martialArts, mv.art).emoji + " " : ""}${esc(mv.name)}</b>
        <span>${Math.round(moveHit(mv) * 100)}% acerto · ${Math.round(mv.dmg[0] * pw * DMG_SCALE)}–${Math.round(mv.dmg[1] * pw * DMG_SCALE)} dano · ⚡${mv.cost}</span>
        <span>KO ${Math.round(mv.ko * 100)}% · letalidade <b class="${lc}">${ll} (${(L * 100).toFixed(L < 0.1 ? 1 : 0)}%)</b></span></button>`; }).join("")}</div>
    <div class="moves util">
      <button class="mv" onclick="UI.fightAct('defend')"><b>🛡️ Defender</b><span>−50% de dano, +28 de fôlego</span></button>
      ${acts.flee ? `<button class="mv" onclick="UI.fightAct('flee')"><b>🏃 Fugir</b><span>se falhar, apanha</span></button>` : ""}
      <button class="mv" onclick="UI.fightAct('surrender')"><b>🏳️ ${tour ? "Desistir (bater)" : "Render-se"}</b><span>${F.kind === "robbery" ? "entrega o dinheiro" : "encerra sem mortes"}</span></button>
      ${acts.kill ? (() => { const k = killOdds(F); return `<button class="mv kill" onclick="UI.confirm('Desferir um golpe para MATAR ${esc(o.first)}? Homicídio doloso: investigação, testemunhas e pena longa.', ()=>UI.fightAct('kill'))"><b>☠️ Golpe para matar</b><span>${Math.round(k.hit * 100)}% acerto · ${Math.round(k.death * 100)}% de morte</span></button>`; })() : ""}
    </div></div>`;
  return h;
}

/* Painel de artes marciais (aba Ações e Academia de Lutas). */
function martialPanel(){
  const M = martial(), a = P().age, energy = ACT_LIMIT - S.activitiesThisYear;
  let h = `<div class="chips" style="margin-bottom:8px">${chip(`🥊 Cartel ${M.rec.w}V–${M.rec.l}D · ${M.rec.ko} nocautes`, "neutral")}${M.titles.length ? chip(`🏆 ${M.titles.length} título(s)`, "good") : ""}${M.kills ? chip(`☠️ ${M.kills} morte(s)`, "bad") : ""}${num(M.banUntil) > a ? chip(`🚫 suspenso(a) até ${M.banUntil} anos`, "bad") : ""}</div>`;
  for (const d of DATA.martialArts){
    const m = mastery(d.id), on = M.enrolled.includes(d.id), nx = nextUnlock(d.id), locked = a < d.minAge;
    if (locked && !m) continue;
    h += `<div class="row art"><div class="grow"><div class="t">${d.emoji} ${d.name} ${on ? chip("treinando", "good") : ""} <span class="muted s">${m ? d.ranks[rankIdx(m)] : ""}</span></div>
      <div class="s">${esc(d.desc)} · ${fmt(artFee(d.id))}/mês${nx ? ` · próximo golpe: <b>${esc(nx.name)}</b> (${nx.req})` : " · todos os golpes aprendidos"}</div>
      ${m ? bar("Maestria", m, "var(--accent)") : ""}</div>
      <div class="art-btns">${on ? `<button class="btn sm" ${energy <= 0 ? "disabled" : ""} onclick="UI.do(()=>trainArt('${d.id}'))">Treinar</button><button class="btn sm" ${energy <= 0 ? "disabled" : ""} onclick="UI.do(()=>trainArt('${d.id}',true))">Intenso</button><button class="btn sm" onclick="UI.do(()=>quitArt('${d.id}'))">Sair</button>`
        : `<button class="btn sm primary" ${inPrison() ? "disabled" : ""} onclick="UI.do(()=>enrollArt('${d.id}'))">Matricular</button>`}</div></div>`;
  }
  h += `<div class="choices" style="margin-top:10px"><button onclick="UI.tournaments()">🏆 Torneios e campeonatos</button><button onclick="UI.moveList()">📜 Golpes que eu sei (${knownMoves().length})</button>
    ${a >= 14 && !inPrison() ? `<button ${energy <= 0 ? "disabled" : ""} onclick="UI.do(provokeStranger)">👊 Procurar briga na rua<small>você é o agressor: karma e polícia</small></button>` : ""}</div>`;
  return h;
}
Object.assign(UI, {
  fightOpen(hitWho){ if (!S.fight) return; modal(renderFight(hitWho), { locked:true }); },
  fightIntensity(id){ if (!S.fight) return; S.fight.intensity = id; UI.fightOpen(); },
  fightAct(a){
    const F = S.fight; if (!F || F.over) return;
    if (typeof Device !== "undefined" && !Device.guard(220)) return;
    const hp0 = F.opp.hp, me0 = F.me.hp;
    fightAction(a); saveGame(true);
    if (!S.fight) return UI.fightDone();
    const who = F.me.hp < me0 ? "me" : F.opp.hp < hp0 ? "opp" : "";
    UI.fightOpen(who);
  },
  fightDone(){
    if (typeof Device !== "undefined" && !Device.guard()) return;
    const before = UI._mgBefore || takeSnapshot();
    const res = closeFight(); sanitize(); saveGame(true); render();
    if (!P().alive){ modal(`<div class="emoji">🕊️</div><h3>Fim da jornada</h3><div class="result">${esc(res || "")}</div><div class="choices"><button class="primary" onclick="UI.close();UI.tab('life')">Ver certidão</button></div>`); return; }
    if (S.fight) return UI.fightOpen(); // próxima luta do torneio
    UI._mgBefore = null; showResult(res || "A luta acabou.", before);
  },
  martial(){ modal(`<div class="emoji">🥋</div><h3>Academia de Lutas</h3><p class="muted">Energia ${ACT_LIMIT - S.activitiesThisYear}/${ACT_LIMIT} · até ${MAX_ENROLL} modalidades ao mesmo tempo. Treino intenso rende quase o dobro, mas machuca.</p>${martialPanel()}<div class="choices" style="margin-top:8px"><button onclick="UI.close()">Sair</button></div>`); },
  tournaments(){
    const arts = Object.keys(martial().arts).filter(id => mastery(id) > 0);
    modal(`<div class="emoji">🏆</div><h3>Torneios</h3><p class="muted">Cartel ${martial().rec.w}V–${martial().rec.l}D. Cada luta é jogada no modal de combate; empate vai para os juízes.</p>
      ${DATA.tournaments.map(t => `<div class="card flat"><div class="t">${t.emoji} ${t.name}</div><div class="s muted">${t.fights} luta(s) · maestria ${t.minM}+${t.minWins ? ` · ${t.minWins}+ vitórias` : ""} · inscrição ${t.fee ? fmt(priceOf(t.fee)) : "grátis"} · prêmio ${fmt(priceOf(t.prize[0]), true)}–${fmt(priceOf(t.prize[1]), true)} · fama +${t.fame}</div>
        <div class="choices" style="margin-top:6px">${arts.length ? arts.map(id => { const why = tournamentBlock(t, id), d = byId(DATA.martialArts, id); return `<button ${why ? "disabled" : ""} onclick="UI.close();UI.do(()=>enterTournament('${t.id}','${id}'))">${d.emoji} Lutar de ${d.name} (${Math.round(mastery(id))})${why ? `<small class="bad">${esc(why)}</small>` : ""}</button>`; }).join("") : `<div class="empty">Treine alguma modalidade primeiro.</div>`}</div></div>`).join("")}
      <div class="choices"><button onclick="UI.close()">Fechar</button></div>`);
  },
  moveList(){
    const ms = knownMoves();
    modal(`<h3>📜 Golpes conhecidos</h3><div class="oddsline">Letalidade base = índice do golpe. A letalidade real depende de força, maestria, intensidade e da vulnerabilidade do alvo.</div>
      ${ms.map(mv => `<div class="row"><div class="grow"><div class="t">${mv.art ? byId(DATA.martialArts, mv.art).emoji : "👊"} ${esc(mv.name)}${mv.dirty ? ` <span class="tag bad">sujo</span>` : ""}</div><div class="s">dano ${mv.dmg[0]}–${mv.dmg[1]} · acerto ${Math.round(mv.acc * 100)}% · KO ${Math.round(mv.ko * 100)}% · letalidade ${(mv.lethal * 100).toFixed(1)} · ${({ strike:"golpe", throw:"projeção", sub:"finalização" })[mv.type]}</div></div></div>`).join("")}
      ${DATA.moves.filter(mv => mv.art && !ms.includes(mv)).length ? `<div class="section-label">Ainda bloqueados</div>${DATA.moves.filter(mv => mv.art && !ms.includes(mv)).map(mv => `<div class="row"><div class="grow s muted">🔒 ${esc(mv.name)} — ${byId(DATA.martialArts, mv.art).name} ${mv.req}</div></div>`).join("")}` : ""}
      <div class="choices" style="margin-top:10px"><button onclick="UI.close()">Fechar</button></div>`);
  },
});
</script>
<script>/* src/ui/escape.js */
"use strict";
/* =====================================================================
   ui/escape.js — minigame de fuga: grade, cones de visão (agora e no
   próximo turno), direcional na tela + teclado (setas/WASD/espaço).
   Lógica e regras em systems/escape.js.
   ===================================================================== */
const ARROW = { N:"▲", S:"▼", E:"▶", W:"◀" };

function renderEscape(){
  const E = S.escape, st = escStage(), vNow = visionAt(st, E.t), vNext = visionAt(st, E.t + 1);
  const guards = {}, cams = {};
  for (const g of st.guards){ const p = guardAt(g, E.t); guards[p.x + "," + p.y] = p.dir; }
  for (const c of st.cams) cams[c.x + "," + c.y] = camDir(c, E.t);
  let cells = "";
  for (let y = 0; y < st.h; y++) for (let x = 0; x < st.w; x++){
    const k = x + "," + y, ch = st.grid[y][x], me = E.pos[0] === x && E.pos[1] === y;
    const cls = ["ec"]; let ic = "";
    if (!E.over && ch !== "#" && Math.abs(x - E.pos[0]) + Math.abs(y - E.pos[1]) <= 1) cls.push("reach"); // casas tocáveis
    if (ch === "#") cls.push("wall");
    if (ch === "X"){ cls.push("exit"); ic = E.key ? "🚪" : "🔒"; }
    if (ch !== "#" && vNow.has(k)) cls.push("now"); else if (ch !== "#" && vNext.has(k)) cls.push("next");
    if (st.key && !E.key && st.key[0] === x && st.key[1] === y) ic = "🔑";
    if (cams[k]) ic = `<span class="cam">📹<i>${ARROW[cams[k]]}</i></span>`;
    if (guards[k]) ic = `<span class="guard">👮<i>${ARROW[guards[k]]}</i></span>`;
    if (me){ cls.push("me"); ic = E.over && E.result === "fail" ? "🚨" : "🧍"; }
    cells += `<div class="${cls.join(" ")}" data-x="${x}" data-y="${y}">${ic}</div>`;
  }
  const left = st.limit - E.t;
  let h = `<div class="escape ${E.over ? "done " + E.result : ""}">
    <div class="fight-head"><h3>🏃 ${esc(st.name)}</h3>${chip(`Etapa ${E.stage + 1}/${E.stages.length}`, "neutral")}${chip(`Dificuldade ${E.d}/8`, E.d >= 5 ? "bad" : E.d >= 3 ? "warn" : "good")}
      ${chip(`⏱️ ${left} turno(s)`, left <= 3 ? "bad" : "neutral")}${st.key ? chip(E.key ? "🔑 cartão na mão" : "🔑 pegue o cartão", E.key ? "good" : "warn") : ""}</div>
    <div class="esc-board"><div class="escgrid" role="grid" aria-label="Mapa da fuga: toque numa casa vizinha para andar" style="grid-template-columns:repeat(${st.w},1fr)">${cells}</div>
    <div class="esc-side"><div class="esc-legend"><span><i class="lg now"></i>vigiado agora</span><span><i class="lg next"></i>vigiado no próximo turno</span><span>👮 guarda (▲ direção)</span><span>📹 câmera (gira a cada 2 turnos)</span></div>
    <div class="esc-msg" aria-live="polite">${esc(E.lastMsg || "Chegue à saída sem pisar em casas vermelhas ou laranjas.")}</div>`;
  if (E.over){
    h += `</div></div><div class="fight-end"><div class="emoji">${E.result === "ok" ? "🏃‍♂️💨" : "🚨"}</div><div class="result">${esc(E.msg)}</div><div class="choices"><button class="primary" onclick="UI.escapeDone()">Continuar</button></div></div></div>`;
    return h;
  }
  h += `<div class="dpad">
      <span></span><button aria-label="Norte" onclick="UI.escMove('N')">▲</button><span></span>
      <button aria-label="Oeste" onclick="UI.escMove('W')">◀</button><button aria-label="Esperar" class="wait" onclick="UI.escMove('wait')">⏸</button><button aria-label="Leste" onclick="UI.escMove('E')">▶</button>
      <span></span><button aria-label="Sul" onclick="UI.escMove('S')">▼</button><span></span></div>
    <div class="oddsline" style="text-align:center">${Device.coarse() ? "Toque numa casa vizinha ou deslize o dedo na grade · toque em você para esperar" : "Setas/WASD ou clique numa casa vizinha · espaço para esperar"} · melhor rota: ${st.opt} turnos</div>
    ${!E.stage && !E.t ? `<div class="choices" style="margin-top:8px"><button onclick="UI.escAbort()">Desistir e voltar para a cela</button></div>` : ""}</div></div></div>`;
  return h;
}

Object.assign(UI, {
  escapeOpen(){ if (!S.escape) return; modal(renderEscape(), { locked:true }); },
  escMove(d){
    const E = S.escape; if (!E || E.over) return;
    E.lastMsg = escapeMove(d); saveGame(true);
    UI.escapeOpen();
    if (E.over && E.result === "fail"){ const g = $(".escgrid"); if (g) restartClass(g, "shake"); }
  },
  escAbort(){ if (abortEscape()){ closeModal(); toast("Você desistiu da fuga. Fica para outra hora."); saveGame(true); render(); } },
  escapeDone(){
    const before = UI._mgBefore || takeSnapshot(), msg = closeEscape();
    sanitize(); saveGame(true); render(); UI._mgBefore = null;
    showResult(msg, before);
  },
});
document.addEventListener("keydown", e => {
  if (!S || !S.escape || S.escape.over || !document.querySelector("#modalRoot .escgrid")) return;
  const d = { ArrowUp:"N", KeyW:"N", ArrowDown:"S", KeyS:"S", ArrowLeft:"W", KeyA:"W", ArrowRight:"E", KeyD:"E", Space:"wait" }[e.code];
  if (!d) return;
  e.preventDefault(); UI.escMove(d);
});

/* ---------- Toque: tocar numa casa ou deslizar o dedo na grade ---------- */
function escDirToward(x, y){
  const E = S && S.escape; if (!E || E.over) return null;
  const dx = x - E.pos[0], dy = y - E.pos[1];
  if (!dx && !dy) return "wait";
  return Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? "E" : "W") : (dy > 0 ? "S" : "N"); // um passo na direção tocada
}
let escTouch = null, escSwiped = false;
document.addEventListener("touchstart", e => {
  const g = e.target.closest && e.target.closest(".escgrid"); if (!g || e.touches.length !== 1) return;
  escTouch = { x:e.touches[0].clientX, y:e.touches[0].clientY }; escSwiped = false;
}, { passive:true });
document.addEventListener("touchend", e => {
  if (!escTouch) return;
  const t = e.changedTouches[0], dx = t.clientX - escTouch.x, dy = t.clientY - escTouch.y; escTouch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; // foi um toque, não um deslize: o click cuida
  escSwiped = true; UI.escMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "E" : "W") : (dy > 0 ? "S" : "N"));
}, { passive:true });
document.addEventListener("click", e => {
  const c = e.target.closest && e.target.closest(".escgrid .ec"); if (!c) return;
  if (escSwiped){ escSwiped = false; return; }
  const d = escDirToward(+c.dataset.x, +c.dataset.y); if (d) UI.escMove(d);
});
</script>
<script>/* src/ui/hub.js */
"use strict";
/* =====================================================================
   ui/hub.js — HUB INICIAL (menu principal estilo jogo mobile):
   continuar, vidas salvas (slots), hall dos legados/conquistas, ajustes
   e o CRIADOR DE PERSONAGEM (nome, gênero, país/cidade, tom de pele,
   cabelo, olhos, etnia, traço inicial). Classe social e orientação NÃO
   são escolhidas: a classe é sorteada ao nascer e a orientação é
   descoberta na adolescência.
   ===================================================================== */
let HUB_FORM = null, HUB_VIEW = null;
const flagOf = cid => ({ BR:"🇧🇷", PT:"🇵🇹", US:"🇺🇸", JP:"🇯🇵", DE:"🇩🇪", MX:"🇲🇽", NG:"🇳🇬", IN:"🇮🇳" })[cid] || "🌍";

function showHub(view = "home"){
  const el = $("#hub"); if (!el) return;
  closeModal();
  el.classList.add("on"); document.body.classList.add("hub-open");
  const same = HUB_VIEW === view && el.innerHTML, y = el.scrollTop; // re-render da mesma tela mantém a rolagem
  el.innerHTML = `<div class="hub-inner ${same ? "still" : ""}">${HUB_VIEWS[view] ? HUB_VIEWS[view]() : HUB_VIEWS.home()}</div>`;
  el.scrollTop = same ? y : 0; HUB_VIEW = view;
  if (same) return;
  if (!Device.coarse()){ const f = el.querySelector("button.primary, button"); if (f) setTimeout(() => f.focus({ preventScroll:true }), 30); }
}
function hideHub(){ const el = $("#hub"); if (!el) return; el.classList.remove("on"); el.innerHTML = ""; HUB_VIEW = null; document.body.classList.remove("hub-open"); }
const hubBack = () => `<button class="hub-back" onclick="showHub('home')" aria-label="Voltar">←</button>`;

const HUB_VIEWS = {
  home(){
    const slots = listSlots(), cur = slots.find(s => s.id === (CUR_SLOT || lsGet(CUR_SLOT_KEY))) || slots[0], hall = readHall();
    return `<div class="hub-top">${fsButton("hub-back")}</div><div class="hub-logo"><span class="ld-mark">🧬</span><b>Claudi<span>Life</span></b></div><div class="ld-sub">Simulador de vida</div>
      ${cur ? `<button class="hub-continue" onclick="hubPlay('${cur.id}')"><span class="hc-av">${cur.alive ? avatarFor(cur.age, cur.gender, cur.tone) : "🪦"}</span>
        <span class="hc-txt"><b>${cur.alive ? "▶ Continuar" : "📜 Ver legado"}</b><small>${esc(cur.name)} · ${cur.age} anos · ${flagOf(cur.country)} ${cur.gen > 1 ? `· ${cur.gen}ª geração` : ""}</small></span></button>` : ""}
      <div class="hub-grid">
        <button class="hub-tile accent" onclick="showHub('create')"><span>✨</span><b>Nova vida</b><small>criar personagem</small></button>
        <button class="hub-tile" onclick="hubRandom()"><span>🎲</span><b>Vida aleatória</b><small>tudo sorteado</small></button>
        <button class="hub-tile" onclick="showHub('slots')"><span>📂</span><b>Vidas salvas</b><small>${slots.length}/${MAX_SLOTS} slots</small></button>
        <button class="hub-tile" onclick="showHub('hall')"><span>🏛️</span><b>Hall dos legados</b><small>${hall.lives.length} vida(s) · ${Object.keys(hall.ach).length} conquista(s)</small></button>
        <button class="hub-tile" onclick="showHub('settings')"><span>⚙️</span><b>Ajustes</b><small>tela cheia, som, tema</small></button>
        <button class="hub-tile" onclick="document.getElementById('hubimp').click()"><span>⬆️</span><b>Importar</b><small>arquivo .json</small></button>
        <button class="hub-tile" onclick="UI.guide()"><span>📖</span><b>Guia rápido</b><small>como jogar em 5 passos</small></button>
      </div>
      <input type="file" id="hubimp" accept="application/json,.json" hidden onchange="importSave(this.files[0], ok=>{ toast(ok?'Save importado em um slot novo!':'Arquivo inválido.'); if (ok){ hideHub(); render(); } })">
      <div class="hub-foot">💡 ${esc(pick(DATA.tips))}</div>`;
  },
  slots(){
    const slots = listSlots();
    return `${hubBack()}<h2 class="hub-h">📂 Vidas salvas <span class="muted">${slots.length}/${MAX_SLOTS}</span></h2>
      ${slots.length ? slots.map(s => `<div class="hub-slot ${s.id === CUR_SLOT ? "cur" : ""}"><div class="hs-av">${s.alive ? avatarFor(s.age, s.gender, s.tone) : "🪦"}</div>
        <div class="grow"><div class="t">${esc(s.name)} ${s.alive ? "" : `<span class="tag bad">falecido(a)</span>`}</div>
        <div class="s muted">${s.age} anos · ${flagOf(s.country)} · ${esc(DATA.classes[s.cls]?.name || "")}${s.gen > 1 ? ` · ${s.gen}ª geração` : ""}${s.title ? ` · 🏅 ${esc(s.title)}` : ""}</div>
        <div class="s muted">salvo em ${new Date(s.savedAt).toLocaleString("pt-BR", { dateStyle:"short", timeStyle:"short" })}</div></div>
        <div class="hs-btns"><button class="btn sm primary" onclick="hubPlay('${s.id}')">${s.alive ? "Jogar" : "Legado"}</button>
        <button class="btn sm danger" onclick="hubDelete('${s.id}')">Apagar</button></div></div>`).join("") : `<div class="empty">Nenhuma vida salva ainda.</div>`}`;
  },
  hall(){
    const h = readHall(), L = h.lives;
    const best = L.slice().sort((a,b) => b.score - a.score)[0], oldest = L.slice().sort((a,b) => b.age - a.age)[0];
    const ach = Object.entries(h.ach).sort((a,b) => b[1] - a[1]);
    return `${hubBack()}<h2 class="hub-h">🏛️ Hall dos legados</h2>
      <div class="statgrid">${[["🧬 Vidas vividas", L.length],["🏆 Melhor pontuação", best ? `${best.score} · ${esc(best.name)}` : "—"],["⏳ Vida mais longa", oldest ? `${oldest.age} anos · ${esc(oldest.name)}` : "—"],["🎖️ Conquistas únicas", ach.length]]
        .map(([k,v]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
      ${ach.length ? `<div class="section-label">Conquistas desbloqueadas</div><div class="chips">${ach.map(([t,n]) => chip(`${esc(t)}${n > 1 ? ` ×${n}` : ""}`, "good")).join("")}</div>` : ""}
      <div class="section-label">Vidas passadas</div>
      ${L.length ? L.map(l => `<div class="hub-slot"><div class="hs-av">${avatarFor(Math.min(l.age, 70), l.gender, l.tone)}</div><div class="grow"><div class="t">${esc(l.name)} <span class="muted s">${l.born}–${l.died}</span></div>
        <div class="s">🏅 ${esc(l.title || "—")} · ${l.score} pts · ${l.ach} conquista(s)</div><div class="s muted">${flagOf(l.country)} ${esc(l.cls || "")} · ${esc(l.cause || "")}</div></div></div>`).join("") : `<div class="empty">Quando um personagem morrer, a história dele fica aqui.</div>`}`;
  },
  settings(){
    return `${hubBack()}<h2 class="hub-h">⚙️ Ajustes</h2><div class="choices">
      ${FS.settingsHTML("showHub('settings')")}
      <div class="section-label">🔊 Som e jogo</div>
      <button onclick="Sound.toggle();showHub('settings')">${SETTINGS.sound ? "🔊 Som ligado" : "🔇 Som desligado"}</button>
      <div class="form" style="padding:0 4px"><label>Volume</label><input type="range" min="0" max="1" step="0.05" value="${SETTINGS.volume}" oninput="Sound.setVolume(+this.value)" onchange="Sound.play('click')" style="padding:0"></div>
      <button onclick="UI.theme()">🌓 Alternar tema claro/escuro</button>
      <button onclick="SETTINGS.lang = SETTINGS.lang === 'forte' ? 'leve' : 'forte'; saveSettings(); showHub('settings')">${SETTINGS.lang === "forte" ? "🤬 Linguagem realista (com palavrões)" : "😇 Linguagem leve (filtrada)"}</button></div>`;
  },
  create(){
    const F = HUB_FORM ||= { gender: chance(0.5) ? "M" : "F", country: pick(DATA.countries).id, tone:"", hair: pick(DATA.hair), eyes: pick(DATA.eyes), ethnicity: pick(DATA.ethnicities), trait:"", first:"", last:"", city:"" };
    const c = byId(DATA.countries, F.country);
    if (!c.cities.includes(F.city)) F.city = c.cities[0];
    const pickBtn = (field, label, value) => `<label id="lbl_${field}">${label}</label><button type="button" class="picker" aria-haspopup="listbox" aria-labelledby="lbl_${field}" onclick="hubPick('${field}')"><span>${value}</span><i aria-hidden="true">▾</i></button>`;
    return `${hubBack()}<h2 class="hub-h">✨ Criar personagem</h2>
      <div class="creator-preview"><div class="cp-av">${avatarFor(0, F.gender, F.tone)}</div><div class="cp-arrow">→</div><div class="cp-av cp-big">${avatarFor(28, F.gender, F.tone)}</div>
        <div class="cp-name">${esc(F.first || "Nome")} ${esc(F.last || "Sobrenome")}<small>${flagOf(F.country)} ${esc(F.city)}, ${esc(c.name)}</small></div></div>
      <div class="form">
        <label>Primeiro nome</label><div class="row-in"><input id="h_first" maxlength="30" value="${esc(F.first)}" oninput="HUB_FORM.first=this.value;hubPreview()" placeholder="deixe vazio para sortear"><button class="btn sm" onclick="hubRollName()">🎲</button></div>
        <label>Sobrenome</label><input id="h_last" maxlength="30" value="${esc(F.last)}" oninput="HUB_FORM.last=this.value;hubPreview()" placeholder="deixe vazio para sortear">
        <label>Gênero</label><div class="seg two">${[["M","Masculino"],["F","Feminino"]].map(([k,l]) => `<button class="${F.gender === k ? "on" : ""}" onclick="HUB_FORM.gender='${k}';showHub('create')">${l}</button>`).join("")}</div>
        ${pickBtn("country", "País", `${flagOf(F.country)} ${esc(c.name)}`)}
        ${pickBtn("city", "Cidade", esc(F.city))}
        <label>Tom de pele (avatar)</label><div class="tones">${DATA.skinTones.map(([t,n]) => `<button title="${n}" aria-label="${n}" class="${F.tone === t ? "on" : ""}" onclick="HUB_FORM.tone='${t}';showHub('create')">${avatarFor(28, F.gender, t)}</button>`).join("")}</div>
        ${pickBtn("ethnicity", "Etnia", esc(F.ethnicity))}
        ${pickBtn("hair", "Cabelo", esc(F.hair))}
        ${pickBtn("eyes", "Olhos", esc(F.eyes))}
        <label>Traço de personalidade inicial <span class="muted">(os outros são sorteados)</span></label>
        <div class="traitpick">${[["","🎲 Sortear"], ...DATA.traits.map(t => [t.id, t.name])].map(([id,n]) => `<button class="${F.trait === id ? "on" : ""}" title="${esc(byId(DATA.traits,id)?.desc || "")}" onclick="HUB_FORM.trait='${id}';showHub('create')">${esc(n)}</button>`).join("")}</div>
        ${F.trait ? `<div class="oddsline">${esc(byId(DATA.traits, F.trait).desc)}</div>` : ""}
      </div>
      <div class="hub-locked"><div>🎲 <b>Classe social:</b> sorteada ao nascer, entre 9 níveis — de <i>Miséria Extrema</i> a <i>Herdeiro(a) Bilionário(a)</i>. Ela define o patrimônio dos pais, a moradia, a saúde e a escola.</div>
        <div>🏳️‍🌈 <b>Orientação:</b> em descoberta. Suas escolhas na adolescência vão revelá-la.</div></div>
      <div class="choices" style="margin-top:12px"><button class="primary" onclick="hubStart()">👶 Nascer!</button></div>`;
  },
};
function hubPreview(){ const p = $(".cp-name"); if (!p || !HUB_FORM) return; const c = byId(DATA.countries, HUB_FORM.country); p.innerHTML = `${esc(HUB_FORM.first || "Nome")} ${esc(HUB_FORM.last || "Sobrenome")}<small>${flagOf(HUB_FORM.country)} ${esc(HUB_FORM.city)}, ${esc(c.name)}</small>`; }
function hubRollName(){ const c = byId(DATA.countries, HUB_FORM.country), n = genName(c, HUB_FORM.gender); HUB_FORM.first = n.first; HUB_FORM.last = n.last; showHub("create"); }
function hubStart(){
  if (slotsFull()){ toast(`Você já tem ${MAX_SLOTS} vidas salvas. Apague uma em "Vidas salvas".`); showHub("slots"); return; }
  const F = HUB_FORM; HUB_FORM = null;
  hideHub(); startNewSlot();
  UI.startLife({ first:F.first.trim() || undefined, last:F.last.trim() || undefined, gender:F.gender, country:F.country, city:F.city, tone:F.tone, hair:F.hair, eyes:F.eyes, ethnicity:F.ethnicity, trait:F.trait || undefined, keepLineage:false });
}
function hubRandom(){
  if (slotsFull()){ toast(`Você já tem ${MAX_SLOTS} vidas salvas. Apague uma em "Vidas salvas".`); showHub("slots"); return; }
  hideHub(); startNewSlot(); UI.startLife({ tone: pick(DATA.skinTones)[0] });
}
function hubPlay(id){
  if (!loadGame(id)){ toast("Não foi possível abrir esse save."); return; }
  hideHub(); HUD_PREV = null; TAB = "life"; render(); pageTop();
  if (!P().alive) return;
  if (S.fight) UI.fightOpen(); else if (S.escape) UI.escapeOpen(); else if (S.queue.length) showEvent();
}
function hubDelete(id){
  const s = listSlots().find(x => x.id === id); if (!s) return;
  UI.confirm(`Apagar a vida de ${s.name} para sempre? (O hall dos legados é mantido.)`, () => { deleteSlot(id); if (!CUR_SLOT) S = null; showHub("slots"); });
}

/* ---------- Seletor próprio (substitui <select>) ----------
   A lista nativa do <select> é desenhada pelo navegador/sistema e, em
   webviews (pré-visualização de editor, apps embutidos), costuma abrir
   fora do lugar. Esta lista é HTML da página: abre como folha inferior no
   celular e como caixa central no desktop, com a opção atual marcada. */
const HUB_PICKS = {
  country:   { title:"País",   opts: () => DATA.countries.map(x => [x.id, `${flagOf(x.id)} ${x.name}`]) },
  city:      { title:"Cidade", opts: () => byId(DATA.countries, HUB_FORM.country).cities.map(x => [x, x]) },
  ethnicity: { title:"Etnia",  opts: () => DATA.ethnicities.map(x => [x, x]) },
  hair:      { title:"Cabelo", opts: () => DATA.hair.map(x => [x, x]) },
  eyes:      { title:"Olhos",  opts: () => DATA.eyes.map(x => [x, x]) },
};
function hubPick(field){
  const P0 = HUB_PICKS[field]; if (!P0 || !HUB_FORM) return;
  const cur = HUB_FORM[field];
  modal(`<h3>${P0.title}</h3><div class="choices picklist" role="listbox" aria-label="${P0.title}">${P0.opts().map(([v, l]) =>
    `<button role="option" aria-selected="${v === cur}" class="${v === cur ? "sel" : ""}" onclick="hubPicked('${field}', this.dataset.v)" data-v="${esc(v)}">${esc(l)}${v === cur ? '<b aria-hidden="true">✓</b>' : ""}</button>`).join("")}
    </div><div class="choices" style="margin-top:10px"><button onclick="UI.close()">Cancelar</button></div>`);
  const sel = document.querySelector("#modalRoot .picklist .sel"); if (sel) sel.scrollIntoView({ block:"center" });
}
function hubPicked(field, v){
  HUB_FORM[field] = v;
  if (field === "country"){ const c = byId(DATA.countries, v); if (!c.cities.includes(HUB_FORM.city)) HUB_FORM.city = c.cities[0]; }
  closeModal(); showHub("create");
}
</script>
<script>/* src/ui/lifestyle.js */
"use strict";
/* =====================================================================
   ui/lifestyle.js — modais de aparência/visão, pets (abrigo, pet shop,
   mercado exótico e cuidados), painel da penitenciária, casamento com
   regime de bens e ações com amigos/cônjuge.
   ===================================================================== */
function petRow(pt){
  const sp = petSp(pt), risk = attackRisk(pt);
  return `<div class="pet-row"><div class="pet-av">${sp.emoji}</div><div class="grow"><div class="t">${esc(pt.name)} <span class="muted s">${esc(sp.name)} · ${pt.age} ano(s)${pt.temper ? ` · ${esc(pt.temper)}` : ""}</span>${sp.illegal ? ` <span class="tag bad">ilegal</span>` : ""}</div>
    <div class="pet-bars">${bar("💞 Vínculo", pt.bond, "var(--accent)")}${bar("🍖 Fome", pt.hunger, "var(--bad)")}${bar("😾 Estresse", pt.stress, "var(--warn)")}</div>
    <div class="s muted">${sp.size > homeSpace() ? `⚠️ precisa de ${spaceName(sp.size)} · ` : ""}custo ${fmt(priceOf(sp.food + sp.vet), true)}/ano · adestramento ${Math.round(pt.trained*100)}%${risk > 0 ? ` · <b class="${risk > 0.05 ? "bad" : "warn"}">risco de ataque ${(risk*100).toFixed(1)}%/ano</b>` : ""}${pt.neglect ? ` · <b class="bad">${pt.neglect} ano(s) de descuido</b>` : ""}</div>
    <div class="art-btns" style="margin-top:6px"><button class="btn sm" ${pt.played ? "disabled" : ""} onclick="UI.do(()=>petAct('${pt.uid}','play'))">🎾 Brincar</button><button class="btn sm" onclick="UI.do(()=>petAct('${pt.uid}','feed'))">🍖 Ração especial</button>
    <button class="btn sm" onclick="UI.do(()=>petAct('${pt.uid}','train'))">🎓 Adestrar</button><button class="btn sm" onclick="UI.do(()=>petAct('${pt.uid}','vet'))">🩺 Veterinário</button>
    <button class="btn sm danger" onclick="UI.confirm('Doar/entregar ${esc(pt.name)}?', ()=>UI.do(()=>petAct('${pt.uid}','giveaway')))">${sp.illegal ? "🏞️ Santuário" : "🏠 Doar"}</button></div></div></div>`;
}
function petsCard(){
  const pets = S.pets || [];
  return `<div class="card"><h2>🐾 Animais <span class="tag">${pets.length}/${MAX_PETS} · moradia: ${spaceName(homeSpace())}</span></h2>
    ${pets.length ? pets.map(petRow).join("") : `<div class="empty">Nenhum bicho ainda. Que tal adotar?</div>`}
    <div class="choices" style="margin-top:10px"><button onclick="UI.petShop('shelter')">🏠 Abrigo de adoção</button><button onclick="UI.petShop('shop')">🛍️ Pet shop</button>${P().age >= 18 ? `<button onclick="UI.petShop('exotic')">🐅 Mercado exótico<small>ilegal · perigoso</small></button>` : ""}</div></div>`;
}

Object.assign(UI, {
  /* ---------- Aparência e visão ---------- */
  beauty(tab = "style"){
    const L = look(), a = P().age, tabs = [["style","💇 Estilo"],["care","👕 Rotina"],["proc","💉 Procedimentos"],["eyes","👁️ Visão"]];
    let body = "";
    if (tab === "style") body = `${label("Cabelo")}<div class="grid2">${DATA.hairStyles.map(h => `<button class="action ${L.hair === h.id ? "sel" : ""}" onclick="UI.do(()=>setStyle('hair','${h.id}'));UI.beauty('style')"><b>${h.name}</b><span>${h.price ? fmt(priceOf(h.price)) : "grátis"}${h.looks ? ` · +${h.looks} aparência` : ""}</span></button>`).join("")}</div>
      ${label("Rosto")}<div class="grid2">${DATA.faceStyles.map(h => `<button class="action ${L.face === h.id ? "sel" : ""}" onclick="UI.do(()=>setStyle('face','${h.id}'));UI.beauty('style')"><b>${h.name}</b><span>${h.price ? fmt(priceOf(h.price)) : "grátis"}${h.looks ? ` · +${h.looks}` : ""}</span></button>`).join("")}</div>
      <div class="oddsline">Repetir mudanças de visual no mesmo ano rende cada vez menos.</div>`;
    if (tab === "care") body = `${label("Guarda-roupa (custo anual)")}<div class="grid2">${DATA.wardrobes.map(w => `<button class="action ${num(L.wardrobe) === w.id ? "sel" : ""}" onclick="UI.do(()=>setWardrobe(${w.id}));UI.beauty('care')"><b>${w.name}</b><span>${w.price ? `${fmt(priceOf(w.price))}/ano · +${w.perYear}/ano até ${w.cap}` : "sem custo"}</span></button>`).join("")}</div>
      ${label("Pele")}<div class="choices"><button onclick="UI.do(toggleSkincare);UI.beauty('care')">${L.skincare ? "✅ Skincare ativo" : "🧴 Começar skincare"}<small>${fmt(priceOf(1500))}/ano · envelhecimento da pele pela metade</small></button></div>`;
    if (tab === "proc") body = `<div class="oddsline">Clínica barata = erro médico frequente (deformação, sequela e até morte). Acima dos 60, o risco dobra.</div>
      <div class="grid2">${DATA.procedures.map(d => `<button class="action" ${a < d.minAge ? "disabled" : ""} onclick="UI.confirm('${esc(d.name)} por ${fmt(priceOf(d.price))}? Risco de complicação ~${Math.round(d.risk*100*(a>60?2:1))}%.', ()=>{ UI.do(()=>doProcedure('${d.id}')); })"><span class="odds ${d.risk > 0.1 ? "bad" : d.risk > 0.04 ? "warn" : "good"}">${Math.round(d.risk*100)}%</span><b>${d.name}</b><span>${fmt(priceOf(d.price))} · +${d.looks[0]}–${d.looks[1]} aparência${a < d.minAge ? ` · idade ${d.minAge}+` : ""}</span></button>`).join("")}</div>`;
    if (tab === "eyes") body = !L.visionTested ? `<div class="empty">O teste de visão acontece uma única vez, na escola.</div>`
      : !L.myopia ? `<div class="empty">👁️ Visão perfeita. Nada a corrigir.</div>`
      : L.lasik ? `<div class="empty">✅ Visão corrigida a laser.</div>`
      : `<p class="muted">Você tem miopia. Óculos: ${L.glasses ? esc(byId(DATA.frames, L.glasses).name) : "<b class='bad'>sem correção (dor de cabeça, notas piores)</b>"} · penalidade atual na aparência −${num(L.glassesPenalty)}.</p>
        ${label("Armações")}<div class="grid2">${DATA.frames.map(f => `<button class="action ${L.glasses === f.id ? "sel" : ""}" onclick="UI.do(()=>setFrame('${f.id}'));UI.beauty('eyes')"><b>${f.name}</b><span>${f.price ? fmt(priceOf(f.price)) + (f.yearly ? "/ano" : "") : "grátis"} · aparência −${f.penalty}${f.minAge ? ` · ${f.minAge}+` : ""}</span></button>`).join("")}</div>
        ${label("Cirurgia a laser (definitiva)")}<div class="choices"><button ${a < 20 ? "disabled" : ""} onclick="UI.close();UI.do(()=>laserSurgery(false))">🏥 Clínica de referência · ${fmt(priceOf(9000))}<small>97% de sucesso · recupera a aparência +1</small></button>
        <button ${a < 20 ? "disabled" : ""} onclick="UI.close();UI.do(()=>laserSurgery(true))">🏚️ Clínica popular · ${fmt(priceOf(3500))}<small>80% de sucesso · risco de olho seco</small></button></div>`;
    modal(`<div class="emoji">${avatar()}</div><h3>Aparência ${Math.round(P().stats.looks)}/100</h3>
      <div class="seg tabs4">${tabs.map(([k,l]) => `<button class="${tab === k ? "on" : ""}" onclick="UI.beauty('${k}')">${l}</button>`).join("")}</div>
      <div style="margin-top:10px">${body}</div><div class="choices" style="margin-top:10px"><button onclick="UI.close()">Fechar</button></div>`);
  },
  /* ---------- Pets ---------- */
  petShop(kind){
    const a = P().age;
    let list = "";
    if (kind === "shelter") list = shelterList().map((x,i) => { const sp = byId(DATA.petSpecies, x.sp); return `<button class="action" onclick="UI.close();UI.do(()=>adoptPet(${i}))"><b>${sp.emoji} ${esc(x.name)}</b><span>${esc(sp.name)} · ${x.age} ano(s) · ${esc(x.temper)} · taxa ${fmt(priceOf(sp.price))}</span></button>`; }).join("") || `<div class="empty">Todos foram adotados este ano. 💛</div>`;
    else list = DATA.petSpecies.filter(s => s.src === kind).map(sp => `<button class="action" ${kind === "exotic" && a < 18 ? "disabled" : ""} onclick="UI.petBuy('${sp.id}')">${sp.danger >= 0.3 ? `<span class="odds bad">perigo</span>` : ""}<b>${sp.emoji} ${sp.name}</b><span>${fmt(priceOf(sp.price))} · ${fmt(priceOf(sp.food + sp.vet), true)}/ano${sp.size ? ` · ${spaceName(sp.size)}` : ""}</span></button>`).join("");
    const head = { shelter:["🏠","Abrigo de adoção","Adotar salva uma vida (+karma). Taxa simbólica."], shop:["🛍️","Pet shop","Animais legais, com nota fiscal."], exotic:["🐅","Mercado exótico (clandestino)","Posse ILEGAL: fiscalização, multa e ficha suja. Bichos grandes exigem espaço, comida cara e atenção — descuido pode ser fatal."] }[kind];
    modal(`<div class="emoji">${head[0]}</div><h3>${head[1]}</h3><p class="muted">${head[2]}</p><div class="grid2">${list}</div><div class="choices" style="margin-top:10px"><button onclick="UI.close()">Fechar</button></div>`);
  },
  petBuy(id){
    const sp = byId(DATA.petSpecies, id);
    modal(`<div class="emoji">${sp.emoji}</div><h3>${sp.name}</h3><p>${fmt(priceOf(sp.price))} · manutenção ${fmt(priceOf(sp.food + sp.vet))}/ano${sp.size ? ` · exige ${spaceName(sp.size)} (você tem: ${spaceName(homeSpace())})` : ""}.</p>
      ${sp.danger >= 0.2 ? `<div class="card alert" style="margin:8px 0"><b>⚠️ Animal selvagem.</b> Sem comida, atenção e espaço por alguns anos, o risco de ataque fica real — inclusive fatal.</div>` : ""}
      <div class="form"><label>Nome</label><input id="petname" maxlength="20" placeholder="${esc(pick(DATA.petNames))}"></div>
      <div class="choices" style="margin-top:10px"><button class="primary" onclick="const n=document.getElementById('petname').value;UI.close();UI.do(()=>buyPet('${id}', n))">Comprar</button><button onclick="UI.close()">Cancelar</button></div>`);
  },
  /* ---------- Penitenciária ---------- */
  prisonCourses(){
    const cat = prisonCat();
    modal(`<div class="emoji">📚</div><h3>Biblioteca e oficinas</h3><p class="muted">Seu crime: <b>${DATA.crimeCats[cat].name}</b>. Cursos alinhados ao seu caso remem mais pena.</p>
      ${DATA.prisonCourses.map(c => { const st = S.prison.courses?.[c.id] || { p:0 }, m = c.mult[cat] || 1, lock = P().stats.intelligence < c.minInt;
        return `<div class="row"><div class="grow"><div class="t">${c.emoji} ${c.name} ${st.done ? chip("concluído", "good") : ""} <span class="tag ${m >= 1.5 ? "good" : m < 1 ? "bad" : ""}">remição ×${m.toFixed(1)}</span></div>
          <div class="s">${esc(c.perk)}${lock ? ` · <b class="bad">exige inteligência ${c.minInt}</b>` : ""}</div>${st.p ? bar("Progresso", st.p, "var(--accent)") : ""}</div>
          <button class="btn sm" ${lock || S.activitiesThisYear >= ACT_LIMIT ? "disabled" : ""} onclick="UI.do(()=>prisonAct('course','${c.id}'));UI.prisonCourses()">Estudar</button></div>`; }).join("")}
      <div class="choices" style="margin-top:10px"><button onclick="UI.close()">Fechar</button></div>`);
  },
  /* ---------- Casamento ---------- */
  marryDialog(u){
    const r = relBy(u); if (!r) return; ensureSpouseMoney(r);
    UI._mc = "simple";
    modal(`<div class="emoji">💒</div><h3>Casar com ${esc(r.first)}</h3><p class="muted">${esc(r.first)} tem ~${fmt(r.money)} de patrimônio (${DATA.wealthLevels[num(r.wealth,2)].toLowerCase()}). Você tem ${fmt(S.money)}.</p>
      ${label("Cerimônia")}<div class="seg two"><button class="on" onclick="UI._mc='simple';this.classList.add('on');this.nextElementSibling.classList.remove('on')">Simples · ${fmt(priceOf(2500))}</button><button onclick="UI._mc='big';this.classList.add('on');this.previousElementSibling.classList.remove('on')">Festão · ${fmt(priceOf(25000))}</button></div>
      ${label("Regime de bens")}<div class="choices">${Object.entries(REGIMES).map(([k,g]) => `<button onclick="UI.close();UI.do(()=>marryWith('${u}', UI._mc, '${k}'))">${g.name}<small>no casamento você acessa: ${g.access}</small></button>`).join("")}<button onclick="UI.close()">Cancelar</button></div>`);
  },
});
</script>
<script>/* src/ui/extras.js */
"use strict";
/* =====================================================================
   ui/extras.js — telas de trabalho autônomo, vida de atleta, coleção,
   arsenal e lado sombrio (caçada em etapas).
   ===================================================================== */
function gigCard(){
  const a = P().age; if (a < 12 || inPrison()) return "";
  const G = S.gig;
  let h = `<div class="card"><h2>🧰 Trabalho autônomo <span class="tag">${S.job ? "como bico, além do emprego" : "renda por conta própria"}</span></h2>`;
  if (G){
    const d = gigDef(G.id);
    h += `<div class="row"><div class="grow"><div class="t">${d.emoji} ${d.name}</div><div class="s">${G.years} ano(s) · renda estimada <b>${fmt(gigIncome())}/ano</b>${d.audience ? ` · ${G.audience.toLocaleString("pt-BR")} ${d.adult ? "assinantes" : "clientes/seguidores"}` : ""} · avaliação ${Math.round(G.rating)}</div>
      ${bar("Habilidade", G.skill, "var(--accent)")}${d.adult ? bar("⚠️ Exposição", G.exposure, "var(--bad)") : ""}</div></div>
      <div class="row"><span class="s">Ritmo:</span>${DATA.gigPace.map(p => `<button class="btn ${G.pace === p.id ? "primary" : ""}" ${S.job && p.id === 2 ? "disabled" : ""} onclick="UI.do(()=>setGigPace(${p.id}))">${p.name}</button>`).join("")}</div>
      <div class="row">${d.audience ? `<button class="btn" onclick="UI.do(promoteGig)">📣 Divulgar</button>` : ""}<button class="btn" onclick="UI.do(practiceGig)">📈 Aperfeiçoar</button><button class="btn danger" onclick="UI.confirm('Parar de trabalhar como ${esc(d.name)}?', ()=>UI.do(()=>stopGig()))">Parar</button></div>
      ${d.adult ? `<div class="oddsline">Exposição alta = chance de vazar para família, parceiro(a) e emprego. ${G.id === "escort" ? `Lei local: <b>${DATA.escortLaw[P().country] || "tolerada"}</b>.` : ""}</div>` : ""}`;
  }
  const cats = [...new Set(DATA.gigs.map(g => g.cat))];
  h += `<details ${G ? "" : "open"}><summary class="t" style="cursor:pointer;margin-top:8px">${G ? "Trocar de atividade" : "Escolher atividade"}</summary>`;
  for (const cat of cats){
    const list = DATA.gigs.filter(g => g.cat === cat && (!g.adult || a >= 18)); if (!list.length) continue;
    h += label(cat) + list.map(g => { const why = gigBlock(g), est = !why ? gigIncome({ id:g.id, years:0, skill:15 + P().stats.intelligence/10, audience: g.audience ? 10 : 0, pace: S.job ? 0 : 1, exposure:0, rating:70 }) : 0;
      return `<div class="row"><div class="grow"><div class="t">${g.emoji} ${g.name}</div><div class="s">${esc(g.desc)}${est ? ` · começa ~${fmt(est, true)}/ano` : ""}</div></div>
        <button class="btn sm ${why ? "" : "primary"}" ${why ? "disabled" : ""} onclick="${g.adult ? `UI.confirm('${esc(g.name)}: conteúdo/atividade adulta, com risco de exposição, estigma${g.danger ? ", ISTs, violência e polícia" : ""}. Continuar?', ()=>UI.do(()=>startGig('${g.id}')))` : `UI.do(()=>startGig('${g.id}'))`}">${why ? esc(why) : "Começar"}</button></div>`; }).join("");
  }
  return h + `</details></div>`;
}
function athleteCard(){
  if (!isAthlete()) return "";
  const J = S.job, c = career();
  return `<div class="card hero"><h2>🏟️ Vida de atleta <span class="tag">${esc(J.club || "—")}</span></h2>
    ${bar("Forma", athleteForm(), "var(--good)")}
    <div class="s">Contrato: ${J.contract ?? "?"} ano(s) restante(s) · salário ×${num(J.contractMult, 1).toFixed(2)} · títulos ${num(J.titles)}${J.injured ? " · <b class='bad'>lesionado(a)</b>" : ""} · aposentadoria típica aos ${retireAge(c)}</div>
    <div class="row"><button class="btn primary" onclick="UI.do(extraTraining)">🏋️ Treino extra</button><span class="s">+desempenho, risco de lesão</span></div></div>`;
}
function collectionCard(){
  if (P().age < 18) return "";
  const C = collection();
  return `<div class="card"><h2>🏺 Coleção <span class="tag">${C.length} peça(s) · ${fmt(collectionTotal(), true)}</span></h2>
    ${C.length ? C.map(c => { const d = byId(DATA.collectibles, c.id), gain = c.value - c.paid;
      return `<div class="row"><div class="grow"><div class="t">${d.emoji} ${d.name}${c.hot ? ' <span class="tag bad">sem procedência</span>' : ""}</div>
        <div class="s">${d.cat} · ${fmtAsset(c.value, c.country)} <span class="${gain >= 0 ? "good" : "bad"}">(${gain >= 0 ? "+" : "−"}${fmt(Math.abs(gain), true)})</span>${c.insured ? " · 🛡️ segurada" : ""}</div></div>
        <div class="art-btns"><button class="btn sm" onclick="UI.do(()=>insureCollectible('${c.uid}'))">${c.insured ? "Cancelar seguro" : "🛡️ Segurar"}</button><button class="btn sm" onclick="UI.do(()=>lendToMuseum('${c.uid}'))">🏛️ Emprestar a museu</button><button class="btn sm" onclick="UI.confirm('Vender ${esc(d.name)}?', ()=>UI.do(()=>sellCollectible('${c.uid}')))">Vender</button></div></div>`; }).join("") : `<div class="empty">Nenhuma peça. Visite a casa de leilões.</div>`}
    <div class="choices" style="margin-top:8px"><button onclick="UI.collectShop()">🔨 Leilões, antiquários e mercado negro</button></div></div>`;
}
function darkPanel(){
  const D = S.dark; if (!D || !D.active) return P().age >= 18 ? `<div class="row"><div class="grow"><div class="t">🌑 Lado sombrio</div><div class="s">Um caminho sem volta: caçar alvos, esconder pistas, viver uma vida dupla.</div></div><button class="btn sm danger" onclick="UI.darkIntro()">Despertar</button></div>` : "";
  const why = huntBlock();
  return `${label(`🌑 Lado sombrio · ${D.code === "code" ? "com código" : "sem código"} · ${D.kills} vítima(s)`)}
    <div class="bars">${bar("Impulso", D.urge, "var(--accent-2)")}${bar("Suspeita policial", D.heat, "var(--bad)")}${bar("Disfarce", darkCover(), "var(--good)")}${bar("Discrição", D.stealth, "var(--info)")}</div>
    <div class="oddsline">Pistas acumuladas: <b>${D.clues}</b>. Com suspeita acima de 85 e pistas, a força-tarefa fecha o cerco.</div>
    <div class="grid2" style="margin-top:8px">
      <button class="action" ${why ? "disabled" : ""} onclick="UI.hunt()"><b>🎯 Caçar</b><span>${why ? esc(why) : "escolher alvo e planejar"}</span></button>
      <button class="action" onclick="UI.do(destroyEvidence)" ${D.clues ? "" : "disabled"}><b>🧹 Sumir com pistas</b><span>energia · pode dar errado</span></button>
      <button class="action" onclick="UI.do(normalLife)"><b>🎭 Vida normal</b><span>−suspeita</span></button>
      <button class="action" onclick="UI.do(repressDark)"><b>🧠 Terapia</b><span>−impulso · ${fmt(priceOf(2500), true)}</span></button></div>`;
}
function armoryRow(d, black){
  const why = weaponBlock(d);
  return `<div class="row"><div class="grow"><div class="t">${d.emoji} ${d.name} ${d.legal === "illegal" ? '<span class="tag bad">ilegal</span>' : d.legal === "license" ? '<span class="tag">exige porte</span>' : ""}</div>
    <div class="s">${fmt(priceOf(d.price))}${black ? "+" : ""} · letalidade ${Math.round(d.lethal*100)} · discrição ${Math.round(d.discretion*100)} · rastreável ${Math.round(d.trace*100)}%</div></div>
    <button class="btn sm" ${why ? "disabled" : ""} onclick="UI.close();UI.do(()=>buyWeapon('${d.id}'))">${why ? esc(why) : "Comprar"}</button></div>`;
}

Object.assign(UI, {
  collectShop(){
    const row = d => `<button class="action" onclick="UI.close();UI.confirm('Comprar ${esc(d.name)}?${d.src === "black" ? " Procedência duvidosa: pode ser falso ou apreendido." : ""}', ()=>UI.do(()=>buyCollectible('${d.id}')))"><b>${d.emoji} ${d.name}</b><span>${d.cat} · ~${fmt(priceOf(d.price), true)} · valoriza ~${Math.round(d.appr*100)}%/ano</span></button>`;
    modal(`<div class="emoji">🔨</div><h3>Leilões e antiquários</h3><p class="muted">Leilão cobra 12% de comissão; antiquário, 5%. O mercado negro sai pela metade — e pode ser falso ou roubado.</p>
      ${Object.entries(DATA.collectSrc).map(([k, l]) => `${label(l)}<div class="grid2">${DATA.collectibles.filter(d => d.src === k).map(row).join("")}</div>`).join("")}
      <div class="choices" style="margin-top:10px"><button onclick="UI.close()">Fechar</button></div>`);
  },
  armory(black){
    const law = DATA.gunLaw[P().country] || { age:25 };
    modal(`<div class="emoji">${black ? "🕳️" : "🔫"}</div><h3>${black ? "Mercado paralelo" : "Loja de armas autorizada"}</h3>
      <p class="muted">${black ? "Sem registro e sem perguntas. Se for pego(a) com isso, a pena aumenta." : `Armas de fogo exigem porte (idade ${law.age}+, ficha limpa, exame psicológico). Seu porte: <b>${S.flags.gunLicense ? "aprovado" : "não tem"}</b>.`}</p>
      ${!black && !S.flags.gunLicense ? `<div class="choices"><button onclick="UI.close();UI.do(applyGunLicense)">🪪 Solicitar porte de arma<small>${fmt(priceOf(law.cost || 2000))} · aprovação ~${Math.round((law.ok || 0.3)*100)}% em ${country().name}</small></button></div>` : ""}
      ${DATA.armory.filter(d => black ? d.legal === "illegal" : d.legal !== "illegal").map(d => armoryRow(d, black)).join("")}
      ${arsenal().length ? `${label("Meu arsenal")}${arsenal().map(w => { const d = byId(DATA.armory, w.id); return `<div class="row"><div class="grow s">${d.emoji} ${d.name}${w.registered ? " · registrada em seu nome" : ""}</div><button class="btn sm" onclick="UI.close();UI.do(()=>discardWeapon('${w.uid}'))">Descartar</button></div>`; }).join("")}` : ""}
      <div class="choices" style="margin-top:10px"><button onclick="UI.close()">Fechar</button></div>`);
  },
  darkIntro(){
    modal(`<div class="emoji">🌑</div><h3>O lado sombrio</h3><p>Você passará a ter <b>impulso</b> (cresce todo ano), <b>suspeita policial</b> e <b>pistas</b>. Uma vida "normal" (emprego, família) é o seu disfarce. Se a força-tarefa juntar provas: pena máxima.</p>
      <div class="choices"><button class="danger" onclick="UI.close();UI.do(()=>awakenDark('code'))">⚖️ Com código: só quem escapou da justiça</button>
      <button class="danger" onclick="UI.close();UI.do(()=>awakenDark('none'))">🩸 Sem código</button><button onclick="UI.close()">Não. Melhor não.</button></div>`);
  },
  hunt(){
    const why = huntBlock(); if (why){ toast(why); return; }
    UI._targets = huntCandidates();
    modal(`<div class="emoji">🎯</div><h3>Escolher o alvo</h3><p class="muted">Código: <b>${dark().code === "code" ? "só culpados" : "nenhum"}</b>. Alvos com motivo pessoal chamam atenção da polícia.</p>
      <div class="choices">${UI._targets.map((t, i) => { const d = byId(DATA.darkTargets, t.tid); return `<button onclick="UI.do(()=>startHunt(UI._targets[${i}]));UI.huntPlan()">${esc(t.first)} ${esc(t.last)}, ${t.age} — ${esc(d.name)}<small>${esc(d.desc)} · risco ${d.risk >= 1.1 ? "alto" : d.risk >= 0.85 ? "médio" : "baixo"}${dark().code === "code" && !d.guilty ? " · <b class='bad'>viola seu código</b>" : ""}</small></button>`; }).join("")}
      <button onclick="UI.close()">Desistir</button></div>`, { locked:true });
  },
  huntPlan(msg = ""){
    const H = S.hunt; if (!H){ closeModal(); return; }
    const opts = [{ id:null, name:"🤜 Mãos nuas (artes marciais)", acc:0.4, discretion:0.6, trace:0.1 }, ...arsenal().map(w => byId(DATA.armory, w.id))];
    modal(`<div class="emoji">🗺️</div><h3>Planejamento: ${esc(H.t.first)} ${esc(H.t.last)}</h3>
      ${msg ? `<div class="result">${esc(msg)}</div>` : ""}
      ${bar("Preparo", H.prep, "var(--accent)")}
      <div class="choices" style="margin-top:8px"><button ${H.studied >= 2 || S.activitiesThisYear >= ACT_LIMIT ? "disabled" : ""} onclick="UI.huntPlan(huntStudy())">👁️ Estudar a rotina do alvo<small>energia · +preparo (máx. 2 vezes)</small></button></div>
      ${label("Abordagem (escolha para executar)")}
      <div class="choices">${opts.map(o => { H.weapon = o.id; const p = huntOdds(H); H.weapon = null; return `<button class="danger" onclick="UI.huntGo(${o.id ? `'${o.id}'` : "null"})">${o.name}<small>sucesso ~${Math.round(p*100)}% · discrição ${Math.round(o.discretion*100)} · rastreável ${Math.round(o.trace*100)}%</small></button>`; }).join("")}
      <button onclick="S.hunt=null;UI.close();toast('Você recuou. Talvez outro dia.')">↩️ Recuar</button></div>`, { locked:true });
  },
  huntGo(w){
    const msg = huntExecute(w);
    if (S.fight){ UI._mgBefore = takeSnapshot(); return UI.fightOpen(); }
    if (!S.hunt || !S.hunt.success){ saveGame(true); render(); modal(`<div class="emoji">💨</div><h3>Deu errado</h3><div class="result">${esc(msg)}</div><div class="choices"><button class="primary" onclick="UI.close()">Continuar</button></div>`); return; }
    modal(`<div class="emoji">🌑</div><h3>Feito</h3><div class="result">${esc(msg)}</div>${label("E agora?")}
      <div class="choices"><button onclick="UI.huntEnd('meticulous')">🧹 Limpar tudo com calma<small>energia · −2 pistas</small></button>
      <button onclick="UI.huntEnd('fast')">🏃 Sair rápido<small>deixa mais rastros</small></button>
      <button onclick="UI.huntEnd('frame')">🧩 Plantar pistas falsas<small>inteligência · pode virar contra você</small></button></div>`, { locked:true });
  },
  huntEnd(mode){ const m = huntCleanup(mode); saveGame(true); render(); modal(`<div class="emoji">🌘</div><div class="result">${esc(m)}</div><div class="choices"><button class="primary" onclick="UI.close()">Voltar à vida normal</button></div>`); },
});
/* Evento "O impulso" pode pedir para abrir a caçada ao continuar. */
{ const _next = UI.next; UI.next = function(){ if (S && S.flags.openHunt){ delete S.flags.openHunt; if (!validHead()) return UI.hunt(); } return _next.apply(this, arguments); }; }
</script>
<script>/* src/ui/tutorial.js */
"use strict";
/* =====================================================================
   ui/tutorial.js — TUTORIAL resumido, logo após o carregamento de uma
   nova vida. Travado (não fecha tocando fora nem com Esc): o jogador
   passa pelos 5 cartões. Depois da 1ª vez, pode marcar "não mostrar nas
   próximas vidas". Revisável a qualquer hora: menu ☰ → Guia rápido, ou
   o hub.

function scanBad(o, path="S", out=[]){
  if (out.length > 5) return out;
  if (typeof o === "number" && !isFinite(o)) out.push(path);
  else if (o && typeof o === "object") for (const k in o) scanBad(o[k], path+"."+k, out);
  return out;
}

      else if (S.org && isBoss() && roll < 0.97){ chance(0.5) ? recruit(makeCrewCandidate()) : startOp(pick(DATA.orgOps).id); }
      else if (S.dirty > 0 && roll < 0.975) launder(S.dirty);

    } catch(e){ res.errors.push("ação: " + e.message + " @" + (e.stack||"").split("\n")[1]); }
    try { if (S.fight) autoFight(); if (S.escape) autoEscape(); } catch(e){ res.errors.push("minigame: " + e.message + " @" + (e.stack||"").split("\n")[1]); }
  };
  for (let i=0;i<lives;i++){
    S = null; newLife({ seed: 1000+i });
    let guard = 0;
    while (P().alive && guard++ < 200){
      for (let k=0;k<3;k++) if (P().alive && !S.queue.length) randomAction();
      try { if (P().alive) ageUp(); } catch(e){ res.errors.push("ageUp: " + e.message + " @" + (e.stack||"").split("\n")[1]); break; }
      let g2 = 0;

      const bad = scanBad(S);
      if (bad.length){ res.bad.push(`vida ${i} idade ${P().age}: ${bad.join(", ")}`); break; }
      if (S.money < 0) { res.bad.push(`vida ${i}: dinheiro negativo ${S.money}`); }
    }
    if (guard >= 200) res.errors.push("loop: vida " + i + " não terminou");
    if (S.jobHistory.length || S.job) res.jobs++;
    res.diagnosed = (res.diagnosed||0) + S.log.filter(e=>/diagnóstico|detectou|Fiquei doente/.test(e.text)).length;
    res.consequences = (res.consequences||0) + S.consequences.length;
    if (S.jobHistory.some(j=>j.career==="Carreira Política") || career()?.elected) res.politicians = (res.politicians||0)+1;

    if (S.record.length) res.prison++;

/* =====================================================================
   Sonda de balanceamento (abra index.html?balance).
   Compara estilos de vida com as MESMAS sementes e testa o antigo
   exploit de "spam de saúde" num idoso.
   ===================================================================== */
function balanceReport(n = 40){
  const policies = {
    cuidadoso: () => { if (P().age >= 18){ if (S.health.plan === "none") setHealthPlan("premium"); medicalCheckup(); doActivity("gym"); doActivity("walk"); doActivity("meditate");
                       for (const il of S.illnesses.filter(i=>i.diagnosed && !i.treated)) if (treatIllness(il.id, "private").ok === false) treatIllness(il.id, "public"); } },
    negligente: () => {},
    imprudente: () => { if (P().age >= 16){ S.addictions.smoke = Math.max(S.addictions.smoke, 50); S.addictions.alcohol = Math.max(S.addictions.alcohol, 45); } if (S.job) S.job.effort = 2; },
  };
  const out = {};
  for (const [name, policy] of Object.entries(policies)){
    const ages = [], h60 = [], cancer = { got:0, survived:0 };
    for (let i=0;i<n;i++){
      S = null; newLife({ seed: 5000+i, cls: 4 });
      let had = false;
      while (P().alive && P().age < 125){
        if (P().age >= 18 && !S.job && !S.edu.school) applyJob(pick(["cashier","sales","admin","waiter"]));
        policy();
        ageUp(); while (validHead()) resolveEvent(0);
        if (P().age === 60) h60.push(P().stats.health);
        if (S.illnesses.some(x=>x.id==="cancer")) had = true;
      }
      ages.push(P().age); if (had){ cancer.got++; if (!/Câncer/.test(P().cause)) cancer.survived++; }
    }
    const avg = a => (a.reduce((x,y)=>x+y,0)/Math.max(1,a.length)).toFixed(1);
    out[name] = { idadeMedia: avg(ages), saudeAos60: avg(h60), cancer: `${cancer.survived}/${cancer.got} sobreviveram` };
  }
  // exploit: idoso de 75 anos, saúde 30 → todas as ações de saúde possíveis num único ano
  S = null; newLife({ seed: 77, cls: 6 }); P().age = 75; P().vitality = 60; P().stats.health = 30; S.money = priceOf(1e6);
  const h0 = P().stats.health;
  const msgs = [];
  for (let k=0;k<20;k++){ const r = doActivity(pick(["gym","walk","train","meditate"])); if (k < 3) msgs.push(r.msg); medicalCheckup(); }
  out.exploitSpam = { antes: h0, depois: Math.round(P().stats.health), teto: Math.round(healthCap()), primeiras: msgs };
  return out;
}

function emigrationTest(){
  S = null; newLife({ seed: 9090, country:"BR", cls:6 });

  const r1 = buyProperty("apt2", false); const p = S.properties[0];

  const r2 = emigrate("PT");
  const cashConvertedOk = Math.abs(S.money - fxConv(cashBefore - emigrateCost(byId(DATA.countries,"PT")) * 0, "BR", "PT")) < S.money; // caixa convertido para EUR
  let rentLines = 0;
  for (let y=0; y<4 && P().alive; y++){ ageUp(); while (validHead()) resolveEvent(0); rentLines += S.yearSummary.lines.filter(l=>/Aluguel recebido/.test(l[0])).length; p.tenant = p.tenant || { name:"Inquilino Teste", reliability:100, since:30, late:0 }; }
  const still = S.properties.find(x=>x.uid===p.uid);
  const sold = still ? sellProperty(still.uid) : { ok:false };
  return { comprou: r1.ok, emigrou: r2.ok, paisAtual: P().country, imovelMantido: !!still, imovelPais: still?.country, moedaImovel: still ? country(still.country).currency : null,

/* Combate: tabela de letalidade + 150 lutas completas por contexto. */
function combatTest(){
  const res = { letalidade:{}, sims:{} };
  S = null; newLife({ seed: 2727 }); P().age = 28; P().stats.health = 85;
  const cases = [["Soco · leigo · normal","punch",{},"normal"],["Cruzado · boxe 40 · normal","cross",{boxe:40},"normal"],
    ["Chute alto · muay 85 · controlado","headkick",{muaythai:85},"ctrl"],["Chute alto · muay 85 · normal","headkick",{muaythai:85},"normal"],
    ["Chute alto · muay 85 · com tudo","headkick",{muaythai:85},"all"],["Mata-leão · jiu 80 · com tudo","rnc",{jiujitsu:80},"all"]];
  for (const [label, mv, arts, inten] of cases){
    martial().arts = {}; for (const [k,v] of Object.entries(arts)) martial().arts[k] = { m:v, years:5 };
    startFight("street", {}); S.fight.intensity = inten; S.fight.opp.age = 30; S.fight.opp.health = 80;
    const young = moveLethal(byId(DATA.moves, mv)); S.fight.opp.age = 70; S.fight.opp.health = 50; const old = moveLethal(byId(DATA.moves, mv));
    res.letalidade[label] = `alvo 30a: ${(young*100).toFixed(1)}% · alvo 70a doente: ${(old*100).toFixed(1)}%`;
    S.fight = null;
  }
  for (const kind of Object.keys(DATA.fightProfiles)){
    const t = { win:0, lose:0, draw:0, fled:0, surrender:0, mortes:0, morreu:0, erros:0 };
    for (let i=0;i<150;i++){
      try {
        S = null; newLife({ seed: 7000+i }); P().age = 28; P().stats.health = rint(50, 95); martial().arts = { mma:{ m: rint(0,90), years:3 } };
        if (kind === "prison") sendToPrison(5, "teste");
        if (kind === "rival" || kind === "hit"){ S.crimeSkill = 40; S.money += priceOf(1e5); foundOrg(); }
        startFight(kind, kind === "tournament" ? { tid:"amador", art:"mma", idx:0 } : kind === "rival" ? { rival: S.org?.rivals?.[0]?.name } : {});
        let g = 0;
        while (S.fight && !S.fight.over && g++ < 30){ const mv = fightActions().moves.filter(m => S.fight.me.sta >= m.cost); fightAction(mv.length ? pick(mv).id : "defend"); }
        const F = S.fight; t[F.result]++; if (F.oppOutcome === "death") t.mortes++; if (F.myOutcome === "death") t.morreu++;
        closeFight(); if (S.fight) autoFight();
        if (scanBad(S).length || S.money < 0) t.erros++;
      } catch(e){ t.erros++; res.erro = `${kind}: ${e.message} @${(e.stack||"").split("\n")[1]}`; }
    }
    res.sims[kind] = t;
  }
  res.OK = Object.values(res.sims).every(t => !t.erros);
  return res;
}

/* Fuga: para cada dificuldade 0–8, gera puzzles e os JOGA com a solução
   da BFS através de escapeMove (a mesma função da UI). Todos devem fugir. */
function escapeTest(perD = 8){

      if (k === "collect"){ S.money += priceOf(2e6); buyCollectible("fossil"); buyCollectible("watch"); buyCollectible("idol"); TAB = "assets"; render(); }
    }
    const es = location.search.match(/escape=(\d+)/); // ?demo=25&escape=4&moves=2
    if (es){ sendToPrison(6, "demonstração"); S.prison.security = ["mínima","média","máxima"][Math.min(2, Math.floor(+es[1]/2))]; S.prison.escAttempts = +es[1] % 2; startEscape();
      const mv = +(location.search.match(/moves=(\d+)/)||[0,0])[1]; const sol = solveStage(escStage()); for (let j=1;j<=mv && j<sol.path.length;j++){ const [x0,y0]=sol.path[j-1],[x1,y1]=sol.path[j]; S.escape.lastMsg = escapeMove(x1>x0?"E":x1<x0?"W":y1>y0?"S":y1<y0?"N":"wait"); }
      render(); UI.escapeOpen(); }
    return;
  }
  // abertura: carregamento longo (4–6 s) → hub (menu principal)
  showLoading(BOOT_STEPS, () => { migrateLegacySave(); }, () => showHub("home"), { long:true });
})();
</script>
