<script>/* src/ui/sound.js */
"use strict";
/* =====================================================================
   ui/sound.js — SoundManager 100% procedural (Web Audio API).
   Nenhum arquivo externo: cada efeito é sintetizado com osciladores e
   ruído filtrado, então funciona offline e nunca "quebra" por falta de
   asset. O AudioContext só é criado no primeiro gesto do usuário
   (política de autoplay dos navegadores). Mudo/volume em SETTINGS.
   ===================================================================== */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null, muted = false, unlocked = false; const last = {};
  function ensure(){
    if (typeof window === "undefined") return null;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    if (!ctx){
      ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    master.gain.setTargetAtTime(SETTINGS.sound ? SETTINGS.volume : 0, ctx.currentTime, 0.01);
    if (ctx.state !== "running" && ctx.state !== "closed") ctx.resume().catch(()=>{}); // "suspended" ou "interrupted" (iOS)
    return ctx;
  }
  /* tom com envelope ADSR simplificado e glissando opcional */
  function tone({ f = 440, f2, t = 0, d = 0.12, type = "sine", g = 0.22, a = 0.006 }){
    const t0 = ctx.currentTime + t, o = ctx.createOscillator(), v = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    v.gain.setValueAtTime(0.0001, t0); v.gain.exponentialRampToValueAtTime(g, t0 + a); v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(v); v.connect(master); o.start(t0); o.stop(t0 + d + 0.05);
  }
  /* ruído filtrado (whoosh, caixa registradora, impacto) */
  function noise({ t = 0, d = 0.3, g = 0.15, f = 1200, f2, q = 0.8 }){
    const t0 = ctx.currentTime + t, s = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), v = ctx.createGain();
    s.buffer = noiseBuf; bp.type = "bandpass"; bp.Q.value = q; bp.frequency.setValueAtTime(f, t0); if (f2) bp.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    v.gain.setValueAtTime(0.0001, t0); v.gain.exponentialRampToValueAtTime(g, t0 + 0.02); v.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(bp); bp.connect(v); v.connect(master); s.start(t0); s.stop(t0 + d + 0.05);
  }
  const arp = (notes, step, opts) => notes.forEach((f,i) => tone({ f, t: i*step, ...opts }));
  const SFX = {
    click:       () => tone({ f:1200, f2:900, d:0.035, type:"triangle", g:0.08 }),
    bubble:      () => tone({ f:520, f2:1100, d:0.07, type:"sine", g:0.1 }),
    year:        () => { noise({ d:0.45, f:400, f2:2400, g:0.08, q:0.6 }); arp([659, 988], 0.12, { d:0.35, type:"triangle", g:0.13, t:0.18 }); },
    money:       () => { arp([1319, 1568, 2093], 0.06, { d:0.16, type:"square", g:0.05 }); tone({ f:2637, t:0.2, d:0.3, g:0.04 }); },
    loss:        () => arp([392, 311, 233], 0.11, { d:0.22, type:"sawtooth", g:0.06 }),
    buy:         () => { noise({ d:0.06, f:3000, g:0.12, q:2 }); arp([1047, 1568], 0.08, { d:0.25, type:"triangle", g:0.12, t:0.05 }); },
    alert:       () => { arp([740, 554], 0.13, { d:0.12, type:"triangle", g:0.12 }); },
    siren:       () => { for (let i=0;i<3;i++){ tone({ f:620, f2:950, t:i*0.42, d:0.21, type:"sawtooth", g:0.05 }); tone({ f:950, f2:620, t:i*0.42+0.21, d:0.21, type:"sawtooth", g:0.05 }); } },
    achievement: () => arp([523, 659, 784, 1047], 0.09, { d:0.4, type:"triangle", g:0.12 }),
    death:       () => { [196, 233, 294].forEach(f => tone({ f, d:2.2, a:0.3, type:"sine", g:0.1 })); noise({ d:1.8, f:300, g:0.02, q:0.4 }); },
    error:       () => arp([196, 147], 0.08, { d:0.12, type:"square", g:0.05 }),
    travel:      () => { noise({ d:1.0, f:200, f2:1800, g:0.06, q:0.5 }); arp([523, 784, 1047], 0.15, { d:0.3, t:0.4, type:"sine", g:0.1 }); },
    // combate
    punch:       () => { noise({ d:0.11, f:200, g:0.4, q:0.7 }); tone({ f:120, f2:55, d:0.13, g:0.28 }); },
    hurt:        () => { noise({ d:0.14, f:350, g:0.3, q:0.9 }); tone({ f:260, f2:140, d:0.16, type:"sawtooth", g:0.06 }); },
    miss:        () => noise({ d:0.18, f:700, f2:2600, g:0.07, q:0.6 }),
    bell:        () => { [880, 1320, 2200].forEach((f,i) => tone({ f, d:1.4 - i*0.3, a:0.003, type:"sine", g:0.09 - i*0.02 })); },
    ko:          () => { noise({ d:0.35, f:120, g:0.45, q:0.5 }); arp([330, 247, 165], 0.12, { d:0.3, type:"triangle", g:0.09, t:0.12 }); },
    win:         () => arp([523, 659, 784, 1047, 1319], 0.08, { d:0.35, type:"triangle", g:0.11 }),
    // fuga
    step:        () => tone({ f:260, f2:200, d:0.04, type:"triangle", g:0.06 }),
    pickup:      () => arp([1175, 1568, 2093], 0.05, { d:0.14, type:"square", g:0.04 }),
    stage:       () => arp([659, 880, 1175], 0.09, { d:0.25, type:"triangle", g:0.1 }),
    caught:      () => { for (let i=0;i<2;i++) tone({ f:880, f2:440, t:i*0.3, d:0.26, type:"square", g:0.06 }); noise({ d:0.4, f:150, g:0.3, q:0.5, t:0.6 }); },
    escape:      () => { noise({ d:0.8, f:300, f2:2400, g:0.05, q:0.5 }); arp([523, 659, 784, 1047, 1568], 0.1, { d:0.45, t:0.3, type:"triangle", g:0.11 }); },
    // prisão: sirene policial "yelp" + batida metálica de grade
    jail:        () => {
      for (let i=0;i<4;i++){ tone({ f:700, f2:1500, t:i*0.32, d:0.16, type:"sawtooth", g:0.045 }); tone({ f:1500, f2:700, t:i*0.32+0.16, d:0.16, type:"sawtooth", g:0.045 }); }
      [0, 0.09].forEach(t0 => { noise({ t:1.42+t0, d:0.25, f:2400, q:6, g:0.18 }); tone({ f:180, f2:120, t:1.42+t0, d:0.3, type:"square", g:0.06 }); tone({ f:1980, t:1.42+t0, d:0.6, type:"sine", g:0.03 }); });
    },
    // hospital: ambulância (dois tons alternados) + bipe de monitor cardíaco
    hospital:    () => {
      for (let i=0;i<4;i++){ tone({ f:960, t:i*0.5, d:0.24, type:"triangle", g:0.07 }); tone({ f:770, t:i*0.5+0.25, d:0.24, type:"triangle", g:0.07 }); }
      for (let i=0;i<3;i++) tone({ f:1046, t:2.15 + i*0.62, d:0.09, type:"sine", g:0.06, a:0.003 });
    },
    beep:        () => tone({ f:1046, d:0.1, type:"sine", g:0.06 }),
    // tela cheia
    expand:      () => { noise({ d:0.25, f:600, f2:3000, g:0.05, q:0.7 }); arp([523, 784], 0.07, { d:0.18, type:"triangle", g:0.08, t:0.05 }); },
    collapse:    () => { noise({ d:0.22, f:2600, f2:500, g:0.05, q:0.7 }); arp([784, 523], 0.07, { d:0.18, type:"triangle", g:0.08 }); },
    // carregamento
    tick:        () => tone({ f:1600, d:0.025, type:"sine", g:0.025 }),
    ready:       () => { [523, 659, 784].forEach((f,i) => tone({ f, t:i*0.04, d:0.9, a:0.02, type:"sine", g:0.06 })); tone({ f:1047, t:0.18, d:0.7, type:"triangle", g:0.05 }); },
  };
  return {
    play(name){
      if (muted || !SETTINGS.sound) return;
      const now = Date.now(), gap = { jail:2600, hospital:3200, siren:1400 }[name] || 0; // sons longos não se empilham
      if (gap && now - (last[name] || 0) < gap) return; last[name] = now;
      try { if (!ensure()) return; SFX[name]?.(); } catch(e){}
    },
    setVolume(v){ SETTINGS.volume = Math.max(0, Math.min(1, v)); saveSettings(); if (ctx) ensure(); },
    toggle(){ SETTINGS.sound = !SETTINGS.sound; saveSettings(); if (ctx) ensure(); if (SETTINGS.sound){ this.unlock(); this.play("click"); } return SETTINGS.sound; },
    mute(m){ muted = !!m; }, // usado pelo selftest
    /* iOS/Android: o contexto só "acorda" dentro de um gesto. Tocar um buffer
       mudo de 1 amostra no primeiro toque destrava o áudio da página toda.
       Respeita o mudo: com som desligado, nada é criado. */
    unlock(){
      if (muted || !SETTINGS.sound) return;
      try {
        const c = ensure(); if (!c) return;
        if (!unlocked){ const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0); unlocked = true; }
        if (c.state !== "running") c.resume().catch(()=>{});
      } catch(e){}
    },
    suspend(){ try { if (ctx && ctx.state === "running") ctx.suspend(); } catch(e){} }, // app em segundo plano
  };
})();
/* A simulação emite eventos; o áudio escuta (desacoplado via core/bus.js). */
on("achievement", () => Sound.play("achievement"));
on("promotion",   () => Sound.play("achievement"));
on("siren",       () => Sound.play("siren"));
on("buy",         () => Sound.play("buy"));
on("loss",        () => Sound.play("loss"));
on("death",       () => Sound.play("death"));
on("economy",     () => Sound.play("alert"));
on("travel",      () => Sound.play("travel"));
on("crime",       () => Sound.play("money"));
on("hit",        () => Sound.play("punch"));
on("hurt",       () => Sound.play("hurt"));
on("miss",       () => Sound.play("miss"));
on("fightStart", () => Sound.play(S && S.fight && S.fight.kind === "tournament" ? "bell" : "alert"));
on("fightWin",   () => Sound.play(S && S.fight && ["ko","grave","coma","death"].includes(S.fight.oppOutcome) ? "ko" : "win"));
on("fightLose",  () => Sound.play("ko"));
on("step",       () => Sound.play("step"));
on("pickup",     () => Sound.play("pickup"));
on("stage",      () => Sound.play("stage"));
on("caught",     () => Sound.play("caught"));
on("escape",     () => Sound.play("escape"));
on("jail",       () => Sound.play("jail"));
on("hospital",   () => Sound.play("hospital"));
</script>
<script>/* src/ui/device.js */
"use strict";
/* =====================================================================
   ui/device.js — comportamento de app em celular/tablet.
   • --app-h: altura real visível (fallback quando não há 100dvh e para a
     barra de endereço do iOS/Android que encolhe e cresce).
   • Áudio: o AudioContext é criado/retomado no 1º toque (exigência do
     iOS/Android) e retomado quando o app volta do segundo plano.
   • Salva ao ir para o segundo plano (mobile mata abas sem aviso).
   • Anti toque duplo: um 2º toque rápido não escolhe a opção do PRÓXIMO
     evento nem envelhece dois anos.
   • Classe html.touch / html.mouse para ajustes finos de interface.
   ===================================================================== */
const Device = (() => {
  const root = document.documentElement;
  const coarse = () => typeof matchMedia === "function" && matchMedia("(pointer:coarse)").matches;
  function setAppHeight(){
    if (typeof CSS !== "undefined" && CSS.supports && CSS.supports("height", "100dvh")) return; // o CSS já resolve
    const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    root.style.setProperty("--app-h", Math.round(h) + "px");
  }
  function setPointerClass(){ root.classList.toggle("touch", coarse()); root.classList.toggle("mouse", !coarse()); }
  setAppHeight(); setPointerClass();
  addEventListener("resize", setAppHeight, { passive:true });
  if (window.visualViewport) visualViewport.addEventListener("resize", setAppHeight, { passive:true });
  addEventListener("orientationchange", () => { setTimeout(setAppHeight, 120); setTimeout(keepModalInView, 160); }, { passive:true });
  if (typeof matchMedia === "function"){ const mq = matchMedia("(pointer:coarse)"); (mq.addEventListener ? mq.addEventListener("change", setPointerClass) : mq.addListener(setPointerClass)); }

  /* ao girar a tela, o modal aberto volta ao topo do conteúdo visível (sem perder estado) */
  function keepModalInView(){ const m = document.querySelector("#modalRoot .modal"); if (m && m.scrollTop > m.scrollHeight - m.clientHeight) m.scrollTop = m.scrollHeight; }

  /* ---------- Áudio: desbloqueio no primeiro gesto ---------- */
  const unlock = () => { if (typeof Sound !== "undefined") Sound.unlock(); };
  for (const ev of ["pointerdown","touchend","keydown","click"]) addEventListener(ev, unlock, { capture:true, passive:true });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden"){ try { if (typeof S !== "undefined" && S && P().alive) saveGame(true); } catch(e){} if (typeof Sound !== "undefined") Sound.suspend(); }
  });
  addEventListener("pagehide", () => { try { if (typeof S !== "undefined" && S) saveGame(true); } catch(e){} });

  /* ---------- Anti toque duplo ---------- */
  let busyUntil = 0;
  function guard(ms = 320){ const now = performance.now(); if (now < busyUntil) return false; busyUntil = now + ms; return true; }

  return { guard, coarse, setAppHeight };
})();
</script>
<script>/* src/ui/fullscreen.js */
"use strict";
/* =====================================================================
   ui/fullscreen.js — TELA CHEIA (PC e celular) + MODO APP anti-rolagem.
   • Fullscreen API nativa (requestFullscreen / webkitRequestFullscreen).
   • Onde a API não existe (iPhone) ou é bloqueada (iframe/webview), entra
     o MODO APP (pseudo tela cheia): a página inteira para de rolar; só o
     conteúdo do jogo rola por dentro, sem "puxar para atualizar", sem
     efeito elástico e sem zoom de pinça acidental.
   • Instalado na tela inicial (display-mode: standalone) → modo app
     automático.
   • pageTop(): volta ao topo funcionando nos dois modos de rolagem.
   ===================================================================== */
const FS = (() => {
  const d = document, root = d.documentElement;
  let pseudo = false;
  const nativeEl = () => d.fullscreenElement || d.webkitFullscreenElement || null;
  const nativeOk = () => !!(root.requestFullscreen || root.webkitRequestFullscreen) && (d.fullscreenEnabled ?? d.webkitFullscreenEnabled ?? true);
  const standalone = () => (typeof matchMedia === "function" && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const active = () => !!nativeEl() || pseudo;

  function apply(){
    const on = active() || standalone();
    root.classList.toggle("app-mode", on);
    root.classList.toggle("is-fullscreen", !!nativeEl());
    for (const b of d.querySelectorAll("[data-fs-btn]")){
      b.innerHTML = active() ? FS_ICON.exit : FS_ICON.enter;
      b.setAttribute("aria-label", active() ? "Sair da tela cheia" : "Tela cheia");
      b.setAttribute("aria-pressed", active() ? "true" : "false");
      b.title = active() ? "Sair da tela cheia" : "Tela cheia";
    }
  }
  async function enter(){
    let ok = false;
    if (nativeOk()){
      try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI:"hide" }) : root.webkitRequestFullscreen()); ok = true; } catch(e){ ok = false; }
    }
    if (!ok){
      pseudo = true;
      toast(/iPhone|iPod/.test(navigator.userAgent) ? "Modo app ativado. Para tela cheia total no iPhone: Compartilhar → Adicionar à Tela de Início." : "Modo app ativado (o navegador bloqueou a tela cheia nativa).");
    }
    apply(); Sound.play("expand");
  }
  async function exit(){
    try { if (nativeEl()) await (d.exitFullscreen ? d.exitFullscreen() : d.webkitExitFullscreen()); } catch(e){}
    pseudo = false; apply(); Sound.play("collapse");
  }
  function toggle(){ return active() ? exit() : enter(); }
  /* Preferência "abrir sempre em tela cheia": o modo app (sem rolagem
     acidental) liga na hora; a tela cheia nativa só pode ser pedida num
     gesto do usuário, então é solicitada no PRIMEIRO toque/clique. */
  function setAlways(on){
    SETTINGS.fullscreen = !!on; saveSettings();
    if (on && !active()) enter(); else apply();
    return SETTINGS.fullscreen;
  }
  if (SETTINGS.fullscreen){
    pseudo = true;
    const firstTap = async () => {
      removeEventListener("pointerdown", firstTap, true);
      if (!nativeEl() && nativeOk()){ try { await (root.requestFullscreen ? root.requestFullscreen({ navigationUI:"hide" }) : root.webkitRequestFullscreen()); } catch(e){} }
      apply();
    };
    addEventListener("pointerdown", firstTap, true);
  }
  d.addEventListener("fullscreenchange", apply); d.addEventListener("webkitfullscreenchange", apply);
  if (typeof matchMedia === "function"){ const mq = matchMedia("(display-mode: standalone)"); mq.addEventListener ? mq.addEventListener("change", apply) : mq.addListener?.(apply); }
  // F11/ESC também passam por aqui: o "F" alterna (fora de campos de texto)
  d.addEventListener("keydown", e => { if (e.key === "f" && !e.ctrlKey && !e.metaKey && !/input|textarea|select/i.test(e.target.tagName) && !d.querySelector("#modalRoot .escgrid")) toggle(); });
  setTimeout(apply, 0);
  /* Botões de configuração (hub e menu do jogo). */
  function settingsHTML(after){
    return `<div class="section-label">📱 Tela</div>
      <button onclick="FS.toggle().then(()=>${after})">${active() ? "🗗 Sair da tela cheia" : "⛶ Entrar em tela cheia agora"}<small>${nativeOk() ? "tela cheia do aparelho" : "este navegador não permite tela cheia nativa: usa o modo app (sem rolagem acidental)"}</small></button>
      <button onclick="FS.setAlways(!SETTINGS.fullscreen);${after}">${SETTINGS.fullscreen ? "✅" : "⬜"} Abrir sempre em tela cheia<small>ativa ao abrir o jogo (no 1º toque, no celular)</small></button>
      ${/iPhone|iPod/.test(navigator.userAgent) && !standalone() ? `<div class="oddsline">No iPhone, a tela cheia total só existe instalando o jogo: <b>Compartilhar → Adicionar à Tela de Início</b>.</div>` : ""}`;
  }
  return { toggle, enter, exit, active, apply, setAlways, settingsHTML };
})();
const FS_ICON = {
  enter: `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`,
  exit:  `<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>`,
};
const fsButton = (cls = "iconbtn") => `<button class="${cls} fsbtn" data-fs-btn onclick="FS.toggle()" aria-label="Tela cheia" title="Tela cheia">${FS.active() ? FS_ICON.exit : FS_ICON.enter}</button>`;
/* Topo da página em qualquer modo (no modo app quem rola é o <body>). */
function pageTop(smooth = false){
  const opt = { top:0, behavior: smooth && !REDUCED() ? "smooth" : "auto" };
  window.scrollTo(opt); if (document.body) document.body.scrollTo?.(opt);
}
</script>
<script>/* src/ui/feedback.js */
"use strict";
/* =====================================================================
   ui/feedback.js — tela de carregamento, feedback flutuante (+R$,
   −Saúde, +Fama), balões de fala e ficha de NPC.
   ===================================================================== */

/* ---------- Tela de carregamento estilo jogo mobile ----------
   Barra de progresso + checklist de etapas + porcentagem + dicas que
   giram. `work` roda no meio (gerar vida, carregar save) e a tela some
   em fade com um acorde de "pronto". { long:true } = 4–6 s (abertura do
   jogo e nova vida); padrão ≈1,5 s. NÃO pode ser pulada. Em
   prefers-reduced-motion a tela aparece sem animações (CSS). */
const BOOT_STEPS = ["Inicializando o motor de simulação…","Gerando árvore genealógica…","Sorteando país, cidade e família…","Calculando a economia global…","Carregando academias e submundo…","Treinando os guardas do presídio…","Afinando os efeitos sonoros…","Preparando seu destino…"];
function showLoading(steps, work, done, opts = {}){
  const el = $("#loading");
  if (!el || /selftest|balance|demo|acttest/.test(location.search)){ work && work(); done && done(); return; }
  const tips = DATA.tips.slice().sort(() => Math.random() - 0.5); let tipI = 0;
  el.innerHTML = `<div class="ld-inner">
      <div class="ld-logo"><span class="ld-mark">🧬</span><b>Claudi<span>Life</span></b></div>
      <div class="ld-sub">Simulador de vida</div>
      <div class="ld-bar"><i></i></div>
      <div class="ld-row"><div class="ld-step">${esc(steps[0])}</div><div class="ld-pct">0%</div></div>
      ${opts.long ? `<ol class="ld-list">${steps.map(t => `<li>${esc(t.replace(/…$/, ""))}</li>`).join("")}</ol>` : ""}
      <div class="ld-tip">💡 <b>Dica:</b> <span>${esc(tips[0])}</span></div>
      <div class="ld-skip">${opts.long ? "Preparando a simulação…" : ""}</div></div>`;
  el.classList.remove("out"); el.classList.add("on");
  const bar = el.querySelector(".ld-bar i"), stepEl = el.querySelector(".ld-step"), pctEl = el.querySelector(".ld-pct"), tipEl = el.querySelector(".ld-tip span"), items = el.querySelectorAll(".ld-list li");
  const total = opts.long ? 4300 + Math.random()*1400 : 1300 + Math.random()*500, t0 = performance.now(); // UI: não consome o RNG semeado
  let worked = false, finished = false, lastStep = -1, lastTip = t0;
  const finish = () => {
    if (finished) return; finished = true;
    if (!worked){ worked = true; work && work(); }
    bar.style.width = "100%"; pctEl.textContent = "100%"; items.forEach(li => li.className = "done");
    Sound.play("ready");
    el.classList.add("out");
    setTimeout(()=>{ el.classList.remove("on","out"); el.innerHTML = ""; done && done(); }, 320);
  };
  el.onclick = null; // não pulável: roda até o fim da duração programada
  const tick = now => {
    if (finished) return;
    const k = Math.min(1, (now - t0)/total);
    // progresso "realista": acelera, hesita nas etapas pesadas e termina suave
    const eased = Math.min(1, 1 - Math.pow(1-k, 2.2) + Math.sin(k*Math.PI*3) * 0.015 * (1-k));
    bar.style.width = Math.round(eased*100) + "%"; pctEl.textContent = Math.round(eased*100) + "%";
    const si = Math.min(steps.length-1, Math.floor(k*steps.length));
    if (si !== lastStep){
      lastStep = si; stepEl.textContent = steps[si];
      items.forEach((li, i) => li.className = i < si ? "done" : i === si ? "active" : "");
      if (si > 0) Sound.play("tick");
    }
    if (opts.long && now - lastTip > 1900 && tips.length > 1){ lastTip = now; tipI = (tipI + 1) % tips.length; tipEl.parentElement.classList.remove("swap-in"); void tipEl.offsetWidth; tipEl.textContent = tips[tipI]; tipEl.parentElement.classList.add("swap-in"); }
    if (k > 0.45 && !worked){ worked = true; work && work(); }
    if (k >= 1) return finish();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/* ---------- Feedback flutuante ---------- */
const FLOAT_KEYS = [["money","💰",true],["health","❤️ Saúde"],["happiness","😊 Felicidade"],["intelligence","🧠 Inteligência"],["looks","✨ Aparência"],["fame","⭐ Fama"],["stress","😣 Estresse",false,true],["rep","💼 Reputação"]];
function floatDiff(before, after){
  if (!before || !after) return;
  const host = $("#floaters"); if (!host) return;
  let i = 0, gained = false, lost = false;
  for (const [k, label, money, inverse] of FLOAT_KEYS){
    const d = Math.round(num(after[k]) - num(before[k])); if (!d) continue;
    const good = inverse ? d < 0 : d > 0;
    if (money){ (d > 0 ? gained = true : lost = true); }
    const f = document.createElement("div");
    f.className = `floater ${good ? "good" : "bad"}`;
    f.textContent = money ? `${d>0?"+":"−"}${fmt(Math.abs(d), true)}` : `${d>0?"+":"−"}${Math.abs(d)} ${label}`;
    f.style.animationDelay = `${i*110}ms`; f.style.left = `${50 + (i%2 ? 1 : -1) * (6 + (i%3)*5)}%`;
    host.appendChild(f); setTimeout(()=>f.remove(), 1900 + i*110); i++;
    if (i >= 5) break;
  }
  if (gained) Sound.play("money"); else if (lost) Sound.play("loss");
}

/* ---------- Balões de fala ---------- */
function bubble(text, who, side = "left", avatar = "💭"){
  return `<div class="bubble-row ${side}"><div class="bubble-av">${avatar}</div><div class="bubble"><div class="bubble-who">${esc(who)}</div>${esc(text)}</div></div>`;
}

/* ---------- Ficha de NPC (abordagens, relações, capangas) ---------- */
function npcCard(n, { revealed = false, known = false } = {}){
  const per = byId(DATA.personalities, n.personality), show = revealed || known;
  const gIcon = n.gender === "F" ? "👩" : "👨";
  return `<div class="npc-card">
    <div class="npc-head"><div class="npc-av">${n.age < 13 ? "🧒" : n.age >= 65 ? (n.gender==="F"?"👵":"👴") : gIcon}</div>
      <div><div class="t">${esc(n.first)} ${esc(n.last||"")}${n.nick?` <span class="muted">"${esc(n.nick)}"</span>`:""}</div>
      <div class="s">${n.age} anos · ${esc(n.job || (n.role && typeof relLabel === "function" ? relLabel(n) : n.role) || "—")}</div></div></div>
    <div class="npc-tags">
      ${chip(show && per ? `🧠 ${per.name}` : "🧠 Personalidade ?", show ? "" : "neutral")}
      ${chip(show ? `💵 ${DATA.wealthLevels[num(n.wealth,2)]}` : "💵 Finanças ?", "neutral")}
      ${n.looks !== undefined ? chip(`✨ Aparência ${Math.round(n.looks)}`, "neutral") : ""}
      ${n.skill !== undefined ? chip(`🎯 Habilidade ${Math.round(n.skill)}`, "neutral") : ""}
      ${n.loyalty !== undefined ? chip(`🤝 Lealdade ${Math.round(n.loyalty)}`, n.loyalty < 35 ? "bad" : "good") : ""}
    </div>
    ${show && per ? `<div class="oddsline">${esc(per.desc)}${per.scam ? ' · <b class="bad">⚠️ sinais de golpe</b>' : ""}</div>` : ""}
  </div>`;
}

<script>/* src/ui/render.js */
"use strict";
/* =====================================================================
   ui/render.js — HUD (atualizado NO LUGAR para animar barras e números),
   abas, rodapé e despacho da view ativa.
   ===================================================================== */
const TABS = [["life","🏠","Vida"],["career","💼","Carreira"],["assets","💰","Bens"],["rels","❤️","Relações"],["health","🩺","Saúde"],["acts","🎯","Ações"]];
const HUD_BARS = [["health","❤️ Saúde"],["happiness","😊 Felicidade"],["intelligence","🧠 Inteligência"],["looks","✨ Aparência"]];
let HUD_PREV = null;

function hudSkeleton(){
  $("#hud").innerHTML = `
    <div class="hudcard">
      <div class="idrow">
        <div class="avatar" data-k="avatar"></div>
        <div class="idtext"><h1 data-k="name"></h1><div class="sub" data-k="sub"></div></div>
        <div class="money"><span data-k="money"></span><small data-k="nw"></small></div>
        ${fsButton()}<button class="iconbtn" onclick="UI.menu()" aria-label="Menu">☰</button>
      </div>
      <div class="bars">${HUD_BARS.map(([k,l])=>`<div class="bar" data-bar="${k}"><div class="lbl"><span>${l}</span><b data-v></b></div><div class="track"><div class="fill"></div><i class="cap"></i></div><span class="delta"></span></div>`).join("")}</div>
      <div class="substats" data-k="substats"></div>
    </div>
    <nav class="tabs" role="tablist">${TABS.map(([k,ic,l])=>`<button role="tab" data-tab="${k}" onclick="UI.tab('${k}')"><span class="ic">${ic}</span><span>${l}</span></button>`).join("")}</nav>`;
}
function renderHUD(){
  if (!$("#hud .hudcard")) { hudSkeleton(); HUD_PREV = null; }
  const p = P(), c = country(), q = k => $(`#hud [data-k="${k}"]`);
  const now = { ...p.stats, money:S.money, age:p.age };
  q("avatar").textContent = avatar();
  q("name").textContent = `${p.first} ${p.last}`;
  q("sub").textContent = `${p.age} ano${p.age===1?"":"s"} · ${lifeStage()} · ${p.city}, ${c.name}`;
  const mEl = q("money"), mBox = mEl.parentElement;
  animateNumber(mEl, HUD_PREV ? HUD_PREV.money : S.money, S.money, v => fmt(v, true));
  q("nw").textContent = `Patrimônio ${fmt(netWorth(), true)}`;
  if (HUD_PREV && S.money !== HUD_PREV.money){ mBox.classList.remove("up","down"); mBox.classList.add(S.money > HUD_PREV.money ? "up" : "down"); restartClass(mBox, "flash"); clearTimeout(mBox._t); mBox._t = setTimeout(()=>mBox.classList.remove("up","down"), 1200); }
  if (HUD_PREV && p.age !== HUD_PREV.age) restartClass(q("avatar"), "bday");
  for (const [k] of HUD_BARS){
    const el = $(`#hud [data-bar="${k}"]`), v = Math.round(clamp(p.stats[k]));
    el.querySelector("[data-v]").textContent = v + "%";
    const fill = el.querySelector(".fill"); fill.style.width = v + "%"; fill.style.background = barColor(v);
    const cap = el.querySelector(".cap");
    if (k === "health" && healthCap() < 99){ cap.style.display = ""; cap.style.left = healthCap() + "%"; cap.title = `Teto de saúde: ${Math.round(healthCap())}`; } else cap.style.display = "none";
    const d = HUD_PREV ? v - Math.round(HUD_PREV[k]) : 0;
    if (d){ const de = el.querySelector(".delta"); de.textContent = (d>0?"+":"−") + Math.abs(d); de.className = "delta " + (d>0?"up":"down"); restartClass(de, "show"); el.classList.remove("up","down"); restartClass(el, d>0?"up":"down"); }
  }
  const subs = [];
  if (p.age >= 6) subs.push(chip(`😣 Estresse ${Math.round(p.stress)}`, p.stress >= 66 ? "bad" : p.stress >= 40 ? "warn" : "good"));
  if (p.age >= 18) subs.push(chip(`💼 Reputação ${Math.round(p.reputation)}`, "neutral"), chip(`🏦 Crédito ${S.credit}`, S.credit >= 680 ? "good" : S.credit >= 560 ? "neutral" : "bad"));
  if (p.alive) subs.push(chip(`⚡ Energia ${ACT_LIMIT - S.activitiesThisYear}/${ACT_LIMIT}`, "neutral"));
  if (p.fame >= 10) subs.push(chip(`⭐ Fama ${Math.round(p.fame)}`));
  q("substats").innerHTML = subs.join("");
  for (const b of document.querySelectorAll("#hud [data-tab]")){ const on = b.dataset.tab === TAB; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); }
  HUD_PREV = now;
}
function renderFooter(){
  const f = $("#agebar");
  if (!P().alive){ f.innerHTML = `<div class="inner"><button class="big" onclick="UI.newLifeDialog()">✨ Nova vida</button></div>`; return; }
  const pending = S.queue.length;
  f.innerHTML = `<div class="inner"><button class="big" onclick="UI.ageUp()">${pending ? "📩 Responder evento" : "＋ Envelhecer 1 ano"}<small>${pending ? `${pending} decisão(ões) pendente(s)` : `próximo: ${P().age+1} anos · ${year()+1}`}</small></button></div>`;
}
const VIEWS = () => ({ life:viewLife, career:viewCareer, assets:viewAssets, rels:viewRels, health:viewHealth, acts:viewActs });
function render(){
  if (!S) return;
  renderHUD(); renderFooter();
  const v = $("#view");
  v.innerHTML = !P().alive ? viewDeath() : (VIEWS()[TAB] || viewLife)();
  if (TAB_CHANGED && !REDUCED()) restartClass(v, "view-enter");
  TAB_CHANGED = false;
}
</script>
<script>/* src/ui/views/life.js */
"use strict";
/* ui/views/life.js — aba Vida: situação atual, resumo do ano,
   consequências (passado → presente), fluxo de caixa e linha do tempo
   com busca e filtros por categoria. */
const LOG_FILTERS = [["all","Tudo"],["milestone","Marcos"],["good","Positivos"],["bad","Negativos"],["work","Trabalho"],["money","Dinheiro"],["love","Amor"],["health","Saúde"],["school","Estudos"],["crime","Crime"]];

function occupation(){
  const p = P();
  if (inPrison()) return `⛓️ Preso(a) — ${S.prison.life ? "prisão perpétua" : S.prison.years + " ano(s) restantes"} (${esc(S.prison.crime)})`;
  if (S.wanted) return `🚨 Foragido(a) da Justiça${S.wanted.fakeId ? " · identidade falsa" : ""}`;
  if (S.job) return `💼 ${career().levels[S.job.level].t}`;
  if (S.edu.school){ const m = byId(DATA.majors,S.edu.major) || byId(DATA.techCourses,S.edu.major); return `🎒 ${schoolName()}${m && !["fund","medio","supl"].includes(S.edu.school) ? " — " + esc(m.name) : ""}`; }
  if (S.retired) return "🏖️ Aposentado(a)";
  if (S.partTime) return `🧃 ${byId(DATA.partTime,S.partTime).name}`;
  if (S.gig) return `${gigDef(S.gig.id).emoji} ${gigDef(S.gig.id).name} (autônomo)`;
  return p.age < 6 ? "🧸 Curtindo a infância" : "🔎 Sem ocupação";
}
function viewLife(){
  const p = P(), home = homeInfo(), pt = partner();
  const alerts = [];
  if (p.stress >= 75) alerts.push(`😣 Estresse crítico (${Math.round(p.stress)}): saúde, relações e trabalho estão sofrendo. Veja as causas na aba Saúde.`);
  if (S.illnesses.some(i=>i.diagnosed && !i.treated && byId(DATA.illnesses,i.id).sev >= 8)) alerts.push("🏥 Há uma doença grave diagnosticada sem tratamento.");
  if (S.loans.some(l=>l.name==="Cheque especial")) alerts.push("🏦 Você está no cheque especial (38% a.a.): isso derruba seu crédito.");
  for (const l of S.loans.filter(l=>l.missed)) alerts.push(`⚠️ "${esc(l.name)}" está ${l.missed} ano(s) em atraso — ${l.propertyUid ? "o imóvel vai a leilão no 2º ano" : l.vehicleUid ? "o veículo será apreendido no 2º ano" : "penhora judicial no 3º ano"}.`);
  if (phaseName() === "recessão" || phaseName() === "crise") alerts.push(`${phase().emoji} Economia em ${phaseName()}: demissões ×${phase().layoff} e crédito mais difícil.`);
  if (S.org && S.org.heat >= 60) alerts.push(`🚨 Calor policial alto em ${esc(S.org.name)} (${Math.round(S.org.heat)}): batida iminente.`);
  for (const a of DATA.addictions) if (S.addictions[a.id] >= 60) alerts.push(`${a.emoji} ${a.name} em nível grave (${Math.round(S.addictions[a.id])}).`);

  let h = `<div class="card hero"><h2>${occupation()} <span class="tag">${year()}</span></h2>
    <div class="s muted">🏠 ${esc(home.name)} · ${pt ? `${relLabel(pt)}: ${esc(pt.first)}` : "Solteiro(a)"} · ${DATA.eduLevels[S.edu.level]} · ${DATA.classes[p.cls].name}</div>
    <div class="chips" style="margin-top:10px">${p.traits.map(t=>{ const d = byId(DATA.traits,t); return `<span class="chip" title="${esc(d.desc)}">${d.name}</span>`; }).join("")}
    ${S.illnesses.filter(i=>i.diagnosed).map(i=>chip(`🤒 ${byId(DATA.illnesses,i.id).name}${i.treated?" · em tratamento":""}`, i.treated ? "warn" : "bad")).join("")}
    ${(S.pets||[]).map(x => chip(`${byId(DATA.petSpecies, x.sp)?.emoji || "🐾"} ${esc(x.name)}`, "neutral")).join("")}
    ${chip(`🏳️‍🌈 ${orientationName()}`, "neutral")}${look().glasses ? chip("👓 óculos", "neutral") : ""}</div></div>`;
  // balões: pensamento do personagem + comentário de alguém próximo (mudam a cada ano)
  const nc = npcComment();
  h += `<div class="bubbles">${bubble(currentThought(), "Você pensa…", "right", avatar())}${nc ? bubble(nc.text, nc.who, "left", "💬") : ""}</div>`;
  if (inPrison()){
    const sec = byId(DATA.prisonSecurity, S.prison.security) || DATA.prisonSecurity[1], why = escapeBlock();
    h += `<div class="card dark"><h2>⛓️ Presídio <span class="tag">${sec.emoji} ${esc(sec.name)}</span></h2>
      <div class="s">Pena ${S.prison.life ? "perpétua" : `${S.prison.years} ano(s) restantes`} · cumpridos ${S.prison.served} · fugas frustradas ${num(S.prison.escAttempts)} · dificuldade da fuga ${escapeDifficulty()}/8</div>
      <div class="choices" style="margin-top:10px"><button ${why ? "disabled" : ""} onclick="UI.do(()=>startEscape())">🏃 Tentar fugir (minigame)<small>${esc(why || "puzzle tático: guardas, câmeras e limite de turnos")}</small></button>
      <button ${S.activitiesThisYear >= ACT_LIMIT ? "disabled" : ""} onclick="UI.do(()=>{ if (!spendEnergy()) return R(false,'Sem energia.'); startFight('prison',{ provoked:true }); return R(true,'Encarei o mais folgado do pavilhão.'); })">🥊 Arrumar briga no pátio<small>respeito ou solitária · corta a remição do ano pela metade</small></button></div></div>`;
    const off = S.activitiesThisYear >= ACT_LIMIT ? "disabled" : "", cat = prisonCat(), lawDone = S.prison.courses?.law?.done;
    h += `<div class="card"><h2>🏛️ Penitenciária <span class="tag">⚡ ${ACT_LIMIT - S.activitiesThisYear}/${ACT_LIMIT}</span></h2>
      <div class="s">Crime: <b>${DATA.crimeCats[cat].name}</b> · remição acumulada ${Math.round(num(S.prison.remit)*365)} dias · intimidação ${Math.round(num(S.prison.intim))} · anos remidos na vida ${num(S.stats.remitted)}</div>
      ${S.prison.foughtAge === P().age ? `<div class="oddsline bad">Você brigou este ano: a remição está pela metade.</div>` : ""}
      <div class="grid2" style="margin-top:10px">
        <button class="action" ${off} onclick="UI.do(()=>prisonAct('yard'))"><b>🏋️ Pátio</b><span>força e intimidação: menos gente mexe com você</span></button>
        <button class="action" ${off} onclick="UI.do(()=>prisonAct('work'))"><b>🧺 Trabalhar</b><span>pecúlio + remição${cat === "property" ? " (×1,4 no seu caso)" : ""}</span></button>
        <button class="action" onclick="UI.prisonCourses()"><b>📚 Biblioteca e cursos</b><span>remição conforme o seu crime</span></button>
        <button class="action" ${off} onclick="UI.do(()=>prisonAct('visit'))"><b>🫂 Dia de visita</b><span>família, felicidade</span></button>
        <button class="action" ${off || !lawDone || S.prison.appealed ? "disabled" : ""} onclick="UI.do(appealSentence)"><b>⚖️ Recorrer da sentença</b><span>${lawDone ? (S.prison.appealed ? "recurso já julgado" : `chance ~${Math.round(DATA.appealOdds[cat]*100)}% (base)`) : "exige Direito Penal Básico"}</span></button>
      </div></div>`;
  }
  if (S.wanted) h += `<div class="card alert"><h2>🚨 Foragido(a)</h2><div class="s">Há ${S.wanted.years} ano(s) · pena pendente ${S.wanted.remaining} ano(s) · chance de recaptura/ano <b>${Math.round(recaptureChance()*100)}%</b>${S.wanted.fakeId ? " · usando identidade falsa" : ""}</div>
      <div class="choices" style="margin-top:10px">${S.wanted.fakeId ? "" : `<button onclick="UI.do(buyFakeId)">🪪 Comprar identidade falsa (${fmt(priceOf(9000))})</button>`}</div></div>`;
  if (alerts.length) h += `<div class="card alert"><h2>⚠️ Atenção</h2>${alerts.map(a=>`<div class="row"><div class="grow">${a}</div></div>`).join("")}</div>`;

  const deltas = yearDeltas();
  if (S.lastYear && S.lastYear.age === p.age && deltas.length){
    h += `<div class="card"><h2>📅 Seu ano aos ${p.age} <span class="tag ${S.lastYear.net>=0?"good":"bad"}">caixa ${fmt(S.lastYear.net, true)}</span></h2>
      <div class="chips">${deltas.map(d=>chip(`${d.label} ${signed(d.d, d.money)}`, d.good ? "good" : "bad")).join("")}</div></div>`;
  }
  const recent = S.consequences.slice(-5).reverse(), pend = pendingConsequences();
  if (recent.length || pend){
    h += `<div class="card"><h2>🔗 Consequências <span class="tag">${pend ? `${pend} efeito(s) ainda por vir` : ""}</span></h2>
      ${recent.map(c=>`<div class="row"><div class="grow"><div class="s">aos ${c.age} anos</div><div class="${c.kind==="bad"?"bad":c.kind==="good"?"good":""}">${esc(c.text)}</div></div></div>`).join("") || `<div class="empty">Suas escolhas ainda vão repercutir.</div>`}</div>`;
  }
  const Y = S.yearSummary;
  if (Y && Y.lines.length){
    h += `<div class="card"><h2>💵 Fluxo de caixa do último ano <span class="tag ${Y.income-Y.expenses>=0?"good":"bad"}">${fmt(Y.income-Y.expenses)}</span></h2>
      ${Y.lines.filter(([,v])=>v).map(([l,v])=>`<div class="row"><div class="grow s">${esc(l)}</div><div class="${v>=0?"good":"bad"}">${v?fmt(v):"—"}</div></div>`).join("")}</div>`;
  }
  h += `<div class="card log"><h2>🕰️ Linha do tempo <span class="tag">${S.log.length} registros</span></h2>
    <div class="logtools"><input type="search" placeholder="Buscar na vida… (ex.: promovido, Lucas, câncer)" value="${esc(LOGQUERY)}" oninput="UI.logSearch(this.value)" aria-label="Buscar na linha do tempo"></div>
    <div class="filters" style="margin-bottom:10px">${LOG_FILTERS.map(([k,l])=>`<button class="${LOGFILTER===k?"on":""}" onclick="UI.logFilter('${k}')">${l}</button>`).join("")}</div>
    <div id="logbody">${renderLog()}</div></div>`;
  return h;
}
function logMatches(e){
  if (LOGFILTER !== "all"){
    if (["milestone","good","bad"].includes(LOGFILTER)){ if (e.kind !== LOGFILTER) return false; }
    else if (!(e.tags || autoTag(e.text)).includes(LOGFILTER)) return false;
  }
  return !LOGQUERY || e.text.toLowerCase().includes(LOGQUERY.toLowerCase());
}
function highlight(text){
  const t = esc(text); if (!LOGQUERY) return t;
  const q = esc(LOGQUERY).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`);
}
function renderLog(){
  const items = S.log.filter(logMatches);
  const byAge = new Map();
  for (const e of items){ if (!byAge.has(e.age)) byAge.set(e.age, []); byAge.get(e.age).push(e); }
  const ages = [...byAge.keys()].sort((a,b)=>b-a);
  const shown = LOGALL || LOGQUERY ? ages : ages.slice(0, 25);
  if (!shown.length) return `<div class="empty">${LOGQUERY ? "Nenhum registro encontrado." : "Nada por aqui ainda."}</div>`;
  const cur = P().age;
  return shown.map(a => `<div class="yr">${a} anos · ${P().birthYear + a}</div>` + byAge.get(a).map((e,i)=>`<div class="ev ${e.kind}${a===cur?" new":""}"${a===cur?` style="animation-delay:${i*45}ms"`:""}>${highlight(e.text)}</div>`).join("")).join("")
    + (ages.length > shown.length ? `<button class="btn" style="margin-top:12px" onclick="UI.logAll()">Mostrar todos os ${ages.length} anos</button>` : "");
}

<script>/* src/ui/views/career.js */

/* ui/views/career.js */

function viewCareer(){

  if (!E.school && a >= 16 && !inPrison()){
    const btns = [];
    if (E.level < 2) btns.push(`<button class="btn" onclick="UI.do(returnToSchool)">Supletivo (EJA)</button>`);
    if (E.level >= 2) btns.push(`<button class="btn primary" onclick="UI.uniDialog()">Prestar vestibular</button>`, `<button class="btn" onclick="UI.techDialog()">Curso técnico</button>`);
    if (E.level >= 4 && E.level < 5) btns.push(`<button class="btn" onclick="UI.do(()=>startGrad(5))">Mestrado</button>`);
    if (E.level >= 5 && E.level < 6) btns.push(`<button class="btn" onclick="UI.do(()=>startGrad(6))">Doutorado</button>`);
    if (btns.length) h += `<div class="chips" style="margin-top:8px">${btns.join("")}</div>`;
  }
  if (E.debt) h += `<div class="row"><div class="grow s">Financiamento estudantil: <b class="bad">${fmt(E.debt)}</b></div><button class="btn" onclick="UI.do(payStudentDebt)">Pagar</button></div>`;
  h += `</div>`;

  // Emprego atual
  h += `<div class="card"><h2>💼 Trabalho</h2>`;
  if (S.job){
    const c = career(), J = S.job;
    h += `<div class="row"><div class="grow"><div class="t">${c.levels[J.level].t}</div><div class="s">${c.sector} · ${fmt(J.salary)}/ano · ${J.years} ano(s) na carreira · nível ${J.level+1}/${c.levels.length}</div></div>${mini(J.perf)}</div>
      ${c.elected ? `<div class="oddsline">Mandato: ${4 - (J.levelYears % 4)} ano(s) até a próxima eleição · reeleição ${explainOdds(oddsElection(J.level))}</div>` : J.level < c.levels.length-1 ? `<div class="oddsline">Promoção este ano: ${promotionBlocker() ? `<b class="warn">bloqueada — ${esc(promotionBlocker())}</b>` : J.perf > 62 ? explainOdds(oddsPromotion()) : "<b>exige desempenho > 62</b>"}</div>` : ""}
      <div class="row"><span class="s">Esforço:</span>${["Mínimo","Normal","Hora extra"].map((l,i)=>`<button class="btn ${J.effort===i?"primary":""}" onclick="UI.do(()=>setEffort(${i}))">${l}</button>`).join("")}</div>
      <div class="row"><button class="btn" onclick="UI.do(askRaise)">Pedir aumento</button><button class="btn danger" onclick="UI.confirm('Pedir demissão?', ()=>UI.do(quitJob))">Pedir demissão</button>${a>=55?`<button class="btn" onclick="UI.do(retire)">Aposentar</button>`:""}</div>`;
  } else if (S.partTime) h += `<div class="row"><div class="grow"><div class="t">${byId(DATA.partTime,S.partTime).name}</div><div class="s">Meio período · ${fmt(wageOf(byId(DATA.partTime,S.partTime).s))}/ano</div></div><button class="btn danger" onclick="UI.do(quitJob)">Sair</button></div>`;
  else if (S.retired) h += `<div class="empty">Aposentado(a) · pensão de ${fmt(S.pension)}/ano</div>`;
  else h += `<div class="empty">Desempregado(a).</div>`;
  h += `</div>`;

  if (a >= 14 && !S.job && !inPrison()){
    h += `<div class="card"><h2>🧃 Meio período</h2>${DATA.partTime.map(j=>`<div class="row"><div class="grow"><div class="t">${j.name}</div><div class="s">${fmt(wageOf(j.s))}/ano · ${j.minAge}+ anos</div></div><button class="btn" ${a<j.minAge||S.partTime===j.id?"disabled":""} onclick="UI.do(()=>applyPartTime('${j.id}'))">Candidatar</button></div>`).join("")}</div>`;
  }
  h += athleteCard() + gigCard();
  if (a >= 18 && !inPrison()){
    // vagas: elegíveis primeiro, com chance explicada; indisponíveis recolhidas com o motivo
    const elig = DATA.careers.filter(c => !jobEligibility(c)), not = DATA.careers.filter(c => jobEligibility(c));
    const jobRow = c => { const why = jobEligibility(c), o = why ? null : oddsHire(c);
      return `<div class="row"><div class="grow"><div class="t">${c.levels[0].t} <span class="muted s">· ${c.sector} · ${c.tier}${c.stable?" · estável":""}${c.volatile?" · renda variável":""}</span></div><div class="s">${fmt(salaryFor(c,0))}/ano · topo: ${c.levels[c.levels.length-1].t}${why?` · <span class="bad">${why}</span>`:""}</div>${o?`<div class="oddsline">Chance: ${explainOdds(o)}</div>`:""}</div>
        <button class="btn ${o && o.p >= 0.5 ? "primary" : ""}" ${why?"disabled":""} onclick="UI.interview('${c.id}')">${c.elected ? `Candidatar-se (${fmt(campaignCost(0))})` : c.exam ? "Prestar concurso" : "Entrevista"}</button></div>`; };
    h += `<div class="card"><h2>📋 Vagas disponíveis <span class="tag">${elig.length} de ${DATA.careers.length}</span></h2>${elig.length ? elig.sort((x,y)=>oddsHire(y).p - oddsHire(x).p).map(jobRow).join("") : `<div class="empty">Nenhuma vaga compatível com seu perfil agora.</div>`}
      <details style="margin-top:10px"><summary class="s" style="cursor:pointer">Ver ${not.length} vagas indisponíveis e o que falta</summary>${not.map(jobRow).join("")}</details></div>`;
    h += `<div class="card"><h2>🏪 Empreendedorismo</h2>` + (S.businesses.length ? S.businesses.map(b=>`<div class="row"><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">Faturamento ${fmt(b.revenue)} · lucro ${fmt(b.lastProfit)} · valor ${fmt(b.value)}</div></div><button class="btn" onclick="UI.confirm('Vender ${esc(b.name)}?', ()=>UI.do(()=>sellBusiness('${b.uid}')))">Vender</button></div>`).join("") : "")
      + DATA.businesses.map(d=>`<div class="row"><div class="grow"><div class="t">${d.name}</div><div class="s">Investimento ${fmt(priceOf(d.cost))}${d.needs?` · requer ${byId(DATA.majors,d.needs).name}`:""} · risco ${d.vol>0.5?"alto":d.vol>0.25?"médio":"baixo"}</div></div><button class="btn" onclick="UI.do(()=>openBusiness('${d.id}'))">Abrir</button></div>`).join("") + `</div>`;
  }
  if (S.jobHistory.length) h += `<div class="card"><h2>📜 Histórico profissional</h2>${S.jobHistory.slice().reverse().map(j=>`<div class="row"><div class="grow"><div class="t">${esc(j.title)}</div><div class="s">${esc(j.career)} · dos ${j.from} aos ${j.to} anos · ${esc(j.reason)}</div></div></div>`).join("")}</div>`;
  return h;
}
</script>
<script>/* src/ui/views/assets.js */
"use strict";
/* =====================================================================
   ui/views/assets.js — aba Bens: economia global, finanças, moradia,
   imóveis POR PAÍS (inquilinos, estado, reforma, venda remota),
   mercado imobiliário de qualquer país, garagem, investimentos, dívidas,
   dinheiro sujo e emigração.
   ===================================================================== */
const FLAGS = { BR:"🇧🇷", PT:"🇵🇹", US:"🇺🇸", JP:"🇯🇵", DE:"🇩🇪", MX:"🇲🇽", NG:"🇳🇬", IN:"🇮🇳" };
const flag = cid => `<span class="flag">${FLAGS[cid] || "🌐"}</span>`;
let MARKET_COUNTRY = null;

function propertyRow(p){
  const d = byId(DATA.properties,p.id), m = S.loans.find(l=>l.propertyUid===p.uid), abroad = isAbroad(p), cond = Math.round(num(p.condition,100));
  const status = p.residence ? chip("🏡 Moradia","good") : p.rented ? (p.tenant ? chip(`🔑 ${esc(p.tenant.name)} · confiab. ${p.tenant.reliability}`,"neutral") : chip("📢 Anunciado, vago","warn")) : chip("Vazio","neutral");
  const estRent = Math.round(p.value * d.rentYield * 0.85 * (abroad ? 0.9 : 1));
  return `<div class="row"><div class="grow"><div class="t">${flag(p.country)}${d.name}</div>
      <div class="s">${d.kind} · ${fmtAsset(p.value, p.country)} (pago ${fmtIn(p.bought, p.country)})${m?` · deve ${fmtIn(m.principal, p.country)}${m.missed?` <b class="bad">· ${m.missed} ano(s) em atraso!</b>`:""}`:""}</div>
      <div class="chips" style="margin-top:4px">${status}${chip(`🔧 Estado ${cond}%`, cond < 50 ? "bad" : cond < 75 ? "warn" : "good")}${p.rented ? chip(`≈ ${fmtIn(estRent, p.country)}/ano líquido`, "neutral") : ""}</div></div>
    <div class="chips">
      ${!p.residence && !abroad && !d.commercial ? `<button class="btn sm" onclick="UI.do(()=>moveInto('${p.uid}'))">Morar</button>` : ""}
      ${!p.residence ? `<button class="btn sm" onclick="UI.do(()=>toggleRentOut('${p.uid}'))">${p.rented?"Tirar do aluguel":"Alugar"}</button>` : ""}
      ${cond < 95 ? `<button class="btn sm" onclick="UI.do(()=>renovate('${p.uid}'))">Reformar (${fmt(fxConv(renovateCost(p), p.country)*(abroad?1.15:1), true)})</button>` : ""}
      <button class="btn sm danger" onclick="UI.confirm('Vender ${esc(d.name)}? Corretagem 6% + 15% sobre o lucro.', ()=>UI.do(()=>sellProperty('${p.uid}')))">Vender</button></div></div>`;
}
function viewAssets(){
  const a = P().age, home = homeInfo(), ph = phase(), W = S.world;
  let h = `<div class="card hero"><h2>🌎 Economia <span class="phase ${phaseName()}">${ph.emoji} ${phaseName()}</span></h2>
    <div class="kpis">
      <div class="kpi"><div class="k">Inflação (ano)</div><div class="v ${W.inflation > 0.06 ? "bad" : ""}">${(W.inflation*100).toFixed(1)}%</div></div>
      <div class="kpi"><div class="k">Custo de vida acumulado</div><div class="v">×${S.priceIndex.toFixed(2)}</div></div>
      <div class="kpi"><div class="k">Salários acumulados</div><div class="v">×${wageIdx().toFixed(2)}</div></div>
      <div class="kpi"><div class="k">Poder de compra</div><div class="v ${wageIdx()/S.priceIndex < 0.9 ? "bad" : ""}">${Math.round(wageIdx()/S.priceIndex*100)}%</div></div>
    </div>
    <div class="oddsline" style="margin-top:8px">Fase atual: demissões ×${ph.layoff}, contratações ${ph.hire>=0?"+":""}${Math.round(ph.hire*100)}%, imóveis ${ph.prop>=0?"+":""}${Math.round(ph.prop*100)}%/ano. Salários repõem só parte da inflação.</div></div>`;
  h += `<div class="card"><h2>💰 Finanças</h2>
    <div class="kpis">
      <div class="kpi"><div class="k">Conta corrente</div><div class="v">${fmt(S.money)}</div></div>
      <div class="kpi"><div class="k">Investimentos</div><div class="v">${fmt(investTotal())}</div></div>
      <div class="kpi"><div class="k">Imóveis</div><div class="v">${fmt(propertiesTotal(), true)}</div></div>
      <div class="kpi"><div class="k">Veículos · Negócios</div><div class="v">${fmt(vehiclesTotal(), true)} · ${fmt(businessesTotal(), true)}</div></div>
      <div class="kpi"><div class="k">Dívidas</div><div class="v bad">${fmt(debtTotal(), true)}</div></div>
      <div class="kpi"><div class="k">Patrimônio líquido</div><div class="v">${fmt(netWorth(), true)}</div></div>
    </div>
    ${a>=18?`<div class="row" style="margin-top:6px"><div class="grow"><div class="t">🏦 Score de crédito: ${S.credit} · ${creditLabel()}</div><div class="oddsline">Pessoal ${(oddsLoanRate(RATES.personal)*100).toFixed(1)}% · imóvel ${(oddsLoanRate(RATES.mortgage)*100).toFixed(1)}% · veículo ${(oddsLoanRate(RATES.vehicle)*100).toFixed(1)}% a.a. Atrasos → leilão/apreensão em 2 anos, penhora em 3.</div></div>${mini((S.credit-300)/5.5)}</div>
      <div class="row"><span class="s">Estilo de vida:</span>${LIFESTYLES.map((l,i)=>`<button class="btn sm ${P().lifestyle===i?"primary":""}" onclick="UI.do(()=>setLifestyle(${i}))">${l.name}</button>`).join("")}</div>`:""}</div>`;
  if (S.dirty > 0 || S.org){
    const cap = Math.max(0, frontCapacity() - num(S.flags.launderedThisYear));
    h += `<div class="card dark"><h2>🧺 Dinheiro sujo <span class="tag">${fmt(S.dirty)}</span></h2>
      <div class="oddsline">Não paga contas nem compra bens. Lave pelos negócios de fachada (taxa 20%). Capacidade restante este ano: <b>${fmt(cap)}</b>.</div>
      <div class="row"><button class="btn" ${!S.dirty||!cap?"disabled":""} onclick="UI.amountDialog('launder')">Lavar dinheiro</button><span class="s">Fachadas: ${S.businesses.filter(b=>byId(DATA.businesses,b.id).front).map(b=>esc(b.name)).join(", ") || "nenhuma (abra um lava-jato, academia, casa noturna…)"}</span></div></div>`;
  }
  if (a < 18) return h + `<div class="card"><div class="empty">Imóveis, veículos, investimentos e empréstimos ficam disponíveis aos 18 anos.</div></div>`;

  // moradia
  h += `<div class="card"><h2>🏠 Moradia <span class="tag">${esc(home.name)}</span></h2>`;
  if (S.rental) h += `<div class="row"><div class="grow"><div class="t">${byId(DATA.rentals,S.rental).name}</div><div class="s">Aluguel ${fmt(priceOf(byId(DATA.rentals,S.rental).rent))}/ano</div></div><button class="btn sm" onclick="UI.do(leaveRental)">Sair</button></div>`;
  h += `<details><summary class="s" style="cursor:pointer;margin-top:6px">Ver ${DATA.rentals.length} opções de aluguel em ${esc(P().city)} (caução: 3 meses)</summary>${DATA.rentals.map(r=>`<div class="row"><div class="grow"><div class="t">${r.name}</div><div class="s">${fmt(priceOf(r.rent))}/ano · conforto ${r.comfort}/10</div></div><button class="btn sm" ${S.rental===r.id?"disabled":""} onclick="UI.do(()=>rentHome('${r.id}'))">Alugar</button></div>`).join("")}</details></div>`;

  // imóveis por país
  const byCountry = {}; for (const p of S.properties) (byCountry[p.country] = byCountry[p.country] || []).push(p);
  h += `<div class="card"><h2>🏘️ Meus imóveis <span class="tag">${S.properties.length} · ${Object.keys(byCountry).length} país(es)</span></h2>`;
  h += S.properties.length ? Object.entries(byCountry).map(([cid, list]) => `${label(`${flag(cid)} ${country(cid).name}${cid!==P().country?" · gestão remota (−10% aluguel, reformas +15%)":""}`)}${list.map(propertyRow).join("")}`).join("") : `<div class="empty">Você não possui imóveis.</div>`;
  const mc = MARKET_COUNTRY || P().country;
  h += `${label("Mercado imobiliário")}<div class="chips" style="margin:6px 0">${DATA.countries.map(c=>`<button class="btn sm ${c.id===mc?"primary":""}" onclick="UI.market('${c.id}')">${flag(c.id)}${c.name}</button>`).join("")}</div>
    <div class="oddsline">${mc!==P().country?"Compra remota: só à vista, taxas de 8% (ITBI + câmbio). Rende aluguel convertido para sua moeda.":"ITBI/cartório 5%. Financiamento: 30% de entrada, parcela até 35% da renda."}</div>
    <details ${MARKET_COUNTRY?"open":""}><summary class="s" style="cursor:pointer;margin-top:6px">Ver ${DATA.properties.length} imóveis à venda em ${country(mc).name}</summary>
    ${DATA.properties.map(d=>{ const pr = priceIn(d.price, mc); return `<div class="row"><div class="grow"><div class="t">${d.name}</div><div class="s">${d.kind} · ${fmtAsset(pr, mc)} · aluguel bruto ~${(d.rentYield*100).toFixed(1)}%/ano · custos ${(d.upkeep*100).toFixed(1)}%/ano${d.comfort?` · conforto ${d.comfort}`:" · comercial"}</div></div><button class="btn sm" onclick="UI.buyDialog('prop','${d.id}','${mc}')">Comprar</button></div>`; }).join("")}</details></div>`;

  // garagem
  h += `<div class="card"><h2>🚗 Garagem ${S.flags.license?"":'<span class="tag bad">sem habilitação</span>'}</h2>`;
  h += S.vehicles.length ? S.vehicles.map(v=>{ const d = byId(DATA.vehicles,v.id), L = S.loans.find(l=>l.vehicleUid===v.uid); return `<div class="row"><div class="grow"><div class="t">${flag(v.country)}${d.name}</div><div class="s">${d.kind} · ${v.age} ano(s) · vale ${fmtAsset(v.value, v.country)}${L?` · financiado${L.missed?` <b class="bad">(${L.missed} atraso)</b>`:""}`:""}${isAbroad(v)?" · parado no exterior":""}</div></div>
    ${isAbroad(v)?`<button class="btn sm" onclick="UI.do(()=>shipVehicle('${v.uid}'))">Importar</button>`:""}<button class="btn sm" onclick="UI.do(()=>sellVehicle('${v.uid}'))">Vender</button></div>`; }).join("") : `<div class="empty">Garagem vazia.</div>`;
  const kinds = [...new Set(DATA.vehicles.map(d=>d.kind))];
  h += `<details><summary class="s" style="cursor:pointer;margin-top:6px">Concessionária: ${DATA.vehicles.length} modelos (${kinds.join(", ")})</summary>${kinds.map(k=>`${label(k)}${DATA.vehicles.filter(d=>d.kind===k).map(d=>`<div class="row"><div class="grow"><div class="t">${d.name}${d.armored?" 🛡️":""}</div><div class="s">${fmt(priceOf(d.price))} · seguro+IPVA ~${fmt(priceOf(d.price)*(d.ins+d.tax), true)}/ano · combustível ~${fmt(priceOf(d.fuel), true)}/ano · roubo ${d.theft>=1.5?"alto":d.theft>=0.8?"médio":"baixo"} · estilo ${d.style}/10</div></div><button class="btn sm" onclick="UI.buyDialog('car','${d.id}')">Comprar</button></div>`).join("")}`).join("")}</details></div>`;

  // investimentos
  h += `<div class="card"><h2>📈 Investimentos</h2>` + DATA.investments.map(d=>{ const amt = num(S.investments[d.id]); const r = S.lastReturns?.[d.id];
    return `<div class="row"><div class="grow"><div class="t">${d.name}</div><div class="s">Saldo ${fmt(amt)}${r!==undefined?` · último ano <span class="${r>=0?"good":"bad"}">${(r*100).toFixed(1)}%</span>`:""} · risco ${d.sigma>0.5?"extremo":d.sigma>0.2?"alto":d.sigma>0.05?"médio":"baixo"}${d.cycle<0?" · protege em crises":""}</div></div><button class="btn sm" onclick="UI.amountDialog('invest','${d.id}')">Aplicar</button>${amt?`<button class="btn sm" onclick="UI.amountDialog('withdraw','${d.id}')">Resgatar</button>`:""}</div>`; }).join("") + `</div>`;
  // dívidas
  h += `<div class="card"><h2>🏦 Dívidas e crédito</h2>` + (S.loans.length ? S.loans.map(L=>`<div class="row"><div class="grow"><div class="t">${flag(L.country)}${esc(L.name)}${L.missed?` ${chip(`${L.missed} ano(s) em atraso`,"bad")}`:""}</div><div class="s">Saldo ${fmtAsset(L.principal, L.country)} · juros ${(L.rate*100).toFixed(1)}% a.a. · parcela ${fmtIn(L.payment, L.country)}/ano</div></div><button class="btn sm" onclick="UI.do(()=>payOffLoan('${L.uid}'))">Quitar</button></div>`).join("") : `<div class="empty">Nenhuma dívida ativa.</div>`)
    + `<div class="row"><button class="btn" onclick="UI.amountDialog('loan')">Pedir empréstimo pessoal (${(oddsLoanRate(RATES.personal)*100).toFixed(1)}% a.a.)</button></div></div>`;
  // emigração
  h += `<div class="card"><h2>✈️ Emigrar</h2><div class="oddsline" style="margin-bottom:8px">Seus imóveis, veículos e negócios FICAM onde estão e continuam rendendo (gestão remota). Caixa e investimentos são convertidos pelo câmbio. EUA, Japão e Alemanha exigem visto.</div>
    <div class="chips">${DATA.countries.filter(c=>c.id!==P().country).map(c=>{ const v = visaCheck(c); return `<button class="btn sm" ${v?`title="${esc(v)}"`:""} onclick="UI.confirm('Mudar para ${c.name}? Custo ${fmt(emigrateCost(c))}. ${v?esc(v):"Visto OK."}', ()=>UI.do(()=>emigrate('${c.id}')))">${flag(c.id)}${c.name}${v?" 🛂":""}</button>`; }).join("")}</div></div>`;
  h += collectionCard();
  return h;
}
</script>
<script>/* src/ui/views/rels.js */
"use strict";
/* ui/views/rels.js */

/* ---------- Aba Relações ---------- */
function viewRels(){
  const groups = [
    ["👨‍👩‍👧 Família", r => ["mother","father","sibling"].includes(r.role) && r.alive && !r.unborn],
    ["❤️ Amor", r => ["partner","fiance","spouse"].includes(r.role) && r.alive],
    ["🧒 Filhos", r => r.role==="child" && r.alive],
    ["🤝 Amigos", r => r.role==="friend" && r.alive],
    ["💔 Ex", r => r.role==="ex" && r.alive],
    ["🕯️ In memoriam", r => !r.alive],
  ];
  let h = `<div class="card"><div class="chips">${P().age>=16?`<button class="btn primary" onclick="UI.dating()">💘 App de namoro</button>`:""}${P().age>=25?`<button class="btn" onclick="UI.do(adoptChild)">Adotar criança (${fmt(priceOf(3000))})</button>`:""}<span class="s" style="align-self:center">Energia: ${ACT_LIMIT - S.activitiesThisYear}/${ACT_LIMIT}</span></div></div>`;
  for (const [title, f] of groups){
    const list = S.rels.filter(f); if (!list.length) continue;
    h += `<div class="card"><h2>${title}</h2>` + list.map(r=>`<div class="row" style="cursor:pointer" onclick="UI.person('${r.uid}')"><div class="grow"><div class="t">${esc(r.first)} ${esc(r.last)}</div><div class="s">${relLabel(r)} · ${r.alive?`${r.age} anos${r.job?" · "+esc(r.job):""}`:`faleceu aos ${r.deathAge} (${r.deathYear})`}${r.role==="friend"&&r.rel>=60?" · 🤝 pode te ajudar":""}${r.role==="spouse"?` · 💑 ${REGIMES[regime()].name.toLowerCase()}`:""}</div></div>${r.alive?mini(r.rel):""}</div>`).join("") + `</div>`;
  }
  h += `<div class="card"><h2>🏳️‍🌈 Identidade</h2><div class="s">Orientação: <b>${orientationName()}</b>${discovering() ? ` — ${identity().steps} vivência(s) até agora. Ela se define pelas suas escolhas na adolescência.` : ""}</div></div>`;
  h += petsCard();
  return h;
}
</script>
<script>/* src/ui/views/health.js */
"use strict";
/* ui/views/health.js — aba Saúde: condição, fatores de risco e causas do
   estresse, check-up, diagnósticos com opções de tratamento (custo e
   chance de cura explicados), plano de saúde e vícios. */
function viewHealth(){
  const p = P(), a = p.age, cap = Math.round(healthCap()), plan = effectivePlan();
  const checked = S.health.lastCheckup === a;
  let h = `<div class="card hero"><h2>🩺 Condição física <span class="tag">${S.health.exercised ? "exercitou-se este ano" : a >= 18 ? `${S.health.sedentary} ano(s) sedentário` : ""}</span></h2>
    <div class="bars" style="margin-top:0">
      ${bar("❤️ Saúde atual", p.stats.health, null, cap)}
      ${bar("🧬 Teto de saúde (vitalidade − sequelas)", cap, "var(--accent)")}
      ${bar("😣 Estresse", p.stress, stressColor(p.stress))}
      ${bar("⏳ Vitalidade biológica", p.vitality, "var(--info)")}
    </div>
    <div class="oddsline" style="margin-top:10px">A saúde se recupera sozinha em direção ao teto, mais devagar com a idade (${Math.round(22*Math.max(0.25,1-a/120))}% da distância/ano). O teto cai com o envelhecimento e lesões graves — nada o restaura.</div>
    <div class="row" style="margin-top:6px"><button class="btn primary" ${checked?"disabled":""} onclick="UI.do(medicalCheckup)">${checked ? "✔ Check-up feito este ano" : `Fazer check-up (${fmt(checkupCost())})`}</button>
      <span class="s">Detecção com ${esc(plan.name.toLowerCase())}: ${Math.round(plan.detect*100)}% da base. Check-up diagnostica — não cura.</span></div></div>`;

  // diagnósticos
  const diag = S.illnesses.filter(i=>i.diagnosed);
  h += `<div class="card"><h2>🧾 Diagnósticos <span class="tag">${diag.length ? "" : "nenhum conhecido"}</span></h2>`;
  if (!diag.length) h += `<div class="empty">Nenhuma condição diagnosticada.${a >= 35 ? " Doenças silenciosas podem existir — check-ups anuais detectam cedo." : ""}</div>`;
  for (const il of diag){
    const d = byId(DATA.illnesses, il.id), st = DATA.stages[il.stage];
    h += `<div class="row"><div class="grow"><div class="t">${d.name} ${chip(`estágio ${st.name}`, il.stage >= 3 ? "bad" : il.stage === 2 ? "warn" : "neutral")} ${d.chronic ? chip("crônica","neutral") : ""}</div>
      <div class="s">${il.treated ? `Em tratamento: ${byId(DATA.treatments,il.tier).name} · ${fmt(treatmentCost(il))}/ano` : "Sem tratamento — tende a avançar"} · dano ~${Math.round(d.sev*st.dmg*(il.treated ? (d.chronic?0.25:0.45) : 1))}/ano</div></div>
      ${il.treated ? `<button class="btn sm danger" onclick="UI.do(()=>stopTreatment('${il.id}'))">Interromper</button>` : ""}</div>`;
    h += `<div class="grid2" style="margin:2px 0 8px">${DATA.treatments.filter(t=>!t.minStage || il.stage >= t.minStage).map(t=>{
        const o = d.chronic ? null : oddsCure(il, t.id), on = il.treated && il.tier === t.id;
        return `<button class="action" ${on?"disabled":""} onclick="UI.do(()=>treatIllness('${il.id}','${t.id}'))"><b>${on?"✔ ":""}${t.name}</b><span>${fmt(treatmentCost(il, t.id))}/ano · ${d.chronic ? "controla o avanço" : `cura ~${Math.round(o.p*100)}%/ano`}${t.risk>0.05?" · risco de complicação":""}</span></button>`; }).join("")}</div>`;
  }
  h += `</div>`;

  // fatores de risco + estresse
  const risks = riskProfile(), sT = stressTarget();
  h += `<div class="card"><h2>📉 Fatores de risco</h2>${risks.length ? risks.map(r=>`<div class="row"><div class="grow"><div class="t">${esc(r.k)}</div><div class="s">${esc(r.txt)}</div></div>${mini(r.v*100, `var(--${r.level})`)}</div>`).join("") : `<div class="empty">Nenhum fator de risco relevante. Continue assim!</div>`}
    ${label(`Para onde seu estresse caminha: ${Math.round(sT.target)}`)}
    <div class="chips" style="margin-top:6px">${sT.parts.sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,8).map(([l,v])=>chip(`${esc(l)} ${v>0?"+":"−"}${Math.abs(Math.round(v))}`, v > 0 ? "bad" : "good")).join("") || `<span class="muted s">Sem pressões relevantes.</span>`}</div></div>`;

  // plano de saúde
  if (a >= 18){
    h += `<div class="card"><h2>📋 Plano de saúde <span class="tag">${S.health.employerPlan && S.health.plan==="none" ? "básico pago pela empresa" : ""}</span></h2>
      ${DATA.healthPlans.map(pl=>`<div class="row"><div class="grow"><div class="t">${pl.name}</div><div class="s">${pl.cost ? `${fmt(planPremium(pl.id))}/ano · cobre ${Math.round(pl.coverage*100)}% dos tratamentos particulares` : "Você paga tudo do bolso"} · detecção ${Math.round(pl.detect*100)}%</div></div>
      <button class="btn ${S.health.plan===pl.id?"primary":""}" ${S.health.plan===pl.id?"disabled":""} onclick="UI.do(()=>setHealthPlan('${pl.id}'))">${S.health.plan===pl.id?"Atual":"Escolher"}</button></div>`).join("")}
      <div class="oddsline">A mensalidade sobe com a idade e com doenças crônicas preexistentes.</div></div>`;
  }
  // vícios
  const adds = DATA.addictions.filter(d => S.addictions[d.id] > 0);
  if (adds.length || a >= 13){
    h += `<div class="card"><h2>🚭 Hábitos e vícios</h2>${adds.length ? adds.map(d=>`<div class="row"><div class="grow"><div class="t">${d.emoji} ${d.name}</div><div class="s">${d.desc} · ${S.addictions[d.id] > 40 ? "auto-reforçando a cada ano" : "sob controle relativo"}</div></div>${mini(S.addictions[d.id], stressColor(S.addictions[d.id]))}<button class="btn sm" onclick="UI.do(()=>quitAddiction('${d.id}'))">Tentar parar</button></div>`).join("")
      + `<div class="row"><button class="btn" onclick="UI.do(rehab)">🏥 Clínica de reabilitação</button><span class="s">Reduz todos os vícios fortemente; custa caro.</span></div>` : `<div class="empty">Nenhum vício. 🙌</div>`}</div>`;
  }
  return h;
}
</script>
<script>/* src/ui/views/acts.js */
"use strict";
/* =====================================================================
   ui/views/acts.js — aba Ações: LUGARES da cidade (cada um agrupa ações
   reais), atividades com rendimento decrescente, talentos, crimes por

const PLACES = [

  { id:"pets",     ic:"🐾", name:"Pet Shop & Abrigo",   ui:[["🏠 Abrigo de adoção","UI.close();UI.petShop('shelter')"],["🛍️ Pet shop","UI.close();UI.petShop('shop')"],["🐅 Mercado exótico (clandestino)","UI.close();UI.petShop('exotic')"]], minAge:6 },
  { id:"uni",      ic:"🎓", name:"Universidade",        acts:["course","read"], ui:[["Vestibular","UI.close();UI.uniDialog()"],["Curso técnico","UI.close();UI.techDialog()"]], minAge:16 },
  { id:"library",  ic:"📚", name:"Biblioteca",          acts:["read","meditate"] },

  { id:"realty",   ic:"🏘️", name:"Imobiliária",         ui:[["Comprar/alugar imóveis (qualquer país)","UI.close();UI.tab('assets')"]], minAge:18 },
  { id:"court",    ic:"⚖️", name:"Delegacia / Tribunal",ui:[["Pedir reabilitação criminal (limpar ficha)","UI.close();UI.do(expungeRecord)"]], minAge:18 },
  { id:"night",    ic:"🎰", name:"Cassino / Clube noturno", acts:["casino","party","lottery"], minAge:18 },
  { id:"airport",  ic:"✈️", name:"Aeroporto",           acts:["vacation"], ui:[["Emigrar para outro país","UI.close();UI.tab('assets')"]], minAge:18 },
  { id:"mall",     ic:"🛍️", name:"Shopping",            acts:["shopping","social","hobby"], minAge:10 },
  { id:"ngo",      ic:"🙌", name:"ONG / Comunidade",    acts:["volunteer","networking"] },
  { id:"auction",  ic:"🔨", name:"Leilões e antiquários", ui:[["🏺 Comprar peças de museu e relíquias","UI.close();UI.collectShop()"],["Ver minha coleção","UI.close();UI.tab('assets')"]], minAge:18 },
  { id:"guns",     ic:"🔫", name:"Loja de armas",       ui:[["Armas autorizadas e porte","UI.close();UI.armory(false)"]], minAge:18 },
  { id:"stadium",  ic:"🏟️", name:"Estádio / Clube",     ui:[["Carreiras no esporte","UI.close();UI.tab('career')"],["🥋 Academia de lutas","UI.close();UI.martial()"]], minAge:8 },
];
function viewActs(){
  const a = P().age, energy = ACT_LIMIT - S.activitiesThisYear;
  let h = `<div class="card hero"><h2>🗺️ ${esc(P().city)} <span class="tag">⚡ ${energy}/${ACT_LIMIT} de energia</span></h2>
    <div class="grid2">${PLACES.filter(p => a >= (p.minAge||0)).map(p=>`<button class="action" onclick="UI.place('${p.id}')"><b>${p.ic} ${p.name}</b><span>${[...(p.acts||[]).map(id=>byId(ACTIVITIES,id)?.name).filter(Boolean), ...(p.ui||[]).map(u=>u[0])].slice(0,3).join(" · ")}</span></button>`).join("")}</div></div>`;
  const list = ACTIVITIES.filter(x => a >= x.minAge && (!x.cond || x.cond()));
  h += `<div class="card"><h2>🎯 Todas as atividades</h2><div class="oddsline" style="margin:-4px 0 10px">Repetir a mesma atividade no ano rende cada vez menos. Diversifique.</div>
    <div class="grid2">${list.map(x=>actButton(x, energy)).join("")}</div></div>`;
  h += `<div class="card"><h2>🎨 Talentos</h2>${bar("🎵 Música", P().talents.music, "var(--accent)")}${bar("🎭 Atuação", P().talents.acting, "var(--accent)")}${bar("🏅 Esporte", P().talents.sport, "var(--accent)")}
    <div class="oddsline" style="margin-top:8px">Talentos abrem carreiras artísticas e esportivas. Fama ${Math.round(P().fame)}/100.</div></div>`;
  if (a >= 6) h += `<div class="card"><h2>🥋 Artes marciais <span class="tag">${bestArt() ? `${byId(DATA.martialArts,bestArt()).name}: ${rankName(bestArt())}` : "sem graduação"}</span></h2>${martialPanel()}</div>`;
  if (a >= 10) h += crimeCard(energy);
