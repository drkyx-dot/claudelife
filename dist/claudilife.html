<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ClaudiLife">
<meta name="format-detection" content="telephone=no">

<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
<!-- ClaudiLife — build de arquivo único (gerado por tools/build.py) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>/* src/styles/tokens.css */
/* =====================================================================
   tokens.css — design tokens (cor, tipo, espaço, movimento)
   Tema claro por padrão, escuro automático e alternável via data-theme.
   ===================================================================== */
:root{
  --bg:#f2f3f7; --bg-grad:radial-gradient(1200px 600px at 10% -10%, #e7e6ff 0%, transparent 60%);
  --surface:#ffffff; --surface2:#f6f7fb; --surface3:#eceef5; --border:#e2e5ee; --border-strong:#cfd4e2;
  --text:#161a25; --text2:#3b4254; --muted:#6a7287; --accent:#5b57e0; --accent-2:#8a5cf6; --accent-weak:#ecebfd; --on-accent:#fff;
  --good:#18a06c; --good-weak:#e3f6ee; --warn:#d08a00; --warn-weak:#fdf3dc; --bad:#d94848; --bad-weak:#fde8e8; --info:#2f7fd1;
  --shadow-sm:0 1px 2px rgba(18,22,40,.06);
  --shadow:0 1px 2px rgba(18,22,40,.05),0 6px 18px rgba(18,22,40,.06);
  --shadow-lg:0 18px 50px rgba(18,22,40,.22);
  --ring:0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  --radius-sm:10px; --radius:16px; --radius-lg:22px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
  --fs-xs:12px; --fs-sm:13.5px; --fs:15px; --fs-lg:17px; --fs-xl:22px;
  --gap:12px; --gutter:16px;
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:140ms; --t:220ms; --t-slow:420ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f15; --bg-grad:radial-gradient(1200px 600px at 10% -10%, #1d1b3d 0%, transparent 60%);
    --surface:#161922; --surface2:#1c202b; --surface3:#232836; --border:#272c3a; --border-strong:#353b4d;
    --text:#eceef4; --text2:#c5c9d6; --muted:#8f96a8; --accent:#8d89ff; --accent-2:#b18cff; --accent-weak:#24234a; --on-accent:#0d0f15;
    --good:#3ccb92; --good-weak:#143327; --warn:#f2b640; --warn-weak:#3a2e12; --bad:#ff6b6b; --bad-weak:#3d1a1d;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f15; --bg-grad:radial-gradient(1200px 600px at 10% -10%, #1d1b3d 0%, transparent 60%);
  --surface:#161922; --surface2:#1c202b; --surface3:#232836; --border:#272c3a; --border-strong:#353b4d;
  --text:#eceef4; --text2:#c5c9d6; --muted:#8f96a8; --accent:#8d89ff; --accent-2:#b18cff; --accent-weak:#24234a; --on-accent:#0d0f15;
  --good:#3ccb92; --good-weak:#143327; --warn:#f2b640; --warn-weak:#3a2e12; --bad:#ff6b6b; --bad-weak:#3d1a1d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
}
@media (prefers-reduced-motion: reduce){
  :root{ --t-fast:0ms; --t:0ms; --t-slow:0ms; }
  *,*::before,*::after{ animation-duration:1ms !important; animation-delay:0ms !important; animation-iteration-count:1 !important; transition-duration:1ms !important; transition-delay:0ms !important; scroll-behavior:auto !important; }
}
</style>
<style>/* src/styles/layout.css */
/* =====================================================================
   layout.css — casca do app
   Mobile: cabeçalho fixo + abas + botão de idade flutuante.
   Desktop (≥980px): coluna lateral fixa (identidade, atributos, abas,
   botão de idade) + conteúdo principal em coluna larga.
   ===================================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg-grad),var(--bg);background-attachment:fixed;color:var(--text);font:var(--fs)/1.5 var(--font);
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--radius-sm)}

#app{max-width:780px;margin:0 auto;padding:0 var(--gutter);min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;padding:12px 0 6px;
  background:linear-gradient(var(--bg) 82%, transparent)}
main{flex:1;padding:8px 0 120px;min-width:0}

/* abas: ícone + rótulo; rolagem horizontal só em telas muito estreitas */
nav.tabs{display:flex;gap:4px;margin-top:10px;padding:4px;background:var(--surface3);border-radius:14px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:none;
  padding:6px 8px;border-radius:11px;color:var(--muted);font-weight:650;font-size:12px;letter-spacing:.01em;
  transition:background var(--t) var(--ease),color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
nav.tabs button .ic{font-size:17px;line-height:1.1;filter:grayscale(.6);transition:filter var(--t)}
@media (hover:hover){nav.tabs button:hover{color:var(--text2)}}
nav.tabs button:active{transform:scale(.96)}
nav.tabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
nav.tabs button.on .ic{filter:none}

footer.age{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:26px var(--gutter) calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 40%);pointer-events:none}
footer.age .inner{max-width:748px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}

@media (min-width:980px){
  #app{max-width:1180px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
  header.top{position:sticky;top:0;height:100vh;padding:22px 0 110px;background:none;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
  header.top .hudcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow)}
  nav.tabs{flex-direction:column;background:transparent;padding:0;margin-top:14px;gap:2px;overflow:visible}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:14.5px;padding:10px 14px}
  nav.tabs button .ic{font-size:18px}
  main{padding:22px 0 60px}
  footer.age{left:max(var(--gutter), calc(50vw - 590px + var(--gutter)));right:auto;width:340px;background:none;padding:0 0 22px}
  footer.age .inner{max-width:none}
}
@media (max-width:400px){
  :root{--gutter:12px}
  nav.tabs button{padding:6px 5px;font-size:11px}
}
/* sidebar estreita: dinheiro vai para baixo do nome para não truncar */
@media (min-width:980px){
  header.top .idrow{flex-wrap:wrap}
  header.top .idtext{flex:1 1 150px}
  header.top .money{order:3;flex:1 1 100%;display:flex;justify-content:space-between;align-items:baseline;text-align:left;
    background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:18px}
  header.top .money small{display:inline}
}
</style>
<style>/* src/styles/components.css */
/* =====================================================================
   components.css — cartões, linhas, botões, barras, chips, modal, log
   ===================================================================== */
/* ---------- Identidade / HUD ---------- */
.idrow{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(135deg,var(--accent-weak),var(--surface2));box-shadow:inset 0 0 0 1px var(--border)}
.idtext{flex:1;min-width:0}
.idtext h1{font-size:var(--fs-lg);font-weight:750;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idtext .sub{color:var(--muted);font-size:var(--fs-xs)}
.money{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;font-size:16px;letter-spacing:-.01em;transition:color var(--t)}
.money small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.money.up{color:var(--good)} .money.down{color:var(--bad)}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;
  transition:border-color var(--t-fast),transform var(--t-fast)}
@media (hover:hover){.iconbtn:hover{border-color:var(--border-strong)}} .iconbtn:active{transform:scale(.94)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:12px}
.bar{font-size:var(--fs-xs);position:relative}
.bar .lbl{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:3px}
.bar .lbl b{color:var(--text2);font-weight:700;font-variant-numeric:tabular-nums}
.bar .track{height:8px;border-radius:8px;background:var(--surface3);overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:8px;transition:width var(--t-slow) var(--ease-out),background var(--t-slow)}
.bar .cap{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text2);opacity:.35;border-radius:2px;transition:left var(--t-slow) var(--ease-out)}
.bar .delta{position:absolute;right:0;top:-4px;font-weight:800;font-size:11px;pointer-events:none;opacity:0}
.bar .delta.up{color:var(--good)} .bar .delta.down{color:var(--bad)}
.substats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---------- Cartões ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:var(--gap);box-shadow:var(--shadow)}
.card.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--accent) 25%,var(--border))}
.card.alert{border-color:color-mix(in srgb,var(--bad) 40%,var(--border));background:linear-gradient(135deg,var(--bad-weak),var(--surface) 70%)}
.card h2{font-size:15px;font-weight:750;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:-.005em}
.card h2 .tag{font-size:var(--fs-xs);font-weight:550;color:var(--muted)}
.section-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:14px 0 2px}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 0;border-top:1px solid var(--border)}
.row:first-of-type,.section-label + .row{border-top:none}
.row .grow{flex:1 1 170px;min-width:0}
.row .t{font-weight:650}
.row .s{font-size:12.5px;color:var(--muted)}
.row.click{cursor:pointer;border-radius:10px;margin:0 -8px;padding:10px 8px;transition:background var(--t-fast)}
@media (hover:hover){.row.click:hover{background:var(--surface2)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--muted)} .kpi .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}

/* ---------- Botões ---------- */
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:8px 13px;font-size:var(--fs-sm);font-weight:650;white-space:nowrap;
  transition:border-color var(--t-fast),background var(--t-fast),transform var(--t-fast) var(--ease),box-shadow var(--t-fast)}
@media (hover:hover){.btn:hover{border-color:var(--accent);background:var(--surface)}}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.06)}}
.btn.danger{color:var(--bad)} @media (hover:hover){.btn.danger:hover{border-color:var(--bad)}}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.big{flex:1;border:none;border-radius:18px;padding:15px;font-size:17px;font-weight:800;letter-spacing:.01em;color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent);
  transition:transform var(--t-fast) var(--ease),filter var(--t-fast)}
@media (hover:hover){.big:hover{filter:brightness(1.07)}} .big:active{transform:scale(.98)}
.big small{display:block;font-size:11.5px;font-weight:600;opacity:.85}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.action{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px 12px;text-align:left;position:relative;
  transition:border-color var(--t-fast),transform var(--t-fast) var(--ease),box-shadow var(--t-fast)}
@media (hover:hover){.action:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}}
.action:active{transform:scale(.98)}
.action b{display:block;font-size:14px} .action span{font-size:12px;color:var(--muted)}
.action .odds{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800}

/* ---------- Chips, mini barras, odds ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:650;white-space:nowrap}
.chip.neutral{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.chip.good{background:var(--good-weak);color:var(--good)} .chip.bad{background:var(--bad-weak);color:var(--bad)} .chip.warn{background:var(--warn-weak);color:var(--warn)}
.minibar{width:74px;height:7px;background:var(--surface3);border-radius:5px;overflow:hidden;flex:none}
.minibar i{display:block;height:100%;border-radius:5px}
.oddsline{font-size:12px;color:var(--muted);margin-top:2px}
.oddsline b{color:var(--text2)}

/* ---------- Linha do tempo ---------- */
.logtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.logtools input{flex:1 1 180px;padding:8px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;font-size:var(--fs-sm)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-weight:600;transition:all var(--t-fast)}
.filters button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.log .yr{font-weight:800;margin-top:14px;font-size:12px;color:var(--accent);letter-spacing:.02em;position:sticky;top:0}
.log .yr:first-child{margin-top:0}
.log .ev{padding:4px 0 4px 12px;border-left:2px solid var(--border);font-size:14px;color:var(--text2)}
.log .ev.milestone{border-color:var(--accent);font-weight:650;color:var(--text)}
.log .ev.good{border-color:var(--good)} .log .ev.bad{border-color:var(--bad)}
.log mark{background:var(--warn-weak);color:inherit;border-radius:3px;padding:0 2px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* ---------- Modal, toast, formulário ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,10,18,.55);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:20px;box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.modal .emoji{font-size:40px;line-height:1;margin-bottom:6px}
.modal p{margin:6px 0 14px;color:var(--text2)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-weight:650;
  transition:border-color var(--t-fast),transform var(--t-fast) var(--ease),background var(--t-fast)}
@media (hover:hover){.choices button:hover{border-color:var(--accent);background:var(--surface);transform:translateX(2px)}}
.choices button:active{transform:scale(.99)}
.choices button small{display:block;font-weight:450;color:var(--muted);font-size:12px;margin-top:1px}
.choices button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent}
.result{font-size:15.5px;color:var(--text);background:var(--surface2);border-radius:12px;padding:12px 14px;margin:4px 0 14px}
.form label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.form input,.form select{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-12px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:12px;
  font-size:13.5px;font-weight:600;z-index:80;opacity:0;pointer-events:none;max-width:90vw;box-shadow:var(--shadow-lg);
  transition:opacity var(--t) var(--ease),transform var(--t) var(--ease-out)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.yearbadge{position:fixed;left:50%;top:38%;z-index:70;pointer-events:none;transform:translate(-50%,-50%);text-align:center;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px 22px;box-shadow:var(--shadow-lg);opacity:0}
.yearbadge b{display:block;font-size:26px;font-weight:850;letter-spacing:-.02em}
.yearbadge span{color:var(--muted);font-size:13px}

/* ---------- Certidão ---------- */
.cert{border:2px double var(--border-strong);border-radius:18px;padding:20px;text-align:center}
.cert h3{letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:6px 0}
.score{font-size:52px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;text-align:left;font-size:14px;margin-top:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:650}
.action:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.choices button:disabled{opacity:.5;cursor:not-allowed;transform:none}
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";transition:transform var(--t)} details[open] summary::before{content:"▾ "}
</style>
<style>/* src/styles/animations.css */
/* =====================================================================
   animations.css — microinterações com propósito
   Tudo é desligado por prefers-reduced-motion (ver tokens.css).
   ===================================================================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheetOut{to{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes floatDelta{0%{opacity:0;transform:translateY(4px)}15%{opacity:1}80%{opacity:1;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-14px)}}
@keyframes glowUp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
@keyframes glowDown{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes badge{0%{opacity:0;transform:translate(-50%,-40%) scale(.9)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(.98)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

      paisagem baixa de celular, desktop (≥980) e telas muito largas.
   Os efeitos de :hover dos outros arquivos ficam em @media (hover:hover):
   em telas de toque eles não existem nem ficam "presos".
   ===================================================================== */
:root{
  --sat:env(safe-area-inset-top, 0px); --sab:env(safe-area-inset-bottom, 0px);
  --sal:env(safe-area-inset-left, 0px); --sar:env(safe-area-inset-right, 0px);
  --app-h:100vh;            /* atualizado por JS (fallback de dvh) */
  --nav-h:62px;             /* altura da navegação inferior */
  --tap:44px;               /* alvo mínimo de toque (Apple HIG / Material) */
}
@supports (height:100dvh){ :root{ --app-h:100dvh; } }

/* ---------- 1. Raiz: sem rolagem horizontal, sem inflar fonte, sem zoom por duplo toque ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
@supports (overflow:clip){ html{overflow-x:clip} }
body{min-height:100vh;min-height:var(--app-h);overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
@supports (overflow:clip){ body{overflow-x:clip} }
#app{min-height:100vh;min-height:var(--app-h);padding-left:max(var(--gutter), var(--sal));padding-right:max(var(--gutter), var(--sar))}
img,svg,video,canvas{max-width:100%}
html.lock,html.lock body{overflow:hidden}            /* modal aberto: a página de trás não rola */

/* ---------- 2. Toque ---------- */
button,select,input,[role="button"],.row.click,.action,.hub-tile{touch-action:manipulation}
button,.row.click,.action,.mv,.hub-tile,.hub-continue,nav.tabs,.dpad,.escgrid,.arena,.seg,.tones,.traitpick,#loading,.chip,.big{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.log,.result,.modal p,.kv dd{-webkit-user-select:text;user-select:text}
/* feedback de toque (o hover não existe em touch) */
.row.click:active{background:var(--surface2)}
.choices button:active{background:var(--surface);border-color:var(--accent)}
.action:active,.mv:active:not(:disabled),.hub-tile:active{border-color:var(--accent)}
.btn:active{background:var(--surface3)}
.filters button:active,.seg button:active,.tones button:active,.traitpick button:active{transform:scale(.96)}
@media (pointer:coarse){
  .btn{min-height:var(--tap);padding:10px 14px}
  .btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
  .iconbtn{width:var(--tap);height:var(--tap)}
  .choices button{min-height:52px;padding:13px 15px}
  .action{min-height:58px}
  .filters button{min-height:40px;padding:8px 14px}
  .seg button{min-height:var(--tap)}
  .tones button,.traitpick button{min-height:var(--tap);min-width:var(--tap)}
  .hub-back{width:var(--tap);height:var(--tap)}
  .row.click{min-height:var(--tap)}
  .art-btns{gap:6px}
  .mv{min-height:60px}
  nav.tabs button{min-height:50px}
}
/* campos ≥ 16px: o iOS não dá zoom automático ao focar */
input,select,textarea,.form input,.form select,.logtools input{font-size:16px}
input[type="range"]{min-height:var(--tap);touch-action:pan-x}
/* textos e chips longos nunca estouram a largura */
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.btn{max-width:100%}
.row .t,.row .s,.result,.modal p,.oddsline{overflow-wrap:anywhere}

/* ---------- 3. Áreas seguras nos elementos fixos ---------- */
header.top{padding-top:calc(12px + var(--sat))}
.toast{top:calc(14px + var(--sat))}
#floaters{top:calc(110px + var(--sat))}
#loading{padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#hub{padding-top:calc(18px + var(--sat));padding-bottom:calc(40px + var(--sab));padding-left:max(var(--gutter,16px), var(--sal));padding-right:max(var(--gutter,16px), var(--sar));
  height:100vh;height:var(--app-h);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
footer.age{padding-left:max(var(--gutter), var(--sal));padding-right:max(var(--gutter), var(--sar))}
@media (max-width:979px){
  nav.tabs{padding-left:max(8px, var(--sal));padding-right:max(8px, var(--sar));padding-bottom:calc(6px + var(--sab))}
  footer.age{bottom:calc(var(--nav-h) + var(--sab))}
  main{padding-bottom:calc(190px + var(--sab))}
}
@media (min-width:980px){
  header.top{height:100vh;height:var(--app-h)}
  footer.age{padding-bottom:calc(22px + var(--sab))}
}

/* ---------- 4. Modais: cabem em qualquer tela, rolam por dentro ---------- */
.overlay{padding:calc(12px + var(--sat)) max(12px, var(--sar)) calc(12px + var(--sab)) max(12px, var(--sal));overscroll-behavior:contain}
.modal{max-height:calc(100vh - 24px - var(--sat) - var(--sab));max-height:calc(var(--app-h) - 24px - var(--sat) - var(--sab));
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
@media (max-width:639px){
  /* celular: modal vira "folha" ancorada embaixo, perto do polegar */
  .overlay{padding:calc(8px + var(--sat)) 0 0}
  .modal{max-width:none;border-radius:22px 22px 0 0;padding:18px max(16px, var(--sar)) calc(18px + var(--sab)) max(16px, var(--sal));
    max-height:calc(100vh - 8px - var(--sat));max-height:calc(var(--app-h) - 8px - var(--sat))}
  .modal::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--border-strong);margin:-6px auto 12px}
}
/* botão principal de resultado/continuação acompanha a rolagem do modal */
.modal .choices > button.primary:only-child,.modal .fight-end .choices{position:sticky;bottom:0}
.modal .fight-end .choices{background:var(--surface);padding-top:8px;margin-bottom:-4px}

/* ---------- Celular pequeno (≤ 480px) ---------- */
@media (max-width:480px){
  :root{--fs:15px}
  .card{padding:14px;border-radius:14px}
  .card h2{font-size:14.5px;flex-wrap:wrap}
  .bars{gap:6px 12px}
  .modal h3{font-size:18px}
  .grid2{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .kv{grid-template-columns:1fr;gap:0 0}.kv dt{margin-top:6px}
  .statgrid,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pet-row{flex-wrap:wrap}.pet-row > .grow{flex:1 1 100%}
}
@media (max-width:360px){
  :root{--gutter:12px;--fs:14.5px}
  .grid2,.moves,.moves.util{grid-template-columns:1fr}
  .hub-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hub-tile{padding:12px}.hub-tile span{font-size:22px}
  nav.tabs button{font-size:10.5px;padding:6px 2px}
  .idtext h1{font-size:15.5px}.money{font-size:14.5px}
  .avatar{width:44px;height:44px;font-size:24px}
  .ld-logo,.hub-logo{font-size:32px}
}

/* ---------- Tablets (481–979): mais colunas, linhas de leitura confortáveis ---------- */
@media (min-width:481px) and (max-width:979px){
  #app{max-width:860px}
  .grid2{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .hub-inner{max-width:680px}
  .hub-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .modal{max-width:600px}
  .card p,.result{max-width:70ch}
}
@media (min-width:700px) and (max-width:979px){
  nav.tabs{left:50%;right:auto;transform:translateX(-50%);width:min(720px, 100% - 24px);bottom:calc(10px + var(--sab));border-radius:20px;border:1px solid var(--border);padding-bottom:6px}
  footer.age{bottom:calc(var(--nav-h) + 18px + var(--sab))}
  main{padding-bottom:calc(200px + var(--sab))}
}

/* ---------- Celular deitado (paisagem baixa) ---------- */
@media (orientation:landscape) and (max-height:500px) and (max-width:979px){
  :root{--nav-h:48px}
  header.top{position:relative;padding-top:calc(8px + var(--sat))}
  .bars{grid-template-columns:repeat(4,1fr)}
  nav.tabs button{flex-direction:row;gap:6px;min-height:40px;padding:4px 6px}
  nav.tabs button .ic{font-size:15px}
  footer.age{padding-top:10px;padding-bottom:6px}
  .big{padding:9px;font-size:15px}.big small{display:none}
  main{padding-bottom:calc(140px + var(--sab))}
  .overlay{align-items:center;padding:calc(6px + var(--sat)) max(12px, var(--sar)) calc(6px + var(--sab)) max(12px, var(--sal))}
  .modal{border-radius:18px;max-width:min(92vw, 760px);max-height:calc(100vh - 12px);max-height:calc(var(--app-h) - 12px - var(--sat) - var(--sab))}
  .modal::before{display:none}
  .ld-list{display:none}.ld-sub{margin-bottom:12px}.ld-tip{margin-top:12px}
  .hub-logo{margin-top:4px;font-size:30px}
  .hub-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- Desktop e telas muito largas ---------- */
@media (min-width:1440px){
  #app{max-width:1280px;grid-template-columns:360px minmax(0,1fr)}
  footer.age{left:max(var(--gutter), calc(50vw - 640px + var(--gutter)));width:360px}
}

/* ---------- Combate em telas pequenas ---------- */
@media (max-width:520px){
  .fight-head h3{font-size:16px;flex:1 1 100%}
  .fighter{padding:8px}.f-av{font-size:26px}.f-name{font-size:13px}
  .flog{font-size:12.5px;min-height:54px}
  .seg button{font-size:12px;padding:8px 2px}
}

/* ---------- Fuga: grade tocável + direcional no polegar ---------- */
.escape .esc-board{display:block}
.escgrid{touch-action:none;width:min(100%, 430px, calc(var(--app-h) - 360px));min-width:min(100%, 260px);cursor:pointer}
.ec.reach{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
.ec.reach:active{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
@media (pointer:coarse){
  .dpad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,56px);gap:8px}
  .dpad button{font-size:22px;border-radius:16px}
}
@media (orientation:landscape) and (max-height:500px){
  /* deitado: grade à esquerda, legenda e direcional à direita */
  .escape .esc-board{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
  .escgrid{width:min(calc(var(--app-h) - 120px), 360px);margin:0}
  .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,46px);margin:6px auto}
}

/* ---------- Hub e loading ---------- */
.hub-continue,.hub-tile{min-height:var(--tap)}
@media (min-width:980px){ .hub-inner{max-width:720px}.hub-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* ---------- Cabeçalho em celulares estreitos: dinheiro desce para uma linha própria ---------- */
@media (max-width:420px){
  header.top .idrow{flex-wrap:wrap;row-gap:6px}
  header.top .idtext{flex:1 1 0}
  header.top .idtext h1{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
  header.top .idtext .sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  header.top .money{order:3;flex:1 1 100%;display:flex;justify-content:space-between;align-items:baseline;text-align:left;
    background:var(--surface2);border-radius:12px;padding:6px 12px}
  header.top .money small{display:inline}
}

/* ---------- Barras de atributo: colunas que encolhem de verdade (1fr não desce abaixo do conteúdo) ---------- */
.bars{grid-template-columns:repeat(2,minmax(0,1fr))}
.bar{min-width:0}
.bar .lbl{gap:6px}
.bar .lbl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (orientation:landscape) and (max-height:500px) and (max-width:979px){ .bars{grid-template-columns:repeat(4,minmax(0,1fr))} }
.pet-bars{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){ .pet-bars{grid-template-columns:minmax(0,1fr)} }

/* ---------- Navegação inferior estreita: 6 abas sem vazar da tela ---------- */
@media (max-width:420px){
  nav.tabs{gap:2px}
  nav.tabs button{padding:6px 1px;font-size:11px;letter-spacing:0}
  nav.tabs button > span:not(.ic){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
.hub-tile{min-width:0}.hub-tile b,.hub-tile small{max-width:100%;overflow-wrap:anywhere}

/* ---------- Seletor próprio (substitui <select> nativo) ---------- */
.picker{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:var(--tap);padding:10px 12px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;font-size:16px;text-align:left;cursor:pointer}
.picker span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker i{font-style:normal;color:var(--muted);flex:none}
.picker:active{border-color:var(--accent)}
@media (hover:hover){ .picker:hover{border-color:var(--accent)} }
.picklist button{display:flex;justify-content:space-between;align-items:center}
.picklist button.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface2))}
.picklist button b{color:var(--accent)}
.hub-inner.still{animation:none}

/* =====================================================================
   MODO APP / TELA CHEIA (html.app-mode): a página não rola; quem rola é
   o <body> (conteúdo do jogo), com overscroll travado — sem "puxar para
   atualizar", sem efeito elástico e sem zoom de pinça acidental. Modais,
   hub e linha do tempo continuam com rolagem interna própria.
   ===================================================================== */
html.app-mode{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}
html.app-mode body{height:100%;height:var(--app-h);overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
html.app-mode.lock body{overflow:hidden}
html.app-mode .modal,html.app-mode #hub{overscroll-behavior:contain}
html.is-fullscreen body{background:var(--bg)}
.fsbtn{display:grid;place-items:center;color:var(--text2)}
.fsbtn svg{display:block}
.idrow .fsbtn{margin-right:-4px}
.hub-top{display:flex;justify-content:flex-end}
.hub-top .hub-back{display:grid;place-items:center}
</style>
</head>

<script>/* src/core/utils.js */
"use strict";
/* core/utils.js */

const clamp = (v,a=0,b=100) => { v = Number(v); if(!isFinite(v)) v = a; return Math.max(a, Math.min(b, v)); };

const num = (v, d=0) => (typeof v === "number" && isFinite(v)) ? v : d;

const byId = (list, id) => list.find(x => x.id === id);

/* hash estável de string (atribuições determinísticas em migrações) */
function hashStr(s){ let h = 0; for (const ch of String(s)) h = (h*31 + ch.charCodeAt(0)) | 0; return h; }
</script>
<script>/* src/core/rng.js */
"use strict";
/* core/rng.js */

/* RNG mulberry32 — a semente fica no estado, então um save recarregado
   continua a mesma sequência aleatória (reprodutível para debug). */
function rand(){
  let t = (S && S.seed !== undefined) ? (S.seed = (S.seed + 0x6D2B79F5) | 0) : (Math.random()*2**32)|0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const chance = p => rand() < p;

const rint = (a,b) => a + Math.floor(rand()*(b-a+1));

const rfloat = (a,b) => a + rand()*(b-a);

const pick = arr => arr[Math.floor(rand()*arr.length)];

const gauss = () => { let u=0,v=0; while(!u) u=rand(); while(!v) v=rand(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };

const uid = () => Math.floor(rand()*1e9).toString(36) + Date.now().toString(36).slice(-3);

function weighted(items, wfn){
  const ws = items.map(i => Math.max(0, num(wfn(i))));
  const tot = ws.reduce((a,b)=>a+b,0);
  if (tot <= 0) return null;
  let r = rand()*tot;
  for (let i=0;i<items.length;i++){ r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length-1];
}
</script>
<script>/* src/core/economy.js */
"use strict";
/* =====================================================================
   core/economy.js — moedas, conversão multi-país e impostos.

   MODELO MULTI-PAÍS (v5): cada ativo/dívida guarda `country` e o valor
   na MOEDA DAQUELE PAÍS. O caixa (S.money) e os investimentos ficam na
   moeda do país onde o jogador mora. Tudo que soma patrimônio ou fluxo
   converte com fxConv(). Assim, emigrar não apaga nem liquida nada:
   imóveis no Brasil continuam no Brasil, rendendo em reais.
   ===================================================================== */
function country(id){ return byId(DATA.countries, id || S.player.country) || DATA.countries[0]; }

const priceOf  = base => Math.round(base * country().fx * country().col  * S.priceIndex);
/* salários seguem S.wageIndex (cresce menos que a inflação no modo bruto) */
const wageIdx  = () => num(S.wageIndex, S.priceIndex);
const wageOf   = base => Math.round(base * country().fx * country().wage * wageIdx());
const toBase   = local => local / (country().fx * country().wage * wageIdx());
/* Preço base num país específico (comprar imóvel no exterior, avaliar ativo remoto). */
const priceIn  = (base, cid) => Math.round(base * country(cid).fx * country(cid).col * S.priceIndex);

/* Converte valor da moeda de `from` para a de `to` (padrão: país atual). */
function fxConv(amount, from, to){
  from = from || S.player.country; to = to || S.player.country;
  if (from === to) return Math.round(num(amount));
  return Math.round(num(amount) / country(from).fx * country(to).fx);
}
/* Valor de um ativo/dívida já convertido para a moeda local. */
const localValue = a => fxConv(a.value ?? a.principal ?? 0, a.country);

function fmtIn(v, cid, compact){
  v = num(v);
  const c = country(cid);
  try {
    return new Intl.NumberFormat(c.locale, { style:"currency", currency:c.currency,
      notation: compact && Math.abs(v) >= 1e6 ? "compact" : "standard",
      maximumFractionDigits: Math.abs(v) >= 1000 || c.currency==="JPY" ? 0 : 2 }).format(v);
  } catch(e){ return c.currency + " " + Math.round(v).toLocaleString(); }
}
const fmt = (v, compact) => fmtIn(v, null, compact);
/* Mostra valor na moeda do ativo e, se estrangeiro, o equivalente local. */
function fmtAsset(v, cid){
  if (!cid || cid === S.player.country) return fmt(v);
  return `${fmtIn(v, cid)} <span class="muted">(≈ ${fmt(fxConv(v, cid), true)})</span>`;
}

/* Imposto de renda progressivo (escala base, independe do país).
   MODO BRUTO: faixas mais pesadas que a v4. */
function incomeTax(local){
  const b = toBase(local); let tax = 0;
  const brackets = [[9000,0],[25000,0.15],[60000,0.25],[150000,0.33],[400000,0.4],[Infinity,0.45]];
  let prev = 0;
  for (const [cap, rate] of brackets){ if (b > prev) tax += (Math.min(b,cap)-prev)*rate; prev = cap; }
  return Math.max(0, Math.round(local * (tax / Math.max(b,1))));
}
/* Imposto sobre grandes fortunas: 0,6% a 1,5% do patrimônio acima de ~1 milhão base. */
function wealthTax(nw){
  const b = toBase(nw), floor = 1e6;
  if (b <= floor) return 0;
  const rate = b > 2e7 ? 0.015 : b > 5e6 ? 0.01 : 0.006;
  return Math.round((nw - wageOf(floor)) * rate);
}
</script>
<script>/* src/core/bus.js */
"use strict";
/* core/bus.js — barramento de eventos mínimo.
   A simulação emite (emit("achievement", …)) sem conhecer a UI; a UI e o
   áudio assinam (on("achievement", fn)). Mantém o motor testável sem DOM. */
const BUS = {};
function on(name, fn){ (BUS[name] = BUS[name] || []).push(fn); }
function emit(name, data){ for (const fn of BUS[name] || []) { try { fn(data); } catch(e){ console.warn("bus", name, e); } } }

<script>/* src/state/state.js */
"use strict";
/* =====================================================================
   state/state.js — estado global S (fonte única da verdade) e helpers.
   Toda mutação de atributo passa por um helper que clampa/sanitiza.
   ===================================================================== */
const SAVE_KEY = "claudilife.save.v6"; // legado: v7 usa slots (state/persistence.js)
const LEGACY_SAVE_KEYS = ["claudilife.save.v6","claudilife.save.v5","claudilife.save.v4","claudilife.save.v3"];
const SAVE_VERSION = 8;
const PROPERTY_ID_MIGRATION = { townhouse:"sobrado" }; // ids removidos em versões antigas

let S = null; // estado global da vida atual

/* ---------- Defaults: garante todos os campos (vida nova, migração, herdeiro) ---------- */
function ensureState(st = S){
  const p = st.player;
  p.stress     = clamp(num(p.stress, 15));
  p.reputation = clamp(num(p.reputation, 50));
  p.vitality   = clamp(num(p.vitality, 100));
  p.karma      = clamp(num(p.karma, 50));
  st.health = Object.assign({ plan:"none", lastCheckup:-99, sequelae:0, sedentary:0, exercised:false, employerPlan:false }, st.health || {});
  st.addictions = Object.assign({ smoke:0, alcohol:0, gambling:0 }, st.addictions || {});
  if (st.flags && st.flags.smoker && !st.addictions.smoke) st.addictions.smoke = 35; // saves v3
  st.credit = Math.max(300, Math.min(850, Math.round(num(st.credit, 620))));
  st.scheduled = st.scheduled || [];
  st.consequences = st.consequences || [];
  st.actCount = st.actCount || {};
  st.queue = st.queue || []; st.cooldown = st.cooldown || {}; st.flags = st.flags || {};
  st.businesses = st.businesses || []; st.loans = st.loans || []; st.investments = st.investments || {};
  st.illnesses = (st.illnesses || []).map(i => ({ stage:1, diagnosed: !!i.treated, treated:false, tier:null, years:0, ...i }));
  // v5: economia global, submundo, estatísticas de vida, ativos multi-país
  st.world = Object.assign({ phase:"estável", years:0, inflation:0.035, history:[] }, st.world || {});
  st.priceIndex = num(st.priceIndex, 1); st.wageIndex = num(st.wageIndex, st.priceIndex);
  st.dirty = Math.max(0, num(st.dirty)); st.crimeSkill = clamp(num(st.crimeSkill)); st.org = st.org || null;
  st.stats = Object.assign({ earned:0, spent:0, crimes:0, crimesOk:0, arrests:0, jobs:0, propsBought:0, carsBought:0, maxNetWorth:0, countries:[p.country], dirtyEarned:0, laundered:0, fights:0, fightsWon:0, kills:0, escapes:0 }, st.stats || {});
  // v6: artes marciais, combate, fuga e foragido
  st.martial = Object.assign({ arts:{}, enrolled:[], rec:{ w:0, l:0, d:0, ko:0 }, kills:0, banUntil:0, titles:[] }, st.martial || {});
  st.martial.rec = Object.assign({ w:0, l:0, d:0, ko:0 }, st.martial.rec);
  st.martial.enrolled = st.martial.enrolled.filter(id => byId(DATA.martialArts, id));
  st.wanted = st.wanted || null; st.fight = st.fight || null; st.escape = st.escape || null;
  // v7: classe em 9 níveis, identidade, aparência, pets, cibercrime, prisão profunda
  if (p.clsScale !== 9){ p.cls = [0,2,4,6,7][p.cls] ?? 4; p.clsScale = 9; }
  if (!st.identity) st.identity = p.orientation && p.orientation !== "descobrindo"
    ? { other:0, same:0, both:0, none:0, pan:0, steps:0, resolved:true }
    : { other:0, same:0, both:0, none:0, pan:0, steps:0, resolved:false };
  p.orientation = p.orientation || "descobrindo";
  st.look = Object.assign({ tone:"", hair:"natural", face:"none", wardrobe:0, skincare:false, glasses:null, myopia:false, visionTested:false, glassesPenalty:0, lasik:false, procedures:0 }, st.look || {});
  st.pets = st.pets || [];
  if (st.flags.pet){ st.pets.push({ uid:uid(), sp:"dog_srd", name:st.flags.pet.name, age:Math.max(1, p.age - num(st.flags.pet.since, p.age)), bond:70, hunger:0, stress:10, neglect:0, health:90, trained:0, played:false }); delete st.flags.pet; }
  st.cyberSkill = clamp(num(st.cyberSkill)); st.prisonSkills = st.prisonSkills || [];
  // v8: trabalho autônomo, coleção, arsenal, lado sombrio
  st.gig = st.gig && byId(DATA.gigs, st.gig.id) ? st.gig : null;
  st.collection = (st.collection || []).filter(c => byId(DATA.collectibles, c.id)).map(c => ({ country:home, ...c }));
  st.arsenal = (st.arsenal || []).filter(w => byId(DATA.armory, w.id));
  st.dark = Object.assign({ active:false, code:"code", urge:0, heat:0, clues:0, stealth:10, kills:0, victims:[], hunts:0 }, st.dark || {});
  st.hunt = null;
  st.stats = Object.assign({ cyberOk:0, petsOwned:0, remitted:0, spouseScams:0 }, st.stats);
  if (st.prison){ st.prison.remit = num(st.prison.remit); st.prison.intim = num(st.prison.intim); st.prison.courses = st.prison.courses || {}; st.prison.cat = st.prison.cat || crimeCategory(st.prison.crime); }
  if (st.prison){ st.prison.security = st.prison.security || (st.prison.years >= 12 ? "máxima" : st.prison.years >= 5 ? "média" : "mínima"); st.prison.escAttempts = num(st.prison.escAttempts); st.prison.escBlock = num(st.prison.escBlock); }
  const home = p.country;
  for (const x of st.properties || []){ x.country = x.country || home; x.condition = num(x.condition, 100); if (PROPERTY_ID_MIGRATION[x.id]) x.id = PROPERTY_ID_MIGRATION[x.id]; }
  st.properties = (st.properties || []).filter(x => byId(DATA.properties, x.id));
  for (const x of [...(st.vehicles||[]), ...(st.businesses||[]), ...(st.loans||[])]) x.country = x.country || home;
  for (const L of st.loans || []) L.missed = num(L.missed);
  // NPCs: personalidade, riqueza e histórico (saves antigos ganham valores coerentes)
  const seen = new Set();
  st.rels = (st.rels || []).filter(r => r && r.uid && !seen.has(r.uid) && seen.add(r.uid));
  for (const r of st.rels){ r.personality = r.personality || DATA.personalities[Math.abs(hashStr(r.uid)) % DATA.personalities.length].id; r.wealth = r.wealth ?? 2; r.respect = clamp(num(r.respect, 50)); r.history = r.history || []; }
  return st;
}

/* ---------- Helpers de mutação ---------- */
function addStat(k, d){
  const st = S.player.stats;
  if (k === "happiness" && d < 0 && hasTrait("resilient")) d *= 0.65;
  if (k === "happiness" && d < 0 && hasTrait("anxious")) d *= 1.25;
  // saúde nunca ultrapassa o teto de vitalidade (envelhecimento + sequelas)
  const max = k === "health" ? healthCap() : 100;
  st[k] = clamp(num(st[k]) + num(d), 0, d > 0 ? Math.max(max, Math.min(st[k], 100)) : 100);
}
function addFame(d){ S.player.fame = clamp(num(S.player.fame) + d); }
function addNoto(d){ S.player.notoriety = clamp(num(S.player.notoriety) + d); }
function addMoney(d){ S.money = Math.round(num(S.money) + num(d)); }
function addStress(d){
  if (d > 0 && hasTrait("resilient")) d *= 0.75;
  if (d > 0 && hasTrait("anxious")) d *= 1.3;
  S.player.stress = clamp(num(S.player.stress) + num(d));
}
function addRep(d){ S.player.reputation = clamp(num(S.player.reputation) + num(d)); }
function addCredit(d){ S.credit = Math.max(300, Math.min(850, Math.round(num(S.credit,620) + d))); }
/* Teto de saúde: vitalidade (cai com a idade) menos sequelas permanentes. */
function healthCap(){ return clamp(num(S.player.vitality,100) - num(S.health?.sequelae,0), 5, 100); }

const hasTrait = id => S.player.traits.includes(id);
const P = () => S.player;
const year = () => S.player.birthYear + S.player.age;

/* ---------- Log com etiquetas automáticas (usadas pelos filtros/busca) ---------- */
const LOG_TAGS = [
  ["work",   /promovid|demitid|contratad|emprego|cargo|aposent|carreira|layoff|eleit|mandato|💼|📈/i],
  ["money",  /R\$|€|\$|herd|invest|dívid|empréstimo|compr|vend|lucr|falênc|💰|💸|🏠|🚗/i],
  ["love",   /namor|casei|casamento|divórc|noiv|💘|💍|💕|💔|bebê|filh|neto/i],
  ["health", /saúde|doen|diagnost|tratament|hospital|médic|câncer|check-up|vício|cirurg|🏥|🩺|💪|🤒/i],
  ["crime",  /pres[oa]|crime|condenad|polícia|prisão|reformatório|🚓|⛓|🦹|investigaç/i],
  ["school", /escola|faculdade|vestibular|formei|diploma|curso|mestrado|doutor|🎓|🎒/i],
];
function autoTag(text){ return LOG_TAGS.filter(([,re]) => re.test(text)).map(([t]) => t); }
function log(text, kind = "", tags){
  S.log.push({ age:S.player.age, year:year(), text, kind, tags: tags || autoTag(text) });
  if (S.log.length > 4000) S.log.splice(0, S.log.length - 4000); // evita save gigante
}
/* Histórico de consequências: liga uma escolha passada ao efeito presente. */
function remember(text, kind = "info"){
  S.consequences.push({ age:P().age, text, kind });
  if (S.consequences.length > 200) S.consequences.shift();
}
function achieve(id, text){
  if (S.achievements.some(a=>a.id===id)) return;
  S.achievements.push({ id, text, age:S.player.age });
  log("🏆 Conquista: " + text, "milestone"); emit("achievement", text);
}
function lifeStage(age = S.player.age){
  if (age < 3) return "Bebê";
  if (age < 13) return "Infância";
  if (age < 18) return "Adolescência";
  if (age < 30) return "Jovem Adulto";
  if (age < 60) return "Vida Adulta";
  return "Terceira Idade";
}

/* ---------- Patrimônio líquido (derivado, nunca armazenado) ---------- */
function investTotal(){ return Object.values(S.investments).reduce((a,b)=>a+num(b),0); }
/* Tudo convertido para a moeda do país atual (ativos guardam a própria moeda). */
function debtTotal(){ return S.loans.reduce((a,l)=>a+fxConv(l.principal, l.country),0) + num(S.edu.debt); }
function propertiesTotal(){ return S.properties.reduce((a,p)=>a+fxConv(p.value, p.country),0); }
function vehiclesTotal(){ return S.vehicles.reduce((a,v)=>a+fxConv(v.value, v.country),0); }
function businessesTotal(){ return S.businesses.reduce((a,b)=>a+fxConv(b.value, b.country),0); }
function netWorth(){
  return Math.round(num(S.money) + num(S.dirty) + propertiesTotal() + vehiclesTotal() + businessesTotal() + investTotal() + (typeof collectionTotal === "function" ? collectionTotal() : 0) - debtTotal());
}

const LIFESTYLES = [
  { name:"Econômico",   mult:0.65, happy:-3, stress:4 },
  { name:"Normal",      mult:1.0,  happy:0,  stress:0 },
  { name:"Confortável", mult:1.7,  happy:3,  stress:-3 },
  { name:"Luxuoso",     mult:3.5,  happy:6,  stress:-5 },
];

const parents = () => S.rels.filter(r => (r.role==="mother"||r.role==="father") && r.alive);
const partner = () => S.rels.find(r => (r.role==="partner"||r.role==="spouse"||r.role==="fiance") && r.alive);
const children = (alive=true) => S.rels.filter(r => r.role==="child" && (!alive || r.alive));
const inPrison = () => !!S.prison;
const classOf = () => DATA.classes[P().cls] || DATA.classes[4];
const clsBand = () => classOf().band; // 0–4: faixa usada pelas fórmulas gerais
function career(){ return S.job ? byId(DATA.careers, S.job.careerId) : null; }
function residence(){ return S.properties.find(p => p.residence); }
function homeInfo(){
  const own = residence();
  if (own){ const d = byId(DATA.properties, own.id); return { type:"own", name:d.name, comfort:d.comfort, status:d.status }; }
  if (S.rental){ const d = byId(DATA.rentals, S.rental); return { type:"rent", name:d.name, comfort:d.comfort, status:d.status, rent:priceOf(d.rent) }; }
  if (inPrison()) return { type:"prison", name:"Cela do presídio", comfort:0, status:0 };
  if (parents().length || P().age < 18) return { type:"family", name:"Casa da família", comfort: classOf().comfort, status: classOf().status };
  return { type:"none", name:"Sem moradia fixa", comfort:0, status:0 };
}
function jobIncome(){
  let inc = 0;
  if (S.job && !inPrison()) inc += S.job.salary;
  if (S.partTime && !inPrison()) inc += wageOf(byId(DATA.partTime, S.partTime).s);
  if (S.retired) inc += S.pension;
  return Math.round(inc);
}
function relBy(uidv){ return S.rels.find(r=>r.uid===uidv); }

/* ---------- Sanitização: blindagem contra NaN e estados inválidos ---------- */
function sanitize(){
  const p = P(), st = p.stats;
  for (const k of ["health","happiness","intelligence","looks"]) st[k] = clamp(st[k]);
  st.health = Math.min(st.health, Math.max(healthCap(), 0));
  for (const k of ["fame","notoriety","stress","reputation","vitality","karma"]) p[k] = clamp(p[k]);
  for (const k in S.addictions) S.addictions[k] = clamp(S.addictions[k]);
  S.credit = Math.max(300, Math.min(850, Math.round(num(S.credit, 620))));
  S.health.sequelae = clamp(S.health.sequelae, 0, 80);
  S.money = Math.round(num(S.money)); S.priceIndex = num(S.priceIndex, 1);
  // saldo nunca fica negativo: o rombo vira cheque especial (dívida rastreada, derruba o crédito)
  if (S.money < 0){
    const d = -S.money; S.money = 0;
    const student = S.edu.school && parents().length && p.age < 25 && clsBand() >= 1;
    if (p.age >= 18 && !student){ takeLoan("Cheque especial", d, RATES.overdraft, 3, true); S.flags.overdraftYear = p.age; }
    else for (const pa of parents()) pa.rel = clamp(pa.rel - 2);
  }
  S.edu.debt = Math.max(0, Math.round(num(S.edu.debt))); S.edu.perf = clamp(S.edu.perf);
  S.dirty = Math.max(0, Math.round(num(S.dirty))); S.crimeSkill = clamp(S.crimeSkill);
  if (S.martial) for (const a of Object.values(S.martial.arts)) a.m = clamp(num(a.m));
  for (const pt of S.pets || []){ for (const k of ["bond","hunger","stress","health"]) pt[k] = clamp(num(pt[k])); pt.trained = Math.max(0, Math.min(1, num(pt.trained))); }
  S.cyberSkill = clamp(num(S.cyberSkill));
  if (S.dark){ S.dark.urge = clamp(S.dark.urge); S.dark.heat = clamp(S.dark.heat); S.dark.stealth = clamp(S.dark.stealth); S.dark.clues = Math.max(0, Math.round(num(S.dark.clues))); }
  if (S.gig){ S.gig.skill = clamp(S.gig.skill); S.gig.exposure = clamp(S.gig.exposure); S.gig.rating = clamp(S.gig.rating, 30, 100); S.gig.audience = Math.max(0, Math.round(num(S.gig.audience))); }
  for (const c of S.collection || []) c.value = Math.max(1, Math.round(num(c.value, 1)));
  if (S.prison){ S.prison.intim = clamp(num(S.prison.intim)); S.prison.remit = Math.max(0, num(S.prison.remit)); }
  p.age = Math.max(0, Math.round(num(p.age)));
  if (S.org){ S.org.heat = clamp(S.org.heat); S.org.respect = clamp(S.org.respect); for (const m of S.org.members) { m.loyalty = clamp(m.loyalty); m.skill = clamp(m.skill); } }
  for (const x of S.properties) x.value = Math.max(0, Math.round(num(x.value)));
  for (const v of S.vehicles) v.value = Math.max(0, Math.round(num(v.value)));
  for (const k in S.investments) S.investments[k] = Math.max(0, Math.round(num(S.investments[k])));
  for (const L of S.loans){ L.principal = Math.max(0, Math.round(num(L.principal))); L.payment = Math.max(1, Math.round(num(L.payment,1))); }
  for (const r of S.rels){ r.rel = clamp(r.rel); r.age = Math.max(0, Math.round(num(r.age))); }
  for (const i of S.illnesses) i.stage = Math.max(1, Math.min(4, Math.round(num(i.stage,1))));
  if (S.job){ S.job.perf = clamp(S.job.perf); S.job.salary = Math.max(0, Math.round(num(S.job.salary))); }
  for (const b of S.businesses){ b.value = Math.max(0, Math.round(num(b.value))); b.revenue = Math.max(0, Math.round(num(b.revenue))); b.lastProfit = Math.round(num(b.lastProfit)); }
}

<script>/* src/state/invariants.js */
"use strict";
/* =====================================================================
   state/invariants.js — checagens de consistência de estado.
   checkInvariants() lista violações (usado no selftest e no console:
   `checkInvariants()`); repairState() corrige o que for reparável
   (chamado ao carregar saves e a cada ano).
   ===================================================================== */
const VALID_ROLES = new Set(["mother","father","sibling","partner","fiance","spouse","child","friend","ex","coworker","acquaintance","late_spouse","late_partner"]);

function checkInvariants(st = S){
  const bad = [], p = st.player, push = m => bad.push(m);
  for (const k of ["health","happiness","intelligence","looks"]) if (!(p.stats[k] >= 0 && p.stats[k] <= 100)) push(`stat ${k}=${p.stats[k]}`);
  for (const k of ["stress","reputation","vitality","fame","notoriety"]) if (!(p[k] >= 0 && p[k] <= 100)) push(`${k}=${p[k]}`);
  if (!(st.money >= 0)) push(`money=${st.money}`);
  if (st.job && !byId(DATA.careers, st.job.careerId)) push(`job inválido ${st.job.careerId}`);
  if (st.job && st.prison) push("emprego e prisão ao mesmo tempo");
  if (st.job && st.retired) push("empregado e aposentado");
  if (st.properties.filter(x=>x.residence).length > 1) push("mais de uma residência");
  if (st.rental && st.properties.some(x=>x.residence)) push("aluga e mora em imóvel próprio");
  for (const L of st.loans){ if (L.propertyUid && !st.properties.some(x=>x.uid===L.propertyUid)) push(`hipoteca órfã ${L.name}`); if (!(L.principal >= 0)) push(`dívida negativa ${L.name}`); }
  const romance = st.rels.filter(r => ["partner","fiance","spouse"].includes(r.role) && r.alive);
  if (romance.length > 1) push(`${romance.length} parceiros simultâneos`);
  for (const r of st.rels){
    if (!VALID_ROLES.has(r.role)) push(`papel inválido ${r.role}`);
    if (r.role === "child" && r.alive && r.age >= p.age && p.alive) push(`filho(a) ${r.first} mais velho que o jogador`);
  }
  if (!p.alive && st.queue.length) push("morto com eventos pendentes");
  if (st.edu.school === "uni" && !byId(DATA.majors, st.edu.major)) push("faculdade sem curso válido");
  for (const i of st.illnesses) if (!byId(DATA.illnesses, i.id)) push(`doença inválida ${i.id}`);
  if (st.illnesses.length !== new Set(st.illnesses.map(i=>i.id)).size) push("doença duplicada");
  if (p.stats.health > healthCap() + 0.5) push(`saúde ${p.stats.health} acima do teto ${healthCap()}`);
  return bad;
}

function repairState(st = S){
  // romance: mantém só o vínculo mais forte (cônjuge > noivo > namoro)
  const order = { spouse:3, fiance:2, partner:1 };
  const romance = st.rels.filter(r => order[r.role] && r.alive).sort((a,b)=>order[b.role]-order[a.role] || b.rel-a.rel);
  for (const r of romance.slice(1)) r.role = "ex";
  if (st.job && st.prison) st.job = null;
  if (st.job && st.retired) st.retired = false;
  const res = st.properties.filter(x=>x.residence); for (const x of res.slice(1)) x.residence = false;
  if (st.rental && res.length) st.rental = null;
  st.loans = st.loans.filter(L => !L.propertyUid || st.properties.some(x=>x.uid===L.propertyUid));
  const seen = new Set(); st.illnesses = st.illnesses.filter(i => byId(DATA.illnesses,i.id) && !seen.has(i.id) && seen.add(i.id));
  if (!st.player.alive) st.queue = [];
}
</script>
<script>/* src/state/persistence.js */
"use strict";
/* =====================================================================
   state/persistence.js — SLOTS de vidas salvas + HALL DOS LEGADOS.
   • Cada vida fica em claudilife.slot.<id>; o índice (nome, idade, país,
     avatar, data) fica em claudilife.slots; a vida aberta, em curslot.
   • Saves antigos (chave única v3–v6) viram um slot automaticamente.
   • Toda morte registra a vida no Hall (claudilife.hall): título,
     pontuação, causa e conquistas — o histórico entre vidas do hub.
   • NO_PERSIST (testes/demos) impede qualquer escrita.
   ===================================================================== */
const SLOTS_KEY = "claudilife.slots", SLOT_PREFIX = "claudilife.slot.", CUR_SLOT_KEY = "claudilife.curslot", HALL_KEY = "claudilife.hall";
const MAX_SLOTS = 6;
let CUR_SLOT = null, NO_PERSIST = false;

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function listSlots(){ try { const a = JSON.parse(lsGet(SLOTS_KEY)); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
function writeSlots(a){ lsSet(SLOTS_KEY, JSON.stringify(a.slice(0, 20))); }
function newSlotId(){ return "s" + Date.now().toString(36) + Math.floor(Math.random()*1e5).toString(36); }
function metaOf(st, id){
  const p = st.player;
  return { id, name:`${p.first} ${p.last}`, age:p.age, alive:p.alive, country:p.country, cls:p.cls, gender:p.gender, tone: st.look?.tone || "",
           savedAt: Date.now(), gen: (st.lineage || []).length + 1, title: st.final?.title || null };
}

function saveGame(silent){
  if (NO_PERSIST || !S) return false;
  if (!CUR_SLOT) CUR_SLOT = newSlotId();
  try {
    localStorage.setItem(SLOT_PREFIX + CUR_SLOT, JSON.stringify({ v:SAVE_VERSION, savedAt:Date.now(), state:S }));
    const slots = listSlots().filter(x => x.id !== CUR_SLOT); slots.unshift(metaOf(S, CUR_SLOT)); writeSlots(slots);
    lsSet(CUR_SLOT_KEY, CUR_SLOT);
    if (!silent) toast("Jogo salvo 💾"); return true;
  } catch(e){ if (!silent) toast("Não foi possível salvar (armazenamento cheio ou indisponível)."); return false; }
}
function validateState(st){
  return st && st.player && st.player.stats && Array.isArray(st.rels) && Array.isArray(st.log) && st.edu && typeof st.money === "number";
}
function migrate(st){
  // ponto central de migração entre versões de save (ensureState preenche/converte campos)
  ensureState(st); repairState(st);
  st.version = SAVE_VERSION; return st;
}
/* Save de chave única (v3–v6) → slot. Roda uma vez. */
function migrateLegacySave(){
  if (NO_PERSIST || lsGet("claudilife.legacyMigrated")) return;
  for (const key of [SAVE_KEY, ...LEGACY_SAVE_KEYS]){
    const raw = lsGet(key); if (!raw) continue;
    try { const o = JSON.parse(raw); if (!validateState(o.state)) continue;
      const id = newSlotId(); lsSet(SLOT_PREFIX + id, raw);
      const slots = listSlots(); slots.unshift(metaOf(o.state, id)); writeSlots(slots); lsSet(CUR_SLOT_KEY, id);
      break;
    } catch(e){}
  }
  lsSet("claudilife.legacyMigrated", "1");
}
function loadGame(slotId){
  migrateLegacySave();
  const id = slotId || lsGet(CUR_SLOT_KEY) || listSlots()[0]?.id; if (!id) return false;
  try {
    const raw = lsGet(SLOT_PREFIX + id); if (!raw) return false;
    const o = JSON.parse(raw); if (!validateState(o.state)) return false;
    S = migrate(o.state); sanitize(); CUR_SLOT = id; lsSet(CUR_SLOT_KEY, id);
    return true;
  } catch(e){ console.warn("save inválido", e); return false; }
}
function deleteSlot(id){
  lsDel(SLOT_PREFIX + id); writeSlots(listSlots().filter(x => x.id !== id));
  if (CUR_SLOT === id){ CUR_SLOT = null; lsDel(CUR_SLOT_KEY); }
}
function startNewSlot(){ CUR_SLOT = newSlotId(); }
const slotsFull = () => listSlots().length >= MAX_SLOTS;

/* ---------- Hall dos legados ---------- */
function readHall(){ try { const h = JSON.parse(lsGet(HALL_KEY)); return h && Array.isArray(h.lives) ? h : { lives:[], ach:{} }; } catch(e){ return { lives:[], ach:{} }; } }
function recordHall(){
  if (NO_PERSIST || !S || !S.final) return;
  const p = P(), h = readHall();
  h.lives.unshift({ name:`${p.first} ${p.last}`, gender:p.gender, tone:S.look?.tone || "", title:S.final.title, score:S.final.score?.total ?? 0, age:p.age, cause:p.cause,
    born:p.birthYear, died:p.birthYear + p.age, country:p.country, cls:DATA.classes[p.cls]?.name, nw:S.final.netWorth, ach:S.achievements.length, ts:Date.now() });
  h.lives = h.lives.slice(0, 80);
  for (const a of S.achievements) h.ach[a.text] = num(h.ach[a.text]) + 1;
  lsSet(HALL_KEY, JSON.stringify(h));
}

function exportSave(){
  const blob = new Blob([JSON.stringify({ v:SAVE_VERSION, state:S }, null, 1)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `claudilife-${P().first}-${P().last}-${P().age}anos.json`.replace(/\s+/g,"_");
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function importSave(file, done){
  const fr = new FileReader();
  fr.onload = () => { try { const o = JSON.parse(fr.result); const st = o.state || o; if (!validateState(st)) throw 0; S = migrate(st); sanitize(); startNewSlot(); saveGame(true); done(true); } catch(e){ done(false); } };
  fr.readAsText(file);
}
</script>

<script>/* src/generators/people.js */
"use strict";
/* generators/people.js */

function genName(c, gender){ return { first: pick(c.first[gender==="M"?"m":"f"]), last: pick(c.last) }; }

function makeNPC(role, c, opts={}){
  const gender = opts.gender || (chance(0.5)?"M":"F");
  const n = genName(c, gender);
  return {
    uid: uid(), role, gender,
    first: opts.first || n.first, last: opts.last || n.last,
    age: num(opts.age, 0), rel: clamp(num(opts.rel, rint(40,80))), alive: true,
    job: opts.job || null, looks: clamp(opts.looks ?? rint(20,95)), since: S ? S.player.age : 0,
    money: num(opts.money, 0), craziness: rint(0,100), generous: rint(0,100),
    personality: opts.personality || pick(DATA.personalities).id,
    wealth: opts.wealth ?? weighted([0,1,2,3,4], k => [12,30,35,17,6][k]),
    respect: clamp(num(opts.respect, rint(35,70))),
    history: [],
  };
}
/* Registra uma interação no histórico do NPC (exibido na ficha da pessoa). */
function remember_npc(r, text){
  if (!r) return; r.history = r.history || [];
  r.history.push({ age: P().age, text }); if (r.history.length > 25) r.history.shift();
}
const personalityOf = r => byId(DATA.personalities, r.personality) || DATA.personalities[5];
/* Ocupação legível por idade (NPCs sem carreira simulada). */
function npcJobFor(age){
  if (age < 6) return null; if (age < 18) return "Estudante"; if (age >= 67) return "Aposentado(a)";
  return pick(["Professor(a)","Engenheiro(a)","Vendedor(a)","Designer","Enfermeiro(a)","Advogado(a)","Autônomo(a)","Programador(a)","Motorista","Cozinheiro(a)","Comerciante","Bancário(a)","Desempregado(a)","Policial","Corretor(a)"]);
}

function rollTraits(first){
  const out = byId(DATA.traits, first) ? [first] : []; // traço inicial escolhido no hub
  const pool = DATA.traits.filter(t => t.id !== first);
  const n = rint(2,3);
  while (out.length < n && pool.length){
    const t = pool.splice(Math.floor(rand()*pool.length),1)[0];
    if (out.some(o => o === t.opp || byId(DATA.traits,o)?.opp === t.id)) continue;
    out.push(t.id);
  }
  return out;
}

/* Gênero do(a) pretendente conforme a orientação. "Em descoberta" segue as
   inclinações já mostradas nas escolhas (systems/identity.js). */
function partnerGender(){
  const o = P().orientation, g = P().gender, other = g==="M"?"F":"M";
  if (o === "hetero") return other;
  if (o === "homo") return g;
  if (o === "descobrindo"){ const I = S.identity || {}; const so = num(I.other) + 1, ss = num(I.same) + 1; return chance(so/(so+ss)) ? other : g; }
  return chance(0.5) ? "M" : "F";
}

function makePartner(ageDelta=[-4,4], rel=[55,80]){
  const p = makeNPC("partner", country(), { gender: partnerGender(), age: Math.max(14, P().age + rint(...ageDelta)), rel: rint(...rel) });
  p.since = P().age; p.job = P().age >= 20 ? pick(["Professor(a)","Engenheiro(a)","Vendedor(a)","Designer","Enfermeiro(a)","Advogado(a)","Autônomo(a)","Programador(a)","Chef","Arquiteto(a)"]) : null;
  p.money = wageOf(rint(0, 60000) * (P().age/30));
  return p;
}

<script>/* src/generators/life.js */
"use strict";
/* generators/life.js */

/* Cria um estado inteiro novo. opts permite "Personalizar Nascimento"
   e também "continuar como herdeiro" (inheritFrom). */
function newLife(opts = {}){
  const prev = S;
  S = { seed: (opts.seed ?? (Math.random()*2**31)|0) };
  const c = byId(DATA.countries, opts.country) || pick(DATA.countries);
  const gender = opts.gender || (chance(0.5)?"M":"F");
  const nm = genName(c, gender);
  // classe social: SEMPRE sorteada (opts.cls só existe para herdeiros e testes)
  const clsId = opts.cls ?? weighted(DATA.classes, k => k.weight).id;
  const cls = DATA.classes[clsId];
  const birthYear = opts.birthYear || (prev && opts.heir ? prev.player.birthYear + prev.player.age : 2000 + rint(0,6));

  Object.assign(S, {
    version: SAVE_VERSION, lifeNo: (prev?.lifeNo || 0) + 1,
    lineage: prev && opts.heir ? [...(prev.lineage||[]), summarizeLife(prev)] : (opts.keepLineage && prev ? prev.lineage : []),
    priceIndex: 1, money: 0,
    player: {
      first: opts.first || nm.first, last: opts.last || (opts.heirLast) || nm.last, gender,
      orientation: opts.orientation || "descobrindo", // definida ao longo da adolescência (systems/identity.js)
      country: c.id, city: c.cities.includes(opts.city) ? opts.city : pick(c.cities),
      ethnicity: opts.ethnicity || pick(DATA.ethnicities), eyes: opts.eyes || pick(DATA.eyes), hair: opts.hair || pick(DATA.hair),
      birthYear, age: 0, alive: true, cause: null, cls: clsId, clsScale: 9,
      stats: { health: clamp(rint(70,100) - (cls.band === 0 ? rint(5,15) : 0)), happiness: rint(65,100), intelligence: clamp(rint(15,90)+cls.eduBonus/2), looks: rint(10,95) },
      fame: 0, notoriety: 0, karma: 50,
      traits: opts.traits || rollTraits(opts.trait),
      talents: { music: rint(0,100), acting: rint(0,100), sport: rint(0,100) },
      lifestyle: 1, // 0 econômico,1 normal,2 confortável,3 luxuoso
    },
    edu: { level: 0, school: null, yearsLeft: 0, perf: 60, major: null, degrees: [], techs: [], debt: 0, dropped:false },
    job: null, partTime: null, retired: false, pension: 0, jobHistory: [], unemployedYears: 0,
    businesses: [], properties: [], rental: null, vehicles: [], investments: {}, loans: [],
    rels: [], prison: null, parole: 0, record: [], illnesses: [],
    log: [], achievements: [], flags: {}, cooldown: {}, queue: [], yearSummary: null,
    activitiesThisYear: 0, gymYears: 0, createdAt: Date.now(),
  });
  if (opts.tone !== undefined) S.look = { tone: opts.tone };
  if (opts.orientation) S.identity = { other:0, same:0, both:0, none:0, pan:0, steps:0, resolved:true };
  ensureState(S);
  // predisposição genética: herdada da família, multiplica o risco de certas doenças
  S.health.genetic = DATA.illnesses.filter(d => !["flu","depress"].includes(d.id) && chance(0.12)).map(d => d.id);
  if (hasTrait("genius")) addStat("intelligence", 15);
  if (hasTrait("athletic")) { addStat("health", 8); P().talents.sport = clamp(P().talents.sport + 25); }
  if (hasTrait("creative")) { P().talents.music = clamp(P().talents.music + 15); P().talents.acting = clamp(P().talents.acting + 15); }

  // Pais / responsáveis
  const parentJobs = ["Pedreiro","Professora","Vendedor","Enfermeira","Motorista","Contador","Advogada","Engenheiro","Médica","Empresário","Autônomo","Funcionário Público","Desempregado","Cozinheiro","Diarista"];
  const famLast = P().last;
  const singleParent = chance(clsId <= 1 ? 0.25 : 0.1);
  const mother = makeNPC("mother", c, { gender:"F", age: rint(18,40), last: chance(0.5)?famLast:pick(c.last), job: pick(parentJobs), rel: rint(55,100) });
  S.rels.push(mother);
  if (!singleParent){
    S.rels.push(makeNPC("father", c, { gender:"M", age: mother.age + rint(-3,8), last: famLast, job: pick(parentJobs), rel: rint(45,100) }));
  }
  if (opts.heir && prev){ // herdeiro: o pai/mãe é o personagem anterior (já falecido)
    const p = S.rels[0]; p.first = prev.player.first; p.last = prev.player.last; p.gender = prev.player.gender;
    p.role = prev.player.gender === "F" ? "mother" : "father";
  }
  const nSib = weighted([0,1,2,3], k => [30,40,20,10][k]);
  for (let i=0;i<nSib;i++) S.rels.push(makeNPC("sibling", c, { age: rint(1,12), last: famLast, rel: rint(35,85) }));
  for (const r of S.rels) if (r.role === "sibling" && chance(0.5)) r.age = 0, r.unborn = rint(1,6);

  // Herança direta (continuar como herdeiro)
  if (opts.inheritance) { S.trustFund = Math.round(opts.inheritance); }

  log(`Nasci ${gender==="M"?"menino":"menina"} em ${P().city}, ${c.name}, no ano ${birthYear}. Me chamaram de ${P().first} ${P().last}.`, "milestone");
  log(`Família de ${cls.name}. Moramos em: ${cls.home}.`);
  if (cls.id === 8){ S.trustFund = num(S.trustFund) + priceOf(rint(3e6, 1.2e7)); remember("Nasci com um fundo fiduciário milionário — liberado aos 18 anos.", "good"); }
  if (cls.band === 0) remember(`Nascer em ${cls.name.toLowerCase()} pesa: saúde frágil, escola difícil e pouco acesso a médicos.`, "bad");
  const tnames = P().traits.map(t => byId(DATA.traits,t).name).join(", ");
  log(`Temperamento: ${tnames}.`);
  if (S.health.genetic.length) remember(`Histórico familiar de ${S.health.genetic.map(id=>byId(DATA.illnesses,id).name).join(", ")} — check-ups regulares importam.`, "warn");
  return S;
}
</script>

<script>/* src/events/approach.js */
"use strict";
/* =====================================================================
   events/approach.js — ABORDAGENS: alguém vem até você.
   Regra de design: o jogo NUNCA decide pelo jogador. Toda abordagem
   mostra a ficha da pessoa (ctx.npc), um balão de fala (speech) e opções
   explícitas: aceitar / recusar / negociar / investigar / ignorar.
   "Investigar" gasta energia e revela personalidade e situação
   financeira reais — e devolve a mesma proposta para você decidir.
   ===================================================================== */
function approachNPC(role, opts = {}){
  const n = makeNPC(role, country(), { age: Math.max(16, P().age + rint(-8, 8)), ...opts });
  n.job = n.job || npcJobFor(n.age); n.since = P().age;
  return n;
}
/* Opção padrão de investigação: revela a ficha e re-enfileira a proposta. */
function investigateChoice(id){
  return { label:"🔍 Investigar antes de decidir", hint:"gasta 1 de energia: revela personalidade e finanças", run:c=>{
    if (c.revealed) return "Você já sabe tudo que dava para saber.";
    if (!spendEnergy()) return "Sem energia para investigar este ano — decida no escuro.";
    c.revealed = true; const p = byId(DATA.personalities, c.npc.personality);
    S.queue.splice(1, 0, { id, ctx:c });
    return `Pesquisei: ${c.npc.first} é ${p.name.toLowerCase()} (${p.desc.toLowerCase()}) e está ${DATA.wealthLevels[c.npc.wealth].toLowerCase()}.${p.scam ? " Tem histórico de golpes. ⚠️" : ""}`;
  }};
}
const ignoreChoice = (txt = "Ignorar") => ({ label:`🙈 ${txt}`, run:()=> "Deixei pra lá." });

EVENTS.push(
{ id:"ev_approach_date", emoji:"💬", title:"Alguém se aproximou", age:[16,85], weight:()=> partner() ? 0.25 : P().orientation === "ace" ? 0.4 : 1.6, cd:2,
  setup:()=>({ npc: approachNPC("partner", { gender: partnerGender(), age: Math.max(16, P().age + rint(-6,6)) }), line: approachLine("date") }),
  speech:c=> c.line,
  text:c=> `${c.npc.first}, ${c.npc.age} anos, puxou papo com você${partner() ? " — e você não está solteiro(a)." : "."}`,
  choices:c=>[
    { label:"💘 Aceitar sair", hint: partner() ? "pode custar seu relacionamento atual" : "", run:()=>{
        const p = 0.55 - (c.npc.looks - P().stats.looks)/150 + (hasTrait("charismatic")?0.12:0);
        if (!chance(clamp(p*100, 10, 90)/100)) return `O encontro foi constrangedor. Não rolou química com ${c.npc.first}.` + fx({happiness:-2});
        const old = partner();
        if (old){ old.rel = clamp(old.rel - 30); remember_npc(old, "Descobriu uma traição"); if (chance(0.55)){ if (old.role==="spouse") divorce(old, true); else { old.role = "ex"; } return `Comecei a sair com ${c.npc.first}… e ${old.first} descobriu. Acabou.` + fx({happiness:-8}); } }
        if (!partner()){ c.npc.role = "partner"; c.npc.rel = rint(55,75); remember_npc(c.npc, "Primeiro encontro"); S.rels.push(c.npc); log(`Comecei a namorar ${c.npc.first} ${c.npc.last}. 💕`, "good"); return `Que noite! Você e ${c.npc.first} estão namorando.` + fx({happiness:10}); }
        return `Saímos escondido. Ninguém soube… por enquanto.` + fx({happiness:4}) + (addStress(8), "");
      } },
    { label:"📱 Pegar o contato, sem compromisso", run:()=>{ c.npc.role = "friend"; c.npc.rel = rint(30,50); remember_npc(c.npc, "Trocamos contato"); S.rels.push(c.npc); return `Agora ${c.npc.first} está nos seus contatos.`; } },

/* Sociedade: cria negócio com participação; sócio interesseiro pode sumir com o dinheiro. */
function partnerBusiness(c, share){
  if (!canAfford(c.amt)) return "Você não tem esse dinheiro disponível.";
  addMoney(-c.amt);
  const d = byId(DATA.businesses, c.biz), p = byId(DATA.personalities, c.npc.personality);
  if (p.scam && chance(p.scam)){ remember(`${c.npc.first} sumiu com ${fmt(c.amt)} do "negócio".`, "bad"); addStress(10); return `${c.npc.first} sumiu com o dinheiro. Era golpe.` + fx({happiness:-10}); }
  S.businesses.push({ uid:uid(), id:d.id, country:P().country, name:`${d.name} ${c.npc.last} & ${P().last}`, value:Math.round(c.amt/share*0.8*share),
    revenue:Math.round(priceOf(d.revenue)*rfloat(0.4,0.8)*share), years:0, lastProfit:0, share, partner:c.npc.first });
  c.npc.role = "friend"; c.npc.rel = 55; remember_npc(c.npc, "Sócio(a) em um negócio"); S.rels.push(c.npc);
  log(`🤝 Abri ${d.name} em sociedade com ${c.npc.first} (${Math.round(share*100)}% meu).`, "milestone");
  return `Sociedade fechada: ${Math.round(share*100)}% de ${d.name}.`;
}
</script>
<script>/* src/events/underworld.js */
"use strict";
/* events/underworld.js — eventos do crime organizado (todos perguntam ao jogador). */
const crewMember = uid => S.org?.members.find(m => m.uid === uid);
EVENTS.push(
{ id:"ev_police_raid", emoji:"🚨", title:"Operação policial", age:[14,120], weight:0, cond:()=> !!S.org && !inPrison(),

        S.org.members = S.org.members.filter(x=>x!==m); for (const x of S.org.members) x.loyalty = clamp(x.loyalty - 12);

{ id:"ev_betrayal", emoji:"🐀", title:"Traidor na organização", age:[14,120], weight:0, cond:c=> !!S.org,

    { label:"🙏 Conversar e perdoar", run:()=>{ const m = crewMember(c.uid); if (m && chance(0.4)){ m.loyalty = clamp(m.loyalty + 25); return "Ele chorou, pediu desculpas e jurou lealdade."; } S.org.heat = clamp(S.org.heat + 30); if (m) S.org.members = S.org.members.filter(x=>x!==m); return "Perdoei… e ele delatou do mesmo jeito. A polícia sabe demais agora."; } },
  ]},
{ id:"ev_rival_war", emoji:"⚔️", title:"Guerra de facções", age:[14,120], weight:0, cond:()=> !!S.org && S.org.rank === DATA.orgRanks.length-1,

    { label:"🥊 Acertar as contas pessoalmente com o chefe deles", hint:"combate mano a mano · pode terminar em morte", run:()=>{ startFight("rival", { rival:c.name }); return `Marquei um encontro sem testemunhas com o chefe de ${c.name}.`; } },
    { label:"🔫 Revidar", hint:`chance ~${Math.round(Math.min(90, orgPower()/(orgPower()+c.power)*100))}%`, run:()=>{
        const win = chance(orgPower()/(orgPower()+c.power)); S.org.heat = clamp(S.org.heat + 20);
        const lost = S.org.members.filter(()=>chance(0.25)); S.org.members = S.org.members.filter(m=>!lost.includes(m));

{ id:"ev_org_task", emoji:"📦", title:"Serviço da organização", age:[14,120], weight:0, cond:()=> !!S.org && !isBoss() && !inPrison(),

    { label:"✅ Cumprir a tarefa", run:()=>{ if (chance(0.75 + S.crimeSkill/400)){ S.org.respect = clamp(S.org.respect + rint(6,12)); S.crimeSkill = clamp(S.crimeSkill+2); const g = priceOf(rint(1000,5000)); S.dirty += g; S.stats.dirtyEarned += g; return `Feito. Ganhei respeito e ${fmt(g)} sujos.`; } emit("siren"); if (chance(0.5)){ sendToPrison(rint(1,3), "tráfico de mercadoria ilegal"); return "Caí numa blitz com a encomenda."; } return "Deu errado e o chefe ficou puto." + (S.org.respect = clamp(S.org.respect-10), ""); } },
    { label:"✋ Recusar", hint:"respeito despenca", run:()=>{ S.org.respect = clamp(S.org.respect - 15); if (chance(0.2)) return "Recusei. Me lembraram, de um jeito nada gentil, quem manda." + injure(8, "O \"recado\" da organização", 0.2); return "Recusei. Fui ficando de escanteio."; } },
    { label:"🚪 Pedir para sair da organização", run:()=> leaveOrg().msg },
  ]},
{ id:"ev_tax_audit", emoji:"🧾", title:"Auditoria da Receita", age:[18,120], weight:0, cond:()=> !inPrison(),
  text:()=> `A Receita Federal estranhou o faturamento dos seus negócios (${fmt(S.stats.laundered)} movimentados).`,
  choices:()=>[
    { label:"🧑‍💼 Contratar tributarista", hint:"caro", run:()=>{ addMoney(-priceOf(15000)); if (chance(0.6)) return "A contabilidade criativa passou pela auditoria."; const fine = Math.round(S.money*0.3); addMoney(-fine); return `Multa pesada de ${fmt(fine)}.`; } },

  ]},

/* Resultado de uma batida: chance de prisão do jogador + desmonte parcial. */
function raidOutcome(pPrison){
  S.org.ops = S.org.ops.filter(()=>chance(0.6)); S.org.members = S.org.members.filter(()=>chance(0.75)); S.dirty = Math.round(S.dirty * 0.5);
  if (P().age >= 18 && chance(pPrison * (isBoss() ? 1 : 0.6))){ sendToPrison(rint(3, isBoss() ? 15 : 6), "associação criminosa"); return " Fui preso(a)."; }
  S.org.heat = clamp(S.org.heat - 10); return " Perdi operações, capangas e metade do dinheiro sujo, mas escapei.";
}

{ id:"ev_phone_broke", emoji:"📱", title:"Celular quebrou", age:[12,90], weight:1, cd:4,

{ id:"ev_identity_theft", emoji:"🕵️", title:"Golpe no seu nome", age:[18,95], weight:()=> 0.7 * country().crime, cd:8,

{ id:"ev_flood", emoji:"🌧️", title:"Enchente", age:[18,95], weight:()=> S.properties.some(p=>!isAbroad(p)) ? 0.8 : 0.3, cd:6,
