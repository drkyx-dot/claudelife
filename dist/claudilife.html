  text:c=> c.uid ? `Uma enchente atingiu ${byId(DATA.properties, S.properties.find(p=>p.uid===c.uid)?.id || "house")?.name || "sua casa"}.` : "Uma enchente alagou sua rua e estragou móveis.",
  choices:c=>[
    { label:"🛠️ Reformar já", run:()=>{ const p = S.properties.find(p=>p.uid===c.uid); if (p){ p.condition = clamp(num(p.condition,100)-25); return renovate(p.uid).msg; } return "Comprei móveis novos." + fx({money:-priceOf(2000)}); } },

{ id:"ev_wedding_invite", emoji:"💒", title:"Convite de casamento", age:[20,80], weight:()=> S.rels.some(r=>r.role==="friend"&&r.alive) ? 0.9 : 0, cd:3,
  setup:()=>{ const f = pick(S.rels.filter(r=>r.role==="friend"&&r.alive)); return { uid:f.uid, name:f.first, gift: priceOf(rint(100,600)) }; },
  speech:c=> say(`Você TEM que ir no meu casamento, hein! Se faltar, eu nunca te perdoo.`),
  text:c=> `${c.name} vai casar e te chamou para ser padrinho/madrinha.`,
  choices:c=>[

    { label:"🙏 Ir sem gastar muito", run:()=>{ const f = relBy(c.uid); if (f) f.rel = clamp(f.rel+5); return "Fui, dancei, comi bem." + fx({money:-Math.round(c.gift/4), happiness:4}); } },
    { label:"🚫 Inventar uma desculpa", run:()=>{ const f = relBy(c.uid); if (f) { f.rel = clamp(f.rel-18); remember_npc(f, "Faltei ao casamento dele(a)"); } return `${c.name} ficou magoado(a).`; } },

{ id:"ev_tax_refund", emoji:"💸", title:"Restituição do imposto", age:[18,95], weight:()=> S.job ? 0.8 : 0, cd:3,

{ id:"ev_car_breakdown", emoji:"🛞", title:"Carro quebrou", age:[18,95], weight:()=> S.vehicles.some(v=>!isAbroad(v) && v.age > 4) ? 1.2 : 0, cd:3,
  setup:()=>{ const v = pick(S.vehicles.filter(v=>!isAbroad(v) && v.age > 4)); return { uid:v.uid, amt: Math.round(fxConv(v.value, v.country)*rfloat(0.08,0.25) + priceOf(300)) }; },
  text:c=> `O motor do seu ${byId(DATA.vehicles, S.vehicles.find(v=>v.uid===c.uid)?.id || "compact").name} fundiu. Conserto: ${fmt(c.amt)}.`,
  choices:c=>[
    { label:"🔧 Consertar", run:()=> "Carro de volta à estrada." + fx({money:-c.amt}) },

{ id:"ev_food_poison", emoji:"🤢", title:"Intoxicação alimentar", age:[5,95], weight:0.7, cd:5,

    { label:"🛌 Aguentar em casa", run:()=> "Dois dias de agonia." + fx({health:-6, happiness:-3}) },

{ id:"ev_inflation_shock", emoji:"🛒", title:"Tudo mais caro", age:[18,95], weight:()=> S.world.inflation > 0.06 ? 2 : 0, cd:3,

<script>/* src/events/combat.js */
"use strict";
/* =====================================================================
   events/combat.js — eventos de luta, homicídio, prisão e fuga.
   Toda briga abre o modal de combate (startFight); toda fuga abre o
   minigame (startEscape). Os eventos sempre perguntam ao jogador.
   ===================================================================== */
EVENTS.push(
/* Desafio num bar: alguém quer brigar com você */
{ id:"ev_fight_challenge", emoji:"🍺", title:"Desafio no bar", age:[16,70], weight:()=> (P().notoriety > 20 || bestMastery() > 30 ? 0.9 : 0.4) * country().crime, cd:3, cond:()=>!inPrison(),
  setup:()=>({ npc: approachNPC("acquaintance", { personality: pick(["hothead","hothead","ambitious","schemer"]) }) }),
  speech:()=> say(pick(["Tá olhando o quê, porra? Vamos resolver lá fora.","Ouvi dizer que você é bom de briga. Prova.","Você esbarrou em mim, mané. Vai pedir desculpa ou vai apanhar?"])),
  text:c=> `${c.npc.first}, ${c.npc.age} anos, já bebeu demais e quer briga.`,
  choices:c=>[
    { label:"🥊 Aceitar a briga", hint:"abre o combate", run:()=>{ startFight("street", { npc:c.npc }); return `Fui lá pra fora com ${c.npc.first}.`; } },
    { label:"🗣️ Desarmar com conversa", run:()=> chance(0.5 + (hasTrait("charismatic")?0.2:0)) ? "Paguei uma cerveja e virou papo de boteco." : "Não colou. Saí do bar debaixo de xingamento." + fx({happiness:-3}) },
    investigateChoice("ev_fight_challenge"),
    ignoreChoice("Pagar a conta e ir embora"),
  ]},
/* Promotor de lutas: convite para torneio quando há maestria */
{ id:"ev_tournament_invite", emoji:"📣", title:"Convite para competir", age:[16,45], weight:()=> bestMastery() >= 25 ? 1.1 : 0, cd:2, cond:()=>!inPrison() && !!bestArt(),
  setup:()=>{ const art = bestArt(), m = mastery(art), t = [...DATA.tournaments].reverse().find(t => m >= t.minM) || DATA.tournaments[0];
    return { npc: approachNPC("acquaintance", { job:"Promotor(a) de lutas", personality: pick(["ambitious","greedy","calm"]) }), art, tid:t.id }; },
  speech:c=> `Tenho visto você treinar. Tem vaga no ${byId(DATA.tournaments,c.tid).name}. Topa?`,
  text:c=> { const t = byId(DATA.tournaments,c.tid); return `${t.emoji} ${t.name} · ${t.fights} luta(s) · prêmio até ${fmt(priceOf(t.prize[1]))} · modalidade ${byId(DATA.martialArts,c.art).name}.`; },
  choices:c=>[
    { label:"🥊 Aceitar e lutar", hint: tournamentBlock(byId(DATA.tournaments,c.tid), c.art) || "abre o combate", run:()=>{ const t = byId(DATA.tournaments,c.tid), why = tournamentBlock(t, c.art); if (why) return `Não deu: ${why}.`; if (adult()) addMoney(-priceOf(t.fee)); startFight("tournament", { tid:t.id, art:c.art, idx:0 }); return `Subi no ringue do ${t.name}.`; } },
    investigateChoice("ev_tournament_invite"),
    { label:"✋ Recusar", run:()=> "Ainda não é a minha hora." },
  ]},
/* Vingança da família/aliados de alguém que você matou */
{ id:"ev_revenge", emoji:"🩸", title:"Vingança", age:[12,120], weight:0, cond:()=>!inPrison(),
  speech:c=> say(`Você matou ${c.name}. Achou que ia ficar por isso mesmo, desgraçado(a)?`),
  text:c=> `${c.kin[0].toUpperCase() + c.kin.slice(1)} de ${c.name} te encontrou.`,
  choices:c=>[
    { label:"🥊 Encarar", hint:"abre o combate · eles vêm para matar", run:()=>{ startFight("revenge", { victim:c.name }); return "Não vou correr."; } },
    { label:"💵 Oferecer dinheiro pela paz", hint:`${fmt(priceOf(15000))}`, run:()=>{ const v = priceOf(15000); if (!canAfford(v)) return "Não tinha o dinheiro. Levei uma surra e um aviso." + injure(rint(10,20), "A surra da vingança", 0.3); addMoney(-v); return chance(0.6) ? "Aceitaram. Mas o ódio continua no olhar." : (schedule("victimRevenge", rint(2,4), c), "Pegaram o dinheiro… e prometeram voltar."); } },
    { label:"🏃 Fugir e sumir por um tempo", run:()=>{ addStress(10); schedule("victimRevenge", rint(2,5), c); return "Escapei por hoje. Eles vão continuar procurando."; } },
    { label:"🚓 Pedir proteção à polícia", hint:"eles vão fazer perguntas", run:()=>{ addNoto(5); if (chance(0.3)){ schedule("homicideCase", 1, { name:c.name, label:"homicídio", years:rint(8,15), p:0.5 }); return "A polícia me protegeu — e reabriu o caso da morte."; } return "Botaram uma viatura na porta por umas semanas."; } },
  ]},
/* Investigação de homicídio (consequência agendada) */
{ id:"ev_murder_probe", emoji:"🕵️", title:"Investigação de homicídio", age:[12,120], weight:0, cond:()=>!inPrison(),
  speech:()=> say("A gente sabe que você estava lá. Vai facilitar ou vai complicar?"),
  text:c=> `A Polícia Civil chegou em você pela morte de ${c.name}. Chance atual de condenação: ${Math.round(c.p*100)}%.`,
  choices:c=>[
    { label:"⚖️ Contratar advogado criminalista", hint:`${fmt(priceOf(25000))} · −35% de chance`, run:()=>{ const v = priceOf(25000); if (!canAfford(v)) return "Sem dinheiro para um bom advogado. A defensoria fez o que pôde." + murderTrial(c, 0); addMoney(-v); return "Meu advogado desmontou metade das provas." + murderTrial(c, 0.35); } },
    { label:"🤝 Confessar (pena reduzida)", run:()=>{ const y = Math.max(2, Math.round(c.years*0.6)); P().karma = clamp(P().karma+12); addStress(-10); sendToPrison(y, c.label + " (réu confesso)"); return `Confessei. ${y} anos, mas a consciência ficou um pouco mais leve.`; } },
    { label:"💵 Comprar o silêncio das testemunhas", hint:"dinheiro sujo · pode virar mais um crime", run:()=>{ const v = priceOf(20000); if (S.dirty < v) return "Não tinha dinheiro sujo bastante." + murderTrial(c, 0); S.dirty -= v; if (chance(0.25)){ addNoto(15); return "Uma testemunha gravou a oferta." + murderTrial({ ...c, years:c.years+4 }, -0.2); } return "As testemunhas \"esqueceram\" o que viram." + murderTrial(c, 0.5); } },
    { label:"✈️ Fugir do país antes do indiciamento", run:()=>{ const dest = pick(DATA.countries.filter(x=>x.id!==P().country)); if (chance(0.6)){ const from = P().country; emigrate(dest.id, true); S.wanted = { since:P().age, remaining:c.years, crime:c.label, fakeId:false, country:from, years:0, security:"máxima" }; return `Fugi para ${dest.name}. Tenho mandado de prisão internacional nas costas.`; } sendToPrison(c.years + 3, c.label + " + tentativa de fuga"); return "Fui preso(a) no aeroporto."; } },
    { label:"🙅 Negar tudo", run:()=> "Fiquei calado(a)." + murderTrial(c, 0) },
  ]},
/* Contrato de execução (crime organizado) */
{ id:"ev_hit_contract", emoji:"🎯", title:"Um contrato", age:[18,70], weight:()=> S.org && S.org.rank >= 1 ? 0.7 : 0, cd:3, cond:()=>!!S.org && !inPrison(),
  setup:()=>({ npc: approachNPC("acquaintance", { personality:"schemer", wealth:4 }), target: genName(country(), chance(0.8)?"M":"F"), pay: priceOf(rint(20000, 80000)), cop: chance(0.15) }),
  speech:()=> say("Tem um cara atrapalhando os negócios. Quero ele fora do caminho. Definitivamente."),
  text:c=> `${c.npc.first} oferece ${fmt(c.pay)} (sujo) para eliminar ${c.target.first} ${c.target.last}.`,
  choices:c=>[
    { label:"🎯 Aceitar o serviço", hint:"abre o combate · intenção de matar", run:()=>{ if (c.cop && chance(0.5)){ sendToPrison(rint(8,15), "tentativa de homicídio (flagrante armado)", "máxima"); return "O \"alvo\" era policial disfarçado. Era uma armadilha."; } startFight("hit", { pay:c.pay, npc:{ first:c.target.first, last:c.target.last, age:rint(25,60), personality:pick(DATA.personalities).id } }); return `Esperei ${c.target.first} sair de casa.`; } },
    { label:"🔍 Levantar a ficha do alvo", hint:"gasta 1 de energia", run:()=>{ if (!spendEnergy()) return "Sem energia para investigar."; S.queue.splice(1, 0, { id:"ev_hit_contract", ctx:{ ...c, revealed:true } }); return c.cop ? "⚠️ O alvo tem ligação com a polícia. Cheiro de armadilha." : `${c.target.first} é só um comerciante com dívidas com a gente.`; } },
    { label:"✋ Recusar", hint:"respeito na organização cai", run:()=>{ S.org.respect = clamp(S.org.respect - 6); return say("\"Achei que você tinha estômago. Me enganei.\""); } },
  ]},
/* ---------- Prisão ---------- */
{ id:"ev_prison_fight", emoji:"🔪", title:"Acerto no pátio", age:[0,120], weight:0, prison:true,
  setup:()=>({ npc:{ first: genName(country(),"M").first, last:"", age:rint(20,50), personality: pick(["hothead","schemer","ambitious"]), nick: pick(["Caveira","Tanque","Magrelo","Bigode","Neguinho","Alemão","Gordo","Tatu"]) } }),
  speech:c=> say(pick(["Aqui quem manda sou eu, ô novato. Passa tua marmita.","Você me deve respeito, porra. Vou te ensinar.","Ouvi que você anda falando de mim…"])),
  text:c=> `"${c.npc.nick}" e dois comparsas te cercaram no pátio.`,
  choices:c=>[
    { label:"🥊 Lutar", hint:"abre o combate · pode haver estilete", run:()=>{ startFight("prison", { npc:c.npc, attacked:true }); return "Encostei na parede e levantei a guarda."; } },
    { label:"🧾 Pagar \"proteção\"", hint:`${fmt(priceOf(600))}`, run:()=>{ const v = priceOf(600); if (!canAfford(v)) return "Sem dinheiro. Apanhei." + injure(rint(6,14), "A surra no pátio", 0.2); addMoney(-v); return "Paguei. Por enquanto, me deixam em paz." + fx({happiness:-3}); } },
    { label:"👮 Chamar os agentes", hint:"X-9 tem vida curta", run:()=>{ if (chance(0.4)){ addStress(15); return "Me tiraram do pavilhão… mas agora sou \"o X-9\"." + injure(rint(5,12), "A emboscada contra o X-9", 0.2); } return "Os agentes separaram. Fiquei marcado(a)."; } },
  ]},
{ id:"ev_escape_plan", emoji:"🗝️", title:"Plano de fuga", age:[0,120], weight:0, prison:true,
  setup:()=>({ npc:{ first: genName(country(),"M").first, last:"", age:rint(22,55), personality: pick(["schemer","loyal","calm"]), nick: pick(["Rato","Professor","Toupeira","Chave"]) } }),
  speech:()=> say("Mapeei a ronda dos guardas. Sei onde a câmera falha. Tá dentro?"),
  text:c=> `"${c.npc.nick}" tem um plano: com a ajuda dele, a fuga fica mais fácil (−1 de dificuldade).`,
  choices:c=>[
    { label:"🏃 Topar e fugir agora", hint: escapeBlock() || "minigame de fuga facilitado", run:()=>{ const r = startEscape(1); return r.msg; } },
    { label:"🐀 Delatar o plano à direção", hint:"reduz a pena, vira alvo", run:()=>{ if (S.prison) S.prison.years = Math.max(1, S.prison.years - 1); addStress(10); P().karma = clamp(P().karma - 5); if (chance(0.35)) return "Ganhei 1 ano de redução… e uma facada no banho." + injure(rint(8,18), "A vingança pela delação", 0.3); return "Ganhei 1 ano de redução da pena."; } },
    { label:"✋ Recusar", run:()=> "Prefiro cumprir minha pena em paz." },
  ]},
/* ---------- Foragido(a) ---------- */
{ id:"ev_fugitive", emoji:"🚨", title:"Vida de foragido(a)", age:[0,120], weight:0, cond:()=> !!S.wanted && !inPrison(),
  text:()=> `Você está foragido(a) há ${S.wanted.years} ano(s). Chance de recaptura este ano: ${Math.round(recaptureChance()*100)}%.${S.wanted.fakeId ? " Você usa identidade falsa." : ""}`,
  speech:()=> say("Vi teu rosto na TV, no Linha Direta… cê tem que sumir, mano."),
  choices:()=>[
    { label:"🪪 Comprar identidade falsa", hint:`${fmt(priceOf(9000))} · −55% de chance de recaptura`, run:()=> buyFakeId().msg },
    { label:"✈️ Fugir para outro país (coiote)", hint:`${fmt(priceOf(4000))} · −65% de chance de recaptura`, run:()=>{ const v = priceOf(4000); if (!canAfford(v)) return "Sem dinheiro para o coiote."; addMoney(-v); const dest = pick(DATA.countries.filter(x=>x.id!==P().country)); emigrate(dest.id, true); return `Cruzei a fronteira escondido(a). Agora vivo em ${dest.name}.`; } },
    { label:"🙋 Me entregar", hint:"pena restante + 1 ano", run:()=>{ const W = S.wanted; S.wanted = null; P().karma = clamp(P().karma+8); sendToPrison(W.remaining + 1, `${W.crime} (apresentou-se)`, W.security || "média"); return "Cansei de fugir. Me apresentei à polícia."; } },
    { label:"🤫 Ficar na moita", run:()=>{ addStress(4); return "Mudei o cabelo, troquei de bairro e não saí de casa."; } },
  ]},
);

/* Julgamento: p ajustado pela defesa (bonus reduz a chance de condenação). */
function murderTrial(c, bonus){
  const p = clamp((c.p - bonus) * 100, 3, 97) / 100;
  if (chance(p)){ sendToPrison(c.years, c.label, c.years >= 12 ? "máxima" : "média"); return ` Condenado(a) por ${c.label}: ${c.years >= 99 ? "prisão perpétua" : c.years + " anos"}.`; }
  remember(`O caso da morte de ${c.name} foi arquivado por falta de provas.`, "good");
  return " O juiz arquivou o caso por falta de provas.";
}

<script>/* src/events/class.js */
"use strict";
/* =====================================================================
   events/class.js — infância e juventude marcadas pela CLASSE SOCIAL
   sorteada ao nascer (9 níveis em DATA.classes).
   ===================================================================== */
const clsId = () => P().cls;
EVENTS.push(
{ id:"ev_hunger", emoji:"🍞", title:"Geladeira vazia", age:[3,14], cd:3, weight:()=> clsId() <= 1 ? 1.6 : 0,
  text:()=> "Faltou comida em casa este mês. Seus pais estão fazendo o impossível.",
  speech:()=> say("Filho(a), hoje tem só arroz… amanhã a gente dá um jeito."),

<script>/* src/events/identity.js */
"use strict";
/* =====================================================================
   events/identity.js — vivências da adolescência que moldam a
   orientação sexual (systems/identity.js) e a saída do armário.
   Tudo é escolha do jogador; nada é imposto.
   ===================================================================== */
const otherWord = (plural) => P().gender === "M" ? (plural ? "garotas" : "uma garota") : (plural ? "garotos" : "um garoto");
const sameWord  = (plural) => P().gender === "M" ? (plural ? "garotos" : "um garoto") : (plural ? "garotas" : "uma garota");

EVENTS.push(
{ id:"ev_id_crush", emoji:"💭", title:"Uma paixonite", age:[11,16], once:true, weight:()=> discovering() ? 2.2 : 0,
  text:()=> "Tem alguém da escola que não sai da sua cabeça. Seu coração dispara quando essa pessoa passa.",
  speech:()=> say("Por que eu fico tão nervoso(a) perto dessa pessoa?"),
  choices:()=>[
    { label:`💘 É ${otherWord()} da minha turma`, run:()=>{ leanIdentity({ other:2 }); return "Passei o recreio inteiro tentando puxar assunto."; } },
    { label:`💘 É ${sameWord()} da minha turma`, run:()=>{ leanIdentity({ same:2 }); return "Fiquei confuso(a), mas o sentimento era real."; } },
    { label:"💞 Para ser sincero(a), são duas pessoas — de gêneros diferentes", run:()=>{ leanIdentity({ both:1.5 }); return "O coração não segue regras."; } },
    { label:"😶 Não sinto isso por ninguém. Todo mundo exagera.", run:()=>{ leanIdentity({ none:2 }); return "Prefiro meus jogos e meus amigos."; } },
    { label:"🤐 Prefiro não pensar nisso agora", run:()=> "Guardei para mim." },
  ]},
{ id:"ev_id_dance", emoji:"🪩", title:"A dança lenta", age:[14,19], once:true, weight:()=> discovering() ? 1.8 : 0,
  text:()=> "Na festa de formatura, toca uma música lenta. Duas pessoas te chamam para dançar ao mesmo tempo.",
  choices:()=>[
    { label:`🕺 Dançar com ${otherWord()}`, run:()=>{ leanIdentity({ other:1.5 }); return "Foi bonito. Fiquei com um sorriso bobo a noite toda." + fx({happiness:4}); } },
    { label:`💃 Dançar com ${sameWord()}`, run:()=>{ leanIdentity({ same:1.5 }); return "Algo fez sentido naquele momento." + fx({happiness:4}); } },
    { label:"🌈 Tanto faz quem: o que importa é a pessoa", run:()=>{ leanIdentity({ pan:1.5, both:0.5 }); return "Dancei com as duas e me diverti muito." + fx({happiness:5}); } },
    { label:"🥤 Ficar no canto conversando com amigos", run:()=>{ leanIdentity({ none:1 }); return "Dança lenta não é a minha praia."; } },
  ]},
{ id:"ev_id_reflection", emoji:"📓", title:"Diário à noite", age:[15,21], once:true, weight:()=> discovering() ? 1.6 : 0,
  text:()=> "Você escreve no diário: o que realmente te atrai em alguém?",
  choices:()=>[
    { label:`✍️ Sinto atração por ${otherWord(true)}`, run:()=>{ leanIdentity({ other:2 }); return "Escrever ajudou a organizar a cabeça."; } },
    { label:`✍️ Sinto atração por ${sameWord(true)}`, run:()=>{ leanIdentity({ same:2 }); return "Foi a primeira vez que admiti isso, mesmo que só no papel."; } },
    { label:"✍️ Me atraio por mais de um gênero", run:()=>{ leanIdentity({ both:2 }); return "Nenhuma caixinha me cabe direito."; } },
    { label:"✍️ Me atraio por pessoas, não por gêneros", run:()=>{ leanIdentity({ pan:2.5 }); return "Gênero nunca foi o que me chamou atenção."; } },
    { label:"✍️ Atração física quase não existe para mim", run:()=>{ leanIdentity({ none:2.5 }); return "Gosto de afeto e companhia, mas desejo não é a minha."; } },
  ]},
{ id:"ev_id_invite", emoji:"💌", title:"Um convite", age:[16,22], cd:2, weight:()=> discovering() ? 1.6 : 0,
  setup:()=>{ const g = chance(0.5) ? (P().gender === "M" ? "F" : "M") : P().gender; return { npc: approachNPC("acquaintance", { gender:g, age: Math.max(16, P().age + rint(-2,2)) }), same: g === P().gender }; },
  speech:c=> pick(["Quer tomar um café comigo um dia desses?","Achei você interessante. Topa sair?","Vai ter um show sábado… quer ir comigo?"]),
  text:c=> `${c.npc.first} te convidou para sair.`,
  choices:c=>[
    { label:"😊 Aceitar animado(a)", run:()=>{ leanIdentity(c.same ? { same:2 } : { other:2 }); c.npc.role = "friend"; c.npc.rel = rint(50,70); remember_npc(c.npc, "Primeiro encontro"); S.rels.push(c.npc); return `O encontro com ${c.npc.first} foi ótimo.` + fx({happiness:6}); } },
    { label:"🤔 Topar, mas sem expectativas", run:()=>{ leanIdentity(c.same ? { same:0.8, both:0.4 } : { other:0.8, both:0.4 }); return "Foi legal. Ainda estou entendendo o que senti."; } },
    { label:"🙅 Recusar: não sinto nada por essa pessoa", run:()=>{ leanIdentity(c.same ? { other:0.6 } : { same:0.6 }); return "Agradeci, mas não."; } },
    { label:"😶 Recusar: não sinto vontade de sair com ninguém", run:()=>{ leanIdentity({ none:1.5 }); return "Prefiro ficar na minha."; } },
  ]},
{ id:"ev_identity_conclusion", emoji:"🪞", title:"Me entendendo", age:[16,22], weight:0, cond:()=> discovering(),
  text:()=> "Depois de tantas experiências, você sente que começa a se entender melhor. Qual destas palavras te descreve?",
  speech:()=> say("Não preciso ter pressa… mas acho que finalmente sei quem eu sou."),
  choices:()=>[
    ...orientationCandidates().slice(0, 3).map(o => ({ label:`🏳️‍🌈 ${orientationName(o)}`, hint: o === orientationCandidates()[0] ? "o que mais combina com suas escolhas" : "", run:()=>{ setOrientation(o); return `Sou ${orientationName(o).toLowerCase()}. Dizer isso em voz alta trouxe paz.`; } })),
    { label:"⏳ Ainda estou descobrindo", run:()=> "Sem rótulos por enquanto. Tenho tempo." },
  ]},
{ id:"ev_coming_out", emoji:"🏳️‍🌈", title:"Contar para alguém?", age:[12,99], weight:0, cond:()=> ["homo","bi","pan"].includes(P().orientation) && !S.flags.out,
  text:()=> `Você se entende como ${orientationName().toLowerCase()}. Vai contar para as pessoas próximas?`,
  choices:()=>[
    { label:"👪 Contar para a família", run:()=>{
        S.flags.out = "family"; let good = 0, bad = 0;
        for (const r of parents()){ const per = byId(DATA.personalities, r.personality); const ok = chance(0.55 + r.rel/250 + (per?.id === "calm" || per?.id === "generous" ? 0.15 : 0) - (per?.id === "hothead" ? 0.2 : 0));
          if (ok){ r.rel = clamp(r.rel + 8); remember_npc(r, "Me apoiou quando saí do armário"); good++; } else { r.rel = clamp(r.rel - 25); remember_npc(r, "Reagiu mal quando saí do armário"); bad++; } }
        if (!parents().length) return "Contei para os parentes que me criaram. Recebi um abraço." + fx({happiness:8});
        return bad ? (good ? "Uma parte da família me acolheu; outra virou a cara. Dói." + fx({happiness:-4}) + (addStress(10), "") : "A reação foi dura. Chorei a noite toda." + fx({happiness:-12}) + (addStress(18), ""))
                   : "Me abraçaram e disseram que nada muda. Que alívio!" + fx({happiness:14}) + (addStress(-12), "");
      } },
    { label:"🤝 Contar só para os amigos", run:()=>{ S.flags.out = "friends"; for (const f of S.rels.filter(r=>r.role==="friend"&&r.alive)){ f.rel = clamp(f.rel + (chance(0.85) ? 6 : -15)); } return "Meus amigos foram incríveis (quase todos)." + fx({happiness:8}) + (addStress(-6), ""); } },
    { label:"🔒 Manter em segredo por enquanto", run:()=>{ addStress(8); return "Ainda não é a hora. Cada um tem seu tempo."; } },
  ]},
);
</script>
<script>/* src/events/bonds.js */
"use strict";
/* =====================================================================
   events/bonds.js — fraudes conjugais (suas e contra você), processos,
   vingança de ex e amigos pedindo ajuda (a utilidade é de mão dupla).
   ===================================================================== */
EVENTS.push(
{ id:"ev_fraud_discovered", emoji:"🧾", title:"Descoberto(a)", age:[18,120], weight:0, cond:c=> !!relBy(c.uid)?.alive,
  speech:c=> say(pick(["Você me roubou?! Depois de tudo que eu fiz por você, seu(sua) desgraçado(a)?","Eu vi o extrato. Nem tenta mentir.","Como você teve coragem, porra?"])),
  text:c=> `${relBy(c.uid).first} descobriu seu ${c.kind} de ${fmt(c.amt)}.`,
  choices:c=>[
    { label:"💸 Devolver tudo e implorar perdão", hint:`${fmt(Math.round(c.amt*1.1))}`, run:()=>{ const r = relBy(c.uid), v = Math.round(c.amt*1.1); if (S.money < v) return "Nem tinha mais o dinheiro para devolver." + fraudEscalate(c); addMoney(-v); r.money = num(r.money) + v; if (chance(0.35 + r.rel/300)){ r.rel = clamp(r.rel + 15); return "Devolvi com juros. Fiquei no sofá por meses, mas o casamento sobreviveu."; } return "Devolvi, mas a confiança não volta." + fraudEscalate(c); } },
    { label:"🤥 Negar e culpar o banco", hint:"inteligência ajuda", run:()=>{ if (chance(0.15 + P().stats.intelligence/400)){ relBy(c.uid).rel = clamp(relBy(c.uid).rel + 25); return "Inventei um erro do banco. Colou… por enquanto."; } return "A mentira piorou tudo." + fraudEscalate(c, true); } },
    { label:"🚪 Assumir e pedir o divórcio", run:()=>{ const r = relBy(c.uid); if (r.role === "spouse") divorce(r, false, c.amt); return "Acabou. Cada um para um lado — e os advogados ficaram ricos."; } },
  ]},
{ id:"ev_scam_lawsuit", emoji:"⚖️", title:"Processo por estelionato", age:[18,120], weight:0, cond:()=>!inPrison(),
  speech:()=> say("O(a) senhor(a) está sendo processado(a) por estelionato sentimental."),
  text:c=> `${c.name} te processa para reaver ${fmt(c.amt)}.`,
  choices:c=>[
    { label:"🤝 Fazer acordo (devolver 120%)", run:()=>{ const v = Math.round(c.amt*1.2); const paid = Math.min(Math.max(0,S.money), v); addMoney(-paid); addRep(-6); if (paid < v){ sendToPrison(rint(1,3), "estelionato (acordo descumprido)"); return "Não consegui pagar o acordo inteiro. O juiz não perdoou."; } return `Paguei ${fmt(paid)}. Processo encerrado.`; } },
    { label:"⚖️ Enfrentar no tribunal", hint:"advogado " + fmt(priceOf(8000)), run:()=>{ addMoney(-Math.min(Math.max(0,S.money), priceOf(8000))); if (chance(0.45 - P().stats.intelligence/500)){ sendToPrison(rint(1,5), "estelionato sentimental"); addRep(-15); return "Condenado(a). A história virou reportagem."; } addRep(-5); return "Absolvido(a) por falta de provas."; } },
    { label:"✈️ Sumir do país", run:()=>{ const d = pick(DATA.countries.filter(x=>x.id!==P().country)); const from = P().country; emigrate(d.id, true); S.wanted = S.wanted || { since:P().age, remaining:rint(2,4), crime:"estelionato", fakeId:false, country:from, years:0, security:"média" }; return `Fugi para ${d.name}. Tenho mandado de prisão no meu país.`; } },
  ]},
{ id:"ev_scam_revenge", emoji:"😈", title:"A vingança do(a) ex", age:[18,120], weight:0, cond:()=>!inPrison(),
  speech:c=> say(`Você achou que eu ia deixar barato? Agora todo mundo vai saber quem você é.`),
  text:c=> `${c.name}, a vítima do seu golpe, voltou para acertar as contas.`,
  choices:c=>[
    { label:"📰 Deixar que fale — negar tudo", run:()=>{ addRep(-12); addFame(5); for (const r of S.rels.filter(x=>["friend","partner","spouse","fiance"].includes(x.role))) r.rel = clamp(r.rel - 8); return "Expôs tudo nas redes. Virei o(a) golpista do momento."; } },
    { label:"💵 Pagar pelo silêncio", hint:fmt(priceOf(20000)), run:()=>{ const v = priceOf(20000); if (!canAfford(v)) return "Sem dinheiro. A exposição veio mesmo assim." + fx({happiness:-6}) + (addRep(-12), ""); addMoney(-v); return "Pagou-se o silêncio."; } },
    { label:"🥊 Ir tirar satisfação", hint:"abre o combate", run:()=>{ startFight("provoke", { npc:{ first:c.name, last:"", age:P().age + rint(-5,5), personality:"hothead" } }); return "Fui até a casa dele(a)."; } },
  ]},
{ id:"ev_spouse_drain", emoji:"🕳️", title:"Rombo na conta", age:[20,120], cd:5,
  weight:()=>{ const r = spouse(); if (!r || regime() === "separacao" || S.money < priceOf(15000)) return 0; const per = byId(DATA.personalities, r.personality); return per?.scam ? 0.5 + (r.rel < 50 ? 0.5 : 0) : 0.05; },
  cond:()=>!!spouse() && !inPrison(),
  setup:()=>({ uid: spouse().uid, pct: rfloat(0.2, 0.45) }),
  text:c=> `Sua conta conjunta está com um buraco de ${fmt(Math.round(Math.max(0,S.money)*c.pct))}. Só ${relBy(c.uid).first} tinha acesso.`,
  choices:c=>[
    { label:"🔍 Contratar um detetive", hint:fmt(priceOf(3000)), run:()=>{ const r = relBy(c.uid), loss = Math.round(Math.max(0,S.money)*c.pct); addMoney(-loss - priceOf(3000)); const per = byId(DATA.personalities, r.personality); if (per?.scam){ r.rel = clamp(r.rel - 40); remember_npc(r, "Foi pego(a) desviando meu dinheiro"); divorce(r, false); return `Era ${r.first}: tinha uma conta secreta. Pedi o divórcio na hora.`; } return "O detetive achou um erro do banco. O dinheiro voltou em parte." + fx({money: Math.round(loss*0.6)}); } },
    { label:"🗣️ Confrontar", run:()=>{ const r = relBy(c.uid), loss = Math.round(Math.max(0,S.money)*c.pct); addMoney(-loss); r.rel = clamp(r.rel - 20); return `${r.first} jurou que foi para "despesas da casa". Não sei se acredito.`; } },
    { label:"🙈 Deixar pra lá", run:()=>{ const loss = Math.round(Math.max(0,S.money)*c.pct); addMoney(-loss); addStress(8); return "Engoli o prejuízo para não brigar."; } },
  ]},
{ id:"ev_friend_needs", emoji:"🆘", title:"Um amigo precisa de você", age:[14,90], cd:3,
  weight:()=> S.rels.some(r=>r.role==="friend"&&r.alive&&r.rel>=50) && S.money > priceOf(2000) ? 0.8 : 0, cond:()=>!inPrison(),
  setup:()=>{ const f = pick(S.rels.filter(r=>r.role==="friend"&&r.alive&&r.rel>=50)); return { uid:f.uid, amt: Math.round(priceOf(rint(500, 4000))) }; },
  speech:c=> say("Cara, tô numa merda… você pode me ajudar com uma grana? Te pago, juro."),
  text:c=> `${relBy(c.uid).first} pede ${fmt(c.amt)} emprestado.`,
  choices:c=>[
    { label:"💸 Emprestar", run:()=>{ if (!canAfford(c.amt)) return "Não tinha esse dinheiro."; const f = relBy(c.uid); addMoney(-c.amt); f.rel = clamp(f.rel + 12); f.respect = clamp(num(f.respect) + 10); remember_npc(f, "Emprestei dinheiro numa emergência"); schedule("friendRepay", rint(1,4), { uid:f.uid, amt:c.amt, name:f.first }); return `${f.first} ficou emocionado(a).`; } },
    { label:"🙅 Negar", run:()=>{ const f = relBy(c.uid); f.rel = clamp(f.rel - 10); return `${f.first} entendeu… mas ficou chateado(a).`; } },
  ]},
);
/* Fraude descoberta que não foi perdoada: divórcio litigioso e, às vezes, processo criminal. */
function fraudEscalate(c, lied){
  const r = relBy(c.uid); if (!r) return "";
  if (r.role === "spouse") divorce(r, true, c.amt);
  if (chance(lied ? 0.45 : 0.3) && c.amt > priceOf(20000)){ schedule("loveScamCase", 1, { uid:r.uid, name:`${r.first} ${r.last}`, amt:c.amt, p:0.7 }); return ` ${r.first} pediu o divórcio e ainda vai me processar.`; }
  return ` ${r.first} pediu o divórcio.`;
}
</script>
<script>/* src/events/cyber.js */

/* events/cyber.js — investigação de crimes cibernéticos e convites hackers. */
EVENTS.push(
{ id:"ev_cyber_probe", emoji:"🖥️", title:"Delegacia de crimes cibernéticos", age:[14,120], weight:0, cond:()=>!inPrison(),
  speech:()=> say("A gente rastreou as transações até o seu CPF. Quer explicar?"),

function cyberTrial(c, bonus){
  if (chance(clamp((c.p - bonus) * 100, 5, 95) / 100)){ const y = rint(...c.years); sendToPrison(y, c.crime.toLowerCase()); return ` Condenado(a): ${y} ano(s).`; }
  return " Absolvido(a) por falta de provas.";
}

/* Exposição de trabalho adulto: relações, emprego formal e reputação. */
function adultExposure(owned, mult = 1){
  const p = P(); let msg = [];
  addRep(-12 * mult); addStress(14 * mult);
  if (owned){ addFame(5); S.gig.audience = Math.round(S.gig.audience * 1.4); S.gig.exposure = 0; addStat("happiness", 2); msg.push("Muita gente julgou, mas meus assinantes aumentaram."); }
  else { S.gig.exposure = clamp(S.gig.exposure - 30); msg.push("Apaguei o que pude. O estrago já estava feito."); }
  for (const r of S.rels.filter(x => x.alive && ["mother","father","partner","spouse","fiance","sibling"].includes(x.role))){
    const per = byId(DATA.personalities, r.personality); const ok = per && ["calm","generous","funny"].includes(per.id) && chance(0.6);
    r.rel = clamp(r.rel - (ok ? 3 : rint(12, 30)) * mult); if (!ok) remember_npc(r, "Ficou sabendo do meu trabalho adulto");
  }
  const pt = partner(); if (pt && pt.rel < 30 && chance(0.5)){ if (pt.role === "spouse") divorce(pt, true); else pt.role = "ex"; msg.push(`${pt.first} terminou comigo.`); }
  if (S.job && (career().exam || career().cleanRecord || /Educação|Saúde|Serviço Público|Justiça/.test(career().sector)) && chance(0.5 * mult)){ endJob("Demitido(a) após exposição"); msg.push("Meu emprego formal me demitiu \"por conduta\"."); addStat("happiness", -8); }
  log(`📱 Meu trabalho adulto foi exposto. ${msg.join(" ")}`, "bad");
  return msg.join(" ");
}

<script>/* src/systems/modifiers.js */
"use strict";
/* =====================================================================
   systems/modifiers.js — chances contextuais COM explicação.
   Toda probabilidade importante do jogo é montada aqui a partir do
   estado (atributos, histórico, reputação, saúde, dinheiro…), e a UI
   mostra os fatores ao jogador. Isso é o "nexo": a mesma reputação que
   cai numa demissão aparece depois como −8% numa entrevista.

   Odds = { p (0–1), mods: [[rótulo, delta]] }
   ===================================================================== */
function mkOdds(base){
  const o = { base, mods: [] };
  o.add = (label, v) => { if (isFinite(v) && Math.abs(v) >= 0.005) o.mods.push([label, v]); return o; };
  o.done = (lo = 0.03, hi = 0.95) => { o.p = Math.max(lo, Math.min(hi, o.base + o.mods.reduce((a,[,v])=>a+v,0))); return o; };
  return o;
}
/* Texto compacto: "62% · +10 Carismático · −15 Antecedentes" (4 maiores fatores). */
function explainOdds(o, max = 4){
  const top = o.mods.slice().sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0, max);
  return `<b>${Math.round(o.p*100)}%</b>` + top.map(([l,v]) => ` · <span class="${v>0?"good":"bad"}">${v>0?"+":"−"}${Math.round(Math.abs(v)*100)}</span> ${esc(l)}`).join("");
}
const oddsColor = p => p >= 0.6 ? "good" : p >= 0.3 ? "warn" : "bad";

/* ---------- Mercado de trabalho ---------- */
function oddsHire(c){
  const p = P(), E = S.edu, statV = c.talent ? p.talents[c.talent] : p.stats[c.stat];
  let o;
  if (c.exam){ // concurso: prova pesa quase tudo
    o = mkOdds((p.stats.intelligence - 65) / 40).add("Preparo de estudo", (E.perf-60)/400).add("Ansiedade na prova", hasTrait("anxious") ? -0.08 : 0);
  } else if (c.elected){
    return oddsElection(0);
  } else {
    o = mkOdds(0.35)
      .add(c.talent ? "Talento" : `Atributo-chave (${STAT_LABEL[c.stat]})`, Math.max(-0.3, Math.min(0.25, (statV-50)/140)))
      .add("Inteligência vs. exigência", Math.max(-0.25, Math.min(0.15, (p.stats.intelligence - c.minInt)/200)))
      .add("Formação acima do exigido", Math.min(0.09, Math.max(0, E.level - c.edu) * 0.03))
      .add("Superqualificado(a) para a vaga", c.edu <= 2 && E.level >= 4 ? -0.2 : 0)
      .add("Mercado de trabalho local", (country().opp - 1) * 0.12);
  }
  o.add("Ofício aprendido na prisão", prisonHireBonus(c))
   .add("Indicação de amigo", S.flags.referral && S.flags.referral.age === p.age ? S.flags.referral.bonus : 0);
  o.add("Reputação profissional", (p.reputation - 50)/200)
   .add("Carismático", hasTrait("charismatic") ? 0.1 : 0)
   .add("Timidez/ansiedade", (hasTrait("shy") || hasTrait("anxious")) ? -0.08 : 0)
   .add("Notoriedade negativa", -p.notoriety/250)
   .add("Antecedentes criminais", -S.record.length*0.06)
   .add("Tempo desempregado", S.unemployedYears > 3 ? -Math.min(0.15, S.unemployedYears*0.015) : 0)
   .add("Etarismo do mercado", p.age > 50 ? -(p.age-50)/100 : 0)
   .add("Saúde debilitada", p.stats.health < 35 ? -0.1 : 0)
   .add("Estresse aparente", p.stress > 75 ? -0.05 : 0)
   .add("Carta de referência", S.flags.reference ? 0.07 : 0)
   .add(`Economia (${phaseName()})`, phase().hire)
   .add("Vício perceptível", Math.max(S.addictions.alcohol, S.addictions.gambling) > 60 ? -0.1 : 0);
  o.done();
  if (c.fame) o.p = Math.min(o.p, 0.12 + statV/170);
  return o;
}
function oddsPromotion(){
  const J = S.job, c = career(), p = P();
  const statV = c.talent ? p.talents[c.talent] : p.stats[c.stat];
  const o = mkOdds((J.perf - 55)/100)
    .add("Ambicioso", hasTrait("ambitious") ? 0.08 : 0)
    .add("Carismático", hasTrait("charismatic") ? 0.05 : 0)
    .add("Reputação", (p.reputation - 50)/250)
    .add("Mentoria", S.flags.mentor ? 0.1 : 0)
    .add("Hora extra", J.effort === 2 ? 0.04 : 0)
    .add("Estresse alto", p.stress > 70 ? -0.06 : 0)
    .add("Vício", S.addictions.alcohol > 50 ? -0.08 : 0)
    .add(`Economia (${phaseName()})`, phase().hire * 0.8)
    .done(0, 0.8);
  if (c.fame) o.p *= 0.6 * (statV/70);
  return o;
}
function oddsUniversity(m){
  const p = P(), E = S.edu;
  const base = p.stats.intelligence*0.6 + E.perf*0.4 - (hasTrait("anxious")?5:0);
  // nota = base + U(−12, 12) ≥ mínima  →  P = (12 − (mín − base)) / 24
  const pr = Math.max(0, Math.min(1, (12 - (m.minInt - base)) / 24));
  const o = mkOdds(pr).add("Desempenho escolar", 0).done(0, 1);
  o.mods = [["Inteligência", (p.stats.intelligence - m.minInt)/100], ["Desempenho escolar", (E.perf - 60)/100]];
  if (hasTrait("anxious")) o.mods.push(["Ansiedade", -0.05]);
  o.score = base;
  return o;
}
/* Habilidade técnica efetiva para cibercrime (treino + formação). */
function cyberLevel(){ return clamp(num(S.cyberSkill) + (S.edu.degrees.includes("cs") ? 20 : 0) + (S.edu.techs.includes("t_it") ? 8 : 0)); }
function oddsCrime(c){
  const p = P();
  if (c.cyber) return mkOdds(c.success)
    .add("Inteligência", (p.stats.intelligence - 55)/250)
    .add("Habilidade técnica", (cyberLevel() - num(c.skill))/250)
    .add("Cauteloso", hasTrait("cautious") ? 0.04 : 0)
    .add("Polícia de olho em você", -p.notoriety/600)
    .add("Em liberdade condicional", S.parole > 0 ? -0.08 : 0)
    .done(0.03, 0.92);
  return mkOdds(c.success)
    .add("Cauteloso", hasTrait("cautious") ? 0.05 : 0)
    .add("Impulsivo", hasTrait("impulsive") ? -0.06 : 0)
    .add("Em liberdade condicional", S.parole > 0 ? -0.1 : 0)
    .add("Inteligência", (p.stats.intelligence - 50)/500)
    .add("Polícia de olho em você", -p.notoriety/400)
    .add("Policiamento local", (country().crime - 1) * 0.06)
    .add("Saúde/agilidade", (p.stats.health - 60)/600)
    .done(0.02, 0.93);
}
function oddsLoanRate(base){ // juros personalizados pelo score de crédito
  return Math.max(0.03, base + (700 - S.credit) / 1000);
}
function creditLabel(c = S.credit){ return c >= 760 ? "Excelente" : c >= 680 ? "Bom" : c >= 600 ? "Regular" : c >= 520 ? "Ruim" : "Péssimo"; }

/* ---------- Saúde ---------- */
/* Multiplicador de risco de contrair uma doença (1 = população média). */
function illnessRisk(d){
  const p = P(), A = S.addictions, r = d.risk || {};
  const f = {
    smoke: A.smoke/100, alcohol: A.alcohol/100,
    stress: Math.max(0, p.stress - 40)/60,
    sedentary: Math.min(1, S.health.sedentary/8),
    age: Math.max(0, p.age - (d.minAge||0))/40,
    lux: p.lifestyle === 3 ? 1 : 0,
  };
  let m = 1; for (const k in r) m += r[k] * (f[k]||0);
  if ((S.health.genetic||[]).includes(d.id)) m *= 1.8;
  if (hasTrait("athletic")) m *= 0.85;
  return m;
}
/* Chance anual de cura de uma doença com um dado tier de tratamento. */
function oddsCure(ill, tierId){
  const d = byId(DATA.illnesses, ill.id), st = DATA.stages[ill.stage], t = byId(DATA.treatments, tierId), p = P();
  if (d.chronic) return { p:0, mods:[["Crônica: só controle", 0]] };
  const age = 1 - Math.max(0, p.age - 50) * 0.012;
  const body = 0.6 + p.stats.health/250;
  const pr = Math.max(0.01, Math.min(0.97, d.cure * st.cure * t.eff * age * body));
  return { p: pr, mods: [[`Estágio ${st.name}`, st.cure - 1], [t.name, t.eff - 1], ["Idade", age - 1], ["Condição física", body - 1]] };
}
/* Fatores de risco atuais para exibição na aba Saúde. */
function riskProfile(){
  const p = P(), A = S.addictions, out = [];
  const lvl = v => v >= 0.66 ? "bad" : v >= 0.33 ? "warn" : "good";
  if (p.age >= 45) out.push({ k:"Idade", v:Math.min(1,(p.age-45)/40), txt:`${p.age} anos: risco cardíaco e de câncer crescente` });
  if (p.stress >= 45) out.push({ k:"Estresse", v:(p.stress-40)/60, txt:`Estresse ${Math.round(p.stress)}: pressão, coração, depressão` });
  for (const a of DATA.addictions) if (A[a.id] >= 10) out.push({ k:a.name, v:A[a.id]/100, txt:`${a.emoji} ${Math.round(A[a.id])}/100 — ${a.desc}` });
  if (S.health.sedentary >= 3 && p.age >= 20) out.push({ k:"Sedentarismo", v:Math.min(1,S.health.sedentary/8), txt:`${S.health.sedentary} ano(s) sem exercício` });
  if ((S.health.genetic||[]).length) out.push({ k:"Genética", v:0.4, txt:`Histórico familiar: ${S.health.genetic.map(id=>byId(DATA.illnesses,id).name).join(", ")}` });
  if (S.health.sequelae > 0) out.push({ k:"Sequelas", v:Math.min(1,S.health.sequelae/30), txt:`Teto de saúde reduzido em ${Math.round(S.health.sequelae)} por lesões antigas` });
  if (S.job && S.job.effort === 2) out.push({ k:"Excesso de trabalho", v:0.5, txt:"Hora extra constante desgasta corpo e mente" });
  return out.map(x => ({ ...x, level: lvl(x.v) }));
}
</script>
<script>/* src/systems/consequences.js */
"use strict";
/* =====================================================================
   systems/consequences.js — consequências de médio/longo prazo.
   Uma escolha agenda um efeito futuro: schedule(kind, anos, ctx, nota).
   A cada ano, consequencesYear() dispara os vencidos. Cada handler
   revalida o estado atual antes de agir (sem efeito contraditório: um
   amigo morto não devolve dinheiro, um diploma inexistente não é
   investigado). O resultado vai para o log e para o histórico de
   consequências exibido na aba Vida.
   ===================================================================== */
function schedule(kind, inYears, ctx = {}, note){
  S.scheduled.push({ kind, at: P().age + Math.max(1, Math.round(inYears)), ctx, from: P().age });
  if (note) remember(note, "pending");
}
function pendingConsequences(){ return S.scheduled.filter(x => x.at > P().age).length; }

const CONSEQ = {
  /* colou em provas: pode ser descoberto e manchar o histórico */
  cheatExposed(ctx){
    if (!chance(0.35)) return;
    if (S.edu.school){ S.edu.perf = clamp(S.edu.perf - 20); addRep(-6); return out(`Uma investigação revelou que colei em provas antigas. Desempenho escolar −20.`, "bad"); }
    if (S.job){ addRep(-10); S.job.perf = clamp(S.job.perf - 10); return out(`Ex-colegas expuseram minhas colas na escola. Minha reputação no trabalho caiu.`, "bad"); }
  },
  /* fugiu de um acidente: câmeras e testemunhas */
  hitAndRun(){
    if (inPrison() || !chance(0.45)) return;
    addNoto(25); enqueue("ev_investigation");
    return out(`Imagens do acidente em que fugi vieram à tona. A polícia reabriu o caso.`, "bad");
  },
  /* emprestou dinheiro: o amigo devolve (ou some) anos depois */
  friendRepay(ctx){
    const f = relBy(ctx.uid);
    if (!f || !f.alive){ return out(`O dinheiro emprestado a ${ctx.name} nunca voltou.`, "bad"); }
    if (chance(0.25 + f.rel/200)){
      const back = Math.round(ctx.amt * rfloat(1.0, 1.3)); addMoney(back); f.rel = clamp(f.rel + 10);
      return out(`${ctx.name} me devolveu ${fmt(back)} — com juros de gratidão.`, "good");
    }
    f.rel = clamp(f.rel - 15); return out(`${ctx.name} sumiu com meu dinheiro. A amizade esfriou.`, "bad");
  },
  /* mentoria rende frutos */
  mentorPayoff(){
    S.flags.mentor = false;
    if (!S.job) return;
    addRep(10); S.job.perf = clamp(S.job.perf + 10);
    return out(`A mentoria que aceitei anos atrás rendeu: mais reputação e desempenho.`, "good");
  },
  /* contato de networking vira proposta de emprego */
  contactOffer(){ if (S.job && !inPrison()) enqueue("ev_contact_offer"); },
  /* pagou a faculdade do filho: retribuição na velhice */
  childGrateful(ctx){
    const k = relBy(ctx.uid); if (!k || !k.alive) return;
    k.rel = clamp(k.rel + 12); k.supportsParent = true;
    return out(`${k.first} se formou e agradeceu por eu ter pago a faculdade. Prometeu me ajudar na velhice.`, "good");
  },
  /* propina aceita: investigação de corrupção */
  corruptionProbe(ctx){
    if (inPrison() || !chance(0.4 + P().notoriety/200)) return;
    enqueue("ev_corruption_probe", { amt: ctx.amt });
  },
  /* voluntariado vira referência profissional */
  volunteerReference(){ S.flags.reference = true; addRep(4); return out(`A ONG onde fui voluntário me deu uma carta de referência.`, "good"); },
  /* cirurgia plástica malfeita: revisão anos depois */
  plasticRevision(){
    if (!chance(0.4)) return;
    addStat("looks", -6); return out(`A cirurgia plástica antiga começou a dar problemas estéticos.`, "bad");
  },
  /* exposição de escândalo antigo para figuras públicas */
  oldScandal(){
    if (P().fame < 40 || !chance(0.5)) return;
    addFame(-10); addRep(-8); return out(`Um escândalo antigo voltou às manchetes.`, "bad");
  },
  /* fumou na adolescência mas parou: risco residual cai com o tempo */
  quitBenefit(){ addStat("health", 3); return out(`Anos sem fumar: meu fôlego voltou.`, "good"); },
};
function out(text, kind){ log("⏳ " + text, kind); remember(text, kind); return text; }

function consequencesYear(){
  const age = P().age, due = S.scheduled.filter(x => x.at <= age);
  S.scheduled = S.scheduled.filter(x => x.at > age);
  for (const c of due){ try { CONSEQ[c.kind]?.(c.ctx || {}); } catch(e){ console.warn("consequência", c.kind, e); } }
}
</script>
<script>/* src/systems/economy.js */
"use strict";
/* =====================================================================
   systems/economy.js — ciclo econômico global (MODO BRUTO).
   Fases com transição de Markov. Cada fase altera inflação, demissões,
   contratações, retorno de investimentos e preço de imóveis.
   Salários (S.wageIndex) repõem só parte da inflação + produtividade:
   anos bons recuperam poder de compra, recessões e crises o corroem.
   ===================================================================== */
const PHASES = {
  "expansão": { emoji:"📈", layoff:0.6, hire:0.06,  invest:0.05,  prop:0.02,  infl:0.035,wage:0.95, prod:0.012, next:{ "expansão":0.55, "estável":0.35, "recessão":0.10 } },
  "estável":  { emoji:"➖", layoff:1.0, hire:0,     invest:0,     prop:0,     infl:0.03, wage:0.85, prod:0.008, next:{ "expansão":0.29, "estável":0.56, "recessão":0.13, "crise":0.02 } },
  "recessão": { emoji:"📉", layoff:2.5, hire:-0.1,  invest:-0.12, prop:-0.04, infl:0.045,wage:0.6,  prod:0,  next:{ "estável":0.40, "recessão":0.40, "crise":0.15, "expansão":0.05 } },
  "crise":    { emoji:"🔥", layoff:4.0, hire:-0.18, invest:-0.28, prop:-0.09, infl:0.08, wage:0.45, prod:-0.01, next:{ "recessão":0.55, "crise":0.25, "estável":0.20 } },
};
function phase(){ return PHASES[S.world?.phase] || PHASES["estável"]; }
function phaseName(){ return S.world?.phase || "estável"; }

function economyYear(){
  const W = S.world;
  const nextP = weighted(Object.keys(phase().next), k => phase().next[k]);
  W.years = nextP === W.phase ? W.years + 1 : 1;
  if (nextP !== W.phase){
    const news = {
      "expansão": "📰 Economia em expansão: empresas contratando e bolsa em alta.",
      "estável":  "📰 A economia se estabilizou.",
      "recessão": "📰 RECESSÃO: o PIB encolheu, demissões em massa e crédito mais caro.",
      "crise":    "📰 CRISE ECONÔMICA: quebradeira geral, desemprego disparou e o dinheiro perde valor.",
    }[nextP];
    log(news, nextP === "recessão" || nextP === "crise" ? "bad" : "good", ["money"]);
    emit("economy", nextP);
  }
  W.phase = nextP;
  // inflação do país = fase global + ruído + instabilidade local (países com mais crime/instabilidade oscilam mais)
  const local = (country().crime - 1) * 0.01;
  W.inflation = Math.max(0, phase().infl + local + rfloat(-0.012, 0.012));
  S.priceIndex = num(S.priceIndex, 1) * (1 + W.inflation);
  // salários: repõem parte da inflação + ganho de produtividade (bons anos recuperam, crises corroem)
  S.wageIndex  = num(S.wageIndex, S.priceIndex) * (1 + W.inflation * phase().wage + phase().prod);
  W.history.push({ age:P().age, phase:nextP, infl:W.inflation });
  if (W.history.length > 130) W.history.shift();
}
</script>
<script>/* src/systems/speech.js */
"use strict";
/* =====================================================================
   systems/speech.js — falas: pensamentos do personagem, comentários de
   NPCs e abordagens. As falas refletem o estado (dinheiro, saúde, crime,
   amor, idade). say() aplica o filtro de linguagem leve se ativado.
   ===================================================================== */
function say(text){
  if (SETTINGS.lang !== "leve") return text;
  let t = text; for (const [re, rep] of DATA.SOFTEN) t = t.replace(re, rep); return t;
}
/* escolha estável dentro do mesmo ano (não muda a cada render) */
function stablePick(arr, salt){ return arr[Math.abs(hashStr(`${S.player.first}${P().age}${salt}`)) % arr.length]; }

function thoughtContext(){
  const p = P(), a = p.age, inc = Math.max(jobIncome(), priceOf(4000));
  if (a < 3) return "baby"; if (a < 13) return "child";
  if (inPrison()) return "prison";
  if (S.wanted) return "wanted";
  const roll = Math.abs(hashStr(`${p.first}${a}ctx`)) % 10; // estável no ano, sem gastar o RNG
  if (num(S.martial?.kills) > 0 && roll < 4) return "guilt";
  if (bestMastery() >= 40 && roll >= 7) return "fighter";
  if (S.loans.some(l=>l.missed) || debtTotal() > inc*2) return "debt";
  if (a >= 18 && S.money < priceOf(600)) return "broke";
  if (p.stress >= 70) return "stressed";
  if (S.illnesses.some(i=>i.diagnosed && byId(DATA.illnesses,i.id).sev >= 8) || p.stats.health < 30) return "sick";
  if (S.org || p.notoriety > 30) return "crime";
  if (a < 18) return "teen";
  if (a >= 18 && a < 65 && !S.job && !S.edu.school && !S.retired) return "unemployed";
  if (netWorth() > wageOf(1e6)) return "rich";
  if (a >= 70) return "old";
  const pt = partner(); if (pt && pt.rel > 65) return "love";
  if (!pt && a >= 25 && chance(0.3)) return "lonely";
  if (S.job && chance(0.5)) return "work";
  return p.stats.happiness > 65 ? "happy" : "work";
}
function currentThought(){ const ctx = thoughtContext(); return say(stablePick(DATA.thoughts[ctx] || DATA.thoughts.happy, ctx)); }

/* Comentário de alguém próximo (balão secundário na aba Vida). */
function npcComment(){
  const pool = [];
  for (const r of S.rels.filter(r=>r.alive && !r.unborn)){
    const key = r.role === "spouse" || r.role === "fiance" ? "partner" : r.role;
    if (DATA.npcLines[key] && !(key === "child" && r.age < 5)) pool.push([r, key]);
  }
  if (S.job && !inPrison()) pool.push([{ first: "Seu chefe", uid:"boss" }, "boss"]);
  if (S.org) pool.push([{ first: S.org.members[0]?.name || "Um capanga", uid:"crew" }, "crew"]);
  if (!pool.length) return null;
  const [r, key] = stablePick(pool, "npc");
  return { who: r.first, uid: r.uid, text: say(stablePick(DATA.npcLines[key], key + r.uid).replace("{me}", P().first)) };
}
function approachLine(kind){ return say(pick(DATA.approachLines[kind] || [""])); }
</script>
<script>/* src/systems/aging.js */
"use strict";
/* =====================================================================
   systems/aging.js — envelhecimento natural, estresse e humor de base.
   Vitalidade = teto biológico de saúde (cai com a idade, nunca volta).
   Estresse = consequência agregada de trabalho, dívidas, família,
   doença, moradia e vícios; afeta saúde, humor, relações e carreira.
   ===================================================================== */

/* Alvo de estresse com explicação (a UI mostra as maiores causas). */
function stressTarget(){
  const p = P(), a = p.age, parts = [];
  const add = (label, v) => { if (v) parts.push([label, v]); };
  add("Base", 15);
  if (S.job) add(["Esforço mínimo","Ritmo normal","Hora extra"][S.job.effort] , [-3, 6, 22][S.job.effort]);
  if (S.job && S.job.level >= 3) add("Cargo de alta responsabilidade", 5);
  if (a >= 18 && a < 65 && !S.job && !S.edu.school && !S.retired && !S.businesses.length && !inPrison()) add("Desemprego", 12);
  const inc = Math.max(jobIncome() + S.businesses.reduce((x,b)=>x+Math.max(0,b.lastProfit),0), priceOf(5000));
  const unsecured = S.loans.filter(l=>!l.propertyUid).reduce((x,l)=>x+l.principal,0) + S.edu.debt;
  const ratio = unsecured / inc;
  if (ratio > 0.5) add("Dívidas", ratio > 3 ? 20 : ratio > 1.5 ? 12 : 6);
  if (S.flags.overdraftYear === a || S.flags.overdraftYear === a-1) add("Conta no vermelho", 8);
  if (inPrison()) add("Prisão", 30);
  const serious = S.illnesses.filter(i => i.diagnosed && byId(DATA.illnesses,i.id).sev >= 8).length;
  if (serious) add("Doença grave", Math.min(20, serious*9));
  if (S.flags.caregiver) add("Cuidando de pai/mãe idoso(a)", 10);
  const babies = children().filter(c=>c.age < 6).length; if (babies) add("Filhos pequenos", Math.min(10, babies*4));
  const pt = partner(); if (pt) add(pt.rel < 30 ? "Relacionamento em crise" : pt.rel > 75 ? "Relacionamento feliz" : "", pt.rel < 30 ? 8 : pt.rel > 75 ? -5 : 0);
  const petLove = (S.pets || []).filter(x => x.bond >= 50).length;
  if (petLove) add("Companhia dos pets", -Math.min(8, 3 + petLove * 2));
  const wildStress = (S.pets || []).filter(x => byId(DATA.petSpecies, x.sp)?.danger >= 0.2 && (x.hunger >= 50 || x.stress >= 60)).length;
  if (wildStress) add("Animal selvagem agitado em casa", 6 * wildStress);
  add(`Estilo de vida ${LIFESTYLES[p.lifestyle].name.toLowerCase()}`, a >= 18 ? LIFESTYLES[p.lifestyle].stress : 0);
  const home = homeInfo(); if (a >= 18) add(home.type === "none" ? "Sem moradia" : "Conforto da moradia", home.type === "none" ? 20 : Math.round((5 - home.comfort)*1.2));
  if (S.edu.school === "uni" || S.edu.school === "grad") add("Faculdade", 6); else if (S.edu.school === "medio") add("Ensino médio", 3);
  if (S.addictions.gambling > 40) add("Jogo compulsivo", 8);
  if (S.retired) add("Aposentadoria", -6);
  if (S.job && career().elected) add("Vida pública", 6);
  let target = parts.reduce((x,[,v])=>x+v, 0);
  if (a < 10) target *= 0.4;
  return { target: clamp(target), parts: parts.filter(([l])=>l && l !== "Base") };
}

function agingYear(){
  const a = P().age, st = P().stats, p = P();
  // ganhos de inteligência com retorno decrescente: quanto mais alto, mais difícil subir
  if (a < 18) addStat("intelligence", rfloat(0.1, 1.2) * (hasTrait("genius")?1.4:1) * (1 - st.intelligence/125));
  if (a > 70) addStat("intelligence", -rfloat(0, 1.2));
  // vitalidade: teto biológico (atleta envelhece mais devagar; vícios aceleram)
  if (a > 28){
    let drop = 0.3 + (a > 50 ? 0.45 : 0) + (a > 70 ? 0.8 : 0) + (a > 85 ? 1.2 : 0);
    drop *= hasTrait("athletic") ? 0.8 : 1;
    drop += S.addictions.smoke/220 + S.addictions.alcohol/260 + (p.stress > 70 ? 0.25 : 0);
    if (S.health.exercised) drop *= 0.8;
    p.vitality = clamp(p.vitality - drop);
  }
  if (a > 35) addStat("looks", (-rfloat(0.2, 1.0) - (a>60 ? 0.8 : 0) - (S.addictions.smoke > 40 ? 0.5 : 0)) * (S.look?.skincare ? 0.5 : 1));
  if (a >= 13 && a <= 17) addStat("looks", rfloat(-3, 4));

  // estresse caminha 40% em direção ao alvo do ano
  const { target } = stressTarget();
  p.stress = clamp(p.stress + (target - p.stress) * 0.4 + rfloat(-3, 3));

  // felicidade regride à linha de base determinada pela vida atual
  const home = homeInfo();
  let base = 50 + home.comfort*1.5 + (a >= 18 ? LIFESTYLES[p.lifestyle].happy : 0);
  const pt = partner(); if (pt) base += (pt.rel - 50) / 6;
  base += parents().reduce((s,x)=> s + (x.rel-50)/25, 0);
  base += children().reduce((s,c)=> s + (c.rel-50)/30, 0);
  if (a >= 18 && a < 65 && !S.job && !S.edu.school && !S.retired && S.businesses.length===0) base -= 8;
  if (home.type === "none" && a >= 18) base -= 15;
  if (home.type === "family" && a > 25) base -= 4;
  if (inPrison()) base -= 25;
  if (p.stress > 50) base -= (p.stress - 50) / 4;
  if (hasTrait("lazy")) base += 3;
  if (hasTrait("anxious")) base -= 4;
  if (S.illnesses.some(i=>i.diagnosed && byId(DATA.illnesses,i.id)?.mood)) base -= 15;
  if (st.health < 30) base -= 8;
  st.happiness = clamp(st.happiness + (base - st.happiness) * 0.25 + rfloat(-3,3));

  p.notoriety = clamp(p.notoriety - 2); // a "ficha" esfria com o tempo
  if (S.job && !career().fame) addFame(-1); else if (!S.job) addFame(-2);
  // reputação regride lentamente a 50 sem emprego (o mercado esquece)
  if (!S.job && a >= 18) p.reputation = clamp(p.reputation + (50 - p.reputation) * 0.1);
}
</script>
<script>/* src/systems/health.js */
"use strict";
/* =====================================================================
   systems/health.js — saúde, doenças por estágio, check-up, tratamento,
   planos de saúde, vícios, sequelas e morte.

   PRINCÍPIOS DE BALANCEAMENTO (auditoria v4):
   • Check-up NÃO cura nem dá saúde: ele DIAGNOSTICA (com chance
     realista dependente de plano, estágio e tipo de doença). 1×/ano.
   • Recuperação natural tem retorno decrescente com a idade e nunca
     passa do teto = vitalidade (cai com a idade) − sequelas.
   • Doenças evoluem em 4 estágios se não tratadas; detectar cedo é mais
     barato e muito mais eficaz. Crônicas nunca curam: só são controladas.
   • Tratamento custa por ano (cobertura do plano reduz), com eficácia
     que cai com estágio, idade e condição física.
   • Estilo de vida acumula: estresse, vícios, sedentarismo e excesso de
     trabalho aumentam o risco e drenam saúde todo ano.
   ===================================================================== */
const stageName = i => DATA.stages[i.stage].name;
function effectivePlan(){
  const id = S.health.plan !== "none" ? S.health.plan : (S.health.employerPlan ? "basic" : "none");
  return byId(DATA.healthPlans, id);
}
function planPremium(id = S.health.plan){
  const pl = byId(DATA.healthPlans, id); if (!pl || !pl.cost) return 0;
  const chronic = S.illnesses.filter(i => i.diagnosed && byId(DATA.illnesses,i.id).chronic).length;
  return priceOf(pl.cost * (1 + Math.max(0, P().age - 35) * 0.035) * (1 + chronic * 0.25));
}
/* Quanto do custo de saúde o jogador paga (menores: pais cobrem parte). */
function selfPayShare(){
  if (P().age >= 18 || !parents().length) return 1;
  return classOf().uninsured;
}
function treatmentCost(il, tierId = il.tier){
  const d = byId(DATA.illnesses, il.id), t = byId(DATA.treatments, tierId);
  const cov = tierId === "public" ? 0 : effectivePlan().coverage;
  return Math.round(priceOf(d.cost) * DATA.stages[il.stage].cost * t.costMult * (1 - cov) * selfPayShare());
}
function checkupCost(){ return Math.round(priceOf(350) * (1 - effectivePlan().coverage) * selfPayShare()); }

/* Lesão aguda com possível sequela permanente (reduz o teto de saúde). */
function injure(amount, cause, sequelaChance = 0.3){
  addStat("health", -amount);
  if (amount >= 18) emit("hospital"); // ferimento sério = ambulância
  if (amount >= 12 && chance(sequelaChance)){
    const s = Math.round(amount * 0.25);
    S.health.sequelae = num(S.health.sequelae) + s;
    remember(`${cause} deixou sequela permanente (teto de saúde −${s}).`, "bad");
    return ` Sequela permanente: teto de saúde −${s}.`;
  }
  return "";
}

/* ---------- Tick anual ---------- */
function healthYear(){
  const a = P().age, st = P().stats, Y = S.yearSummary;
  // exercício × sedentarismo (acumulativo)
  if (S.health.exercised) S.health.sedentary = 0; else if (a >= 18) S.health.sedentary++;
  if (S.health.sedentary > 2) addStat("health", -Math.min(2, S.health.sedentary*0.2));
  addictionsYear();
  // contrair doenças
  for (const d of DATA.illnesses){
    if (d.manual || S.illnesses.some(i=>i.id===d.id) || a < (d.minAge||0)) continue; // manual = só por causa específica (ex.: IST)
    let p = d.id === "flu" ? 0.07 : d.id === "depress" ? 0.012 : 0.0025 + Math.max(0, a - d.minAge)*0.00055;
    p *= illnessRisk(d) * (1.5 - st.health/100);
    if (chance(Math.min(0.2, p))){
      const il = { id:d.id, years:0, stage:1, diagnosed: d.symptoms <= 1, treated:false, tier:null };
      S.illnesses.push(il);
      if (il.diagnosed) log(`Fiquei doente: ${d.name}. 🤒`, "bad");
    }
  }
  // evolução, dano, custo e cura
  for (const il of S.illnesses){
    const d = byId(DATA.illnesses, il.id), t = il.treated ? byId(DATA.treatments, il.tier) : null;
    il.years++;
    const prog = il.treated ? d.progress * (il.tier === "public" ? 0.35 : 0.2) : d.progress;
    if (il.years > 1 && il.stage < 4 && chance(prog)){ il.stage++; if (il.diagnosed) log(`${d.name} avançou para o estágio ${stageName(il)}.`, "bad"); }
    if (!il.diagnosed && il.stage >= d.symptoms){ il.diagnosed = true; log(`Os sintomas apareceram: diagnóstico de ${d.name} já em estágio ${stageName(il)}. 🏥`, "bad"); remember(`${d.name} foi descoberto(a) tarde, sem check-up preventivo.`, "bad"); }
    const reduce = il.treated ? (d.chronic ? 0.25 : 0.45) / t.eff : (d.chronic ? 0.55 : 1);
    addStat("health", -d.sev * DATA.stages[il.stage].dmg * reduce * rfloat(0.7, 1.2));
    if (il.stage >= 3) S.health.sequelae = num(S.health.sequelae) + 0.5;
    if (il.treated){
      const cost = treatmentCost(il);
      if (cost){ addMoney(-cost); Y.expenses += cost; Y.lines.push([`Tratamento: ${d.name}`, -cost]); }
      if (!d.chronic && chance(oddsCure(il, il.tier).p)){ il.cured = true; log(`Venci a doença: ${d.name}! 💪`, "good"); if (il.stage >= 3) achieve("survivor","Sobreviveu a uma doença grave"); }
    } else if (!d.chronic){
      const spont = d.sev < 8 && il.stage <= 2 ? d.cure * 0.7 : 0.03;
      if (chance(spont)){ il.cured = true; if (il.diagnosed) log(`Me recuperei de ${d.name} sem tratamento.`, "good"); }
    }
  }
  S.illnesses = S.illnesses.filter(i=>!i.cured);
  // estresse crônico desgasta o corpo
  if (P().stress > 60) addStat("health", -(P().stress - 60) / 12);
  if (S.job && S.job.effort === 2) addStat("health", -1);
  // recuperação natural com retorno decrescente pela idade, limitada pelo teto
  const cap = healthCap(), untreatedSerious = S.illnesses.some(i => !i.treated && byId(DATA.illnesses,i.id).sev >= 8);
  if (st.health < cap){
    const rate = 0.22 * Math.max(0.25, 1 - a/120) * (untreatedSerious ? 0.4 : 1);
    addStat("health", (cap - st.health) * rate);
  }
  if (S.health.exercised) S.gymYears++;
  S.health.exercised = false;
}

function addictionsYear(){
  const A = S.addictions, p = P();
  if (p.stress > 70 && p.age >= 18 && (hasTrait("impulsive") || hasTrait("anxious")) && chance(0.35)) A.alcohol = clamp(A.alcohol + 5);
  for (const d of DATA.addictions){
    const v = A[d.id]; if (!v) continue;
    A[d.id] = clamp(v > 40 ? v + d.grip : v - 2);
    if (d.healthDmg) addStat("health", -A[d.id] * d.healthDmg);
  }
  if (A.alcohol > 40){
    if (S.job) S.job.perf = clamp(S.job.perf - (A.alcohol-40)/4);
    const pt = partner(); if (pt && A.alcohol > 55) pt.rel = clamp(pt.rel - 4);
  }
  if (A.gambling > 50 && S.money > 0){
    const loss = Math.round(S.money * rfloat(0.05, 0.15)); addMoney(-loss);
    S.yearSummary.lines.push(["Perdas com apostas", -loss]); S.yearSummary.expenses += loss;
    log(`🎰 O vício em apostas me custou ${fmt(loss)} este ano.`, "bad");
  }
}

/* ---------- Ações de saúde (UI) ---------- */
function medicalCheckup(){
  if (inPrison()) return R(false, "O atendimento médico da prisão é limitado.");
  if (S.health.lastCheckup === P().age) return R(false, "Você já fez check-up este ano.");
  const cost = checkupCost();
  if (cost && P().age >= 18 && !canAfford(cost)) return R(false, `O check-up custa ${fmt(cost)}.`);
  addMoney(-cost); S.health.lastCheckup = P().age;
  const plan = effectivePlan(), found = [];
  for (const il of S.illnesses.filter(i => !i.diagnosed)){
    const d = byId(DATA.illnesses, il.id);
    if (chance(Math.min(0.98, d.detect * plan.detect * (il.stage >= 2 ? 1.15 : 1)))){ il.diagnosed = true; found.push(`${d.name} (${stageName(il)})`); }
  }
  const msg = found.length ? `Check-up detectou: ${found.join(", ")}. Trate na aba Saúde.` : "Check-up sem achados. Isso não garante que esteja tudo bem — a detecção não é perfeita.";
  log(`🩺 ${msg}`, found.length ? "bad" : "good");
  if (found.length) remember(`Check-up preventivo encontrou ${found.join(", ")} cedo.`, "good");
  return R(true, msg);
}
function treatIllness(id, tierId){
  const il = S.illnesses.find(i => i.id === id), t = byId(DATA.treatments, tierId);
  if (!il || !il.diagnosed) return R(false, "Doença não diagnosticada.");
  if (t.minStage && il.stage < t.minStage) return R(false, `Disponível apenas a partir do estágio ${DATA.stages[t.minStage].name}.`);
  const d = byId(DATA.illnesses, id), cost = treatmentCost(il, tierId);
  if (tierId !== "public" && !canAfford(cost)) return R(false, `Precisa de ${fmt(cost)} para o primeiro ano.`);
  il.treated = true; il.tier = tierId; emit("hospital");
  let extra = "";
  if (chance(t.risk)) extra = " Houve complicações." + injure(15, `Complicação no tratamento de ${d.name}`, 0.5);
  log(`Comecei tratamento (${t.name}) para ${d.name}${d.chronic ? " — controle contínuo" : ""}.${extra}`, extra ? "bad" : "");
  return R(true, `Tratamento iniciado: ${fmt(cost)}/ano.${extra}`);
}
function stopTreatment(id){ const il = S.illnesses.find(i=>i.id===id); if (!il) return R(false,"?"); il.treated = false; il.tier = null; log(`Interrompi o tratamento de ${byId(DATA.illnesses,id).name}.`, "bad"); return R(true, "Tratamento interrompido."); }
function setHealthPlan(id){
  if (P().age < 18) return R(false, "Menores usam o plano dos pais.");
  S.health.plan = id; const pl = byId(DATA.healthPlans, id);
  log(id === "none" ? "Cancelei meu plano de saúde." : `Contratei: ${pl.name} (${fmt(planPremium(id))}/ano).`, "");
  return R(true, id === "none" ? "Plano cancelado." : `${pl.name} ativo.`);
}
function quitAddiction(id){
  const A = S.addictions, d = byId(DATA.addictions, id);
  if (!A[id]) return R(false, "Você não tem esse vício.");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  const p = 0.28 + (hasTrait("resilient")?0.15:0) + (hasTrait("impulsive")?-0.1:0) - A[id]/250 + (P().stress < 40 ? 0.08 : -0.05);
  if (chance(Math.max(0.05, p))){
    A[id] = clamp(A[id] - rint(25, 45)); addStat("happiness", -5); addStress(5);
    if (id === "smoke" && A[id] === 0) schedule("quitBenefit", 3);
    log(`Lutei contra ${d.name.toLowerCase()} e consegui reduzir. 💪`, "good");
    return R(true, `Progresso contra ${d.name.toLowerCase()}! Abstinência é dura (−5 felicidade).`);
  }
  A[id] = clamp(A[id] + 3); addStat("happiness", -3);
  log(`Tentei largar ${d.name.toLowerCase()} e recaí.`, "bad");
  return R(false, "Recaída. Tentar de novo (ou reabilitação) ajuda.");
}
function rehab(){
  if (P().age < 16) return R(false, "Indisponível.");
  if (!Object.values(S.addictions).some(v => v >= 20)) return R(false, "Você não precisa de reabilitação.");
  if (S.flags.rehabYear === P().age) return R(false, "Você já passou pela clínica este ano.");
  const cost = Math.round(priceOf(6000) * (1 - effectivePlan().coverage*0.5));
  if (!canAfford(cost)) return R(false, `A clínica custa ${fmt(cost)}.`);
  addMoney(-cost); S.flags.rehabYear = P().age;
  for (const k in S.addictions) S.addictions[k] = clamp(S.addictions[k] * rfloat(0.3, 0.6));
  addStress(-10); addStat("happiness", -3);
  if (S.job) S.job.perf = clamp(S.job.perf - 8);
  log("Passei um período numa clínica de reabilitação. 🏥", "milestone"); remember("Encarei a reabilitação — os vícios perderam força.", "good");
  return R(true, "Reabilitação concluída: vícios reduzidos drasticamente.");
}

/* ---------- Morte ---------- */
function deathCheck(){
  const a = P().age, h = P().stats.health;
  if (h <= 0){
    const worst = S.illnesses.slice().sort((x,y)=>y.stage-x.stage)[0];
    return worst ? byId(DATA.illnesses, worst.id).name : "falência múltipla de órgãos";
  }
  const hf = Math.max(0.35, 1 + (60 - h)/22);
  let q = Math.min(0.9, (a < 1 ? 0.003 : 0.00004*Math.exp(0.092*a)) * hf);
  const terminal = S.illnesses.find(i => i.stage === 4 && !byId(DATA.illnesses,i.id).chronic);
  if (terminal) q = Math.min(0.95, q + (terminal.treated ? 0.12 : 0.28));
  if (chance(q)){
    if (terminal) return byId(DATA.illnesses, terminal.id).name;
    const serious = S.illnesses.filter(i=>byId(DATA.illnesses,i.id).sev>=8);
    if (serious.length && chance(0.6)) return byId(DATA.illnesses, pick(serious).id).name;
    return a > 70 ? pick(["causas naturais, enquanto dormia","insuficiência cardíaca","um AVC","velhice"]) : pick(["um acidente doméstico","um infarto súbito","um aneurisma","um AVC"]);
  }
  if (a >= 120) return "velhice extrema";
  return null;
}

<script>/* src/systems/education.js */
"use strict";
/* systems/education.js */

/* ---------- Educação ---------- */
function schoolYear(){
  const a = P().age, E = S.edu;
  if (inPrison()) return;
  if (a === 6 && !E.school && E.level === 0){ E.school = "fund"; E.yearsLeft = 9; log("Comecei o Ensino Fundamental.", "milestone"); }
  if (!E.school) return;
  // desempenho escolar puxa em direção à inteligência
  const target = P().stats.intelligence * 0.8 + 15 + (hasTrait("lazy")?-10:0) + (hasTrait("ambitious")?6:0);
  E.perf = clamp(E.perf + (target - E.perf) * 0.3 + rfloat(-6,6));
  addStat("intelligence", (E.school === "uni" || E.school === "grad" ? rfloat(0.5,2) : rfloat(0,1)) * (1 - P().stats.intelligence/125));
  // custo anual de faculdade
  if (E.school === "uni" || E.school === "grad" || E.school === "tech"){
    const cost = E.school==="tech" ? priceOf(byId(DATA.techCourses,E.major)?.cost || 2500) : priceOf((byId(DATA.majors,E.major)?.cost || 8000) * (E.school==="grad"?1.2:1));
    payTuition(cost);
  }
  if (E.perf < 18 && E.school !== "fund" && chance(0.35)){
    log(`Fui reprovado por desempenho e saí do curso (${schoolName()}).`, "bad"); addStat("happiness",-12);
    if (E.school === "medio") E.dropped = true;
    E.school = null; E.yearsLeft = 0; return;
  }
  if (E.perf < 25 && (E.school==="fund"||E.school==="medio") && chance(0.3)){
    log("Repeti de ano na escola. 😓", "bad"); addStat("happiness",-6); return;
  }
  E.yearsLeft--;
  if (E.yearsLeft > 0) return;
  graduate();
}

function payTuition(cost){
  const E = S.edu, cls = P().cls;
  if (E.perf > 88 && chance(0.5)){ S.yearSummary.lines.push(["Bolsa de estudos", 0]); return; }
  const parentShare = parents().length ? classOf().eduShare : 0;
  const self = Math.round(cost * (1-parentShare));
  if (self <= 0) return;
  if (S.money >= self && P().age >= 18){ addMoney(-self); S.yearSummary.expenses += self; S.yearSummary.lines.push(["Mensalidades", -self]); }
  else { E.debt = num(E.debt) + self; S.yearSummary.lines.push(["Financiamento estudantil (dívida)", 0]); }
}

function schoolName(s = S.edu.school){
  return { fund:"Ensino Fundamental", medio:"Ensino Médio", tech:"Curso Técnico", uni:"Graduação", grad:"Pós-graduação", supl:"Supletivo" }[s] || "—";
}

function graduate(){
  const E = S.edu; const s = E.school; E.school = null;
  if (s === "fund"){ E.level = Math.max(E.level,1); log("Concluí o Ensino Fundamental! 🎒", "milestone"); E.school = "medio"; E.yearsLeft = 3; log("Entrei no Ensino Médio.", ""); return; }
  if (s === "medio" || s === "supl"){ E.level = Math.max(E.level,2); log(`Me formei no Ensino Médio com desempenho ${Math.round(E.perf)}/100. 🎓`, "milestone"); addStat("happiness",8); enqueue("ev_after_school"); return; }
  if (s === "tech"){ E.level = Math.max(E.level,3); E.techs.push(E.major); log(`Concluí o ${byId(DATA.techCourses,E.major).name}! 🛠️`, "milestone"); addStat("happiness",6); return; }
  if (s === "uni"){ E.level = Math.max(E.level,4); E.degrees.push(E.major); log(`Colei grau em ${byId(DATA.majors,E.major).name}! 🎓`, "milestone"); addStat("happiness",12); achieve("grad","Diploma universitário"); return; }
  if (s === "grad"){
    const lvl = E.gradLevel || 5; E.level = Math.max(E.level, lvl);
    log(lvl===6 ? "Defendi minha tese — agora sou Doutor(a)! 🧪" : "Concluí o Mestrado! 📚", "milestone");
    addStat("happiness",10); if (lvl===6) achieve("phd","Doutorado concluído");
  }
}

/* ---------- Educação ---------- */
function applyUniversity(majorId){
  const m = byId(DATA.majors, majorId), E = S.edu;
  if (E.level < 2) return "Preciso do Ensino Médio antes.";
  const o = oddsUniversity(m), score = o.score + rfloat(-12,12);
  if (score >= m.minInt){
    E.school = "uni"; E.major = m.id; E.yearsLeft = m.years; E.perf = clamp(E.perf*0.6 + 25);
    log(`Fui aprovado(a) no vestibular de ${m.name}! 🎉`, "milestone"); addStat("happiness",10); addStress(4);
    return `Aprovado(a) em ${m.name}!`;
  }
  log(`Reprovei no vestibular de ${m.name}.`, "bad"); addStat("happiness",-8);
  return `Não passei no vestibular de ${m.name} (nota ${Math.round(score)}, precisava ${m.minInt}).`;
}
function techEligibility(t){
  if (t.minInt && P().stats.intelligence < t.minInt) return `Requer inteligência ${t.minInt}`;
  if (t.minHealth && P().stats.health < t.minHealth) return `Exame médico: saúde ${t.minHealth}`;
  return null;
}
function startTech(id){ const E = S.edu; E.school = "tech"; E.major = id; E.yearsLeft = 2; E.perf = clamp(E.perf*0.5+30); log(`Comecei o ${byId(DATA.techCourses,id).name}.`, "milestone"); }

function startGrad(level){
  const E = S.edu;
  if (E.level < level-1 || E.level < 4) return R(false, "Requisito: diploma anterior.");
  if (P().stats.intelligence < (level===6?70:58)) return R(false, "Inteligência insuficiente para a seleção.");
  E.school = "grad"; E.gradLevel = level; E.yearsLeft = level===6 ? 4 : 2; E.major = E.degrees[E.degrees.length-1];
  log(`Ingressei no ${level===6?"Doutorado":"Mestrado"}.`, "milestone"); return R(true, "Matrícula feita!");
}

function returnToSchool(){
  if (S.edu.level >= 2 || S.edu.school || P().age < 16) return R(false, "Não disponível.");
  S.edu.school = "supl"; S.edu.yearsLeft = S.edu.level >= 1 ? 2 : 3; S.edu.dropped = false;
  if (S.edu.level < 1) S.edu.level = 1;
  log("Me matriculei no supletivo (EJA).", "milestone"); return R(true, "Matriculado(a) no supletivo.");
}

function dropOut(){
  if (!S.edu.school) return R(false, "Você não está estudando.");
  if (S.edu.school === "fund" || (S.edu.school==="medio" && P().age < 16)) return R(false, "Você é jovem demais para largar a escola.");
  const n = schoolName(); if (S.edu.school==="medio") S.edu.dropped = true;
  S.edu.school = null; S.edu.yearsLeft = 0;
  log(`Larguei o(a) ${n}.`, "bad"); return R(true, `Você largou o(a) ${n}.`);
}

function studyHarder(){
  if (!S.edu.school) return R(false, "Você não está estudando.");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  S.edu.perf = clamp(S.edu.perf + rint(4,10)); addStat("intelligence", rfloat(0.5,2)); addStat("happiness",-1);
  return R(true, "Você estudou com afinco. Desempenho escolar subiu.");
}
