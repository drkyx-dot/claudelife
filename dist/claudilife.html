     • público: 1 + log10(1 + audiência/50), cresce com tempo, fama,
       aparência e marketing; despenca com escândalos.
   Adulto (18+): exposição acumula a cada ano (mais no ritmo intenso e
   com fama); quando "vaza", o jogador decide como reagir. Acompanhante:
   ISTs, clientes violentos (abre combate), polícia onde é ilegal.
   ===================================================================== */
const gigDef = id => byId(DATA.gigs, id);
const gig = () => S.gig;

function gigBlock(d){
  const p = P(), rq = d.req || {};
  if (p.age < d.minAge) return `Idade mínima ${d.minAge}`;
  if (inPrison()) return "Você está preso(a)";
  if (rq.car && (!S.vehicles.length || !S.flags.license)) return "Precisa de carro e carteira";
  if (rq.int && p.stats.intelligence < rq.int) return `Inteligência ${rq.int}`;
  if (rq.health && p.stats.health < rq.health) return `Saúde ${rq.health}`;
  if (rq.edu && S.edu.level < rq.edu) return `Requer ${DATA.eduLevels[rq.edu]}`;
  if (S.gig?.id === d.id) return "Você já faz isso";
  return null;
}
function startGig(id){
  const d = gigDef(id), why = gigBlock(d); if (why) return R(false, why);
  if (S.gig) stopGig(true);
  S.gig = { id, years:0, skill: Math.round(15 + P().stats.intelligence/10), audience: d.audience ? rint(2, 15) : 0, pace: S.job ? 0 : 1, exposure:0, lastIncome:0, rating: 70 };
  if (d.adult) remember(`Comecei como ${d.name.toLowerCase()}. Dinheiro, mas também exposição e risco.`, "pending");
  log(`${d.emoji} Comecei a trabalhar por conta própria: ${d.name}.`, "");
  return R(true, `Agora você é ${d.name.toLowerCase()}${S.job ? " (como bico, além do emprego)" : ""}.`);
}
function stopGig(silent){
  const G = S.gig; if (!G) return R(false, "Você não trabalha por conta.");
  const d = gigDef(G.id); S.gig = null;
  if (!silent) log(`${d.emoji} Parei de trabalhar como ${d.name.toLowerCase()} após ${G.years} ano(s).`, "");
  return R(true, `Encerrou: ${d.name}.`);
}
function setGigPace(i){
  const G = S.gig; if (!G) return R(false, "?");
  if (S.job && i === 2) return R(false, "Com emprego fixo, o bico não passa de ritmo Normal.");
  G.pace = i; return R(true, `Ritmo: ${DATA.gigPace[i].name}.`);
}
/* Marketing/divulgação: gasta energia e dinheiro, cresce o público. */
function promoteGig(){
  const G = S.gig; if (!G) return R(false, "?");
  const d = gigDef(G.id); if (!d.audience) return R(false, "Esse trabalho não depende de divulgação.");
  const cost = priceOf(300 + G.years*80); if (!canAfford(cost)) return R(false, `Divulgação custa ${fmt(cost)}.`);
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  addMoney(-cost);
  const g = Math.round((10 + G.audience*0.15) * rfloat(0.6, 1.5) * (0.7 + P().stats.looks/200 + P().fame/150));
  G.audience += g; if (d.adult) G.exposure = clamp(G.exposure + 6);
  return R(true, `Divulgação feita: +${g} ${d.adult ? "assinantes" : "clientes/seguidores"} (${fmt(cost)}).`);
}
function practiceGig(){
  const G = S.gig; if (!G) return R(false, "?");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  const g = Math.round(rint(4, 9) * dim("gigskill")); S.actCount.gigskill = num(S.actCount.gigskill) + 1;
  G.skill = clamp(G.skill + g); return R(true, `Me aperfeiçoei: habilidade ${Math.round(G.skill)} (+${g}).`);
}

function statFactor(d){
  const p = P(); let f = 1;
  for (const [k, w] of Object.entries(d.drivers || {})){
    const v = k === "talent" ? Math.max(p.talents.music, p.talents.acting) : k === "fame" ? p.fame : k === "reputation" ? p.reputation : p.stats[k];
    f *= Math.pow(0.4 + num(v)/100*1.2, w);
  }
  return f;
}
/* Renda estimada (usada no tick e exibida na UI). */
function gigIncome(G = S.gig){
  if (!G) return 0;
  const d = gigDef(G.id), pace = DATA.gigPace[G.pace];
  const aud = d.audience ? 1 + Math.log10(1 + G.audience/50) : 1;
  const mult = (G.id === "dev" || G.id === "design") && (S.edu.degrees.includes("cs") || S.edu.techs.includes("t_it")) ? 1.25 : 1;
  return Math.round(wageOf(d.base) * statFactor(d) * (0.6 + G.skill/100) * aud * pace.income * mult * (0.85 + 0.15*country().opp) * (G.rating/80));
}

function gigYear(){
  const G = S.gig; if (!G) return;
  if (inPrison()){ S.gig = null; return; }
  const d = gigDef(G.id), pace = DATA.gigPace[G.pace], Y = S.yearSummary, p = P();
  G.years++;
  // crescimento natural do público e da habilidade
  if (d.audience){
    const growth = (0.08 + p.stats.looks/900 + p.fame/500 + G.skill/1000) * rfloat(0.6, 1.4) * (G.pace === 0 ? 0.6 : G.pace === 2 ? 1.3 : 1);
    G.audience = Math.round(G.audience * (1 + growth) + rint(2, 12));
    if (d.viral && chance(0.04 + p.stats.looks/2000)) enqueue("ev_gig_viral");
  }
  G.skill = clamp(G.skill + rfloat(1, 4));
  G.rating = clamp(G.rating + rfloat(-6, 6) + (G.skill - 50)/25, 30, 100);
  // renda
  const inc = gigIncome(G); G.lastIncome = inc;
  addMoney(inc); Y.income += inc; S.stats.earned += inc; Y.lines.push([`${d.emoji} ${d.name}`, inc]);
  addStress(d.stress * pace.stress * (S.job ? 1.5 : 1) - 3);
  if (d.id === "streamer" || d.id === "street") addFame(Math.min(4, G.audience/2000) + (d.id === "street" ? 0.3 : 0));
  // riscos específicos
  const r = pace.risk;
  if (G.id === "delivery" && chance(0.05 * r)) log("🛵 Levei um tombo de moto na entrega." + injure(rint(6, 18), "Um acidente de entrega", 0.25), "bad");
  if (G.id === "rideshare" && chance(0.06 * r * country().crime)) enqueue("ev_gig_robbery");
  if (d.audience && !d.adult && chance(0.08)) enqueue(chance(0.5) ? "ev_gig_bigclient" : "ev_gig_noshow");
  if (d.adult){
    G.exposure = clamp(G.exposure + rint(3, 7) * r + p.fame/25);
    addRep(-0.5);
    if (chance(G.exposure/220)) enqueue("ev_adult_exposed");
    if (G.id === "escort") escortRisks(G, r);
  }
}
/* Acompanhante: saúde, violência e polícia. */
function escortRisks(G, r){
  const law = DATA.escortLaw[P().country] || "tolerada";
  if (chance(0.07 * r * (G.pace === 2 ? 1.3 : 1)) && !S.illnesses.some(i => i.id === "ist")){
    S.illnesses.push({ id:"ist", years:0, stage:1, diagnosed:true, treated:false, tier:null });
    log("🦠 Fui diagnosticado(a) com uma IST. Preciso tratar antes que piore.", "bad", ["health"]); emit("hospital");
  }
  if (chance(0.06 * r)) enqueue("ev_escort_danger");
  else if (chance(0.05)) enqueue("ev_escort_regular");
  if (law === "ilegal" && chance(0.08 * r)) enqueue("ev_escort_police");
}
</script>
<script>/* src/systems/sports.js */
"use strict";
/* =====================================================================
   systems/sports.js — VIDA DE ATLETA (carreiras com athlete:true).
   • Contrato (J.contract anos, J.club, J.contractMult no salário). No fim
     do contrato, o jogador escolhe: renovar, transferência para clube
     maior (se estiver bem), proposta do exterior ou ficar livre.
   • Lesões: chance anual pelo risco do esporte, ritmo de treino e idade;
     lesão grave tira a temporada (desempenho despenca).
   • Títulos: chance pela forma; dão bônus em dinheiro, fama e conquistas.
   • Declínio físico depois dos 30 (eSports: 26) e aposentadoria
     esportiva com transição para técnico(a), comentarista ou olheiro(a).
   ===================================================================== */
const isAthlete = () => !!(S.job && career()?.athlete);
const peakEnd = c => c.id === "esports" ? 26 : 30;
const retireAge = c => c.id === "esports" ? 31 : c.id === "fighter" ? 38 : 36;

/* Forma = talento esportivo, saúde, desempenho e (lutas) maestria. */
function athleteForm(){
  const c = career(), p = P(), J = S.job;
  const age = p.age, decline = Math.max(0, age - peakEnd(c)) * 3.5;
  const base = c.id === "esports" ? p.stats.intelligence*0.5 + p.talents.sport*0.1 : p.talents.sport*0.45 + p.stats.health*0.3;
  return clamp(base + J.perf*0.3 + (c.id === "fighter" ? bestMastery()*0.2 : 0) - decline - num(J.injured)*25);
}
function sportsYear(){
  if (!isAthlete()) return;
  const c = career(), J = S.job, p = P();
  J.club = J.club || pick(DATA.clubNames);
  if (J.contract === undefined) J.contract = rint(2, 4);
  J.injured = 0;
  // lesões
  const riskInj = (0.03 + c.risk*0.025) * (J.effort === 2 ? 1.6 : J.effort === 0 ? 0.7 : 1) * (p.age > 30 ? 1.5 : 1) * (p.stats.health < 50 ? 1.4 : 1);
  if (chance(riskInj)){
    const grave = chance(0.3);
    J.injured = grave ? 1 : 0; J.perf = clamp(J.perf - (grave ? 25 : 8));
    const s = injure(grave ? rint(14, 26) : rint(4, 10), grave ? "Uma lesão grave no esporte" : "Uma lesão no esporte", grave ? 0.45 : 0.1);
    log(`🩹 ${grave ? "Lesão grave: fiquei fora da temporada." : "Lesão leve: algumas semanas parado(a)."}${s}`, "bad", ["health","work"]);
    if (grave) emit("hospital");
    if (grave && p.age > 32 && chance(0.25)) return enqueue("ev_sport_retire", { forced:true });
  }
  // títulos
  const form = athleteForm();
  if (!J.injured && chance(clamp((form - 45)/220 + J.level*0.03, 0.01, 0.45))){
    const bonus = Math.round(J.salary * rfloat(0.2, 0.7));
    addMoney(bonus); S.yearSummary.income += bonus; S.stats.earned += bonus; S.yearSummary.lines.push(["🏆 Bônus por título", bonus]);
    J.titles = num(J.titles) + 1; addFame(3 + J.level*2); addRep(3);
    log(`🏆 Fui campeão(ã) com o ${J.club}! Bônus de ${fmt(bonus)}.`, "milestone", ["work"]);
    achieve("sporttitle", "Campeão(ã) no esporte profissional");
    if (J.titles >= 5) achieve("sportlegend", "Cinco títulos no esporte");
  }
  // contrato e aposentadoria
  J.contract--;
  if (p.age >= retireAge(c) || (p.age >= retireAge(c) - 3 && chance(0.25))) enqueue("ev_sport_retire", { forced: p.age >= retireAge(c) + 2 });
  else if (J.contract <= 0) enqueue("ev_sport_contract", sportOffers());
}
/* Gera as propostas de fim de contrato conforme a forma. */
function sportOffers(){
  const form = athleteForm(), J = S.job;
  const others = DATA.clubNames.filter(n => n !== J.club);
  return { form: Math.round(form),
    renew: { mult: Math.max(0.7, num(J.contractMult, 1) * (form > 60 ? rfloat(1.05, 1.25) : rfloat(0.75, 0.95))), years: rint(2, 4) },
    big: form >= 62 ? { club: pick(others), mult: num(J.contractMult, 1) * rfloat(1.4, 2.1), years: rint(3, 5) } : null,
    abroad: form >= 55 ? { club: pick(["FC Bavaria","Lisboa Sporting","Tokyo United","LA Galaxy Stars","Club de México","Lagos Rangers"]), mult: num(J.contractMult, 1) * rfloat(1.8, 3), years: rint(2, 4) } : null };
}
function signContract(club, mult, years){
  const J = S.job; if (!J) return "";
  const moved = club && club !== J.club;
  if (club) J.club = club; J.contractMult = Math.round(mult*100)/100; J.contract = years;
  J.salary = Math.round(salaryFor(career(), J.level, J.levelYears) * J.contractMult);
  log(`✍️ ${moved ? `Transferência para o ${J.club}` : `Renovei com o ${J.club}`}: ${years} ano(s), ${fmt(J.salary)}/ano.`, "milestone", ["work","money"]);
  if (moved) addFame(2);
  return `Contrato assinado: ${fmt(J.salary)}/ano por ${years} ano(s).`;
}
/* Treino extra (ação do jogador): melhora o desempenho, com risco de lesão. */
function extraTraining(){
  if (!isAthlete()) return R(false, "Só para atletas.");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  const J = S.job; J.perf = clamp(J.perf + rint(4, 9) * dim("sporttrain")); S.actCount.sporttrain = num(S.actCount.sporttrain) + 1;
  P().talents.sport = clamp(P().talents.sport + rint(1, 3)); S.health.exercised = true;
  if (chance(0.06 + career().risk*0.015)) return R(false, "Exagerei no treino e me lesionei." + injure(rint(5, 12), "O treino extra", 0.15));
  return R(true, `Treino extra concluído. Desempenho ${Math.round(J.perf)}.`);
}
/* Transição pós-carreira: contrata direto, sem a fila de requisitos. */
function hireDirect(id, level = 0){
  const c = byId(DATA.careers, id); if (!c) return "";
  if (S.job) endJob("Aposentadoria esportiva");
  S.job = { careerId:id, level, levelYears:0, years:0, perf:60, effort:1, salary: salaryFor(c, level, 0) };
  log(`💼 Comecei nova carreira: ${c.levels[level].t} (${fmt(S.job.salary)}/ano).`, "milestone");
  return `Agora sou ${c.levels[level].t}.`;
}
</script>
<script>/* src/systems/collect.js */
"use strict";
/* =====================================================================
   systems/collect.js — COLEÇÃO (museu/antiguidades) e ARSENAL.
   Coleção: entra no patrimônio, valoriza/oscila por ano (e com o ciclo
   econômico), seguro anual de 1,5% protege contra roubo; peças do
   mercado negro podem ser falsas ou apreendidas. Empréstimo a museu dá
   reputação, fama e uma taxa.
   Arsenal: armas viram golpes no combate (fora de torneios). Armas de
   fogo registradas exigem PORTE; armas ilegais pesam muito se você for
   preso(a) e armas registradas em seu nome facilitam a perícia.
   ===================================================================== */
const collection = () => (S.collection ||= []);
const arsenal = () => (S.arsenal ||= []);
function collectionTotal(){ return collection().reduce((a, c) => a + fxConv(c.value, c.country), 0); }

function buyCollectible(id){
  const d = byId(DATA.collectibles, id); if (!d) return R(false, "?");
  if (!adult()) return R(false, "Só maiores de idade.");
  if (inPrison()) return R(false, "Você está preso(a).");
  const fee = d.src === "auction" ? 0.12 : d.src === "dealer" ? 0.05 : 0;
  const price = Math.round(priceOf(d.price) * (d.src === "black" ? rfloat(0.45, 0.7) : rfloat(0.92, 1.12)));
  const total = Math.round(price * (1 + fee));
  if (!canAfford(total)) return R(false, `Precisa de ${fmt(total)}${fee ? ` (inclui ${Math.round(fee*100)}% de comissão)` : ""}.`);
  addMoney(-total); S.stats.spent += total;
  const fake = d.src === "black" && chance(0.25);
  collection().push({ uid:uid(), id, value: Math.round(priceOf(d.price) * rfloat(0.9, 1.05)), paid: total, age:P().age, insured:false, country:P().country, fake, hot: d.src === "black" });
  if (d.src === "black"){ addNoto(3); S.crimeSkill = clamp(S.crimeSkill + 1); }
  log(`${d.emoji} Comprei: ${d.name} por ${fmt(total)}.`, "", ["money"]);
  emit("buy");
  if (S.collection.length >= 5) achieve("collector", "Colecionador(a) com 5 peças");
  return R(true, `${d.name} agora é sua! ${d.src === "black" ? "⚠️ Procedência duvidosa." : ""}`);
}
function sellCollectible(u){
  const c = collection().find(x => x.uid === u); if (!c) return R(false, "?");
  const d = byId(DATA.collectibles, c.id);
  if (c.fake){ S.collection = S.collection.filter(x => x !== c); log(`🧐 A avaliação revelou que ${d.name} era FALSIFICAÇÃO. Perdi tudo o que paguei.`, "bad"); return R(false, "Era falso! O avaliador recusou a peça."); }
  const v = Math.round(c.value * (c.hot ? 0.5 : 0.9));                   // leiloeiro leva 10%; peça "quente" vende pela metade
  S.collection = S.collection.filter(x => x !== c); addMoney(fxConv(v, c.country)); S.stats.earned += v;
  log(`${d.emoji} Vendi ${d.name} por ${fmt(fxConv(v, c.country))}.`, "good", ["money"]);
  return R(true, `Vendido por ${fmt(fxConv(v, c.country))}.`);
}
function insureCollectible(u){
  const c = collection().find(x => x.uid === u); if (!c) return R(false, "?");
  if (c.hot) return R(false, "Nenhuma seguradora aceita peça sem procedência.");
  c.insured = !c.insured; return R(true, c.insured ? `Segurado: ${fmt(Math.round(c.value*0.015))}/ano.` : "Seguro cancelado.");
}
function lendToMuseum(u){
  const c = collection().find(x => x.uid === u); if (!c) return R(false, "?");
  if (c.hot) return R(false, "Um museu sério vai checar a procedência… melhor não.");
  if (c.lentAge === P().age) return R(false, "Já emprestada este ano.");
  c.lentAge = P().age; const fee = Math.round(c.value * 0.02);
  addMoney(fxConv(fee, c.country)); addRep(3); addFame(c.value > priceOf(300000) ? 3 : 1);
  return R(true, `Emprestei ao museu: +${fmt(fxConv(fee, c.country))}, reputação e prestígio.`);
}
function collectYear(){
  const Y = S.yearSummary;
  for (const c of [...collection()]){
    const d = byId(DATA.collectibles, c.id);
    c.value = Math.max(1, Math.round(c.value * (1 + d.appr + phase().invest*0.4 + rfloat(-d.vol, d.vol))));
    if (c.insured){ const prem = Math.round(fxConv(c.value * 0.015, c.country)); if (S.money >= prem){ addMoney(-prem); Y.expenses += prem; Y.lines.push([`Seguro: ${d.name}`, -prem]); } else c.insured = false; }
    if (chance(0.025 * country().crime * (c.value > priceOf(100000) ? 1.5 : 1))){
      S.collection = S.collection.filter(x => x !== c);
      if (c.insured){ const pay = fxConv(Math.round(c.value*0.9), c.country); addMoney(pay); log(`🚨 Roubaram ${d.name}. O seguro pagou ${fmt(pay)}.`, "bad"); }
      else log(`🚨 Roubaram ${d.name} (sem seguro). Prejuízo de ${fmt(fxConv(c.value, c.country))}.`, "bad");
      continue;
    }
    if (c.hot && chance(0.06)){ S.collection = S.collection.filter(x => x !== c); addNoto(8); S.record.push({ crime:"receptação de bem cultural", age:P().age, years:0 }); log(`🚔 A Interpol rastreou ${d.name}: peça apreendida e ficha suja por receptação.`, "bad", ["crime"]); }
  }
  if (collection().length && chance(0.12)) enqueue("ev_collector_offer");
}

/* ---------- Arsenal ---------- */
const hasWeapon = id => arsenal().some(w => w.id === id);
function weaponBlock(d){
  if (P().age < 18) return "Só maiores de idade";
  if (inPrison()) return "Você está preso(a)";
  if (d.legal === "license" && !S.flags.gunLicense) return "Exige porte de arma";
  if (hasWeapon(d.id)) return "Você já tem";
  return null;
}
function buyWeapon(id){
  const d = byId(DATA.armory, id), why = weaponBlock(d); if (why) return R(false, why);
  const price = priceOf(d.price) * (d.legal === "illegal" ? rfloat(1, 1.4) : 1);
  if (!canAfford(price)) return R(false, `Custa ${fmt(price)}.`);
  addMoney(-Math.round(price));
  if (d.legal === "illegal"){ addNoto(4); if (chance(0.08)){ S.record.push({ crime:"porte ilegal de arma", age:P().age, years:0 }); sendToPrison(rint(1, 3), "porte ilegal de arma"); return R(false, "O vendedor era informante. Preso(a) em flagrante."); } }
  arsenal().push({ uid:uid(), id, registered: d.legal === "license" });
  log(`${d.emoji} Comprei: ${d.name}.`, d.legal === "illegal" ? "bad" : "");
  return R(true, `${d.name} adquirida. Ela aparece como golpe nas brigas.`);
}
function discardWeapon(u){ const w = arsenal().find(x => x.uid === u); if (!w) return R(false, "?"); S.arsenal = S.arsenal.filter(x => x !== w); return R(true, `Me desfiz de: ${byId(DATA.armory, w.id).name}.`); }
function applyGunLicense(){
  const law = DATA.gunLaw[P().country] || { age:25, cost:2000, ok:0.3 };
  if (S.flags.gunLicense) return R(false, "Você já tem porte.");
  if (P().age < law.age) return R(false, `Idade mínima no país: ${law.age}.`);
  if (S.record.length) return R(false, "Negado: antecedentes criminais.");
  if (P().stress > 75 || S.illnesses.some(i => i.id === "depress" && i.diagnosed)) return R(false, "Negado no exame psicológico.");
  const cost = priceOf(law.cost); if (!canAfford(cost)) return R(false, `Taxas e cursos: ${fmt(cost)}.`);
  addMoney(-cost);
  if (!chance(law.ok)) return R(false, `Pedido negado pela polícia (aprovação ~${Math.round(law.ok*100)}% em ${country().name}).`);
  S.flags.gunLicense = true; log("🪪 Consegui porte de arma.", ""); return R(true, "Porte aprovado.");
}
/* Golpe de combate gerado a partir de uma arma do arsenal. */
function weaponMoves(){
  return arsenal().map(w => { const d = byId(DATA.armory, w.id); return d && { id:"w_" + d.id, weapon:d.id, name:`${d.emoji} ${d.name}`, dmg:d.dmg, acc:d.acc, ko:d.ko, lethal:d.lethal, cost:d.cost, type:"strike" }; }).filter(Boolean);
}
/* Na prisão (ou ao ser preso), armas ilegais pesam: +anos e apreensão. */
function weaponsOnArrest(){
  const ill = arsenal().filter(w => byId(DATA.armory, w.id).legal === "illegal");
  S.arsenal = arsenal().filter(w => byId(DATA.armory, w.id).legal !== "illegal");
  return ill.length;
}
</script>
<script>/* src/systems/dark.js */
"use strict";
/* =====================================================================
   systems/dark.js — O "LADO SOMBRIO" (arco de assassino em série).
   Mecânica abstrata de jogo, sem instruções do mundo real.

   Estado S.dark: active, code ("code" = só culpados | "none"), urge
   (impulso 0–100), heat (suspeita policial 0–100), clues (pistas
   acumuladas), stealth (perícia em não deixar rastros), kills, victims.
   • Impulso sobe todo ano; alto demais → crise (estresse, felicidade,
     evento pedindo decisão).
   • Caçada em etapas (S.hunt): alvo → estudar a rotina (preparo) →
     abordagem (arma do arsenal ou mãos nuas) → execução → limpeza.
       sucesso = 0,35 + preparo/200 + discrição/250 + maestria/400
                 + precisão da arma·0,2 − risco do alvo·0,15
       pistas  = rastreabilidade da arma·2 + (1 − preparo/100) + acaso
                 − limpeza;  suspeita += 6 + pistas·9 (+15 se havia motivo)
                 − disfarce/6   (e a suspeita cai 5 + disfarce/8 por ano)
   • DISFARCE: emprego, parceiro(a), filhos e vida estável escondem.
   • Suspeita alta → colegas/família desconfiam, força-tarefa e, com
     pistas suficientes, prisão perpétua/pena máxima.
   ===================================================================== */
const dark = () => (S.dark ||= { active:false, code:"code", urge:0, heat:0, clues:0, stealth:10, kills:0, victims:[], hunts:0 });
function darkCover(){
  const kids = children().filter(c => c.age < 18).length;
  return clamp(20 + (S.job ? 25 : 0) + (partner() ? 15 : 0) + kids*5 + (S.edu.school ? 10 : 0) - (S.org ? 10 : 0) - P().notoriety/3 - (P().stress > 70 ? 10 : 0));
}
function awakenDark(code){
  const D = dark(); if (D.active) return R(false, "Já desperto.");
  if (P().age < 18) return R(false, "—");
  D.active = true; D.code = code; D.urge = 35;
  log(`🌑 Algo sombrio despertou em mim. ${code === "code" ? "Vou seguir um código: só quem merece." : "Sem regras."}`, "bad", ["crime"]);
  remember("Escolhi alimentar o lado sombrio. Cada passo agora tem consequência.", "pending");
  return R(true, code === "code" ? "O código está definido: só culpados." : "Sem código. Sem limites.");
}
function repressDark(){
  const D = dark(); if (!D.active) return R(false, "—");
  const cost = priceOf(2500); if (!canAfford(cost)) return R(false, `Terapia intensiva: ${fmt(cost)}.`);
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  addMoney(-cost); D.urge = clamp(D.urge - rint(15, 30)); addStress(-6);
  return R(true, `Sessões intensas de terapia. Impulso ${Math.round(D.urge)}.`);
}
function normalLife(){
  const D = dark(); if (!D.active) return R(false, "—");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  D.heat = clamp(D.heat - rint(4, 9)); addStat("happiness", 2);
  return R(true, `Churrasco com colegas, sorriso no rosto. Ninguém desconfia de nada. Suspeita ${Math.round(D.heat)}.`);
}
function destroyEvidence(){
  const D = dark(); if (!D.active || !D.clues) return R(false, "Não há nada para destruir.");
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  if (chance(0.55 + D.stealth/250)){ D.clues = Math.max(0, D.clues - 1); D.stealth = clamp(D.stealth + 3); return R(true, `Uma pista a menos. Restam ${D.clues}.`); }
  D.heat = clamp(D.heat + 8); return R(false, "Alguém me viu mexendo onde não devia. Suspeita subiu.");
}

/* ---------- Caçada ---------- */
function huntCandidates(){
  const D = dark(), pool = D.code === "code" ? DATA.darkTargets.filter(t => t.guilty).concat([pick(DATA.darkTargets.filter(t => !t.guilty))]) : DATA.darkTargets;
  return [0,1,2].map(() => { const t = pick(pool), g = chance(0.8) ? "M" : "F", n = genName(country(), g); return { tid:t.id, first:n.first, last:n.last, gender:g, age:rint(22, 60) }; });
}
function huntBlock(){
  const D = dark();
  if (!D.active) return "Lado sombrio inativo";
  if (inPrison()) return "Você está preso(a)";
  if (D.lastHunt === P().age) return "Só uma caçada por ano";
  if (S.activitiesThisYear >= ACT_LIMIT) return "Sem energia este ano";
  return null;
}
function startHunt(target){
  const why = huntBlock(); if (why) return R(false, why);
  spendEnergy(); dark().lastHunt = P().age; dark().hunts++;
  S.hunt = { t: target, prep: 0, studied: 0, weapon: null, step: "plan" };
  return R(true, `Alvo escolhido: ${target.first} ${target.last}.`);
}
function huntStudy(){
  const H = S.hunt; if (!H || H.step !== "plan") return "";
  if (H.studied >= 2) return "Você já sabe tudo que dava para saber.";
  if (!spendEnergy()){ return "Sem energia para observar mais."; }
  H.studied++; H.prep = Math.min(100, H.prep + rint(25, 40));
  return `Observei a rotina do alvo por semanas. Preparo ${H.prep}%.`;
}
function huntOdds(H = S.hunt){
  const t = byId(DATA.darkTargets, H.t.tid), w = H.weapon ? byId(DATA.armory, H.weapon) : null, D = dark();
  return clamp((0.35 + H.prep/200 + D.stealth/250 + bestMastery()/400 + (w ? w.acc*0.2 : 0.08) - t.risk*0.15) * 100, 5, 92) / 100;
}
function huntExecute(weaponId){
  const H = S.hunt; if (!H) return "";
  H.weapon = weaponId || null; H.step = "done";
  const t = byId(DATA.darkTargets, H.t.tid), D = dark();
  if (chance(huntOdds(H))){ H.success = true; H.step = "cleanup"; return `${H.t.first} ${H.t.last} não vai mais fazer mal a ninguém.`; }
  // falhou: o alvo reage (combate) ou escapa
  D.heat = clamp(D.heat + 15); D.clues++;
  if (chance(0.6)){
    startFight("hunt", { npc:{ first:H.t.first, last:H.t.last, age:H.t.age, gender:H.t.gender, personality:"hothead" }, target:H.t });
    S.hunt = null; return "O alvo percebeu e reagiu!";
  }
  S.hunt = null; return `${H.t.first} escapou e viu meu rosto. A suspeita aumentou.`;
}
/* Limpeza: decide quantas pistas ficam. mode: meticulous | fast | frame */
function huntCleanup(mode){
  const H = S.hunt; if (!H || !H.success) return "";
  S.hunt = null;
  return darkKill(H.t, H.weapon, H.prep, mode);
}
function darkKill(target, weaponId, prep, mode = "fast"){
  const D = dark(), t = byId(DATA.darkTargets, target.tid), w = weaponId ? byId(DATA.armory, weaponId) : { trace:0.1, discretion:0.6 };
  let clues = Math.max(0, Math.round(w.trace*2 + (1 - prep/100) + rfloat(-0.6, 1.2)));
  let msg = "";
  if (mode === "meticulous"){ if (spendEnergy()){ clues = Math.max(0, clues - 2); D.stealth = clamp(D.stealth + 5); msg = " Limpei tudo com calma."; } else { msg = " Sem energia para limpar direito."; } }
  else if (mode === "frame"){
    if (chance(0.35 + P().stats.intelligence/300)){ D.heat = clamp(D.heat - 20); msg = " Plantei pistas que apontam para outra pessoa."; P().karma = clamp(P().karma - 10); }
    else { clues += 2; msg = " A pista falsa foi mal plantada — e aponta para mim."; }
  } else msg = " Saí rápido. Deve ter ficado algo para trás.";
  D.clues += clues; D.kills++; D.stealth = clamp(D.stealth + 2);
  S.stats.kills = num(S.stats.kills) + 1; martial().kills++;
  D.heat = clamp(D.heat + 6 + clues*9 + (t.id === "rival" ? 15 : 0) - darkCover()/6);
  D.victims.push({ name:`${target.first} ${target.last}`, type:t.name, age:P().age });
  // psicologia: o código importa
  if (t.guilty || D.code === "none"){ D.urge = clamp(D.urge - rint(45, 65)); addStress(-8); if (D.code === "none") P().karma = clamp(P().karma - 25); }
  else { D.urge = clamp(D.urge - 30); addStat("happiness", -20); addStress(20); P().karma = clamp(P().karma - 30); remember(`Quebrei meu próprio código com ${target.first}. Não sou quem eu achava que era.`, "bad"); msg += " Quebrei meu código. Isso me consome."; }
  log(`🌑 ${target.first} ${target.last} (${t.name.toLowerCase()}) desapareceu.`, "bad", ["crime"]);
  if (D.kills >= 3) achieve("darkpassenger", "Passageiro sombrio");
  if (D.heat >= 60) enqueue("ev_task_force");
  return `Feito.${msg} Pistas deixadas: ${clues}. Suspeita policial: ${Math.round(D.heat)}.`;
}
/* Resultado de uma caçada que virou briga (combate kind "hunt"). */
function huntFightAfter(F){
  const D = dark();
  F.ctx.target = F.ctx.target || { tid:"stranger", first:F.opp.first, last:F.opp.last, age:F.opp.age, gender:F.opp.gender }; // briga de caçada sem alvo planejado
  if (F.oppOutcome === "death"){ F.summary += " " + darkKill(F.ctx.target, F.usedWeapon, 0, "fast"); return; }
  D.heat = clamp(D.heat + (F.result === "win" ? 12 : 25)); D.clues++;
  F.summary += F.result === "win" ? " O alvo sobreviveu e vai falar com a polícia." : " Fugi ferido(a). Deixei sangue e rastros.";
}

/* ---------- Tick anual ---------- */
function darkYear(){
  const D = S.dark; if (!D || !D.active || !P().alive) return;
  if (inPrison()){ D.urge = clamp(D.urge + 5); return; }
  D.urge = clamp(D.urge + rint(10, 18) * (D.code === "code" ? 0.85 : 1));
  D.heat = clamp(D.heat - (5 + darkCover()/8));
  if (D.urge >= 70){ addStress(10); addStat("happiness", -6); enqueue("ev_dark_urge"); }
  if (D.heat >= 45 && chance(0.35)) enqueue("ev_dark_suspicion");
  if (D.heat >= 85 && D.clues >= 3 && chance(0.25 + D.clues*0.06)){
    log("🚨 A força-tarefa juntou as pistas. Fui preso(a) por assassinatos em série.", "bad", ["crime"]);
    const pen = DATA.penal[P().country] || { max:40, life:false };
    sendToPrison(pen.life ? 99 : pen.max, "assassinatos em série", "máxima");
    D.heat = 30; D.caught = true; addFame(30); addNoto(50);
  }
}
</script>
<script>/* src/systems/activities.js */
"use strict";
/* systems/activities.js */

const ACT_LIMIT = 6; // "energia" por ano para atividades pessoais

const R = (ok, msg) => ({ ok, msg });

function spendEnergy(){ if (S.activitiesThisYear >= ACT_LIMIT) return false; S.activitiesThisYear++; return true; }

function canAfford(v){ return S.money >= v; }

const adult = () => P().age >= 18;

/* ---------- Atividades pessoais ----------
   Retornos decrescentes: a n-ésima repetição da mesma atividade no ano
   rende 1/(1 + 0.7·n). Atividades físicas rendem menos com a idade.
   Nenhuma atividade cura doença — isso é papel do sistema de saúde. */
const dim = id => 1 / (1 + 0.7 * num(S.actCount[id]));
const ageBody = () => P().age > 60 ? 0.6 : P().age > 45 ? 0.8 : 1;
const sc = (v, id) => Math.max(v > 0 ? 1 : 0, Math.round(v * dim(id)));
const ACTIVITIES = [
  { id:"gym", name:"Academia", emoji:"🏋️", minAge:12, cost:300, desc:"Saúde, aparência, −estresse", run:()=>{
      S.health.exercised = true; let extra = "";
      if (P().age > 55 && chance(0.04)) extra = " Torci o joelho." + injure(rint(5,9), "Lesão na academia", 0.15);
      addStress(-sc(3,"gym"));
      return "Treinei pesado." + fx({ health: sc(rint(2,5)*ageBody(),"gym"), looks: sc(rint(0,2),"gym") }) + extra; } },
  { id:"read", name:"Ler livros", emoji:"📚", minAge:5, cost:0, desc:"+Inteligência", run:()=> "Devorei vários livros." + fx({ intelligence: sc(rint(1,3)*(1-P().stats.intelligence/125),"read") }) },
  { id:"course", name:"Curso online", emoji:"💻", minAge:16, cost:200, desc:"Inteligência; desempenho no trabalho", run:()=>{ if (S.job) S.job.perf = clamp(S.job.perf + sc(5,"course")); return "Concluí um curso de especialização." + fx({ intelligence: sc(rint(1,3),"course") }); } },
  { id:"meditate", name:"Meditar", emoji:"🧘", minAge:10, cost:0, desc:"−Estresse, +Felicidade", run:()=>{ addStress(-sc(rint(5,10),"meditate")); return "Encontrei paz interior." + fx({ happiness: sc(rint(2,5),"meditate") }); } },
  { id:"walk", name:"Caminhar no parque", emoji:"🌳", minAge:4, cost:0, desc:"Exercício leve", run:()=>{ if (P().age >= 60) S.health.exercised = true; addStress(-2); return "Ar fresco faz bem." + fx({ health: sc(rint(1,2),"walk"), happiness: 1 }); } },
  { id:"hobby", name:"Hobby criativo", emoji:"🪴", minAge:8, cost:80, desc:"−Estresse, +Felicidade", run:()=>{ addStress(-sc(5,"hobby")); return pick(["Cuidei do jardim.","Cozinhei algo novo.","Pintei um quadro.","Montei um quebra-cabeça enorme."]) + fx({ happiness: sc(rint(3,6),"hobby") }); } },
  { id:"party", name:"Balada", emoji:"🪩", minAge:16, cost:150, desc:"Diversão; risco de beber demais", run:()=>{
      if (chance(0.35)) S.addictions.alcohol = clamp(S.addictions.alcohol + rint(2,6));
      if (chance(0.25)){ enqueue("ev_approach_date"); return "Alguém ficou me olhando a noite toda… 👀" + fx({happiness:4}); }
      return "Dancei até amanhecer." + fx({ happiness: sc(rint(3,8),"party"), health:-rint(0,2) }); } },
  { id:"networking", name:"Networking", emoji:"🤝", minAge:20, cost:250, desc:"+Reputação; contatos futuros", cond:()=>!!S.job || S.edu.school==="uni", run:()=>{
      addRep(sc(rint(2,4),"networking")); addStress(2);
      if (chance(0.15)) schedule("contactOffer", rint(1,2), {}, "Um contato de networking pode render uma proposta.");
      return "Troquei cartões com gente influente."; } },
  { id:"vacation", name:"Viajar de férias", emoji:"✈️", minAge:18, cost:3500, desc:"++Felicidade, −−Estresse", run:()=>{ addStress(-sc(15,"vacation")); return `Viagem para ${pick(["a praia","as montanhas","Paris","Tóquio","Buenos Aires","o Caribe","Lisboa"])}!` + fx({ happiness: sc(rint(8,15),"vacation") }); } },
  { id:"therapy", name:"Terapia", emoji:"🛋️", minAge:10, cost:900, desc:"−Estresse; trata depressão", run:()=>{
      addStress(-sc(rint(8,14),"therapy"));
      const d = S.illnesses.find(i=>i.id==="depress" && i.diagnosed);
      if (d && !d.treated){ d.treated = true; d.tier = "private"; return "Comecei acompanhamento para a depressão." + fx({happiness:5}); }
      if (S.illnesses.some(i=>i.id==="depress" && !i.diagnosed)){ const u = S.illnesses.find(i=>i.id==="depress"); u.diagnosed = true; return "A terapeuta identificou um quadro de depressão." ; }
      return "Boas sessões." + fx({ happiness: sc(rint(3,7),"therapy") }); } },
  { id:"music", name:"Praticar música", emoji:"🎹", minAge:6, cost:100, desc:"+Talento musical", run:()=>{ P().talents.music = clamp(P().talents.music + sc(rint(2,6),"music")); return "Horas de ensaio." + fx({happiness:2}); } },
  { id:"acting", name:"Aulas de teatro", emoji:"🎭", minAge:6, cost:150, desc:"+Talento de atuação", run:()=>{ P().talents.acting = clamp(P().talents.acting + sc(rint(2,6),"acting")); return "Improvisos e monólogos." + fx({happiness:2}); } },
  { id:"train", name:"Treinar esporte", emoji:"🏃", minAge:6, cost:100, desc:"+Talento esportivo, exercício", run:()=>{ P().talents.sport = clamp(P().talents.sport + sc(rint(2,6),"train")); S.health.exercised = true; return "Treino puxado." + fx({health: sc(rint(1,3)*ageBody(),"train")}); } },
  { id:"license", name:"Autoescola", emoji:"🪪", minAge:18, cost:400, desc:"Tirar a carteira", cond:()=>!S.flags.license, run:()=>{ if (chance(0.5 + P().stats.intelligence/250)){ S.flags.license = true; return "Passei na prova de direção! 🪪" + fx({happiness:6}); } return "Reprovei no exame de direção." + fx({happiness:-3}); } },
  { id:"lottery", name:"Loteria", emoji:"🎟️", minAge:18, cost:10, desc:"Chance minúscula", run:()=>{ S.addictions.gambling = clamp(S.addictions.gambling + 1); const r = rand(); if (r < 0.0004){ const w = wageOf(rint(2e6,4e7)); achieve("lottery","Ganhou na loteria"); return "GANHEI NA LOTERIA!!! 🤑" + fx({money:w, happiness:30}); } if (r < 0.03) return "Acertei a quadra." + fx({money:priceOf(rint(50,800))}); return "Não foi dessa vez."; } },
  { id:"casino", name:"Cassino", emoji:"🎰", minAge:18, cost:0, desc:"Aposte 10% do caixa (vicia)", run:()=>{ S.addictions.gambling = clamp(S.addictions.gambling + rint(3,6)); const bet = Math.max(0, Math.round(S.money*0.1)); if (!bet) return "Sem dinheiro para apostar."; return chance(0.46) ? "A sorte sorriu!" + fx({money:bet, happiness:6}) : "A casa sempre vence." + fx({money:-bet, happiness:-4}); } },
  { id:"volunteer", name:"Voluntariado", emoji:"🙌", minAge:12, cost:0, desc:"+Karma, +Reputação", run:()=>{ addRep(1); if (!S.flags.volRef && chance(0.25)){ S.flags.volRef = true; schedule("volunteerReference", rint(1,3)); } return "Ajudei quem precisava." + fx({happiness: sc(4,"volunteer"), karma:5}); } },
  { id:"shopping", name:"Fazer compras", emoji:"🛍️", minAge:10, cost:400, desc:"+Felicidade passageira, −estresse", run:()=>{ addStress(-sc(4,"shopping")); if (hasTrait("spendthrift")) addStat("happiness", 2); return pick(["Comprei roupas novas.","Gastei mais do que devia no shopping.","Achei uma promoção imperdível (ou nem tanto)."]) + fx({ happiness: sc(rint(2,5),"shopping") }); } },
  { id:"social", name:"Postar nas redes", emoji:"📱", minAge:13, cost:0, desc:"+Fama (talvez)", run:()=>{ const viral = chance((0.04 + P().stats.looks/1000 + P().fame/400) * dim("social")); return viral ? "Meu post viralizou! 🔥" + fx({fame:rint(5,15), happiness:6}) : "Algumas curtidas." + fx({fame:rand()<0.5?1:0}); } },
];

function doActivity(id){
  const a = byId(ACTIVITIES, id);
  if (P().age < a.minAge) return R(false, `Idade mínima: ${a.minAge}.`);
  if (inPrison()) return R(false, "Você está preso(a).");
  if (a.cond && !a.cond()) return R(false, "Indisponível.");
  const cost = priceOf(a.cost);
  if (cost && P().age >= 18 && !canAfford(cost)) return R(false, `Custa ${fmt(cost)}.`);
  if (!spendEnergy()) return R(false, "Você está exausto(a). Espere o próximo ano.");
  if (cost && P().age >= 18) addMoney(-cost);
  const msg = a.run(); S.actCount[id] = num(S.actCount[id]) + 1;
  log(`${a.emoji} ${a.name}: ${msg}`, ""); sanitize();
  if (P().stats.health <= 0) die("complicações de saúde");
  return R(true, msg);
}
</script>
<script>/* src/systems/world.js */
"use strict";
/* =====================================================================
   systems/world.js — emigração (CORRIGIDO na v5).
   Antes: emigrar vendia tudo (imóveis sumiam, aluguéis paravam).
   Agora: imóveis, veículos e negócios FICAM no país de origem, com seu
   `country` e moeda; seguem valorizando, gerando aluguel (convertido,
   com taxa de administração remota) e podem ser geridos/vendidos de
   longe. Só o caixa e os investimentos (líquidos) são convertidos.
   ===================================================================== */
const VISA_STRICT = { US:true, JP:true, DE:true };
function visaCheck(to){
  if (!VISA_STRICT[to.id]) return null;
  const qualified = S.edu.level >= 4 || netWorth() > wageOf(150000) || (S.job && S.job.level >= 2) || P().fame >= 50;
  if (qualified) return null;
  return `Visto negado por ${to.name}: exige diploma superior, carreira sólida ou patrimônio comprovado.`;
}
function emigrateCost(to){ return Math.round(priceOf(2500) + fxConv(priceIn(1500, to.id), to.id)); }

function emigrate(cid, fled){
  const from = country(), to = byId(DATA.countries, cid);
  if (!to || to.id === from.id) return R(false, "Destino inválido.");
  if (!fled){
    if (!adult()) return R(false, "Precisa ser maior de idade.");
    if (inPrison()) return R(false, "Você está preso(a).");
    if (S.wanted && !S.wanted.fakeId) return R(false, "Foragido(a) não tira passaporte. Só fugindo (coiote) ou com identidade falsa.");
    const visa = visaCheck(to); if (visa) return R(false, visa);
    const cost = emigrateCost(to); if (!canAfford(cost)) return R(false, `Mudança + visto custam ${fmt(cost)}.`);
    addMoney(-cost);
  }
  const conv = v => fxConv(v, from.id, to.id);
  // só ativos líquidos mudam de moeda
  S.money = conv(S.money);
  for (const id in S.investments) S.investments[id] = conv(S.investments[id]);
  S.edu.debt = conv(S.edu.debt);
  S.pension = conv(S.pension); // pensão portável (acordos previdenciários)
  S.lastSalary = conv(num(S.lastSalary));
  if (S.trustFund) S.trustFund = conv(S.trustFund);
  S.dirty = conv(num(S.dirty));
  // imóveis/veículos/negócios/dívidas ficam onde estão: garante o país de origem gravado
  for (const a of [...S.properties, ...S.vehicles, ...S.businesses, ...S.loans]) a.country = a.country || from.id;
  for (const p of S.properties) if (p.residence){ p.residence = false; log(`🏠 ${byId(DATA.properties,p.id).name} em ${from.name} ficou vago — posso colocá-lo para alugar de longe.`, ""); }
  S.rental = null;
  endJob("Emigrou"); S.partTime = null;
  if (S.org && S.org.rank < DATA.orgRanks.length - 1){ log(`Deixei a organização ${S.org.name} ao sair do país.`, "bad"); S.org = null; }
  else if (S.org) { S.org.remote = true; log(`Vou comandar ${S.org.name} à distância — com menos controle.`, "bad"); }
  // pessoas: parceiro(a) pode ou não vir; amigos ficam
  const pt = partner();
  if (pt){ if (pt.rel >= 55 || chance(0.4)){ pt.history = [...(pt.history||[]), { age:P().age, text:"Mudou de país comigo" }]; log(`${pt.first} veio comigo.`, "good"); } else { pt.role = pt.role === "spouse" ? "spouse" : "ex"; if (pt.role === "ex") log(`${pt.first} não quis largar tudo e terminamos.`, "bad"); } }
  for (const r of S.rels) if (["friend","sibling","mother","father"].includes(r.role) && r.alive) r.rel = clamp(r.rel - rint(4,10));
  P().country = to.id; P().city = pick(to.cities);
  if (!S.stats.countries.includes(to.id)) S.stats.countries.push(to.id);
  const kept = S.properties.length + S.vehicles.length + S.businesses.length;
  log(`${fled?"Fugi":"Me mudei"} para ${P().city}, ${to.name}. ✈️${kept ? ` Mantive ${kept} bem(ns) em ${from.name}, geridos à distância.` : ""}`, "milestone");
  emit("travel");
  return R(true, `Bem-vindo(a) a ${to.name}!`);
}

<script>/* src/systems/legacy.js */
"use strict";
/* systems/legacy.js */

function die(cause){
  if (!P().alive) return;
  P().alive = false; P().cause = cause; S.queue = []; emit("death");
  log(`☠️ Faleci aos ${P().age} anos. Causa: ${cause}.`, "milestone");
  S.final = { score: lifeScore(), netWorth: netWorth(), year: year(), title: lifeTitle() };
  recordHall(); // histórico entre vidas (hub)
}

function lifeScore(){
  const a = P().age, h = S.hist || { happy:P().stats.happiness, n:1 };
  const avgHappy = h.n ? h.happy/h.n : P().stats.happiness;
  const nwBase = Math.max(1, netWorth() / (country().fx*country().wage*S.priceIndex));
  const topRatio = Math.max(0, ...S.jobHistory.map(j=>{ const c = DATA.careers.find(c=>c.name===j.career); const i = c ? c.levels.findIndex(l=>l.t===j.title) : 0; return c ? (i+1)/c.levels.length : 0; }), S.job ? (S.job.level+1)/career().levels.length : 0);
  const parts = {
    "Longevidade":      Math.min(a,100)/100*20,
    "Felicidade média": avgHappy/100*20,
    "Patrimônio":       clamp((Math.log10(nwBase)-3)/4*20, 0, 20),
    "Educação":         S.edu.level/6*10,
    "Carreira e fama":  topRatio*10 + P().fame/100*5,
    "Família":          Math.min(10, (S.flags.married?4:0) + Math.min(3,children(false).length)*2),
    "Caráter":          (P().karma-50)/50*5 - Math.min(15, S.record.length*3),
  };
  const total = clamp(Object.values(parts).reduce((a,b)=>a+b,0));
  return { total: Math.round(total), parts };
}

function gradeOf(t){ return t>=85?"Lendária":t>=70?"Excelente":t>=55?"Boa":t>=40?"Comum":t>=25?"Difícil":"Trágica"; }

function summarizeLife(s){
  const keep = S; S = s;
  const out = { name:`${P().first} ${P().last}`, born:P().birthYear, died:P().birthYear+P().age, age:P().age, cause:P().cause, netWorth:fmt(netWorth(),true), score:(s.final||{score:{total:0}}).score.total, country:country().name };
  S = keep; return out;
}

/* Continuar como herdeiro: assume um filho vivo na idade atual dele. */
function continueAsHeir(childUid){
  const old = S, kid = old.rels.find(r=>r.uid===childUid); if (!kid) return;
  const kids = old.rels.filter(r=>r.role==="child"&&r.alive);
  const estate = Math.max(0, netWorth());
  const share = heirShare(estate, kid, kids); // testamento + 15% de imposto de herança
  const oldC = old.player.country;
  S = old; // para summarizeLife usar contexto
  newLife({ heir:true, country:oldC, gender:kid.gender, first:kid.first, heirLast:kid.last, birthYear: old.player.birthYear + old.player.age - kid.age, cls: heirClass(estate) });
  S.priceIndex = old.priceIndex; S.wageIndex = old.wageIndex; S.world = old.world; // mesma economia, outra geração
  const me = P(); me.age = kid.age; me.stats.looks = clamp(kid.looks ?? me.stats.looks);
  // reconstrói família: pai/mãe falecido = personagem anterior
  S.rels = S.rels.filter(r=>r.role!=="sibling");
  const dp = S.rels.find(r=>r.role==="mother"||r.role==="father");
  if (dp){ dp.first = old.player.first; dp.last = old.player.last; dp.gender = old.player.gender; dp.role = old.player.gender==="F"?"mother":"father"; dp.alive = false; dp.age = old.player.age; dp.rel = kid.rel; dp.inheritPaid = true; }
  const other = S.rels.find(r=>r!==dp && (r.role==="mother"||r.role==="father"));
  const spouse = old.rels.find(r=>r.role==="spouse"&&r.alive);
  if (other){ if (spouse){ other.first = spouse.first; other.last = spouse.last; other.gender = spouse.gender; other.age = spouse.age; other.role = spouse.gender==="F"?"mother":"father"; } else other.alive = false; }
  for (const k of kids) if (k !== kid) S.rels.push({ ...k, uid:uid(), role:"sibling" });
  for (const r of S.rels) r.age = r.alive ? Math.max(0, r.age) : r.age;
  // educação compatível com a idade
  const E = S.edu, a = me.age;
  if (a >= 6 && a < 15){ E.school = "fund"; E.yearsLeft = 15-a; }
  else if (a >= 15 && a < 18){ E.level = 1; E.school = "medio"; E.yearsLeft = 18-a; }
  else if (a >= 18){ E.level = 2; }
  me.stats.intelligence = clamp(me.stats.intelligence + Math.min(a,18)*1.2);
  if (a >= 18){ addMoney(share); } else S.trustFund = share;
  S.log = [];
  log(`Continuo a história da família como ${me.first} ${me.last}, ${a} anos, após a morte de ${old.player.first}.`, "milestone");
  log(`Herança recebida: ${fmt(share)}${a<18?" (liberada aos 18)":""}.`, "good");
  S.lineage = [...(old.lineage||[]), summarizeLife(old)];
}

/* Classe do herdeiro pelo tamanho do espólio (9 níveis). */
function heirClass(estate){
  const th = [2e8, 8e6, 1e6, 4e5, 1.5e5, 5e4, 1e4], i = th.findIndex(t => estate >= wageOf(t));
  return i < 0 ? 1 : 8 - i;
}
/* Título final da vida: a característica mais marcante. */
function lifeTitle(){
  const p = P(), S2 = S.stats, nwB = toBase(netWorth()), f = p.gender === "F";
  const opts = [];
  if (S.org && isBoss()) opts.push([95, f ? "Chefona do Crime" : "Chefão do Crime"]);
  if (S2.arrests >= 3) opts.push([80, "Velho(a) Conhecido(a) da Polícia"]);
  const M = S.martial || { rec:{ w:0 }, titles:[], kills:0 };
  if (M.titles.some(t => t.tid === "cinturao")) opts.push([97, f ? "Campeã Mundial de Lutas" : "Campeão Mundial de Lutas"]);
  else if (M.rec.w >= 10) opts.push([78, "Lenda do Ringue"]);
  if (num(M.kills) >= 3) opts.push([92, f ? "A Temida" : "O Temido"]);
  else if (num(M.kills) >= 1 && p.karma < 30) opts.push([72, "Mãos Sujas de Sangue"]);
  const D = S.dark || {};
  if (num(D.kills) >= 3) opts.push([99, D.caught ? "Serial Killer Capturado(a)" : D.code === "code" ? "O Justiceiro das Sombras" : "Assassino(a) em Série Nunca Descoberto(a)"]);
  if (S.flags.exAthlete && num(S.jobHistory.length) && S.achievements.some(a => a.id === "sporttitle")) opts.push([84, "Lenda do Esporte"]);
  if ((S.collection || []).length >= 6) opts.push([66, "Grande Colecionador(a)"]);
  if (num(S2.escapes) >= 1) opts.push([83, num(S2.escapes) >= 2 ? "Mestre(a) da Fuga" : "Fugitivo(a) Lendário(a)"]);
  if (Object.values(M.arts || {}).some(a => a.m >= 90)) opts.push([74, "Grão-Mestre(a) das Artes Marciais"]);
  if (nwB > 2e7) opts.push([90, f ? "Magnata" : "Magnata"]);
  else if (nwB > 2e6) opts.push([70, "Milionário(a) Self-made"]);
  if (p.fame >= 75) opts.push([85, "Lenda Popular"]);
  if (S.job && career().elected && S.job.level >= 4 || S.jobHistory.some(j=>/Presidente|Governador|Senador/.test(j.title))) opts.push([88, "Figura Histórica da Política"]);
  if (children(false).length >= 4 || num(S.flags.grandkids) >= 4) opts.push([65, f ? "Grande Matriarca" : "Grande Patriarca"]);
  if (p.age >= 95) opts.push([75, "Sobrevivente Centenário(a)"]);
  if (p.age < 30) opts.push([60, "Vida Breve"]);
  if (S.edu.level >= 6) opts.push([60, "Mente Brilhante"]);
  if (p.karma >= 80 && !S.record.length) opts.push([62, "Cidadão(ã) Exemplar"]);
  if (S2.countries.length >= 3) opts.push([55, "Cidadão(ã) do Mundo"]);
  if (S.flags.bankrupt) opts.push([50, "Falido(a) Resiliente"]);
  if (!opts.length) opts.push([10, (S.hist?.happy/Math.max(1,S.hist?.n||1)) > 60 ? "Alma Feliz" : "Vida Comum"]);
  return opts.sort((a,b)=>b[0]-a[0])[0][1];
}
/* Capítulos da vida para a linha do tempo ilustrada do legado. */
function lifeChapters(){
  const stages = [["👶","Infância",0,12],["🧑","Adolescência",13,17],["🎓","Juventude",18,29],["💼","Vida Adulta",30,59],["👴","Terceira Idade",60,200]];
  return stages.map(([ic,name,a,b]) => ({ ic, name, range:`${a}–${Math.min(b, P().age)}`,
    items: S.log.filter(e => e.age >= a && e.age <= b && (e.kind === "milestone" || /🏆|⛓️|💍|👶|🎓|🔨|🗳️|👑|☠️|🏃|🥋|🥇|🏅/.test(e.text))).slice(0, 9) }))
    .filter(ch => ch.items.length && P().age >= parseInt(ch.range));
}

/* Testamento (cartório): define a partilha usada em continueAsHeir. */
function makeWill(mode, uid){
  if (P().age < 18) return R(false, "Menores não fazem testamento.");
  const cost = priceOf(400); if (!canAfford(cost)) return R(false, `O cartório cobra ${fmt(cost)}.`);
  addMoney(-cost); S.flags.will = { mode, uid: uid || null };
  const k = uid ? relBy(uid) : null;
  log(`📜 Registrei testamento: ${mode === "favor" ? `60% para ${k?.first}` : mode === "charity" ? "metade para caridade" : "partilha igual entre os filhos"}.`, "");
  return R(true, "Testamento registrado.");
}
function heirShare(estate, kid, kids){
  const W = S.flags.will, net = estate * 0.85; // 15% imposto de herança
  if (!W || W.mode === "equal" || !kids.length) return Math.round(net / Math.max(1, kids.length));
  if (W.mode === "charity") return Math.round(net * 0.5 / kids.length);
  if (W.mode === "favor") return kid.uid === W.uid ? Math.round(net * (kids.length > 1 ? 0.6 : 1)) : Math.round(net * 0.4 / Math.max(1, kids.length - 1));
  return Math.round(net / kids.length);
}

<script>/* src/systems/events.js */
"use strict";
/* systems/events.js */

const STAT_LABEL = { health:"Saúde", happiness:"Felicidade", intelligence:"Inteligência", looks:"Aparência", fame:"Fama", noto:"Notoriedade" };

/* fx aplica efeitos e devolve um sufixo legível "(Saúde +5, Felicidade −3)". */
function fx(o){
  const parts = [];
  for (const k of ["health","happiness","intelligence","looks"]) if (o[k]) { addStat(k, o[k]); parts.push(`${STAT_LABEL[k]} ${o[k]>0?"+":"−"}${Math.abs(Math.round(o[k]))}`); }
  if (o.fame){ addFame(o.fame); parts.push(`Fama ${o.fame>0?"+":"−"}${Math.abs(Math.round(o.fame))}`); }
  if (o.noto){ addNoto(o.noto); }
  if (o.karma){ P().karma = clamp(P().karma + o.karma); }
  if (o.money){ addMoney(o.money); parts.push(`${o.money>0?"+":"−"}${fmt(Math.abs(o.money))}`); }
  return parts.length ? ` (${parts.join(", ")})` : "";
}

const EVENT_MAP = Object.fromEntries(EVENTS.map(e=>[e.id,e]));

function enqueue(id, ctx){
  const ev = EVENT_MAP[id]; if (!ev) return;
  if (S.queue.some(q=>q.id===id)) return;
  try { S.queue.push({ id, ctx: ctx ?? (ev.setup ? ev.setup() : {}) }); } catch(e){ console.warn("setup falhou", id, e); }
}

function eventWeight(ev){
  const a = P().age;
  if (a < ev.age[0] || a > ev.age[1]) return 0;
  if (ev.once && S.cooldown[ev.id] !== undefined) return 0;
  if (ev.cd && S.cooldown[ev.id] !== undefined && a - S.cooldown[ev.id] < ev.cd) return 0;
  if (inPrison() !== !!ev.prison) return 0; // atrás das grades só rolam eventos de prisão (e vice-versa)
  try {
    if (ev.cond && !ev.cond()) return 0;
    return typeof ev.weight === "function" ? ev.weight() : ev.weight;
  } catch(e){ return 0; }
}

/* Sorteia 0–2 eventos/ano, respeitando cooldown (evita repetição). */
function queueEvents(){
  if (P().age < 2) return;
  const n = chance(0.75) ? (chance(0.35) ? 2 : 1) : 0;
  for (let i=0; i<n; i++){
    const ev = weighted(EVENTS, eventWeight);
    if (!ev) break;
    S.cooldown[ev.id] = P().age;
    enqueue(ev.id);
  }
}

/* Resolve a escolha i do primeiro evento da fila. Retorna o texto do resultado. */
function resolveEvent(i){
  const q = S.queue[0]; if (!q) return null;
  const ev = EVENT_MAP[q.id]; let res = "";
  try { const ch = ev.choices(q.ctx)[i]; res = ch.run(q.ctx) || ""; log(`${ev.emoji} ${ev.title}: ${res}`, /−|perdi|demitid|pres|condenad/i.test(res) ? "bad" : "good"); }
  catch(e){ console.error(e); res = "(evento ignorado)"; }
  S.queue.shift();
  sanitize();
  if (S.flags.forcedDeath){ const c = S.flags.forcedDeath; delete S.flags.forcedDeath; die(c); }
  else if (P().stats.health <= 0) die(S.illnesses.some(i=>i.diagnosed && byId(DATA.illnesses,i.id).sev >= 8) ? `complicações de ${byId(DATA.illnesses, S.illnesses.filter(i=>i.diagnosed).sort((a,b)=>b.stage-a.stage)[0].id).name}` : "ferimentos graves");
  return res;
}

/* Descarta eventos da fila que deixaram de fazer sentido (ex.: perdeu o
   emprego por causa de um evento anterior do mesmo ano). Revalida
   cond() de todos e weight() dos sorteáveis. Evita resultados contraditórios. */
function validHead(){
  while (S.queue.length){
    const q = S.queue[0], ev = EVENT_MAP[q.id];
    let ok = !!ev && P().alive;
    try {
      if (ok && ev.cond && !ev.cond(q.ctx)) ok = false; // eventos enfileirados revalidam com o próprio contexto
      if (ok && typeof ev.weight === "function" && !(ev.weight() > 0)) ok = false;
    } catch(e){ ok = false; }
    if (ok && ev.prison && !S.prison) ok = false;
    if (ok) return q;
    S.queue.shift();
  }
  return null;
}
</script>
<script>/* src/systems/sim.js */
"use strict";
/* =====================================================================
   systems/sim.js — orquestra o "tick" anual.
   Ordem fixa (cada subsistema lê o que os anteriores produziram):
   envelhecimento/estresse → escola → carreira → negócios → ativos →
   finanças/crédito → relações → saúde → prisão → consequências
   agendadas → marcos → reparo/sanitização → morte → eventos do ano.
   Um snapshot antes/depois gera o "Resumo do ano" exibido na UI.
   ===================================================================== */
function takeSnapshot(){
  const p = P();
  return { ...p.stats, stress:p.stress, rep:p.reputation, fame:p.fame, vitality:p.vitality,
           money:S.money, nw:netWorth(), credit:S.credit };
}
function ageUp(){
  // briga/fuga deixada pela metade (save recarregado): resolve antes de avançar
  if (S.flags.forcedDeath && P().alive){ const c = S.flags.forcedDeath; delete S.flags.forcedDeath; die(c); return true; }
  if (S.fight) autoFight();
  if (S.escape) autoEscape();
  if (!P().alive || S.queue.length) return false;
  const before = S.snap || takeSnapshot();
  const Y = S.yearSummary = { income:0, taxes:0, expenses:0, lines:[] };
  P().age++;
  economyYear(); // inflação, salários e fase do ciclo
  S.activitiesThisYear = 0; S.actCount = {};

  agingYear(); schoolYear(); careerYear(); sportsYear(); gigYear(); martialYear(); businessYear(); assetsYear(); collectYear();
  financeYear(Y); orgYear(); relationshipsYear(); identityYear(); looksYear(); petsYear(); healthYear(); prisonYear(); fugitiveYear(); darkYear();
  consequencesYear(); milestoneYear();
  S.hist = S.hist || { happy:0, health:0, n:0 };
  S.hist.happy += P().stats.happiness; S.hist.health += P().stats.health; S.hist.n++;

  repairState(); sanitize();
  const after = takeSnapshot();
  S.lastYear = { age:P().age, before, after, net: Y.income - Y.expenses };
  S.snap = after;
  let cause = deathCheck();
  if (S.flags.forcedDeath){ cause = S.flags.forcedDeath; delete S.flags.forcedDeath; } // ataque de animal, erro médico…
  if (cause){ die(cause); return true; }
  queueEvents();
  return true;
}
/* Deltas relevantes do último ano (para o cartão "Seu ano"). */
function yearDeltas(){
  const L = S.lastYear; if (!L) return [];
  const keys = [["health","❤️ Saúde"],["happiness","😊 Felicidade"],["intelligence","🧠 Inteligência"],["looks","✨ Aparência"],["stress","😣 Estresse",true],["rep","💼 Reputação"],["credit","🏦 Crédito"]];
  const out = [];
  for (const [k,label,inverse] of keys){ const d = Math.round(num(L.after[k]) - num(L.before[k])); if (d) out.push({ label, d, good: inverse ? d < 0 : d > 0 }); }
  const dn = L.after.nw - L.before.nw; if (dn) out.push({ label:"📊 Patrimônio", d:dn, money:true, good: dn > 0 });
  return out;
}

/* ---------- Marcos ---------- */
function milestoneYear(){
  const a = P().age, nw = netWorth();
  if (a === 18) log("Atingi a maioridade! 🎉", "milestone");
  if (a === 13) log("Virei adolescente.", "");
  if (a === 60) log("Entrei na terceira idade.", "milestone");
  if (a === 100){ achieve("centenarian","Centenário(a)"); }
  if (nw >= wageOf(1e6)) achieve("millionaire", `Patrimônio de ${fmt(nw,true)}`);
  if (nw >= wageOf(1e8)) achieve("magnate","Magnata (patrimônio altíssimo)");
  if (P().fame >= 80) achieve("famous","Celebridade nacional");
  if (P().stats.looks >= 95) achieve("gorgeous","Beleza estonteante");
  if (P().stats.intelligence >= 98) achieve("genius","Gênio reconhecido");
  if (children().length >= 3) achieve("bigfamily","Família grande");
  if (S.credit >= 800) achieve("credit","Crédito excelente");
  if (a >= 80 && P().stats.health >= 60) achieve("healthy80","Chegou aos 80 com saúde");
}

<script>/* src/ui/dom.js */
"use strict";
/* =====================================================================
   ui/dom.js — helpers de DOM, componentes de template e animações.
   Animações são apenas feedback (nunca bloqueiam o jogo) e respeitam
   prefers-reduced-motion.
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
const barColor = v => v >= 66 ? "var(--good)" : v >= 33 ? "var(--warn)" : "var(--bad)";
const stressColor = v => v >= 66 ? "var(--bad)" : v >= 40 ? "var(--warn)" : "var(--good)";
const REDUCED = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;

let TAB = "life", LOGFILTER = "all", LOGALL = false, LOGQUERY = "", TAB_CHANGED = true;
try { TAB = localStorage.getItem("claudilife.tab") || "life"; } catch(e){}

function toast(msg){ const t = $("#toast"); if (!t) return; t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2800); }
/* Avatar: emoji por idade/gênero + tom de pele escolhido no hub. */
function avatarFor(age, gender, tone = ""){ const f = gender === "F"; return (age<3?"👶":age<13?(f?"👧":"👦"):age<18?"🧑":age<60?(f?"👩":"👨"):(f?"👵":"👴")) + (tone || ""); }
function avatar(){ if (!P().alive) return "🪦"; if (inPrison()) return "🧑‍⚖️"; return avatarFor(P().age, P().gender, S.look?.tone); }

/* ---------- componentes ---------- */
function bar(label, v, color, cap){
  v = Math.round(clamp(v));
  return `<div class="bar"><div class="lbl"><span>${label}</span><b>${v}%</b></div><div class="track"><div class="fill" style="width:${v}%;background:${color||barColor(v)}"></div>${cap!==undefined&&cap<100?`<i class="cap" style="left:${cap}%" title="Teto atual"></i>`:""}</div></div>`;
}
function mini(v, color){ v = Math.round(clamp(v)); return `<div class="minibar" title="${v}%"><i style="width:${v}%;background:${color||barColor(v)}"></i></div>`; }
const chip = (text, cls = "") => `<span class="chip ${cls}">${text}</span>`;
const pct = p => `<b class="${oddsColor(p)}">${Math.round(p*100)}%</b>`;
const label = t => `<div class="section-label">${t}</div>`;
const signed = (d, money) => (d > 0 ? "+" : "−") + (money ? fmt(Math.abs(d), true) : Math.abs(d));

/* ---------- animações ---------- */
/* Contador numérico suave (dinheiro no HUD). */
function animateNumber(el, from, to, format, ms = 550){
  if (!el) return;
  if (REDUCED() || from === to || !isFinite(from)){ el.textContent = format(to); return; }
  cancelAnimationFrame(el._raf);
  const t0 = performance.now();
  const step = t => { if (!S || !el.isConnected) return; const k = Math.min(1, (t - t0)/ms), e = 1 - Math.pow(1-k, 3);
    el.textContent = format(Math.round(from + (to - from)*e)); if (k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}
/* Reinicia uma classe de animação (remove → reflow → adiciona). */
function restartClass(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
/* Selo "🎂 33 anos · 2037" ao passar de ano. */
function yearBadge(){
  const b = $("#yearbadge"); if (!b) return;
  b.innerHTML = `<b>🎂 ${P().age} anos</b><span>${year()} · ${lifeStage()}</span>`;
  restartClass(b, "show");
}
