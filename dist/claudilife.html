<script>/* src/systems/career.js */
"use strict";
/* systems/career.js */

function salaryFor(c, level, years=0){
  const base = c.levels[Math.min(level, c.levels.length-1)].s;
  // MODO BRUTO: salários ~15% menores e reajuste por tempo de casa mais lento
  return wageOf(base * 0.85 * (1 + 0.015*Math.min(years,10)) * (0.85 + 0.15*country().opp));
}

/* ---------- Tick anual de carreira ----------
   Desempenho depende de atributo-chave, felicidade, esforço, traços,
   ESTRESSE e SAÚDE; reputação acumula com o desempenho e pesa em
   contratações futuras (systems/modifiers.js). */
function careerYear(){
  S.health.employerPlan = false;
  if (inPrison()) return;
  if (S.partTime && P().age >= 18 && S.job){ S.partTime = null; }
  if (!S.job){
    if (P().age >= 18 && P().age < 65 && !S.edu.school && !S.retired) S.unemployedYears++;
    return;
  }
  const J = S.job, c = career(), p = P();
  J.years++; J.levelYears++;
  S.health.employerPlan = c.edu >= 3 || J.level >= 2; // benefício: plano básico da empresa
  const statV = c.talent ? p.talents[c.talent] : p.stats[c.stat];
  const target = statV*0.5 + p.stats.happiness*0.2 + 20 + (J.effort-1)*15 + (hasTrait("ambitious")?8:0) - (hasTrait("lazy")?10:0)
    - Math.max(0, p.stress - 60)/2 - (p.stats.health < 30 ? 10 : 0);
  J.perf = clamp(J.perf + (target - J.perf)*0.35 + rfloat(-8,8));
  if (J.effort === 2) addStat("happiness",-3);
  if (J.effort === 0) addStat("happiness",2);
  if (J.perf > 75) addRep(2); else if (J.perf < 35) addRep(-2);
  if (c.elected){ // política: sem promoção/demissão; mandato e eleições
    J.salary = salaryFor(c, J.level, J.levelYears); addFame(J.level*2 + rfloat(-2,2)); politicsYear(); return;
  }
  // promoção
  const canPromote = J.level < c.levels.length-1 && !promotionBlocker();
  if (canPromote && J.perf > 62 && chance(oddsPromotion().p)){
    J.level++; J.levelYears = 0; addRep(4);
    log(`Fui promovido(a) a ${c.levels[J.level].t}! 📈`, "good"); addStat("happiness",8); emit("promotion");
    if (J.level === c.levels.length-1) achieve("top_"+c.id, `Topo da carreira: ${c.levels[J.level].t}`);
  }
  J.salary = Math.round(salaryFor(c, J.level, J.levelYears) * num(J.contractMult, 1)); // contratos esportivos multiplicam
  if (c.fame) addFame(J.level * 3 + rfloat(-2,3));
  // atletas: contrato, lesão, títulos e aposentadoria ficam em systems/sports.js
  if (c.athlete){ if (J.perf < 25 && J.contract > 1 && chance(0.35)){ J.contract = 1; J.contractMult = Math.max(0.5, num(J.contractMult, 1) * 0.8); log(`📉 O ${J.club || "clube"} me deixou no banco e cortou meu salário; o contrato não deve ser renovado.`, "bad"); } return; }
  // demissão (mancha a reputação)
  if (J.perf < 28 && chance(0.4)){
    log(`Fui demitido(a) do cargo de ${c.levels[J.level].t} por baixo desempenho. 📦`, "bad");
    endJob("Demitido"); addStat("happiness",-12); addRep(-12); addStress(8); return;
  }
  // layoff aleatório (crise) — não afeta reputação
  if (!c.stable && chance(0.03 * phase().layoff * (J.perf < 50 ? 1.5 : 1))){ log(`A empresa fez cortes (${phaseName()}) e perdi meu emprego de ${c.levels[J.level].t}.`, "bad"); endJob("Layoff"); addStat("happiness",-10); addStress(10); emit("loss"); return; }
  if (chance(0.22)) enqueue(pick(["ev_deadline","ev_credit_thief","ev_lead_project","ev_office_party","ev_strike"]));
  // risco ocupacional com possível sequela
  if (c.risk && chance(0.012*c.risk)){ const d = rint(5, 9*c.risk); const sq = injure(d, "Acidente de trabalho", 0.25); log(`Me machuquei no trabalho (−${d} saúde).${sq}`, "bad"); }
  // fim natural de carreiras físicas/estéticas
  if (c.id === "athlete" && p.age >= 32 && chance((p.age-31)*0.15)){ log("Meu corpo não acompanha mais: encerrei a carreira esportiva. 🏅", "milestone"); endJob("Fim da carreira esportiva"); addRep(5); return; }
  if (c.id === "model" && p.age >= 34 && chance(0.25)){ log("O mercado da moda me deixou de lado pela idade.", "bad"); endJob("Fim da carreira de modelo"); return; }
  if (p.age >= 60 && chance(0.04 + (p.age-60)*0.03)) enqueue("ev_retire_offer");
}

function endJob(reason){
  if (!S.job) return;
  const c = career();
  S.jobHistory.push({ career:c.name, title:c.levels[S.job.level].t, from:P().age - S.job.years, to:P().age, reason });
  S.lastSalary = S.job.salary;
  S.job = null;
}

/* ---------- Carreira ---------- */
function jobEligibility(c){
  const E = S.edu, a = P().age, st = P().stats;
  if (a < Math.max(18, c.minAge||0)) return `Idade mínima: ${Math.max(18, c.minAge||0)}`;
  if (inPrison()) return "Você está preso(a)";
  if (S.wanted && !S.wanted.fakeId) return "Foragido(a): qualquer checagem de documentos te entrega";
  if (S.wanted && (c.exam || c.elected || c.cleanRecord)) return "Identidade falsa não passa em concurso/checagem de antecedentes";
  if (E.level < c.edu) return `Requer ${DATA.eduLevels[c.edu]}`;
  if (c.major && !E.degrees.includes(c.major)) return `Requer diploma em ${byId(DATA.majors,c.major).name}`;
  if (c.tech && !E.techs.includes(c.tech)) return `Requer ${byId(DATA.techCourses,c.tech).name}`;
  if (c.cleanRecord && S.record.length) return "Exige ficha limpa";
  if (c.maxStartAge && a > c.maxStartAge) return `Idade máxima para começar: ${c.maxStartAge}`;
  if (c.minHealth && st.health < c.minHealth) return `Exame médico: saúde mínima ${c.minHealth}`;
  if (c.minLooks && st.looks < c.minLooks) return `Aparência mínima ${c.minLooks}`;
  if (c.needsCar && (!S.vehicles.length || !S.flags.license)) return "Requer veículo e habilitação";
  if (S.job && S.job.careerId === c.id) return "Seu emprego atual";
  return null;
}

/* O que impede a próxima promoção (tempo de casa, formação, reputação). */
function promotionBlocker(){
  const J = S.job, c = career(); if (!J || c.elected) return null;
  const next = J.level + 1; if (next >= c.levels.length) return "Topo da carreira";
  const need = 1 + Math.floor(J.level/2) + (c.fame ? 1 : 0);
  if (J.levelYears < need) return `Precisa de ${need} ano(s) no cargo (tem ${J.levelYears})`;
  if (next >= 2 && P().reputation < 45) return "Exige reputação 45+ (networking, desempenho)";
  if (next >= 3 && c.edu >= 4 && S.edu.level < 5 && P().reputation < 65) return "Liderança exige pós-graduação ou reputação 65+";
  if (next >= 3 && c.edu < 4 && S.edu.level < 3 && P().reputation < 60) return "Gestão exige curso técnico/superior ou reputação 60+";
  return null;
}
function interviewQuestions(){ const qs = DATA.interview.slice(); const out = []; while (out.length < 3 && qs.length) out.push(qs.splice(Math.floor(rand()*qs.length),1)[0]); return out; }

function applyJob(id, iv = {}){
  const c = byId(DATA.careers, id), why = jobEligibility(c);
  if (why) return R(false, why);
  if (c.elected) return runForOffice(0);
  const o = oddsHire(c);
  if (iv.bonus) o.p = Math.max(0.02, Math.min(0.95, o.p + iv.bonus));
  S.stats.jobs++;
  if (!chance(o.p)){ log(`Fui rejeitado(a) na entrevista para ${c.levels[0].t}.`, "bad"); addStat("happiness",-3); return R(false, `A empresa escolheu outro candidato (${Math.round(o.p*100)}% de chance). 😕`); }
  if (S.job) endJob("Mudou de emprego");
  S.partTime = null;
  const startLevel = (c.edu >= 4 && S.edu.level >= 5 && c.levels.length > 2) ? 1 : 0;
  S.job = { careerId:id, level:startLevel, levelYears:0, years:0, perf:55, effort:1, salary: Math.round(salaryFor(c, startLevel, 0) * (1 + num(iv.raise))) };
  S.unemployedYears = 0; S.retired = false; S.flags.reference = false;
  log(`Fui contratado(a) como ${c.levels[startLevel].t} (${fmt(S.job.salary)}/ano). 💼`, "milestone"); addStat("happiness",8);
  return R(true, `Contratado(a) como ${c.levels[startLevel].t}!`);
}

function applyPartTime(id){
  const j = byId(DATA.partTime, id);
  if (P().age < j.minAge) return R(false, `Idade mínima ${j.minAge}.`);
  if (j.minInt && P().stats.intelligence < j.minInt) return R(false, "Inteligência insuficiente.");
  if (S.job) return R(false, "Você já tem emprego em tempo integral.");
  if (inPrison()) return R(false, "Você está preso(a).");
  S.partTime = id; log(`Comecei a trabalhar meio período como ${j.name}.`, ""); return R(true, `Agora você é ${j.name}.`);
}

function quitJob(){ if (!S.job && !S.partTime) return R(false,"Sem emprego."); if (S.job){ const t = career().levels[S.job.level].t; endJob("Pediu demissão"); log(`Pedi demissão do cargo de ${t}.`, ""); } else { S.partTime = null; log("Saí do trabalho de meio período.", ""); } return R(true, "Você saiu do emprego."); }

function setEffort(e){ if (!S.job) return R(false,"Sem emprego."); S.job.effort = e; return R(true, ["Modo econômico de energia ativado.","Ritmo normal.","Hora extra todo dia!"][e]); }

function askRaise(){
  if (!S.job) return R(false,"Sem emprego.");
  if (career().elected) return R(false, "Salário de cargo público é fixado em lei.");
  if (S.flags.raiseAsked === P().age) return R(false, "Você já pediu aumento este ano.");
  S.flags.raiseAsked = P().age;
  if (chance((S.job.perf-40)/100)){ const r = rfloat(0.04,0.12); S.job.salary = Math.round(S.job.salary*(1+r)); log(`Consegui um aumento de ${Math.round(r*100)}%.`, "good"); return R(true, `Aumento de ${Math.round(r*100)}%! 🎉`); }
  S.job.perf = clamp(S.job.perf-5); log("Pedi aumento e ouvi um 'não'.", "bad"); return R(false, "Pedido negado.");
}

function retire(){
  if (P().age < 55) return R(false, "Idade mínima: 55 anos.");
  const base = S.job ? S.job.salary : num(S.lastSalary, wageOf(10000));
  const yrs = S.jobHistory.reduce((a,j)=>a+(j.to-j.from),0) + (S.job?S.job.years:0);
  S.pension = Math.max(wageOf(7000), Math.round(base * Math.min(0.8, 0.25 + yrs*0.015)));
  endJob("Aposentou-se"); S.retired = true; S.partTime = null;
  log(`Me aposentei com pensão de ${fmt(S.pension)}/ano. 🏖️`, "milestone"); addStat("happiness",10);
  return R(true, "Aposentado(a)!");
}

<script>/* src/systems/politics.js */
"use strict";
/* =====================================================================
   systems/politics.js — carreira política por eleições.
   Cargos não vêm por promoção: a cada 4 anos de mandato há eleição.
   A chance depende de fama, reputação, carisma, aparência, dinheiro de
   campanha e ficha. Propinas aceitas agendam investigações futuras.
   ===================================================================== */
const campaignCost = level => priceOf(3000 * Math.pow(2.2, level));

function oddsElection(level){
  const p = P();
  return mkOdds(0.25 - level * 0.05)
    .add("Fama", p.fame/250)
    .add("Reputação", (p.reputation - 50)/180)
    .add("Carismático", hasTrait("charismatic") ? 0.12 : 0)
    .add("Tímido", hasTrait("shy") ? -0.1 : 0)
    .add("Aparência", (p.stats.looks - 50)/400)
    .add("Inteligência (debates)", (p.stats.intelligence - 50)/400)
    .add("Mandato bem avaliado", S.job && career()?.elected ? (S.job.perf - 50)/250 : 0)
    .add("Escândalos (notoriedade)", -p.notoriety/150)
    .add("Antecedentes", -S.record.length * 0.15)
    .add("Idade madura", p.age >= 35 && p.age <= 70 ? 0.04 : p.age < 28 ? -0.06 : 0)
    .done(0.02, 0.85);
}
/* Primeira candidatura (vereador) ou disputa de cargo acima. */
function runForOffice(level){
  const c = byId(DATA.careers, "politician");
  if (P().age < 21) return R(false, "Idade mínima: 21 anos.");
  if (S.record.length) return R(false, "Ficha suja: candidatura impugnada.");
  if (level >= c.levels.length) return R(false, "Você já está no topo.");
  const cost = campaignCost(level);
  if (!canAfford(cost)) return R(false, `Campanha custa ${fmt(cost)}.`);
  addMoney(-cost); addStress(8);
  const o = oddsElection(level);
  if (!chance(o.p)){
    addRep(-2); log(`🗳️ Perdi a eleição para ${c.levels[level].t}.`, "bad"); addStat("happiness", -8);
    return R(false, `Derrota nas urnas (${Math.round(o.p*100)}% de chance).`);
  }
  if (S.job && S.job.careerId !== "politician") endJob("Eleito(a) para cargo público");
  S.partTime = null;
  S.job = { careerId:"politician", level, levelYears:0, years: S.job?.careerId === "politician" ? S.job.years : 0, perf:55, effort:1, salary: salaryFor(c, level, 0) };
  addFame(8 + level*6); addRep(4); addStat("happiness", 12);
  log(`🗳️ Fui eleito(a) ${c.levels[level].t}!`, "milestone");
  if (level === c.levels.length - 1) achieve("president", "Chegou à Presidência");
  return R(true, `Eleito(a) ${c.levels[level].t}!`);
}
/* Chamado em careerYear para políticos: fim de mandato → evento de eleição. */
function politicsYear(){
  const J = S.job;
  if (J.levelYears > 0 && J.levelYears % 4 === 0) enqueue("ev_election");
  if (chance(0.12)) enqueue("ev_bribe");
}
</script>
<script>/* src/systems/business.js */
"use strict";
/* systems/business.js */

/* ---------- Negócios ---------- */
function businessYear(){
  for (const b of S.businesses){
    const d = byId(DATA.businesses, b.id); b.years++;
    const skill = (P().stats.intelligence + (hasTrait("creative")?15:0) + (hasTrait("ambitious")?10:0)) / 100;
    // crescimento com REVERSÃO À MÉDIA: o mercado comporta um faturamento-alvo
    // (base × talento de gestão). Longe do alvo, o crescimento desacelera — sem bola de neve infinita.
    const target = priceIn(d.revenue, b.country) * num(b.share,1) * (0.8 + skill*2.5);
    const pull = -0.3 * Math.log(Math.max(1, b.revenue) / Math.max(1, target));
    const growth = Math.exp(gauss()*d.vol*0.5 + pull);
    b.revenue = Math.round(Math.max(0, b.revenue * growth));
    // fase econômica pesa no faturamento; à distância a gestão rende menos
    b.revenue = Math.round(b.revenue * (1 + phase().invest*0.6) * (isAbroad(b) ? 0.95 : 1));
    const profit = Math.round(b.revenue * rfloat(0.04, 0.24) * (skill+0.4) - priceIn(d.cost, b.country)*0.08*num(b.share,1));
    b.lastProfit = profit;
    b.value = Math.max(0, Math.round(b.revenue * rfloat(0.6, 1.6)));
    if (b.revenue < priceIn(d.revenue, b.country) * 0.15 * num(b.share,1)){ b.bankrupt = true; }
  }
  for (const b of S.businesses.filter(b=>b.bankrupt)){ log(`Meu negócio "${b.name}" faliu. 💸`, "bad"); addStat("happiness",-15); }
  S.businesses = S.businesses.filter(b=>!b.bankrupt);
  if (S.businesses.some(b=>b.value > wageOf(5e6))) achieve("tycoon","Empresário de sucesso");
}

/* ---------- Empreendedorismo ---------- */
function openBusiness(id){
  const d = byId(DATA.businesses, id), cost = priceOf(d.cost);
  if (!adult()) return R(false, "Precisa ser maior de idade.");
  if (d.needs && !S.edu.degrees.includes(d.needs)) return R(false, `Requer diploma em ${byId(DATA.majors,d.needs).name}.`);
  if (!canAfford(cost)) return R(false, `Precisa de ${fmt(cost)}.`);
  addMoney(-cost);
  const b = { uid:uid(), id, country:P().country, share:1, name:`${d.name} ${P().last}`, value:Math.round(cost*0.8), revenue:Math.round(priceOf(d.revenue)*rfloat(0.4,0.8)), years:0, lastProfit:0 };
  S.businesses.push(b); log(`Abri meu próprio negócio: ${b.name}! 🏪`, "milestone"); achieve("founder","Empreendedor(a)");
  return R(true, `${b.name} inaugurado!`);
}

function sellBusiness(u){ const b = S.businesses.find(x=>x.uid===u); if (!b) return R(false,"?"); const v = fxConv(Math.round(b.value*0.9), b.country); addMoney(v); S.businesses = S.businesses.filter(x=>x!==b); log(`Vendi ${b.name} por ${fmt(v)}.`, "good"); emit("money"); return R(true, `Vendido por ${fmt(v)}.`); }
</script>
<script>/* src/systems/finance.js */
"use strict";
/* =====================================================================
   systems/finance.js — fluxo de caixa anual, aluguéis, dívidas, crédito,
   penhora/leilão e investimentos. MODO BRUTO + MULTI-PAÍS.

   • Cada imóvel/veículo/negócio/dívida tem `country`; valores na moeda
     daquele país e convertidos (fxConv) ao entrar/sair do caixa.
   • Parcela que não cabe no caixa NÃO vira cheque especial: vira ATRASO
     (multa + juros de mora, crédito despenca). 2 anos de atraso numa
     dívida com garantia = leilão/apreensão do bem; 3 anos sem garantia
     = penhora judicial.
   • Cheque especial só cobre o rombo do custo de vida (38% a.a.).
   ===================================================================== */
const RATES = { personal:0.34, mortgage:0.115, vehicle:0.22, overdraft:0.38, student:0.06 };
const isAbroad = a => !!a.country && a.country !== P().country;

/* ---------- Ativos: valorização, desgaste, roubo e retorno ---------- */
function assetsYear(){
  const ph = phase();
  for (const p of S.properties){
    const d = byId(DATA.properties, p.id);
    p.value = Math.max(1000, Math.round(p.value * (1 + d.appr + ph.prop + gauss()*0.06)));
    p.condition = clamp(num(p.condition, 100) - rint(2, 5) - (p.rented ? rint(1, 4) : 0));
    if (p.condition < 40) p.value = Math.round(p.value * 0.985); // imóvel malcuidado desvaloriza
  }
  for (const v of S.vehicles.slice()){
    const d = byId(DATA.vehicles, v.id); v.age++;
    v.value = Math.max(Math.round(priceIn(d.price, v.country)*0.04), Math.round(v.value * (1 - d.dep + rfloat(-0.02,0.02))));
    if (!isAbroad(v) && chance(0.012 * d.theft * country(v.country).crime)){
      const paid = Math.round(v.value * 0.7); addMoney(fxConv(paid, v.country));
      S.vehicles = S.vehicles.filter(x=>x!==v); S.loans = S.loans.filter(l=>l.vehicleUid!==v.uid);
      log(`🚨 Roubaram meu ${d.name}! O seguro pagou só ${fmt(fxConv(paid, v.country))}.`, "bad"); addStress(10); addStat("happiness",-8);
    }
  }
  const ret = {};
  for (const [id, amt] of Object.entries(S.investments)){
    const d = byId(DATA.investments, id); if (!d || amt <= 0) { delete S.investments[id]; continue; }
    const r = Math.max(-0.9, d.mu + d.cycle * ph.invest + gauss()*d.sigma);
    S.investments[id] = Math.round(amt * (1+r)); ret[id] = r;
  }
  S.lastReturns = ret;
  if (S.trustFund && P().age >= 18){ addMoney(S.trustFund); log(`Recebi o fundo fiduciário da família: ${fmt(S.trustFund)}.`, "good"); S.trustFund = 0; }
}

/* ---------- Inquilinos: vacância, calote, danos, taxa remota ---------- */
function tenantsYear(add){
  let total = 0;
  const rec = phaseName() === "recessão" || phaseName() === "crise";
  for (const p of S.properties.filter(x=>x.rented)){
    const d = byId(DATA.properties, p.id), where = isAbroad(p) ? ` (${country(p.country).name})` : "";
    if (!p.tenant){
      if (chance(rec ? 0.45 : 0.7)){
        const n = genName(country(p.country), chance(0.5)?"M":"F");
        p.tenant = { name:`${n.first} ${n.last}`, reliability: rint(25, 95), since: P().age, late:0 };
        log(`🔑 Aluguei ${d.name}${where} para ${p.tenant.name}.`, "good");
      } else { add(`Vacância (sem inquilino): ${d.name}${where}`, 0); continue; }
    }
    const t = p.tenant;
    const gross = Math.round(p.value * d.rentYield * (0.55 + 0.45 * num(p.condition,100)/100) * (d.seasonal ? rfloat(0.6, 1.3) : 1));
    if (chance((1 - t.reliability/100) * 0.45 * (rec ? 1.6 : 1))){
      t.late++; log(`😤 ${t.name} deu calote no aluguel de ${d.name}${where}.`, "bad"); addStress(4);
      if (t.late >= 2 || chance(0.35)){
        const cost = fxConv(gross*0.25, p.country); total -= cost; add(`Despejo/advogado: ${d.name}`, -cost);
        log(`Despejei ${t.name}. O imóvel ficou vago.`, "bad"); p.tenant = null;
      }
      continue;
    }
    if (chance(0.08)){ p.condition = clamp(num(p.condition,100) - 15); log(`🔧 ${t.name} danificou ${d.name}${where}. Precisa de reforma.`, "bad"); }
    let net = gross * 0.85;                 // IR sobre aluguel (15%)
    if (isAbroad(p)) net *= 0.9;            // administradora remota (10%)
    const local = fxConv(net, p.country);
    total += local; add(`Aluguel recebido: ${d.name}${where}`, local);
    if (chance(0.12)){ log(`${t.name} desocupou ${d.name}${where}.`, ""); p.tenant = null; }
  }
  return total;
}

/* ---------- Fluxo de caixa anual ---------- */
function financeYear(Y){
  const a = P().age, add = (label, v) => { Y.lines.push([label, Math.round(v)]); };
  let income = 0, expenses = 0;
  const L = S.stats;
  // receitas
  let wage = jobIncome();
  if (S.job && career().volatile && wage) wage = Math.round(wage * rfloat(0.7, 1.3)); // autônomo/comissão
  if (wage){ income += wage; add(S.retired ? "Aposentadoria/salário" : "Salário bruto", wage); }
  const tax = incomeTax(wage); if (tax){ expenses += tax; Y.taxes = tax; add("Imposto de renda", -tax); }
  for (const b of S.businesses){ const v = fxConv(b.lastProfit, b.country); income += v; add(`Lucro: ${b.name}${isAbroad(b)?" (exterior)":""}`, v); }
  for (const p of S.properties){
    const d = byId(DATA.properties, p.id);
    if (d.income){ const r = fxConv(p.value*d.income*(isAbroad(p)?0.85:1), p.country); income += r; add(`Produção: ${d.name}`, r); }
  }
  income += tenantsYear(add);
  if (a >= 8 && a < 18 && parents().length){
    const al = Math.round(priceOf(DATA.classes[P().cls].allowance) * parents()[0].rel/100);
    if (al){ income += al; add("Mesada", al); }
  }
  if (a >= 65) for (const k of children().filter(k=>k.supportsParent && k.rel > 40)){ const h = priceOf(1500); income += h; add(`Ajuda de ${k.first}`, h); }
  // despesas
  if (!inPrison()){
    const home = homeInfo(), kids = children().filter(c=>c.age<18).length;
    if (a >= 18){
      const lm = LIFESTYLES[P().lifestyle].mult * (hasTrait("frugal")?0.85:1) * (hasTrait("spendthrift")?1.25:1);
      const base = home.type === "family" ? 3000 : 10000;   // alimentação, transporte, contas
      const famHelp = S.edu.school && parents().length && a < 26 ? classOf().eduShare : 0;
      const living = Math.round(priceOf(base * lm) * (1 - famHelp));
      expenses += living; add(`Custo de vida (${LIFESTYLES[P().lifestyle].name})`, -living);
      if (kids){ const k = priceOf(5500*kids*Math.max(0.8,lm*0.8)); expenses += k; add(`Despesas com ${kids} filho(s)`, -k); }
    }
    if (home.type === "rent"){ expenses += home.rent; add("Aluguel da moradia", -home.rent); }
  }
  for (const p of S.properties){ const u = fxConv(p.value * byId(DATA.properties,p.id).upkeep, p.country); expenses += u; add(`IPTU/condomínio: ${byId(DATA.properties,p.id).name}${isAbroad(p)?" (exterior)":""}`, -u); }
  for (const v of S.vehicles){
    const d = byId(DATA.vehicles,v.id), base = Math.max(v.value, priceIn(d.price, v.country)*0.25);
    const u = fxConv(base * (d.ins + d.tax) + (isAbroad(v) ? 0 : priceIn(d.fuel, v.country)), v.country);
    expenses += u; add(`Seguro/IPVA/combustível: ${d.name}`, -u);
  }
  const prem = a >= 18 ? planPremium() : 0;
  if (prem){ expenses += prem; add(`Plano de saúde (${effectivePlan().name})`, -prem); }
  const wt = a >= 18 ? wealthTax(netWorth()) : 0;
  if (wt){ expenses += wt; add("Imposto sobre grandes fortunas", -wt); }
  if (S.edu.debt > 0 && !S.edu.school && a >= 18){
    const pay = Math.min(S.edu.debt, Math.round(Math.max(S.edu.debt*0.12, priceOf(800))));
    S.edu.debt = Math.round(S.edu.debt*(1+RATES.student)) - pay; if (S.edu.debt < 1) S.edu.debt = 0;
    expenses += pay; add("Financiamento estudantil", -pay);
  }
  addMoney(income - expenses);
  L.earned += Math.max(0, income); L.spent += Math.max(0, expenses);

  // parcelas: o que não cabe no caixa vira ATRASO (não vai para o cheque especial)
  for (const ln of S.loans){
    const interest = Math.round(ln.principal * ln.rate);
    const due = Math.min(ln.principal + interest, ln.payment), dueLocal = fxConv(due, ln.country);
    if (S.money >= dueLocal){
      addMoney(-dueLocal); ln.principal = Math.max(0, ln.principal + interest - due); ln.missed = 0;
      expenses += dueLocal; add(`Parcela: ${ln.name}`, -dueLocal);
    } else if (ln.name === "Cheque especial"){
      // rotativo: o que não foi pago capitaliza (juros sobre juros), sem execução judicial
      const paidLocal = Math.max(0, S.money); addMoney(-paidLocal);
      ln.principal = Math.round(ln.principal + interest - fxConv(paidLocal, null, ln.country)); addCredit(-15); addStress(5);
      add("Cheque especial (rolando a dívida)", -paidLocal);
    } else {
      const paidLocal = Math.max(0, S.money), paid = fxConv(paidLocal, null, ln.country);
      addMoney(-paidLocal);
      ln.principal = Math.round((ln.principal + interest - paid) * 1.02); // multa de 2%
      ln.missed = num(ln.missed) + 1; addCredit(-45); addStress(8);
      add(`Parcela ATRASADA: ${ln.name}`, -paidLocal);
      log(`⚠️ Não consegui pagar a parcela de "${ln.name}" (${ln.missed}º ano de atraso).`, "bad");
    }
    ln.yearsLeft--;
  }
  S.loans = S.loans.filter(ln => { if (ln.principal <= 0){ log(`Quitei: ${ln.name}. ✅`, "good"); return false; } return true; });
  Y.income = income; Y.expenses = expenses;
  if (S.money < 0 && S.edu.school && parents().length && a < 25 && clsBand() >= 1){
    // estudante morando com a família: os pais cobrem o rombo (sem histórico de crédito ainda)
    const deficit = -S.money; addMoney(deficit); for (const pa of parents()) pa.rel = clamp(pa.rel - 2);
    add("Pais cobriram o rombo do mês", deficit);
  } else if (S.money < 0){
    const deficit = -S.money; addMoney(deficit);
    takeLoan("Cheque especial", deficit, RATES.overdraft, 3, true);
    log(`Fiquei no vermelho e entrei no cheque especial (${fmt(deficit)}). 😬`, "bad");
    addStat("happiness",-5); S.flags.overdraftYear = a;
  }
  foreclosureYear();
  checkBankruptcy();
  creditYear();
  L.maxNetWorth = Math.max(num(L.maxNetWorth), netWorth());
}

/* ---------- Leilão, apreensão e penhora por calote prolongado ---------- */
function foreclosureYear(){
  for (const ln of S.loans.slice()){
    if (ln.propertyUid && ln.missed >= 2){
      const p = S.properties.find(x=>x.uid===ln.propertyUid); if (!p){ ln.propertyUid = null; continue; }
      const d = byId(DATA.properties, p.id), auction = Math.round(p.value * 0.65);
      const rest = auction - ln.principal; // mesma moeda (a do imóvel)
      S.properties = S.properties.filter(x=>x!==p); S.loans = S.loans.filter(x=>x!==ln);
      if (rest >= 0) addMoney(fxConv(rest, p.country));
      else takeLoan("Saldo devedor pós-leilão", -rest, ln.rate, 6, false, p.country);
      log(`🔨 LEILÃO: o banco tomou ${d.name} e leiloou por ${fmtIn(auction, p.country)} (65% do valor).`, "bad");
      remember(`Perdi ${d.name} em leilão por atrasar o financiamento.`, "bad");
      addCredit(-90); addStress(20); addStat("happiness", -15); emit("loss");
    } else if (ln.vehicleUid && ln.missed >= 2){
      const v = S.vehicles.find(x=>x.uid===ln.vehicleUid); if (!v) { ln.vehicleUid = null; continue; }
      S.vehicles = S.vehicles.filter(x=>x!==v);
      ln.principal = Math.max(0, ln.principal - Math.round(v.value*0.6)); ln.missed = 0; ln.vehicleUid = null;
      log(`🚚 Busca e apreensão: o banco levou meu ${byId(DATA.vehicles,v.id).name}.`, "bad");
      remember("Tive o carro apreendido por falta de pagamento.", "bad"); addCredit(-60); addStress(12);
    } else if (!ln.propertyUid && !ln.vehicleUid && ln.missed >= 3){
      let seized = 0;
      for (const k of Object.keys(S.investments)){ seized += S.investments[k]; delete S.investments[k]; }
      for (const v of S.vehicles.filter(v=>!S.loans.some(l=>l.vehicleUid===v.uid)).slice(0,2)){ seized += fxConv(v.value*0.6, v.country); S.vehicles = S.vehicles.filter(x=>x!==v); }
      const applied = Math.min(fxConv(ln.principal, ln.country), seized);
      ln.principal -= fxConv(applied, null, ln.country); ln.missed = 0; addMoney(seized - applied);
      if (seized){ log(`⚖️ PENHORA judicial: bloquearam ${fmt(seized)} em bens para cobrir "${ln.name}".`, "bad"); remember("Sofri penhora judicial por dívidas não pagas.", "bad"); addCredit(-60); addStress(15); }
    }
  }
  S.loans = S.loans.filter(l => l.principal > 0);
}
/* Score de crédito (300–850): histórico de pagamento → juros e aprovação. */
function creditYear(){
  if (P().age < 18) return;
  const inc = Math.max(jobIncome(), priceOf(3000));
  const unsecured = S.loans.filter(l=>!l.propertyUid).reduce((x,l)=>x+fxConv(l.principal,l.country),0);
  if (S.loans.some(l=>l.missed)) return; // atraso já penalizou
  if (S.flags.overdraftYear === P().age) addCredit(-35);
  else if (unsecured / inc > 2) addCredit(-15);
  else addCredit(S.loans.length ? 12 : 5);
  if (S.edu.debt > inc * 2) addCredit(-8);
}
function takeLoan(name, amount, rate, years, silent, cid){
  amount = Math.round(amount); if (amount <= 0) return null;
  cid = cid || P().country;
  const pmt = Math.round(amount * rate / (1 - Math.pow(1+rate, -years)));
  const ex = silent && S.loans.find(l=>l.name===name && (l.country||P().country)===cid);
  if (ex){ ex.principal += amount; ex.payment = Math.round(ex.principal * rate / (1 - Math.pow(1+rate,-years))); return ex; }
  const L = { uid:uid(), name, principal:amount, rate, years, yearsLeft:years, payment:pmt, country:cid, missed:0 };
  S.loans.push(L); return L;
}
function checkBankruptcy(){
  const income = Math.max(jobIncome(), priceOf(5000));
  const unsecured = S.loans.filter(l=>!l.propertyUid).reduce((a,l)=>a+fxConv(l.principal,l.country),0);
  if (unsecured < income * 3) return;
  log("💥 Dívidas impagáveis: credores executaram meus bens.", "bad");
  let raised = investTotal(); S.investments = {};
  raised += S.vehicles.reduce((a,v)=>a+fxConv(v.value*0.7, v.country),0); S.vehicles = [];
  for (const p of S.properties){ const mort = S.loans.find(l=>l.propertyUid===p.uid); raised += fxConv(p.value*0.75 - (mort?mort.principal:0), p.country); }
  S.loans = S.loans.filter(l=>!l.propertyUid && !l.vehicleUid); S.properties = []; S.rental = S.rental || null;
  addMoney(raised);
  for (const L of S.loans){ const payLocal = Math.min(fxConv(L.principal, L.country), Math.max(0,S.money)); L.principal -= fxConv(payLocal, null, L.country); addMoney(-payLocal); }
  S.loans = S.loans.filter(l=>l.principal>0);
  if (S.loans.length){ log("Declarei falência pessoal. As dívidas restantes foram renegociadas com desconto.", "bad"); for (const L of S.loans){ L.principal = Math.round(L.principal*0.3); L.rate = 0.1; L.years = 8; L.missed = 0; L.payment = Math.round(L.principal*0.1/(1-Math.pow(1.1,-8))); } }
  addStat("happiness",-20); addStress(20); addCredit(-220); S.flags.bankrupt = (S.flags.bankrupt||0)+1; emit("loss");
  remember("A falência destruiu meu crédito: juros altos e financiamentos negados por anos.", "bad");
}

/* ---------- Ações financeiras ---------- */
function invest(id, amount){ amount = Math.round(amount); if (amount <= 0 || !canAfford(amount)) return R(false,"Valor inválido."); if (!adult()) return R(false,"Precisa ser maior de idade."); addMoney(-amount); S.investments[id] = num(S.investments[id]) + amount; log(`Investi ${fmt(amount)} em ${byId(DATA.investments,id).name}.`, ""); return R(true,"Aplicação realizada."); }
function withdraw(id, amount){ const cur = num(S.investments[id]); amount = Math.min(cur, Math.round(amount)); if (amount<=0) return R(false,"Nada a resgatar."); S.investments[id] = cur - amount; addMoney(amount); if (!S.investments[id]) delete S.investments[id]; return R(true, `Resgatado ${fmt(amount)}.`); }
function personalLoan(amount){
  if (!adult()) return R(false,"Precisa ser maior de idade.");
  if (S.loans.some(l=>l.missed)) return R(false, "Crédito negado: você tem parcelas em atraso.");
  const cap = Math.max(priceOf(800), jobIncome()*1.2) - S.loans.filter(l=>!l.propertyUid).reduce((a,l)=>a+fxConv(l.principal,l.country),0);
  if (amount > cap) return R(false, `Limite disponível: ${fmt(Math.max(0,cap))}.`);
  if (S.credit < 480) return R(false, `Crédito negado: score ${S.credit} (${creditLabel()}).`);
  takeLoan("Empréstimo pessoal", amount, oddsLoanRate(RATES.personal), 5); addMoney(amount);
  log(`Peguei um empréstimo de ${fmt(amount)}.`, ""); return R(true, "Empréstimo liberado.");
}
function payOffLoan(u){ const L = S.loans.find(l=>l.uid===u); if (!L) return R(false,"?"); const local = fxConv(L.principal, L.country); if (!canAfford(local)) return R(false, `Precisa de ${fmt(local)}.`); addMoney(-local); S.loans = S.loans.filter(x=>x!==L); addCredit(10); log(`Quitei antecipadamente: ${L.name}.`, "good"); return R(true,"Dívida quitada!"); }
function payStudentDebt(){ const d = S.edu.debt; if (!d) return R(false,"Sem dívida."); const pay = Math.min(d, Math.max(0,S.money)); if (!pay) return R(false,"Sem dinheiro."); addMoney(-pay); S.edu.debt -= pay; return R(true, `Pago ${fmt(pay)} do financiamento estudantil.`); }
function setLifestyle(i){ if (!adult()) return R(false,"Seus pais decidem isso."); P().lifestyle = i; return R(true, `Estilo de vida: ${LIFESTYLES[i].name}.`); }
</script>
<script>/* src/systems/property.js */
"use strict";
/* =====================================================================
   systems/property.js — moradia, imóveis multi-país, reformas e veículos.
   Todo imóvel/veículo guarda `country` e valor na moeda daquele país.
   Você pode comprar imóveis em qualquer país (investimento remoto),
   morar apenas nos do país atual, alugar os demais e vender de longe.
   ===================================================================== */
function rentHome(id){
  if (!adult()) return R(false,"Precisa ser maior de idade.");
  if (inPrison()) return R(false,"Você está preso(a).");
  const d = byId(DATA.rentals,id), first = Math.round(priceOf(d.rent)/12*3); // caução de 3 meses
  if (!canAfford(first)) return R(false, `Precisa de ${fmt(first)} para caução (3 meses).`);
  if (S.credit < 450 && !chance(0.4)) return R(false, "A imobiliária recusou: análise de crédito negativa.");
  addMoney(-first); S.rental = id; for (const p of S.properties) p.residence = false;
  log(`Me mudei para: ${d.name}.`, "milestone"); emit("buy"); return R(true, `Bem-vindo(a) ao novo lar!`);
}
function leaveRental(){ if (!S.rental) return R(false,"Sem aluguel."); S.rental = null; log("Devolvi o imóvel alugado.", ""); return R(true, "Contrato encerrado."); }

function buyProperty(id, financed, cid){
  if (!adult()) return R(false,"Precisa ser maior de idade.");
  cid = cid || P().country;
  const d = byId(DATA.properties,id), price = priceIn(d.price, cid), priceLocal = fxConv(price, cid);
  const abroad = cid !== P().country, fees = Math.round(priceLocal * (abroad ? 0.08 : 0.05)); // ITBI/cartório (+câmbio)
  const p = { uid:uid(), id, country:cid, value:price, bought:price, age:P().age, residence:false, rented:false, condition:100, tenant:null };
  if (financed){
    if (abroad) return R(false, "Bancos não financiam imóveis para não residentes.");
    if (S.loans.some(l=>l.missed)) return R(false, "Financiamento negado: há parcelas em atraso.");
    if (S.credit < 580) return R(false, `Financiamento negado: score ${S.credit} (${creditLabel()}). Mínimo 580.`);
    const down = Math.round(price*0.3), rate = oddsLoanRate(RATES.mortgage), years = 30;
    const pmt = Math.round((price-down)*rate/(1-Math.pow(1+rate,-years)));
    if (!canAfford(down + fees)) return R(false, `Entrada (30%) + taxas: ${fmt(down + fees)}.`);
    const renda = Math.max(jobIncome(), S.businesses.reduce((a,b)=>a+Math.max(0,fxConv(b.lastProfit,b.country)),0));
    if (pmt > renda * 0.35) return R(false, `Banco negou: parcela de ${fmt(pmt)}/ano excede 35% da renda.`);
    addMoney(-(down + fees)); S.properties.push(p);
    const loan = takeLoan(`Financiamento: ${d.name}`, price-down, rate, years); loan.propertyUid = p.uid;
    log(`Comprei ${d.name} financiado (${fmt(price)}, juros ${(rate*100).toFixed(1)}% a.a.). 🏠`, "milestone");
  } else {
    if (!canAfford(priceLocal + fees)) return R(false, `Precisa de ${fmt(priceLocal + fees)} (com taxas).`);
    addMoney(-(priceLocal + fees)); S.properties.push(p);
    log(`Comprei ${d.name}${abroad?` em ${country(cid).name}`:""} à vista por ${fmtIn(price, cid)}. 🏠`, "milestone");
  }
  S.stats.propsBought++; achieve("owner","Casa própria"); if (abroad) achieve("intl_owner","Imóvel no exterior");
  emit("buy"); return R(true, "Imóvel comprado!");
}
function moveInto(u){
  const p = S.properties.find(x=>x.uid===u); if (!p) return R(false,"?");
  if (isAbroad(p)) return R(false, `Esse imóvel fica em ${country(p.country).name}. Emigre para morar nele.`);
  if (byId(DATA.properties,p.id).commercial) return R(false, "Imóvel comercial não serve de moradia.");
  for (const q of S.properties) q.residence = false;
  p.residence = true; p.rented = false; p.tenant = null; S.rental = null;
  log(`Me mudei para minha propriedade: ${byId(DATA.properties,p.id).name}.`, ""); return R(true,"Mudança feita!");
}
function toggleRentOut(u){
  const p = S.properties.find(x=>x.uid===u);
  if (!p || p.residence) return R(false,"Não é possível alugar onde você mora.");
  p.rented = !p.rented; if (!p.rented) p.tenant = null;
  return R(true, p.rented ? "Anunciado para aluguel. Um inquilino deve aparecer no próximo ano." : "Imóvel retirado do aluguel.");
}
function renovateCost(p){ return Math.round(p.value * (100 - num(p.condition,100))/100 * 0.18); }
function renovate(u){
  const p = S.properties.find(x=>x.uid===u); if (!p) return R(false,"?");
  if (num(p.condition,100) >= 95) return R(false, "O imóvel já está em ótimo estado.");
  const c = renovateCost(p), local = fxConv(c, p.country) * (isAbroad(p) ? 1.15 : 1);
  if (!canAfford(local)) return R(false, `Reforma custa ${fmt(local)}.`);
  addMoney(-Math.round(local)); p.value = Math.round(p.value * (1 + (100 - p.condition)/100 * 0.12)); p.condition = 100;
  log(`🛠️ Reformei ${byId(DATA.properties,p.id).name}.`, "good"); return R(true, "Reforma concluída: imóvel valorizou.");
}
function sellProperty(u){
  const p = S.properties.find(x=>x.uid===u); if (!p) return R(false,"?");
  const d = byId(DATA.properties,p.id), mort = S.loans.find(l=>l.propertyUid===u);
  const hot = phaseName() === "crise" ? 0.85 : phaseName() === "recessão" ? 0.92 : 1;
  const gross = Math.round(p.value * 0.94 * hot);              // corretagem 6% + liquidez do ciclo
  const gain = Math.max(0, gross - p.bought), cgt = Math.round(gain * 0.15); // imposto sobre ganho de capital
  const net = gross - cgt - (mort ? mort.principal : 0);
  addMoney(fxConv(net, p.country)); S.loans = S.loans.filter(l=>l!==mort); S.properties = S.properties.filter(x=>x!==p);
  log(`Vendi ${d.name}${isAbroad(p)?` (${country(p.country).name})`:""} por ${fmtIn(gross, p.country)}${cgt?`, ganho de capital tributado em ${fmtIn(cgt,p.country)}`:""}.`, net>0?"good":"bad");
  emit("money"); return R(true, `Venda concluída: ${fmt(fxConv(net, p.country))} líquidos.`);
}

/* ---------- Veículos ---------- */
function buyVehicle(id, financed){
  if (!adult()) return R(false,"Precisa ser maior de idade.");
  const d = byId(DATA.vehicles,id), price = priceOf(d.price);
  if (!d.noLicense && !S.flags.license) return R(false,"Você precisa de carteira de motorista (Ações → Autoescola).");
  const v = { uid:uid(), id, country:P().country, value:price, age:0 };
  if (financed){
    if (S.loans.some(l=>l.missed)) return R(false, "Financiamento negado: há parcelas em atraso.");
    if (S.credit < 540) return R(false, `Financiamento negado: score ${S.credit}.`);
    const down = Math.round(price*0.25); if (!canAfford(down)) return R(false, `Entrada de ${fmt(down)}.`);
    addMoney(-down); const L = takeLoan(`Financiamento: ${d.name}`, price-down, oddsLoanRate(RATES.vehicle), 5); L.vehicleUid = v.uid;
  } else { if (!canAfford(price)) return R(false, `Precisa de ${fmt(price)}.`); addMoney(-price); }
  S.vehicles.push(v); addStat("happiness", 3 + d.style); S.stats.carsBought++;
  if (d.style >= 8) addFame(1);
  log(`Comprei ${d.name}${financed?" financiado":""}. 🚗`, "milestone"); emit("buy");
  return R(true, `${d.name} na garagem!`);
}
function sellVehicle(u){
  const v = S.vehicles.find(x=>x.uid===u); if (!v) return R(false,"?");
  const L = S.loans.find(l=>l.vehicleUid===u), val = Math.round(v.value*0.88) - (L ? L.principal : 0);
  addMoney(fxConv(val, v.country)); S.vehicles = S.vehicles.filter(x=>x!==v); if (L) S.loans = S.loans.filter(x=>x!==L);
  log(`Vendi ${byId(DATA.vehicles,v.id).name} por ${fmtIn(Math.round(v.value*0.88), v.country)}.`, ""); emit("money");
  return R(true, `Vendido: ${fmt(fxConv(val, v.country))} líquidos.`);
}
/* Traz um veículo que ficou no país antigo (frete internacional + impostos de importação). */
function shipVehicle(u){
  const v = S.vehicles.find(x=>x.uid===u); if (!v || !isAbroad(v)) return R(false, "Veículo já está aqui.");
  const cost = Math.round(fxConv(v.value, v.country) * 0.35);
  if (!canAfford(cost)) return R(false, `Frete + importação custam ${fmt(cost)}.`);
  addMoney(-cost); v.value = fxConv(v.value, v.country); v.country = P().country;
  log(`🚢 Importei meu ${byId(DATA.vehicles,v.id).name} para ${country().name}.`, ""); return R(true, "Veículo chegou!");
}

<script>/* src/systems/relationships.js */
"use strict";
/* systems/relationships.js */

/* ---------- Relacionamentos ---------- */
function relationshipsYear(){
  const me = P();
  for (const r of S.rels){
    if (!r.alive) continue;
    if (r.unborn){ r.unborn--; if (r.unborn <= 0){ delete r.unborn; r.age = 0; log(`Nasceu meu irmão/irmã: ${r.first}! 👶`, "good"); } continue; }
    r.age++;
    if (r.role === "spouse" && r.money !== undefined){ r.money = Math.round(num(r.money) * (1 + num(S.world?.inflation)) + num(r.income) * 0.12); } // cônjuge também poupa
    // romance exige manutenção; laços de sangue se estabilizam num patamar
    const romantic = ["partner","spouse","fiance"].includes(r.role), blood = ["mother","father","sibling","child"].includes(r.role);
    let decay = romantic ? rfloat(2,6) : blood ? (r.rel > 35 ? rfloat(0,1.5) : -0.8) : rfloat(0.5,3);
    // estresse e vícios desgastam convivência (nexo saúde mental → relações)
    if (me.stress > 65 && (romantic || r.role === "child")) decay += (me.stress - 65) / 10;
    if (S.addictions.alcohol > 50 && (romantic || r.role === "child")) decay += 2;
    r.rel = clamp(r.rel - decay + (r.interacted ? 2 : 0));
    r.interacted = false;
    // morte de NPCs (Gompertz simplificado)
    // mortalidade de NPC; tratamento pago pelo jogador protege por alguns anos (r.cared)
    let q = r.age < 1 ? 0.004 : Math.min(0.6, 0.00006*Math.exp(0.088*r.age));
    if (r.cared > 0){ q *= 0.5; r.cared--; }
    if (chance(q)){ npcDies(r, r.age > 75 ? "causas naturais" : pick(["um acidente","um infarto","uma doença súbita","um AVC"])); continue; }
    if (r.role === "child" && r.age === 18){ log(`${r.first} fez 18 anos e saiu de casa.`, ""); }
    if (r.role === "child" && r.age >= 22 && !r.job) r.job = pick(["Professor","Engenheiro","Vendedor","Designer","Enfermeiro","Músico","Advogado","Autônomo","Programador"]);
    if ((r.role === "partner" || r.role==="fiance") && r.rel < 18 && chance(0.5)){ r.role = "ex"; log(`${r.first} terminou comigo. 💔`, "bad"); addStat("happiness",-12); }
    else if (r.role === "spouse" && r.rel < 12 && chance(0.4)){ divorce(r, true); }
    if (r.role === "friend" && r.rel < 10 && chance(0.4)){ r.role = "acquaintance"; log(`Perdi o contato com ${r.first}.`, ""); }
  }
  // limpar: ex/conhecidos antigos somem da lista para não inchar o save
  S.rels = S.rels.filter(r => !(["ex","acquaintance","coworker"].includes(r.role) && me.age - (r.since||0) > 15));
  if (me.age >= 6 && me.age <= 70 && S.rels.filter(r=>r.role==="friend"&&r.alive).length < 4 && chance(0.3 + (hasTrait("charismatic")?0.2:0) - (hasTrait("shy")?0.15:0))){
    enqueue("ev_approach_friend"); // o jogador decide se aceita a amizade
  }
  if (me.age < 18 && parents().length === 0 && !S.flags.adopted){ S.flags.adopted = true; log("Sem meus pais, fui morar com parentes que me acolheram.", "bad"); }
}

function npcDies(r, cause){
  r.alive = false; r.deathAge = r.age; r.deathYear = year();
  if (r.livesWithMe){ r.livesWithMe = false; S.flags.caregiver = parents().some(p => p.livesWithMe); }
  const close = ["mother","father","spouse","partner","child","sibling","fiance"].includes(r.role);
  log(`${relLabel(r)} ${r.first} faleceu aos ${r.age} anos (${cause}). 🕯️`, "bad");
  if (close) addStat("happiness", -Math.round(10 + r.rel/6));
  if ((r.role === "mother" || r.role === "father") && !r.inheritPaid){
    r.inheritPaid = true;
    const sibs = S.rels.filter(x=>x.role==="sibling"&&x.alive&&!x.unborn).length;
    const pool = priceOf(DATA.classes[P().cls].inherit) * rfloat(0.4, 1.4) * (parents().length ? 0.5 : 1);
    const share = Math.round(pool / (sibs+1) * (r.rel > 30 ? 1 : 0.2));
    if (share > 0){
      if (P().age >= 18){ addMoney(share); log(`Herdei ${fmt(share)} de ${r.first}.`, "good"); }
      else { S.trustFund = num(S.trustFund) + share; log(`Uma herança de ${fmt(share)} ficou guardada até eu completar 18 anos.`, ""); }
    }
  }
  if (r.role === "spouse") { r.role = "late_spouse"; }
  if (r.role === "partner" || r.role === "fiance") r.role = "late_partner";
}

/* Divórcio: partilha conforme o regime de bens (systems/bonds.js).
   litigious = briga judicial (custas + indenização por fraude, se houver). */
function divorce(sp, theyAsked, litigious = 0){
  ensureSpouseMoney(sp);
  const reg = regime(), t = divorceSplit(sp);
  sp.role = "ex";
  let extra = "";
  if (litigious){ const fees = priceOf(rint(4000, 15000)), dmg = Math.round(litigious * 1.5); const paid = Math.min(Math.max(0, S.money), fees + dmg); addMoney(-paid); sp.money += Math.max(0, paid - fees); extra = ` Divórcio litigioso: ${fmt(paid)} entre custas e indenização.`; addRep(-8); }
  log(`${theyAsked ? sp.first + " pediu o divórcio" : "Pedi o divórcio de " + sp.first} (${REGIMES[reg].name.toLowerCase()}). ${t > 0 ? `Na partilha, paguei ${fmt(t)}.` : t < 0 ? `Na partilha, recebi ${fmt(-t)}.` : "Ninguém deveu nada na partilha."}${extra} ⚖️`, "bad");
  addStat("happiness", -15); S.flags.prenup = false; S.flags.regime = null; S.flags.divorces = (S.flags.divorces||0)+1;
}

function relLabel(r){
  const g = r.gender === "F";
  return ({ mother:"Mãe", father:"Pai", sibling: g?"Irmã":"Irmão", partner: g?"Namorada":"Namorado", fiance: g?"Noiva":"Noivo",
    spouse: g?"Esposa":"Marido", child: g?"Filha":"Filho", friend: g?"Amiga":"Amigo", ex: g?"Ex-namorada":"Ex-namorado",
    coworker: "Colega", acquaintance:"Conhecido(a)", late_spouse: g?"Esposa (falecida)":"Marido (falecido)", late_partner:"Ex-parceiro(a)" })[r.role] || r.role;
}

function addChild(adopted){
  const pt = partner();
  const c = makeNPC("child", country(), { age:0, last: P().last, rel: rint(70,95) });
  c.since = P().age; c.adopted = !!adopted; c.otherParent = pt ? pt.first : null;
  S.rels.push(c);
  log(`${adopted ? "Adotei" : "Nasceu"} ${c.gender==="F"?"minha filha":"meu filho"} ${c.first}! 👶`, "milestone");
  addStat("happiness", 15); achieve("parent","Tornou-se pai/mãe");
  return c;
}

/* ---------- Relacionamentos: interações ---------- */
function interact(u, kind, extra){
  const r = relBy(u); if (!r || !r.alive) return R(false, "Pessoa indisponível.");
  if (inPrison() && !["talk"].includes(kind)) return R(false, "Da prisão só dá para conversar por carta.");
  const name = r.first; r.interacted = true;
  switch(kind){
    case "talk": { const d = rint(1,7) + (hasTrait("charismatic")?2:0); r.rel = clamp(r.rel+d); return R(true, `Conversei com ${name}. (+${d} relação)`); }
    case "time": { if (!spendEnergy()) return R(false,"Sem energia este ano."); const d = rint(5,12); r.rel = clamp(r.rel+d); addStat("happiness",3); addStress(-3); log(`Passei um tempo de qualidade com ${name}.`, ""); return R(true, `Momentos ótimos com ${name}. (+${d})`); }
    case "gift": { const g = byId(DATA.gifts, extra), pr = priceOf(g.price); if (!canAfford(pr)) return R(false, `Custa ${fmt(pr)}.`); addMoney(-pr); r.rel = clamp(r.rel+g.rel); log(`Dei ${g.name.toLowerCase()} para ${name}.`, ""); return R(true, `${name} amou o presente! (+${g.rel})`); }
    case "money": {
      if (r.askedMoney === P().age) return R(false, "Você já pediu este ano.");
      r.askedMoney = P().age;
      const cls = clsBand(), p = r.rel/140 + r.generous/300 + cls*0.05;
      if (chance(p)){ const v = priceOf(rint(20, 400) * Math.pow(3,cls)); addMoney(v); r.rel = clamp(r.rel-3); log(`${name} me deu ${fmt(v)}.`, "good"); return R(true, `${name} te deu ${fmt(v)}!`); }
      r.rel = clamp(r.rel-6); return R(false, `${name} disse não.`);
    }
    case "argue": { r.rel = clamp(r.rel - rint(6,15)); addStat("happiness",-2); log(`Discuti com ${name}.`, "bad"); return R(true, `Vocês brigaram. Relação abalada.`); }
    case "advise": { const d = rint(2,9); r.rel = clamp(r.rel+d); return R(true, `${name} ouviu seus conselhos. (+${d})`); }
    case "propose": {
      if (r.role !== "partner") return R(false,"?");
      if (!adult()) return R(false, "Vocês são jovens demais.");
      if (chance(r.rel/110 - 0.1)){ r.role = "fiance"; log(`Pedi ${name} em casamento e ouvi SIM! 💍`, "milestone"); addStat("happiness",12); return R(true, `${name} aceitou! Vocês estão noivos.`); }
      r.rel = clamp(r.rel-15); log(`Pedi ${name} em casamento e levei um não.`, "bad"); addStat("happiness",-10); return R(false, `${name} recusou...`);
    }
    case "marry": { if (r.role !== "fiance") return R(false,"?"); return marryWith(u, extra === "big" ? "big" : "simple", REGIMES[extra] ? extra : extra === "prenup" ? "separacao" : "parcial"); }
    case "baby": {
      if (!["partner","spouse","fiance"].includes(r.role)) return R(false,"?");
      if (!adult()) return R(false,"Jovem demais.");
      const ages = [P().age, r.age], femaleAge = P().gender==="F" ? P().age : (r.gender==="F" ? r.age : 30);
      if (P().gender === r.gender) return R(false, "Vocês podem adotar (botão Adotar).");
      if (femaleAge > 47) return R(false, "A idade não permite mais uma gravidez.");
      if (r.rel < 40) return R(false, `${name} não quer ter filhos agora.`);
      if (chance(0.55 - (femaleAge-30)*0.02)){ addChild(false); return R(true, "Vocês terão um bebê! 👶"); }
      return R(false, "Não aconteceu desta vez.");
    }
    case "breakup": {
      if (r.role === "spouse"){ divorce(r, false); return R(true, "Divórcio concluído."); }
      if (r.role === "partner" || r.role === "fiance"){ r.role = "ex"; log(`Terminei com ${name}.`, "bad"); addStat("happiness",-6); return R(true, "Vocês terminaram."); }
      if (r.role === "friend"){ r.role = "acquaintance"; return R(true, "Amizade encerrada."); }
      return R(false,"?");
    }
    case "visitGrave": { addStat("happiness",2); return R(true, `Levei flores ao túmulo de ${name}. 🌹`); }
  }
  return R(false,"?");
}

function marry(r, cost, prenup){
  if (!r) return; addMoney(-Math.min(Math.max(0,S.money), cost));
  r.role = "spouse"; r.rel = clamp(r.rel+10); r.marriedAt = P().age; S.flags.prenup = !!prenup; S.flags.married = (S.flags.married||0)+1;
  log(`Casei com ${r.first} ${r.last}! 💒`, "milestone"); achieve("married","Casou-se");
  if (P().gender === "F" && chance(0.3) && r.gender==="M") {} // sobrenome mantido por simplicidade
}

/* Gera 3 pretendentes para o app de namoro. */
function datingCandidates(){
  if (!spendEnergy()) return null;
  const cands = [0,1,2].map(()=>{ const p = makePartner([-6,6], [35,65]); p.looks = rint(15,98); return p; });
  return cands;
}

function dateCandidate(p){
  const diff = p.looks - P().stats.looks;
  const chanceYes = clamp(0.6 - diff/100 + (hasTrait("charismatic")?0.15:0) - (hasTrait("shy")?0.1:0) + P().fame/300 + (netWorth() > wageOf(1e6) ? 0.1 : 0), 5, 95)/100;
  if (!chance(chanceYes)){ log(`${p.first} recusou um encontro comigo.`, "bad"); addStat("happiness",-3); return R(false, `${p.first} não quis sair com você.`); }
  const old = partner(); if (old){ old.role = "ex"; log(`Terminei com ${old.first} para ficar com ${p.first}.`, "bad"); }
  p.role = "partner"; p.since = P().age; S.rels.push(p);
  log(`Comecei a namorar ${p.first} ${p.last}. 💕`, "good"); addStat("happiness",8); return R(true, `Você e ${p.first} estão namorando!`);
}

function adoptChild(){
  if (P().age < 25) return R(false, "Idade mínima para adoção: 25.");
  const cost = priceOf(3000); if (!canAfford(cost)) return R(false, `Custa ${fmt(cost)}.`);
  if (S.record.length) return R(false, "Processo negado por antecedentes criminais.");
  addMoney(-cost); const c = addChild(true); c.age = rint(0,6); return R(true, `Você adotou ${c.first}!`);
}

<script>/* src/systems/bonds.js */
"use strict";
/* =====================================================================
   systems/bonds.js — RELAÇÕES COM UTILIDADE, CASAMENTO E GOLPES.

   Amigos (afeto alto) podem: emprestar dinheiro (vira dívida com prazo),
   indicar para vaga (+chance na próxima candidatura do ano), dar álibi
   (reduz a chance de investigações pendentes — e pode delatar) e dar
   apoio emocional.

   Casamento com REGIME DE BENS (S.flags.regime):
     total     → tudo é do casal: acesso a 100% do patrimônio do cônjuge;
                 no divórcio, tudo é dividido ao meio.
     parcial   → só o que foi ganho depois do casamento é comum.
     separacao → cada um com o seu (acesso ~5%: cartão adicional).
   Golpes contra o cônjuge (desviar, transferir bens, golpe do baú):
   quanto mais você tira e quanto mais esperto(a) é o cônjuge, maior a
   chance de descoberta — imediata ou anos depois (S.scheduled).
   ===================================================================== */
const REGIMES = {
  parcial:   { name:"Comunhão parcial de bens",  access:"o que o casal ganhou após o casamento" },
  total:     { name:"Comunhão universal (total)",access:"todo o patrimônio do cônjuge" },
  separacao: { name:"Separação total de bens",   access:"quase nada (cartão adicional)" },
};
const regime = () => S.flags.regime || (S.flags.prenup ? "separacao" : "parcial");
const spouse = () => S.rels.find(r => r.role === "spouse" && r.alive);

function ensureSpouseMoney(r){
  if (!r.money) r.money = wageOf([2000, 15000, 60000, 250000, 2e6][num(r.wealth, 2)] * rfloat(0.5, 1.5));
  if (!r.income) r.income = wageOf(rint(15000, 70000) * (num(r.wealth, 2) + 1) / 3);
  r.money = Math.round(r.money); r.income = Math.round(r.income);
}
/* Quanto do patrimônio do cônjuge o regime deixa você acessar. */
function spouseAccessible(r){
  const reg = regime();
  if (reg === "total") return Math.round(r.money);
  if (reg === "parcial") return Math.round(Math.max(0, r.money - num(r.moneyAtMarriage)) + r.money * 0.05);
  return Math.round(r.money * 0.05);
}

/* ---------- Casamento ---------- */
function marryWith(u, ceremony, reg){
  const r = relBy(u); if (!r || r.role !== "fiance") return R(false, "Vocês não estão noivos.");
  if (!REGIMES[reg]) return R(false, "Regime inválido.");
  const cost = priceOf(ceremony === "big" ? 25000 : 2500);
  ensureSpouseMoney(r);
  // separação total pedida por você: cônjuge rico desconfia; pobre pode se ofender
  if (reg === "separacao" && r.wealth <= 1 && chance(0.25)){ r.rel = clamp(r.rel - 12); remember_npc(r, "Ficou magoado(a) com o pedido de separação de bens"); }
  if (reg === "total" && r.wealth >= 3 && chance(0.5)) return R(false, `${r.first} não aceita comunhão total: o patrimônio da família dele(a) é grande demais. Escolha outro regime.`);
  marry(r, cost, reg === "separacao");
  S.flags.regime = reg; r.moneyAtMarriage = r.money; S.flags.myMoneyAtMarriage = Math.max(0, S.money);
  log(`📄 Regime de bens: ${REGIMES[reg].name}. ${r.first} tem ~${fmt(r.money)} de patrimônio.`, "");
  return R(true, `Casados! 💒 Regime: ${REGIMES[reg].name}.`);
}

/* Divórcio conforme o regime (substitui a regra antiga de 50% do caixa). */
function divorceSplit(sp){
  const reg = regime(), mine = Math.max(0, S.money), theirs = Math.max(0, num(sp.money));
  let myShare = 0, theirShare = 0;
  if (reg === "total"){ myShare = mine; theirShare = theirs; }
  else if (reg === "parcial"){ myShare = Math.max(0, mine - num(S.flags.myMoneyAtMarriage)); theirShare = Math.max(0, theirs - num(sp.moneyAtMarriage)); }
  const transfer = Math.round((myShare - theirShare) / 2); // > 0: eu pago; < 0: eu recebo
  addMoney(-transfer); sp.money = Math.max(0, theirs + transfer);
  return transfer;
}

/* ---------- Ações com o cônjuge ---------- */
function spouseAct(u, kind, flee){
  const r = relBy(u); if (!r || r.role !== "spouse" || !r.alive) return R(false, "Só com o cônjuge.");
  if (inPrison()) return R(false, "Você está preso(a).");
  ensureSpouseMoney(r);
  const acc = spouseAccessible(r), int = P().stats.intelligence, per = byId(DATA.personalities, r.personality) || {};
  const sharp = (per.id === "schemer" || per.id === "gossip" ? 0.12 : 0) + (per.id === "calm" ? -0.05 : 0);
  switch (kind){
    case "ask": {
      if (r.askedMoney === P().age) return R(false, "Você já pediu este ano.");
      r.askedMoney = P().age;
      if (regime() === "separacao" && !chance(0.3)) return R(false, `${r.first}: "Separação de bens, lembra? Cada um com o seu."`);
      if (!chance(r.rel/110 + (per.id === "generous" ? 0.2 : 0))){ r.rel = clamp(r.rel - 4); return R(false, `${r.first} achou que não era hora.`); }
      const v = Math.round(acc * rfloat(0.1, 0.3)); if (v <= 0) return R(false, "Não há patrimônio comum para usar.");
      r.money -= v; addMoney(v); r.rel = clamp(r.rel - 2);
      log(`💑 ${r.first} topou usar ${fmt(v)} do patrimônio do casal comigo.`, "");
      return R(true, `${r.first} liberou ${fmt(v)} da conta do casal.`);
    }
    case "skim": {
      const v = Math.round(acc * rfloat(0.15, 0.35)); if (v < priceOf(200)) return R(false, "Não tem quase nada acessível para desviar.");
      r.money -= v; addMoney(v); P().karma = clamp(P().karma - 8); S.stats.spouseScams++;
      const p = clamp((0.2 + v / Math.max(1, r.money + v) * 0.8 + sharp - (int - 50)/400) * 100, 5, 95) / 100;
      if (chance(p * 0.4)) return R(false, fraudCaught(r, v, "desvio"));
      schedule("spouseFraudFound", rint(1, 3), { uid:r.uid, amt:v, p, kind:"desvio" });
      return R(true, `Desviei ${fmt(v)} da conta conjunta para uma conta só minha. ${r.first} ainda não percebeu…`);
    }
    case "transfer": {
      if (regime() === "separacao") return R(false, "Na separação total não há bens comuns para transferir.");
      const v = Math.round(acc * rfloat(0.5, 0.8)); if (v < priceOf(1000)) return R(false, "Pouco patrimônio comum.");
      r.money -= v; addMoney(v); P().karma = clamp(P().karma - 15); S.stats.spouseScams++; addNoto(5);
      const p = clamp((0.45 + sharp - (int - 50)/300) * 100, 10, 95) / 100;
      if (chance(p * 0.5)) return R(false, fraudCaught(r, v, "transferência fraudulenta de bens"));
      schedule("spouseFraudFound", rint(1, 2), { uid:r.uid, amt:v, p, kind:"transferência fraudulenta de bens" });
      return R(true, `Com uma procuração "ajeitada", passei ${fmt(v)} em bens para o meu nome.`);
    }
    case "gold": {
      const v = Math.round(acc * 0.95); if (v < priceOf(1000)) return R(false, "Não há o que levar.");
      r.money -= v; addMoney(v); P().karma = clamp(P().karma - 30); S.stats.spouseScams++; addNoto(12);
      r.role = "ex"; r.rel = 0; r.respect = 0; remember_npc(r, "Foi vítima do meu golpe do baú");
      addStat("happiness", 4); addStress(15); achieve("goldigger", "Golpe do baú");
      log(`💼 GOLPE DO BAÚ: limpei ${fmt(v)} de ${r.first} e sumi${flee ? " do país" : ""}.`, "bad", ["crime","money"]);
      let dest = "";
      if (flee){ const from = P().country, d = pick(DATA.countries.filter(x => x.id !== from)); emigrate(d.id, true); dest = ` Agora vivo em ${d.name}.`; }
      schedule("loveScamCase", rint(1, 2), { uid:r.uid, name:`${r.first} ${r.last}`, amt:v, p: flee ? 0.25 : 0.6 }, `${r.first} foi à polícia por causa do golpe.`);
      if (chance(0.5)) schedule("scamRevenge", rint(2, 5), { uid:r.uid, name:r.first }, `${r.first} jurou vingança.`);
      return R(true, `Levei ${fmt(v)} e desapareci da vida de ${r.first}.${dest}`);
    }
  }
  return R(false, "?");
}
/* Golpe descoberto na hora: o cônjuge decide o que fazer. */
function fraudCaught(r, amt, kind){
  r.rel = clamp(r.rel - 60); r.respect = clamp(num(r.respect) - 40); addRep(-10);
  remember_npc(r, `Descobriu meu ${kind}`);
  log(`🚨 ${r.first} descobriu meu ${kind} de ${fmt(amt)}.`, "bad", ["love","crime"]);
  enqueue("ev_fraud_discovered", { uid:r.uid, amt, kind });
  return `${r.first} viu o extrato na hora. Ferrou.`;
}

/* ---------- Amigos com utilidade ---------- */
function friendAct(u, kind){
  const r = relBy(u); if (!r || !r.alive || r.role !== "friend") return R(false, "Só com amigos.");
  const per = byId(DATA.personalities, r.personality) || {};
  switch (kind){
    case "loan": {
      if (inPrison()) return R(false, "Você está preso(a).");
      if (r.rel < 60) return R(false, `Vocês não são próximos o bastante (afeto ${Math.round(r.rel)}/60).`);
      if (r.loanAge && P().age - r.loanAge < 3) return R(false, `Você já pediu a ${r.first} recentemente.`);
      r.loanAge = P().age;
      if (!chance(clamp((r.rel/110 + r.generous/400 + (per.id === "generous" ? 0.15 : 0) - 0.15) * 100, 5, 95) / 100)){ r.rel = clamp(r.rel - 5); return R(false, `${r.first}: "Tô apertado(a) também, desculpa."`); }
      const v = Math.round(priceOf([400, 1500, 5000, 15000, 60000][num(r.wealth, 2)] * rfloat(0.6, 1.2)));
      addMoney(v); remember_npc(r, `Me emprestou ${fmt(v)}`);
      schedule("friendLoanDue", 3, { uid:r.uid, amt:v, name:r.first }, `Devo ${fmt(v)} a ${r.first} (prazo: 3 anos).`);
      return R(true, `${r.first} te emprestou ${fmt(v)}. Prazo: 3 anos.`);
    }
    case "referral": {
      if (r.rel < 55) return R(false, `Afeto insuficiente (${Math.round(r.rel)}/55).`);
      if (!r.job) return R(false, `${r.first} não está empregado(a).`);
      if (S.flags.referral?.age === P().age) return R(false, "Você já tem uma indicação este ano.");
      const bonus = Math.round((0.1 + num(r.wealth, 2) * 0.03 + r.rel/1000) * 100) / 100;
      S.flags.referral = { name:r.first, bonus, age:P().age };
      return R(true, `${r.first} vai te indicar: +${Math.round(bonus*100)}% de chance nas candidaturas deste ano.`);
    }
    case "alibi": {
      const pending = S.scheduled.filter(x => ["homicideCase","hitAndRun","cyberTrace","loveScamCase","spouseFraudFound"].includes(x.kind));
      if (!pending.length && P().notoriety < 20) return R(false, "Você não está encrencado(a): não precisa de álibi.");
      if (r.rel < 65) return R(false, `${r.first} não arrisca tanto por você (afeto ${Math.round(r.rel)}/65).`);
      if (r.alibiAge === P().age) return R(false, "Já pedido este ano.");
      r.alibiAge = P().age;
      if (!chance(r.rel/120 + (per.id === "loyal" ? 0.2 : 0))){ r.rel = clamp(r.rel - 10); return R(false, `${r.first}: "Mentir pra polícia? Tá maluco(a)?"`); }
      if (per.snitch && chance(per.snitch * 1.5)){ addNoto(12); r.rel = clamp(r.rel - 20); log(`🐀 ${r.first} topou o álibi… e contou tudo para a polícia.`, "bad"); return R(false, `${r.first} concordou — e depois abriu o bico. A polícia ficou mais desconfiada.`); }
      for (const x of pending) if (x.ctx && typeof x.ctx.p === "number") x.ctx.p *= 0.55;
      addNoto(-10); r.rel = clamp(r.rel - 3); remember_npc(r, "Me deu um álibi");
      return R(true, `${r.first} vai jurar que estava com você. As investigações perderam força.`);
    }
    case "support": {
      if (r.supportAge === P().age) return R(false, `${r.first} já te ouviu este ano.`);
      if (r.rel < 45) return R(false, "Vocês não têm essa intimidade.");
      r.supportAge = P().age; r.rel = clamp(r.rel + 3); addStress(-rint(6, 12));
      return R(true, `Desabafei com ${r.first} a noite inteira.` + fx({ happiness: rint(5, 10) }));
    }
  }
  return R(false, "?");
}

/* ---------- Consequências agendadas ---------- */
Object.assign(CONSEQ, {
  friendLoanDue(ctx){
    const f = relBy(ctx.uid); if (!f || !f.alive) return out(`A dívida com ${ctx.name} morreu com ele(a).`, "info");
    if (S.money >= ctx.amt && !inPrison()){ addMoney(-ctx.amt); f.rel = clamp(f.rel + 6); f.respect = clamp(num(f.respect) + 10); return out(`Paguei os ${fmt(ctx.amt)} que devia a ${ctx.name}.`, "good"); }
    f.rel = clamp(f.rel - 35); f.respect = clamp(num(f.respect) - 30); remember_npc(f, "Levou calote meu");
    return out(`Dei calote em ${ctx.name} (${fmt(ctx.amt)}). A amizade azedou.`, "bad");
  },
  spouseFraudFound(ctx){
    const r = relBy(ctx.uid); if (!r || !r.alive) return;
    if (!chance(ctx.p)) return out(`Meu ${ctx.kind} nunca foi descoberto.`, "info");
    if (r.role !== "spouse"){ schedule("loveScamCase", 1, { uid:r.uid, name:`${r.first} ${r.last}`, amt:ctx.amt, p:0.4 }); return out(`${r.first} descobriu meu antigo ${ctx.kind} e procurou um advogado.`, "bad"); }
    return out(fraudCaught(r, ctx.amt, ctx.kind), "bad");
  },
  loveScamCase(ctx){
    if (inPrison() || !chance(ctx.p)) return out(`O processo de ${ctx.name} contra mim não foi adiante.`, "good");
    enqueue("ev_scam_lawsuit", ctx); return out(`${ctx.name} me processou por estelionato.`, "bad");
  },
  scamRevenge(ctx){ if (!inPrison()) enqueue("ev_scam_revenge", ctx); },
});
</script>
<script>/* src/systems/identity.js */
"use strict";
/* =====================================================================
   systems/identity.js — DESCOBERTA GRADUAL DA ORIENTAÇÃO SEXUAL.

   O personagem nasce "Em descoberta". Entre ~11 e 22 anos, eventos
   (paixonite, festa, reflexão, convite para sair) somam inclinações:
     other = atração pelo outro gênero    same = pelo mesmo gênero
     both  = por mais de um gênero        pan  = "gênero não importa"
     none  = pouca ou nenhuma atração
   Com 3+ vivências, o evento "Me entendendo" sugere os rótulos mais
   coerentes com as escolhas e o JOGADOR decide (ou adia). Aos 23, se
   ainda indefinido, a orientação se assenta pelo padrão das escolhas.
   A orientação define o gênero dos pretendentes (partnerGender) e o
   peso de eventos românticos (assexual: bem menos abordagens).
   ===================================================================== */
const identity = () => S.identity || (S.identity = { other:0, same:0, both:0, none:0, pan:0, steps:0, resolved:false });
const orientationName = (o = P().orientation) => DATA.orientations[o] || o;
const discovering = () => P().orientation === "descobrindo";

/* Registra uma vivência. delta: { other, same, both, none, pan } */
function leanIdentity(delta){
  const I = identity(); if (I.resolved) return;
  for (const k of ["other","same","both","none","pan"]) I[k] = num(I[k]) + num(delta[k]);
  I.steps++;
}
/* Ranking de rótulos coerentes com as escolhas (melhor primeiro). */
function orientationCandidates(){
  const I = identity(), o = num(I.other) + num(I.both), s = num(I.same) + num(I.both), n = num(I.none), mx = Math.max(o, s);
  const sc = {
    hetero: o - s*0.9 - n*0.5,
    homo:   s - o*0.9 - n*0.5,
    bi:     Math.min(o, s) * 1.4 + num(I.both) - n*0.5 - Math.abs(o - s)*0.3,
    pan:    Math.min(o, s) + num(I.pan) * 1.6 - n*0.5,
    ace:    n * 1.5 - mx * 0.6,
  };
  return Object.keys(sc).sort((a, b) => sc[b] - sc[a]);
}
function setOrientation(o, how = "escolha"){
  const I = identity();
  P().orientation = o; I.resolved = true; I.age = P().age;
  log(`🏳️‍🌈 Me entendi: ${orientationName(o).toLowerCase()}.`, "milestone");
  remember(`Descobri minha orientação (${orientationName(o).toLowerCase()}) ${how === "auto" ? "com o tempo, sem pressa" : "depois de muita reflexão"}.`, "good");
  addStat("happiness", 6); addStress(-6);
  if (["homo","bi","pan"].includes(o)) enqueue("ev_coming_out");
}
function identityYear(){
  if (!discovering()) return;
  const a = P().age, I = identity();
  if (a >= 23) return setOrientation(orientationCandidates()[0], "auto");
  if (a >= 16 && I.steps >= 3 && !S.queue.some(q => q.id === "ev_identity_conclusion") && chance(0.5)) enqueue("ev_identity_conclusion");
}
</script>
<script>/* src/systems/justice.js */
"use strict";
/* systems/justice.js */

/* ---------- Prisão ---------- */
function prisonYear(){
  if (!S.prison) { if (S.parole > 0) S.parole--; return; }
  S.prison.years--; S.prison.served++;
  if (S.prison.escBlock > 0) S.prison.escBlock--;
  addStat("happiness",-6); addStat("health",-2);
  if (S.prison.years <= 0){
    log(`Cumpri minha pena e saí da prisão. 🔓`, "milestone"); S.prison = null; S.parole = 2; return;
  }
  if (S.prison.served >= (S.prison.life ? 15 : 2) && S.prison.years > 1 && !S.prison.paroleAsked) enqueue("ev_parole");
  else if (chance(0.25)) enqueue("ev_prison_life");
  if (chance((0.18 + (S.prison.security === "máxima" ? 0.12 : 0)) * (1 - num(S.prison.intim)/140))) enqueue("ev_prison_fight"); // intimidação afasta encrenca
  else if (!S.prison.escBlock && chance(0.12)) enqueue("ev_escape_plan");
}

/* security: "mínima" | "média" | "máxima" (padrão: pela pena). Foragido(a)
   preso(a) por outro crime soma o restante da pena antiga. */
function sendToPrison(years, crime, security){
  years = Math.max(1, Math.round(years));
  if (S.wanted){ years += num(S.wanted.remaining) + 2; crime += " + fuga anterior"; security = "máxima"; S.wanted = null; }
  years = Math.min(99, years);
  if (S.fight) S.fight.next = null; // torneio não continua atrás das grades
  const illegalGuns = typeof weaponsOnArrest === "function" ? weaponsOnArrest() : 0;
  if (illegalGuns){ years = Math.min(99, years + illegalGuns*2); crime += " + porte ilegal de arma"; }
  endJob("Preso"); S.partTime = null;
  if (S.edu.school && S.edu.school !== "fund" && S.edu.school !== "medio"){ log("Fui expulso(a) do curso.", "bad"); S.edu.school = null; }
  security = security || (years >= 12 ? "máxima" : years >= 5 ? "média" : "mínima");
  S.prison = { years, served:0, crime, security, escAttempts:0, escBlock:0, life: years >= 99, cat: crimeCategory(crime), remit:0, intim:0, courses:{} }; S.record.push({ crime, age:P().age, years }); S.stats.arrests++;
  // dinheiro sujo é apreendido; organização perde força sem você
  if (S.dirty > 0){ log(`A polícia apreendeu ${fmt(S.dirty)} em dinheiro sujo.`, "bad"); S.dirty = 0; }
  if (S.org){ S.org.heat = clamp(S.org.heat - 20); if (!isBoss()) S.org.respect = clamp(S.org.respect + 8); }
  emit("jail");
  S.rental = null;
  log(`Fui condenado(a) a ${years >= 99 ? "PRISÃO PERPÉTUA" : years + " ano(s) de prisão"} por ${crime} (segurança ${security}). ⛓️`, "bad");
  addStat("happiness",-20); addNoto(15); addRep(-20); addStress(15); S.flags.caregiver = false;
  remember(`A condenação por ${crime} vai pesar em entrevistas e eleições (ficha suja).`, "bad");
  const pt = partner(); if (pt && chance(0.45)){ pt.rel = clamp(pt.rel-30); }
}

/* ---------- Crime ---------- */
function commitCrime(id){
  const c = byId(DATA.crimes, id);
  if (P().age < c.minAge) return R(false, `Idade mínima: ${c.minAge}.`);
  if (inPrison()) return R(false, "Você já está preso(a).");
  if (c.minInt && P().stats.intelligence < c.minInt) return R(false, "Você não tem conhecimento para isso.");
  if (c.needsOrg && !S.org) return R(false, "Esse tipo de serviço só rola com uma organização por trás.");
  if (c.cyber) return commitCyber(c);
  if (S.crimeSkill < num(c.skill)) return R(false, `Exige habilidade criminal ${c.skill} (você tem ${Math.round(S.crimeSkill)}).`);
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  let p = oddsCrime(c).p;
  S.stats.crimes++;
  if (hasTrait("honest")) addStat("happiness",-8);
  P().karma = clamp(P().karma - c.noto/3);
  if (chance(p)){
    const g = priceOf(rint(...c.gain)); addNoto(c.noto*0.5);
    S.stats.crimesOk++; S.crimeSkill = clamp(S.crimeSkill + rint(2,4));
    if (S.org) S.org.respect = clamp(S.org.respect + 3);
    if (c.dirty){ S.dirty += g; S.stats.dirtyEarned += g; log(`🦹 Crime (${c.name}) bem-sucedido: ${fmt(g)} em dinheiro sujo.`, "bad"); emit("crime"); return R(true, `Deu certo! ${fmt(g)} em dinheiro SUJO — precisa lavar antes de usar.`); }
    addMoney(g); log(`🦹 Crime (${c.name}) bem-sucedido: ${fmt(g)}.`, "bad"); emit("crime"); return R(true, `Deu certo! Você conseguiu ${fmt(g)}.`);
  }
  addNoto(c.noto); S.crimeSkill = clamp(S.crimeSkill + 1); emit("siren");
  if (P().age < 18){
    if (c.years[1] >= 3){ sendToPrison(1, c.name + " (reformatório)"); return R(false, "Pego(a)! Você foi enviado(a) ao reformatório."); }
    for (const pa of parents()) pa.rel = clamp(pa.rel-15);
    log(`🚓 Fui pego(a) tentando ${c.name.toLowerCase()} e levei uma bronca dos meus pais.`, "bad"); return R(false, "Pego(a)! Seus pais ficaram furiosos.");
  }
  let yrs = rint(...c.years) + (S.record.length ? 1 : 0) + (S.parole>0 ? 2 : 0);
  if (yrs <= 0){ const fine = priceOf(rint(200,2000)); addMoney(-fine); S.record.push({ crime:c.name, age:P().age, years:0 }); log(`🚓 Pego(a) em flagrante (${c.name}). Multa de ${fmt(fine)} e ficha suja.`, "bad"); return R(false, `Pego(a)! Multa de ${fmt(fine)}.`); }
  sendToPrison(yrs, c.name.toLowerCase());
  return R(false, `Pego(a)! Condenado(a) a ${yrs} ano(s).`);
}

/* Reabilitação criminal: 5 anos sem crimes + advogado → chance de limpar o antecedente mais antigo. */
function expungeRecord(){
  if (!S.record.length) return R(false, "Sua ficha já está limpa.");
  if (inPrison()) return R(false, "Você está preso(a).");
  const last = Math.max(...S.record.map(r=>r.age));
  if (P().age - last < 5) return R(false, `Precisa de 5 anos sem condenações (faltam ${5 - (P().age - last)}).`);
  const cost = priceOf(3000); if (!canAfford(cost)) return R(false, `Advogado custa ${fmt(cost)}.`);
  addMoney(-cost);
  if (!chance(0.6)){ log("O juiz negou meu pedido de reabilitação criminal.", "bad"); return R(false, "Pedido negado. Tente de novo no próximo ano."); }
  const old = S.record.shift(); addNoto(-10); addRep(5);
  log(`⚖️ Reabilitação criminal concedida: "${old.crime}" saiu da minha ficha.`, "good");
  remember("Consegui limpar um antecedente criminal na Justiça.", "good");
  return R(true, "Ficha limpa (ao menos esse antecedente)!");
}

/* ---------- Cibercrime ----------
   Preparação paga antes (domínios, kits, laranjas). Sucesso → dinheiro
   SUJO; mesmo dando certo, o rastro digital pode levar a polícia até você
   1–3 anos depois (CONSEQ.cyberTrace). Falha → perde a preparação e, às
   vezes, é preso(a) em flagrante (rastreamento imediato). */
function commitCyber(c){
  if (cyberLevel() < num(c.skill)) return R(false, `Exige habilidade técnica ${c.skill} (você tem ${Math.round(cyberLevel())}). Curso de TI, faculdade de computação ou prática.`);
  const prep = priceOf(c.prep);
  if (!canAfford(prep)) return R(false, `A preparação custa ${fmt(prep)}.`);
  if (!spendEnergy()) return R(false, "Sem energia este ano.");
  addMoney(-prep); S.stats.crimes++; P().karma = clamp(P().karma - c.noto/4);
  if (hasTrait("honest")) addStat("happiness", -8);
  const trace = c.trace * (1 - cyberLevel()/160);
  if (chance(oddsCrime(c).p)){
    const g = priceOf(rint(...c.gain)); S.dirty += g; S.stats.dirtyEarned += g; S.stats.crimesOk++; S.stats.cyberOk = num(S.stats.cyberOk) + 1;
    S.cyberSkill = clamp(num(S.cyberSkill) + rint(3, 6)); addNoto(c.noto * 0.3);
    if (c.id === "celebhack") addFame(2);
    if (chance(trace)) schedule("cyberTrace", rint(1, 3), { crime:c.name, years:c.years, p: clamp(0.4 + trace) }, "Deixei rastros digitais. Pode voltar para me assombrar.");
    log(`💻 Golpe digital (${c.name}): ${fmt(g)} em dinheiro sujo (preparação: ${fmt(prep)}).`, "bad", ["crime"]); emit("crime");
    return R(true, `Deu certo! ${fmt(g)} em dinheiro SUJO — precisa lavar. Rastro estimado: ${Math.round(trace*100)}%.`);
  }
  S.cyberSkill = clamp(num(S.cyberSkill) + 1);
  if (P().age >= 18 && chance(trace * 1.3)){ addNoto(c.noto); emit("siren"); const y = rint(...c.years); sendToPrison(Math.max(1, y), c.name.toLowerCase()); return R(false, `O banco rastreou o IP na hora. Preso(a) por ${c.name.toLowerCase()}: ${y} ano(s).`); }
  log(`💻 Tentei ${c.name.toLowerCase()} e não rolou. Perdi ${fmt(prep)} de preparação.`, "bad");
  return R(false, `Não deu certo. Perdi os ${fmt(prep)} da preparação.`);
}
Object.assign(CONSEQ, {
  cyberTrace(ctx){
    if (!P().alive) return;
    if (inPrison()){ if (chance(ctx.p * 0.5)){ S.prison.years += rint(...ctx.years); return out(`A perícia digital ligou ${ctx.crime.toLowerCase()} a mim: pena aumentada.`, "bad"); } return; }
    if (!chance(ctx.p)) return out(`O rastro de "${ctx.crime}" esfriou.`, "good");
    enqueue("ev_cyber_probe", ctx); return out(`A polícia de crimes cibernéticos chegou até mim (${ctx.crime}).`, "bad");
  },
});
</script>
<script>/* src/systems/underworld.js */
"use strict";
/* =====================================================================
   systems/underworld.js — submundo e crime organizado.

   • DINHEIRO SUJO (S.dirty): rendimento de crimes graves e da
     organização. Não paga contas nem compra bens: precisa ser LAVADO por
     um negócio de fachada seu (taxa 20%, capacidade limitada pelo
     faturamento, aumenta o "calor" e pode atrair auditoria).
   • ORGANIZAÇÃO (S.org): entrar como Associado(a) e subir na hierarquia
     por respeito, ou fundar a sua (você vira Chefe). O chefe recruta
     capangas (habilidade/lealdade/função), abre operações em
     territórios, paga a "parte" de cada um e administra o CALOR policial.
   • Riscos anuais: batida policial, traição de capanga desleal, guerra
     com organizações rivais. Tudo vira evento que PERGUNTA ao jogador.
   ===================================================================== */
const isBoss = () => !!S.org && S.org.rank === DATA.orgRanks.length - 1;
const orgPower = () => !S.org ? 0 : S.org.members.reduce((a,m)=>a + m.skill*(0.4 + m.loyalty/170), 0) + P().stats.intelligence*0.3 + S.crimeSkill*0.5;
function frontCapacity(){
  return S.businesses.filter(b => byId(DATA.businesses,b.id)?.front && !isAbroad(b)).reduce((a,b)=>a + Math.round(b.revenue*0.5), 0);
}
function makeCrewCandidate(){
  const g = chance(0.75) ? "M" : "F", n = genName(country(), g);
  const skill = rint(15, 85), loyalty = rint(25, 90), pers = pick(DATA.personalities);
  return { uid:uid(), name:`${n.first} ${n.last}`, nick: pick(["Magrão","Baixinho","Neguinho","Gringo","Alemão","Faísca","Doutor","Tubarão","Sombra","Japa","Russo","Pistola"]),
    gender:g, age:rint(19,45), skill, loyalty: clamp(loyalty + num(pers.loyalty)), personality:pers.id, role:pick(DATA.orgRoles),
    cost: priceOf(800 + skill*40), cut: priceOf(1500 + skill*60), since:P().age, history:[] };
}

/* ---------- Entrar, fundar, sair ---------- */
function joinOrg(name){
  if (S.org) return R(false, "Você já faz parte de uma organização.");
  S.org = { name: name || pick(DATA.orgNames), own:false, rank:0, respect:10, heat:5, members:[], ops:[], territories:[],
    rivals: [{ name: pick(DATA.orgNames.filter(x=>x!==name)), power: rint(80, 300), hostility: rint(10,40) }], years:0, remote:false };
  log(`🕶️ Entrei para ${S.org.name} como ${DATA.orgRanks[0].name}.`, "bad", ["crime"]);
  remember(`Entrei no crime organizado (${S.org.name}). Sair não vai ser simples.`, "bad");
  return R(true, `Bem-vindo(a) à ${S.org.name}.`);
}
function foundOrg(name){
  if (S.org) return R(false, "Você já faz parte de uma organização.");
  if (P().age < 18) return R(false, "Idade mínima: 18.");
  if (S.crimeSkill < 30 && P().notoriety < 35) return R(false, "Ninguém te respeita no submundo ainda (habilidade criminal 30 ou notoriedade 35).");
  const cost = priceOf(20000);
  if (S.dirty + S.money < cost) return R(false, `Precisa de ${fmt(cost)} (sujo ou limpo) para armas, ponto e propina.`);
  const fromDirty = Math.min(S.dirty, cost); S.dirty -= fromDirty; addMoney(-(cost - fromDirty));
  S.org = { name: name || `Os ${P().last}`, own:true, rank:DATA.orgRanks.length-1, respect:60, heat:10, members:[makeCrewCandidate(), makeCrewCandidate()],
    ops:[], territories:[pick(DATA.territories)], rivals:[{ name: pick(DATA.orgNames), power: rint(120, 350), hostility: rint(20,50) }], years:0, remote:false };
  log(`👑 Fundei minha própria organização: ${S.org.name}.`, "milestone", ["crime"]); achieve("kingpin", "Fundou uma organização criminosa");
  emit("crime"); return R(true, `${S.org.name} está nas ruas.`);
}
function leaveOrg(){
  if (!S.org) return R(false, "?");
  const name = S.org.name;
  if (!isBoss() && chance(0.35)){ injure(rint(10, 25), "A represália da organização", 0.35); log(`Saí de ${name}, mas me deram um "recado" antes.`, "bad"); }
  else log(`${isBoss() ? "Dissolvi" : "Saí de"} ${name}.`, "milestone");
